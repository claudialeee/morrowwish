function sortDataTable(table){

 if(!sortableBodies.has(id))return;

 if(!state)return;

  if(a.value===null&&b.value!==null)return 1;
  if(b.value===null&&a.value!==null)return -1;
  if(a.value===null)return a.order-b.order;
  const delta=typeof a.value==="number"&&typeof b.value==="number"?a.value-b.value:collator.compare(String(a.value),String(b.value));

$("games").innerHTML=displayOrder.map(gameId=>{
 // Elsewhere uses the same complete unified metrics as all other games.
 const x=visibleGames.get(gameId)||{game:gameId,pageviews:0,visitors:0,starts:0,retries:0,avgSeconds:0,ends:0,completion:0,shares:0};
 const known=visibleGames.has(gameId);
 const num=k=>known?format(x[k]??0):'';
 const startRate=known&&x.pageviews>0&&x.startedViews<=x.pageviews?' <small>'+format(x.startRate??pct(x.startedViews,x.pageviews))+'%</small>':'';
 const finishRate=known&&x.starts>0&&x.ends<=x.starts?' <small>'+format(pct(x.ends,x.starts))+'%</small>':'';
 const finished=num('ends')+finishRate;
 const nm=gameNames[x.game]||x.game,label=typeof nm==="string"?nm:nm[lang],url=x.game==="hub"?"/":"/"+encodeURIComponent(x.game)+"/";
 // The homepage is not a game: show its pageviews only. Do not display
 // gameplay counts, placeholder dashes or conversion rates in its row.
 if(x.game==="hub")return '<tr><td><a class="game-name" href="/">'+escapeHTML(label)+'</a></td><td>'+num('pageviews')+'</td><td></td><td></td><td></td></tr>';
 return '<tr class="'+(['pawsibly-innocent','elsewhere','tiny-town'].includes(x.game)?'focus':'')+'"><td><a class="game-name" href="'+url+'">'+escapeHTML(label)+'</a></td><td>'+num('pageviews')+'</td><td>'+num('starts')+startRate+'</td><td>'+finished+'</td><td>'+num('retries')+'</td></tr>';
}).join("");
const channels=Array.isArray(j.byChannel)?j.byChannel:[];
const sourceAliases={itch:['itch','itch.io','itch.zone'],youtube:['youtube','youtube.com','youtu.be','m.youtube.com'],tiktok:['tiktok','tiktok.com'],instagram:['instagram','instagram.com','l.instagram.com'],bluesky:['bluesky','bsky.app','bsky.social']};
const siteFor=id=>channels.filter(x=>(sourceAliases[id]||[]).some(s=>String(x.source||'').toLowerCase()===s||String(x.source||'').toLowerCase().endsWith('.'+s)));
const totalOf=(rows,k)=>rows.reduce((n,x)=>n+Number(x[k]||0),0);
const pulse=j.socialPulse||{},snapshotPlatforms=Array.isArray(pulse.platforms)?pulse.platforms:[];
const fallbackIds=['itch','youtube','tiktok','instagram','bluesky'];
const platformNames={itch:'itch.io',youtube:'YouTube Shorts',tiktok:'TikTok',instagram:'Instagram Reels',bluesky:'Bluesky'};
// The dashboard lists only live channels. A launch-status change requires
// an explicit channel allowlist update, not a speculative future placeholder.
// Blank native-view cells indicate that comparable video views are unavailable.
const platformIds=new Set(fallbackIds);
const platforms=snapshotPlatforms.length?snapshotPlatforms.filter(p=>platformIds.has(p.id)):fallbackIds.map(id=>({id,priority:'',views:null,published:null}));
const homeSources=(j.homeFunnel&&Array.isArray(j.homeFunnel.bySource))?j.homeFunnel.bySource:[];
const homeFor=id=>homeSources.filter(x=>(sourceAliases[id]||[]).some(s=>String(x.source||'').toLowerCase()===s||String(x.source||'').toLowerCase().endsWith('.'+s)));
const nativeNum=(n,id,published)=>!["youtube","tiktok","instagram"].includes(id)||published===0||n==null||!Number.isFinite(Number(n))?"":format(n);
const siteNum=(rows,key)=>rows.length?format(totalOf(rows,key)):'';
const platformLinks={itch:'https://morrowwishgames.itch.io/',youtube:'https://www.youtube.com/channel/UC9v31QGhSfBASDsbXMjch4Q/shorts',tiktok:'https://www.tiktok.com/@morrowwishgames',instagram:'https://www.instagram.com/morrowwishgames/',bluesky:'https://bsky.app/profile/morrowwishgames.bsky.social'};
$("channel-rows").innerHTML=platforms.map(p=>{const z=siteFor(p.id),label=escapeHTML(platformNames[p.id]||p.id);
 const name=platformLinks[p.id]?'<a href="'+platformLinks[p.id]+'" target="_blank" rel="noopener noreferrer"><strong>'+label+'</strong></a>':'<strong>'+label+'</strong>';
 return '<tr><td>'+name+'</td><td>'+nativeNum(p.views,p.id,p.published)+'</td><td>'+siteNum(homeFor(p.id),'visits')+'</td><td data-sort-value="'+(z.length?totalOf(z,'pageviews'):'')+'">'+siteNum(z,'pageviews')+'</td><td>'+siteNum(z,'starts')+'</td><td>'+siteNum(z,'ends')+'</td></tr>';}).join('');
$("social-pulse-note").textContent=snapshotPlatforms.some(p=>Number(p.published)>0&&p.views!=null)?t('socialSnapshotNote'):"";
const verifiedVideos=Array.isArray(pulse.metricScope?.verifiedPosts)?pulse.metricScope.verifiedPosts.filter(p=>p.publicVerified===true&&p.approved===true):[];
const verifiedPlatforms=['youtube','instagram','tiktok'];
const videoGames=['cat-bond','pawsibly-innocent','tiny-town','elsewhere','flip-dash','parcel-panic','pocket-aquarium'];
$("video-metrics-detail").hidden=verifiedVideos.length===0;
$("video-detail-rows").innerHTML=videoGames.map(id=>{
 const cells=verifiedPlatforms.map(platform=>{
 const items=verifiedVideos.filter(p=>p.platform===platform&&p.game===id);
 if(!items.length||items.some(p=>p.views==null||!Number.isFinite(Number(p.views))))return '<td></td>';
 const n=items.reduce((sum,p)=>sum+Number(p.views),0),url=items[0].url;
 return '<td><a href="'+escapeHTML(url)+'" target="_blank" rel="noopener noreferrer">'+format(n)+'</a></td>';
 });
 return '<tr><td class="game-name">'+escapeHTML(gameNames[id]?.[lang]||id)+'</td>'+cells.join('')+'</tr>';
}).join('');
$("video-detail-note").textContent=verifiedVideos.length?t("videoDetailNote",{count:format(verifiedVideos.length),date:pulse.capturedAt||"",tiktok:format(verifiedVideos.filter(p=>p.platform==="tiktok").length),tiktokPublished:format(platforms.find(p=>p.id==="tiktok")?.published??0)}):"";
// Bluesky has no comparable public video-play count. Report its real
// interactions separately instead of treating likes/reposts as views.
const bskyItems=verifiedVideos.filter(p=>p.platform==='bluesky');
$("bluesky-engagement").hidden=bskyItems.length===0;
$("bluesky-updated").textContent=pulse.nativeBluesky?.checkedAt
 ? (lang==='zh'?'最近核实：':'Last checked: ')+new Date(pulse.nativeBluesky.checkedAt).toLocaleString(lang==='zh'?'zh-CN':'en-US')
 : '';
$("bluesky-engagement-rows").innerHTML=videoGames.flatMap(id=>{
 const items=bskyItems.filter(p=>p.game===id);
 if(!items.length)return [];
 const cell=k=>items.every(p=>p[k]!=null&&Number.isFinite(Number(p[k])))?format(items.reduce((n,p)=>n+Number(p[k]),0)):'';
 const url=escapeHTML(items[0].url);
 return ['<tr><td><a class="game-name" href="'+url+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(gameNames[id]?.[lang]||id)+'</a></td><td>'+cell('likes')+'</td><td>'+cell('reposts')+'</td><td>'+cell('replies')+'</td><td>'+cell('quotes')+'</td></tr>'];
}).join('');
const funnel=j.homeFunnel||{},fSources=Array.isArray(funnel.bySource)?funnel.bySource:[];
const youtube=fSources.filter(z=>/youtu/i.test(z.source)),ytVisits=youtube.reduce((n,z)=>n+Number(z.visits||0),0),ytClicked=youtube.reduce((n,z)=>n+Number(z.clickedViews||0),0);
const choices=funnel.byGame||{},rate=n=>n==null?'':format(n)+'%';
const funnelLines=Number(funnel.visits)>0?[
 t('homeFunnelLabel',{clickers:format(funnel.clickedViews||0),visits:format(funnel.visits),rate:rate(funnel.clickRate)}),
 ...(ytVisits?[t('homeFunnelYouTube',{clickers:format(ytClicked),visits:format(ytVisits),rate:rate(pct(ytClicked,ytVisits))})]:[]),
 t('homeFunnelGames',{paws:format(choices['pawsibly-innocent']||0),town:format(choices['tiny-town']||0),bond:format(choices['cat-bond']||0),elsewhere:format(choices.elsewhere||0)}),
 t('homeFunnelNew')
]:[];
$('hub-funnel').textContent=funnelLines.join(' · ');

renderSignals(games);
const chunks=[t("coverageDays",{days:format(j.days),records:format(j.records)}),
 j.lastEventAt?t("lastEventLabel",{when:new Date(j.lastEventAt).toLocaleString(lang==="zh"?"zh-CN":"en-US")}):""];
if(j.partial)chunks.push(t("coveragePartial"));if(r.unknownPastVisits)chunks.push(t("coverageOld",{n:format(r.unknownPastVisits)}));chunks.push(t("coverageDetails"));$("coverage").textContent=hasData?chunks.filter(Boolean).join(" "):"";$("report").hidden=false;enhanceSortableTables();}

let elsewhereData=null;
async function loadElsewhere(){
 elsewhereData=null;
 try{
  const res=await fetch('/api/elsewhere-summary?days='+$('days').value,{headers:key?{'x-analytics-key':key}:{},cache:'no-store'});
  if(!res.ok)throw Error('Story API unavailable');
  elsewhereData=await res.json();
 }catch{elsewhereData=null}
 if(lastData)renderSignals(lastData.byGame||[]);
}
function applyLanguage(next){lang=next==="en"?"en":"zh";document.documentElement.lang=lang==="en"?"en":"zh-CN";document.title=t("pageTitle");
try{localStorage.setItem("morrowwish-dashboard-language",lang);const uri=new URL(location.href);uri.searchParams.set('lang',lang);history.replaceState(history.state,'',uri.pathname+uri.search+uri.hash);}catch{}
for(const node of document.querySelectorAll("[data-i18n]"))node.textContent=t(node.dataset.i18n);
for(const node of document.querySelectorAll("[data-i18n-placeholder]"))node.placeholder=t(node.dataset.i18nPlaceholder);
for(const node of document.querySelectorAll("[data-lang]"))node.setAttribute("aria-pressed",String(node.dataset.lang===lang));
if(lastData)render(lastData);enhanceSortableTables();setStatus(statusKind,lastError);
}
async function load(){setStatus("loading");$("reload").disabled=true;
try{const response=await fetch("/api/summary?days="+$("days").value,{headers:key?{"x-analytics-key":key}:{},cache:"no-store"});const j=await response.json();if(response.status===401){key="";$("secret").value="";$("login").hidden=false;$("report").hidden=true;$("period").hidden=true;setStatus("denied");return;}if(!response.ok)throw Error(j.error||"HTTP "+response.status);
render(j);loadElsewhere();$("login").hidden=true;$("period").hidden=false;setStatus("loaded");
}catch(e){$("report").hidden=true;setStatus("error",e.message||t("failGeneric"));}finally{$("reload").disabled=false;}}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLanguage(b.dataset.lang)));
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();key=$("secret").value.trim();if(!key)return;try{const r=await fetch("/api/auth",{method:"POST",headers:{"x-analytics-key":key},credentials:"same-origin",cache:"no-store"});if(!r.ok){setStatus("denied");return;}key="";$("secret").value="";await load();}catch(err){setStatus("error",err.message||t("failGeneric"));}});
$("reload").addEventListener("click",load);$("days").addEventListener("change",load);
$("reset-metrics").addEventListener("click",async()=>{
 if(!window.confirm(t("resetConfirm")))return;
 const button=$("reset-metrics");button.disabled=true;$("reload").disabled=true;setStatus("resetting");
 try{
  const response=await fetch("/api/reset-metrics",{
   method:"POST",credentials:"same-origin",cache:"no-store",
   headers:{"Content-Type":"application/json","X-Morrowwish-Reset":"confirmed"},
   body:JSON.stringify({confirm:"RESET_METRICS"})
  });
  if(!response.ok)throw Error("HTTP "+response.status);
  await load();
  if(statusKind==="loaded")setStatus("resetDone");
 }catch(e){setStatus("resetFailed");}
 finally{button.disabled=false;$("reload").disabled=false;}
});
applyLanguage(lang);load();
})();
</script></body></html>

if(j.partial)chunks.push(t("coveragePartial"));if(r.unknownPastVisits)chunks.push(t("coverageOld",{n:format(r.unknownPastVisits)}));chunks.push(t("coverageDetails"));$("coverage").textContent=chunks.join(" ");$("report").hidden=false;}

let elsewhereData=null;
const EW={
zh:{title:'平行人生 · 故事表现',desc:'只保留完读率、重玩率和最明显的流失点。',open:'打开平行人生 ↗',starts:'开始人生',finishRate:'完读率',replayRate:'重玩率',replayHint:'重玩访客 / 开始过的访客',dropoff:'最明显的流失点',dropoffMessage:'第 {n} 幕之后，有 {lost} 次未进入下一幕（续读率 {rate}）',dropoffEmpty:'暂无足够数据判断流失点',more:'查看五幕及人生明细',funnel:'五幕故事进度',continue:'每幕续读率',worlds:'四种人生比较',world:'人生',runs:'开始',finished:'完读',noData:'暂无新版数据',pending:'正在读取五幕故事数据…',empty:'—',coverage:'新版五幕故事记录 {n} 条匿名事件；旧版八幕历史保留，不混算。',partial:' 已达读取上限。',denom:'样本 {n}',chapter:'第 {n} 幕',started:'进入',done:'完成'},
en:{title:'Elsewhere · Story engagement',desc:'Finish rate, replay rate and the biggest drop-off; details available on demand.',open:'Play Elsewhere ↗',starts:'Lives started',finishRate:'Finish rate',replayRate:'Replay rate',replayHint:'Replay visitors / visitors who started',dropoff:'Biggest drop-off',dropoffMessage:'After scene {n}, {lost} stopped before the next scene ({rate} continued)',dropoffEmpty:'Not enough data yet to identify a drop-off',more:'Expand five-scene and life details',funnel:'Five-scene progress',continue:'Scene continuation',worlds:'Four-life comparison',world:'Life',runs:'Starts',finished:'Finished',noData:'No five-scene data yet',pending:'Loading five-scene story data…',empty:'—',coverage:'{n} anonymous events for the five-scene edition. Eight-scene records remain stored, but are excluded.',partial:' Read limit reached.',denom:'Sample: {n}',chapter:'Scene {n}',started:'Viewed',done:'Completed'}
};
const worldLabels={'no-work':{zh:'不需要工作了',en:'No More Work'},bookshop:{zh:'海边书店',en:'Seaside Bookshop'},paris:{zh:'巴黎的另一种人生',en:'A Life in Paris'},cabin:{zh:'林间小屋',en:'Cabin in the Woods'}};const worldName=id=>worldLabels[id]?.[lang]||id;
const ewText=(k,p={})=>{let x=EW[lang][k]||k;for(const [name,val] of Object.entries(p))x=x.replaceAll('{'+name+'}',String(val));return x};
const ewPct=n=>n==null?ewText('empty'):(Number(n).toFixed(1)+'%');
function updateEWLabels(){for(const node of document.querySelectorAll('[data-ew]'))node.textContent=ewText(node.dataset.ew);}
function renderElsewhere(j){
 elsewhereData=j;updateEWLabels();const d=j.summary||{},f=j.funnel||[],rates=j.continueRates||[],worlds=j.worlds||[];
 if(lastData)renderSignals(lastData.byGame||[]);
 $('ew-dropoff').innerHTML='<b>'+escapeHTML(ewText('dropoff'))+': </b>'+escapeHTML(d.dropoffChapter?ewText('dropoffMessage',{n:d.dropoffChapter,lost:format(d.dropoffLost),rate:ewPct(d.dropoffRate)}):ewText('dropoffEmpty'));
 const max=Math.max(1,...f.map(x=>x.value||0));
 $('ew-funnel').innerHTML=f.map(x=>{const m=/^(\d)-(view|complete)$/.exec(x.step)||[];return '<div class="ew-funnel-row"><span>'+escapeHTML(ewText('chapter',{n:m[1]||'?'})+' · '+ewText(m[2]==='view'?'started':'done'))+'</span><div class="ew-bar"><span style="width:'+100*(x.value||0)/max+'%"></span></div><strong>'+format(x.value)+'</strong></div>'}).join('');
 $('ew-continue').innerHTML=rates.map(x=>'<div class="ew-continue-row"><span>'+escapeHTML(ewText('chapter',{n:x.from}))+' → '+escapeHTML(ewText('chapter',{n:x.to}))+'</span><b>'+escapeHTML(ewPct(x.rate))+'</b></div>').join('');
 $('ew-worlds').innerHTML=worlds.map(x=>'<tr><td>'+escapeHTML(worldName(x.world))+'</td><td>'+format(x.starts)+'</td><td>'+format(x.ends)+'</td><td>'+escapeHTML(ewPct(x.fullRate))+'</td></tr>').join('');
 $('ew-coverage').textContent=ewText('coverage',{n:format(j.records)})+(j.partial?ewText('partial'):'');
 $('ew-state').hidden=true;$('ew-report').hidden=false;
}
async function loadElsewhere(){
 elsewhereData=null;if(lastData)renderSignals(lastData.byGame||[]);
 $('ew-state').hidden=false;$('ew-state').className='ew-state';$('ew-state').textContent=ewText('pending');$('ew-report').hidden=true;
 try{const response=await fetch('/api/elsewhere-summary?days='+$('days').value,{headers:key?{'x-analytics-key':key}:{},cache:'no-store'});const j=await response.json();if(!response.ok)throw new Error(j.error||'HTTP '+response.status);renderElsewhere(j)}
 catch(e){$('ew-state').textContent=ewText('noData')+' · '+(lang==='zh'?t('failGeneric'):(e.message||'Unavailable'));$('ew-state').className='ew-state error';}
}
function applyLanguage(next){lang=next==="en"?"en":"zh";document.documentElement.lang=lang==="en"?"en":"zh-CN";document.title=t("pageTitle");
try{localStorage.setItem("morrowwish-dashboard-language",lang);const uri=new URL(location.href);uri.searchParams.set('lang',lang);history.replaceState(history.state,'',uri.pathname+uri.search+uri.hash);}catch{}
for(const node of document.querySelectorAll("[data-i18n]"))node.textContent=t(node.dataset.i18n);
for(const node of document.querySelectorAll("[data-i18n-placeholder]"))node.placeholder=t(node.dataset.i18nPlaceholder);
for(const node of document.querySelectorAll("[data-lang]"))node.setAttribute("aria-pressed",String(node.dataset.lang===lang));
if(lastData)render(lastData);if(elsewhereData)renderElsewhere(elsewhereData);else updateEWLabels();setStatus(statusKind,lastError);
}
async function load(){setStatus("loading");$("reload").disabled=true;
try{const response=await fetch("/api/summary?days="+$("days").value,{headers:key?{"x-analytics-key":key}:{},cache:"no-store"});const j=await response.json();if(response.status===401){key="";$("secret").value="";$("login").hidden=false;$("report").hidden=true;$("period").hidden=true;setStatus("denied");return;}if(!response.ok)throw Error(j.error||"HTTP "+response.status);
render(j);loadElsewhere();$("login").hidden=true;$("period").hidden=false;setStatus("loaded");
}catch(e){$("report").hidden=true;setStatus("error",e.message||t("failGeneric"));}finally{$("reload").disabled=false;}}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLanguage(b.dataset.lang)));
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();key=$("secret").value.trim();if(!key)return;try{const r=await fetch("/api/auth",{method:"POST",headers:{"x-analytics-key":key},credentials:"same-origin",cache:"no-store"});if(!r.ok){setStatus("denied");return;}key="";$("secret").value="";await load();}catch(err){setStatus("error",err.message||t("failGeneric"));}});
$("reload").addEventListener("click",load);$("days").addEventListener("change",load);
applyLanguage(lang);load();
})();

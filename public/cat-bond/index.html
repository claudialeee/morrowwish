<body>
  <a class="cb-home" href="/" id="cb-home" aria-label="返回 Morrow Wish">← Morrow Wish 首页</a>
  <div id="game-root">
    <div id="stage">
      <canvas id="scene"></canvas>

      <!-- Top HUD -->
      <div id="hud">
        <div class="hud-pill" aria-label="Coin balance"><span class="ico"><img class="cb-gold-coin" src="/cat-bond/assets/gold-coin.svg?v=gold-currency-20261122" alt="" width="16" height="16"></span><span id="coins">0</span></div>
        <div class="hud-pill"><span class="ico">🐠</span><span id="fish">0</span></div>
        <div class="hud-spacer"></div>
        <div class="scene-title">🏡 庭院</div>
      </div>

      <!-- Toasts -->
      <div id="toasts"></div>
      <div id="first-quest" role="region" aria-label="猫猫冒险指引" aria-live="polite" hidden></div>
      <button id="guide-help" type="button" hidden aria-label="重新查看玩法引导">? 玩法</button>
      <button id="yard-surprise" type="button" hidden></button>
      <!-- Compact exploration action buttons aligned below the top-right utilities. -->
      <nav id="map-actions" hidden aria-label="兼容旧地图入口（统一由顶部菜单访问）">
        <button id="map-squad" type="button" hidden aria-label="选择出战队伍">🐾 出战队伍</button>
        <button id="map-index" type="button" hidden>🗺️ 世界目录</button>
        <button id="map-menu" type="button" hidden aria-label="打开探险管理菜单" aria-haspopup="dialog" aria-controls="panel" aria-expanded="false">☰ 菜单</button>
      </nav>
      <button id="collection-goal" type="button" aria-label="打开猫猫冒险目标" hidden></button>
      <button id="yard-cat-switch" type="button" aria-label="切换庭院中的猫猫" hidden></button>

      <!-- Yard floating actions -->
      <div id="yard-actions">
        <button class="fab map-fab" id="fab-map" title="查看五个探索地区" aria-label="探索五张地图">🗺️<small>地图</small></button>
        <button class="fab" id="fab-build" title="庭院建造" aria-label="庭院建造游乐设施">🏗️</button>
        <button class="fab" id="fab-seek" title="主动寻找野猫（不会自动刷新）" aria-label="主动寻找野猫">🌿</button>
        <button class="fab" id="fab-play" title="逗猫">🪶</button>
        <button class="fab" id="fab-feed" title="喂食">🍖</button>
      </div>

     <div id="yard-placement-dock" hidden role="group" aria-label="庭院设施放置">
        <div class="cb-placement-heading"><span class="cb-placement-seal" aria-hidden="true">✿</span>
          <span class="cb-placement-heading-text"><strong>布置我的猫咪庭院</strong><small>点击草坪直接建造 · 拖动调整位置</small></span></div>
        <span id="yard-placement-status">点击草坪直接建造 · 无需确认</span>
        <div class="yard-placement-actions">
          <button id="yard-placement-cancel" type="button">取消</button>
        </div>
      </div>
      <!-- Battle UI (real-time arena) -->
      <div id="battle-ui">
        <div class="battle-topbar">
          <div class="battle-enemy-summary">
            <span id="wild-name">野生猫猫</span>
            <div class="battle-enemy-track" role="progressbar" aria-label="Enemy health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="battle-enemy-hp-fill"></span></div>
            <div class="battle-poise-row">
              <span id="battle-poise-label" class="battle-poise-label">韧性</span>
              <div class="battle-poise-track" role="progressbar" aria-label="Enemy poise" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="battle-enemy-poise-fill"></span></div>
            </div>
          </div>
          <div class="battle-tools" role="group" aria-label="战斗操作">
            <button class="btn ghost tiny-btn battle-help-trigger" id="battle-help-toggle" type="button" aria-label="查看手动战斗操作说明" aria-expanded="false" title="查看战斗操作说明">?<span class="battle-top-label"> 操作</span></button>
            <button class="btn ghost tiny-btn" id="btn-auto" type="button" aria-pressed="false" title="自动控制移动、攻击、技能及闪避">🤖 自动战斗：关</button>
            <button class="btn ghost tiny-btn" id="btn-flee" title="撤退">🏳️<span class="battle-top-label"> 撤退</span></button>
            <!-- DEBUG 🐛 damage-log button: hidden unless ?debug=1 (revealed by game.js updateBattleUI). First tap records this fight's damage breakdown; a later tap copies the log. Never shown to normal players. -->
            <button class="btn ghost tiny-btn" id="btn-debug" type="button" hidden aria-pressed="false" title="记录本场伤害明细（调试）">🐛<span class="battle-top-label"> 调试</span></button>
          </div>
        </div>
        <div class="battle-hint" id="battle-hint">WASD 移动 · 鼠标瞄准 · 左键攻击 · 空格键闪避</div>
        <div id="battle-coach-card" role="status" aria-live="polite" hidden></div>
        <div id="battle-help" class="battle-help-sheet" role="dialog" aria-modal="true" aria-labelledby="battle-help-title" hidden>
          <div class="battle-help-content">
            <button class="battle-help-close" id="battle-help-close" type="button" aria-label="关闭操作说明">×</button>
            <h3 id="battle-help-title">战斗怎么操作？</h3>
            <div id="battle-help-body"></div>
            <button class="btn gold" id="battle-help-start" type="button">知道了，继续战斗</button>
          </div>
        </div>

        <button id="duo-burst" type="button" hidden aria-label="双猫合击">
          <span class="duo-burst-emblem" aria-hidden="true">✦</span>
          <span class="duo-burst-label">双猫合击</span>
          <span class="duo-burst-track" aria-hidden="true"><i></i></span>
        </button>
        <!-- Active cards and reserves share a normal-flow rail. No overlap. -->
        <div id="battle-squad-rail" aria-label="我方猫咪队伍">
          <div id="team-slots"></div>
          <div id="bench-slots" aria-label="可替换上场的猫咪" hidden></div>
        </div>

        <!-- ultimate meter -->
        <div id="ult-wrap">
          <span class="ult-label">必杀</span>
          <div class="ult-track"><span id="ult-bar"></span></div>
        </div>

        <!-- A single readable skill card (hover/focus) and explicit touch help.
             Kept OUTSIDE the action buttons so it never casts by accident. -->
        <div id="battle-skill-tooltip" class="battle-skill-tooltip" role="status" hidden></div>
        <button type="button" id="battle-skill-info-toggle" class="battle-skill-info-toggle"
          aria-expanded="false" aria-controls="battle-skill-guide">ⓘ 技能说明</button>
        <section id="battle-skill-guide" class="battle-skill-guide" aria-label="技能说明" hidden>
          <button type="button" id="battle-skill-guide-close" aria-label="关闭技能说明">×</button>
          <h3 id="battle-skill-guide-title">当前猫咪的技能</h3>
          <div id="battle-skill-guide-body"></div>
        </section>
        <!-- move bar (bottom) -->
        <div class="move-bar">
          <button class="move" id="mv-basic" data-move="basic"><span class="mv-icon">🧶</span><span class="mv-name">毛球出击</span><span class="mv-k">左键/J</span></button>
          <button class="move" id="mv-q" data-move="q"><span class="mv-icon">🧶</span><span class="mv-name">技能一</span><span class="mv-k">Q</span></button>
          <button class="move" id="mv-e" data-move="e"><span class="mv-icon">💨</span><span class="mv-name">技能二</span><span class="mv-k">E</span></button>
          <button class="move" id="mv-lock" type="button" data-move="lock" aria-label="锁定野猫"><span class="mv-icon">◎</span><span class="mv-name">锁定</span><span class="mv-k">切换</span></button>
          <button class="move" id="mv-dodge" data-move="dodge" title="闪避伤害，短暂无敌（空格键）" aria-label="闪避伤害，短暂无敌（空格键）"><span class="mv-icon">🌀</span><span class="mv-name">闪避</span><span class="mv-k">空格键</span></button>
          <button class="move ult" id="ult-btn" data-move="ult" title="必杀技"><span class="mv-icon">🌪️</span><span class="mv-name">喵之怒涛</span><span class="mv-k">R</span></button>
        </div>
      </div>

      <!-- Bottom tabs -->
      <div id="tabbar">
        <button class="tab" data-tab="cats"><span class="ico" style="position:relative">🐾<span id="cat-duo-dot" hidden aria-hidden="true"></span></span><span class="nav-caption">猫咪</span></button>
        <button class="tab" data-tab="work"><span class="ico">🧶</span><span class="nav-caption">工坊</span></button>
        <button class="tab" data-tab="dex"><span class="ico">📖</span>图鉴</button>
        <button class="tab" data-tab="daily"><span class="ico" style="position:relative">🎁<span id="daily-dot" class="hidden" style="position:absolute;top:-2px;right:-4px;width:8px;height:8px;background:#ff5a5a;border-radius:50%"></span></span>签到</button>
        <button class="tab" data-tab="shop"><span class="ico">🛒</span>商店</button>
      </div>

      <!-- Overlay panel host -->
      <div id="panel" class="panel"></div>

      <div class="studio-stamp">🌙 MORROW·WISH</div>

      <!-- Title screen: independent from gameplay HUD and legacy single-button CSS. -->
      <div id="intro" class="cb-rpg-intro">
        <div class="cb-title-landscape" aria-hidden="true"></div>
        <canvas id="intro-stars" aria-hidden="true"></canvas>
        <div class="cb-title-cover" aria-hidden="true">
          <picture><source media="(orientation:portrait) and (max-width:700px)" srcset="assets/mobile-portrait/title-bell-sanctuary.webp"><img class="cb-title-cover-art" src="assets/garden/title-bell-sanctuary.webp" alt="" decoding="async" draggable="false"></picture>
        </div>
        <div class="cb-title-content">
          <div class="cb-intro-brand">MORROW WISH</div>
          <div class="cb-intro-titleblock">
            <h1 class="game-logo" id="cb-title-name">星铃回响</h1>
            <p class="cb-intro-tagline">循着星铃的回响，寻找遗失的记忆。</p>
          </div>
          <div class="cb-intro-actions">
            <button class="cb-intro-primary" id="intro-start" type="button"><strong>开始新的冒险</strong></button>
            <button class="cb-intro-secondary" id="intro-continue" type="button"><strong>继续故事</strong></button>
          </div>
        </div>
        <p id="start-error" hidden role="alert"></p>
        <section id="intro-slot-panel" class="cb-save-picker" aria-hidden="true">
          <div class="cb-save-picker-card">
            <button id="intro-slot-close" type="button" class="cb-save-picker-close" aria-label="Close">×</button>
            <button type="button" class="cb-picker-language" data-slot-language aria-label="Language">English</button>
            <p class="cb-save-picker-kicker">存档</p>
            <h2 id="intro-slot-heading">选择存档</h2>
            <p class="cb-save-picker-desc"></p>
            <div id="intro-slot-list" class="cb-save-slot-list"></div>
          </div>
        </section>
      </div>
      <button type="button" id="cb-system-toggle" aria-haspopup="dialog" aria-expanded="false">菜单</button>
      <section id="cb-system-menu" role="dialog" aria-modal="true" aria-label="系统菜单" hidden></section>
    </div>

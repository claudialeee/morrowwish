  <script>
  // Identical game, platform-specific presentation: no Morrow Wish exit link or
  // in-game fullscreen when embedded by CrazyGames.
  (() => {
    const params = new URLSearchParams(location.search);
    let fromPortal = false;
    try { fromPortal = /(^|\.)crazygames\.com$/i.test(new URL(document.referrer).hostname); } catch (_) {}
    const crazygames = fromPortal || params.get('platform') === 'crazygames' || params.get('isCrazyGames') === 'true';
    window.CatBondPlatform = { crazygames };
    if (crazygames) document.documentElement.classList.add('cb-cg');
  })();
  </script>

<body>
  <a class="cb-home" href="/" id="cb-home" aria-label="返回 Morrow Wish">← Morrow Wish 首页</a>
  <div id="game-root">
    <div id="stage">
      <canvas id="scene"></canvas>

      <!-- Top HUD -->
      <div id="hud">
        <div class="hud-pill"><span class="ico">🪙</span><span id="coins">0</span></div>
        <div class="hud-pill"><span class="ico">🐟</span><span id="treats">0</span></div>
        <div class="hud-pill"><span class="ico">🐠</span><span id="fish">0</span></div>
        <div class="hud-pill"><span class="ico">🧶</span><span id="yarn">0</span></div>
        <div class="hud-spacer"></div>
        <div class="scene-title">🏡 庭院</div>
      </div>

      <!-- Toasts -->
      <div id="toasts"></div>
      <div id="first-quest" role="status" hidden></div>
      <button id="yard-surprise" type="button" hidden></button>
      <button id="yard-duo-status" type="button" hidden aria-label="查看双猫搭档"></button>
      <button id="map-index" type="button" hidden>🗺️ 地图目录</button>
      <button id="map-squad" type="button" hidden aria-label="选择出战猫咪">🐾 出战猫咪</button>
      <button id="collection-goal" type="button" aria-label="打开猫猫冒险目标" hidden></button>
      <button id="yard-cat-switch" type="button" aria-label="切换庭院中的猫猫" hidden></button>

      <!-- Yard floating actions -->
      <div id="yard-actions">
        <button class="fab map-fab" id="fab-map" title="查看五个探索地区" aria-label="探索五张地图">🗺️<small>地图</small></button>
        <button class="fab" id="fab-build" title="庭院建造" aria-label="庭院建造游乐设施">🏗️</button>
        <button class="fab" id="fab-seek" title="主动寻找野猫（不会自动刷新）" aria-label="主动寻找野猫">🌿</button>
        <button class="fab" id="fab-play" title="逗猫">🪶</button>
        <button class="fab" id="fab-feed" title="喂食">🍖</button>
      </div>

      <!-- Battle UI (real-time arena) -->
      <div id="battle-ui">
        <div class="battle-topbar">
          <div class="battle-enemy-summary">
            <span id="wild-name">野生猫猫</span>
            <div class="battle-enemy-track" role="progressbar" aria-label="Enemy health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="battle-enemy-hp-fill"></span></div>
          </div>
          <button class="btn ghost tiny-btn battle-help-trigger" id="battle-help-toggle" type="button" aria-label="查看手动战斗操作说明" aria-expanded="false" title="查看战斗操作说明">?<span class="battle-top-label"> 操作</span></button>
          <button class="btn ghost tiny-btn" id="btn-auto" type="button" aria-pressed="false" title="自动控制移动、攻击、技能及闪避">🤖 自动战斗：关</button>
          <button class="btn ghost tiny-btn" id="btn-flee" title="撤退">🏳️<span class="battle-top-label"> 撤退</span></button>
        </div>
        <div class="battle-hint" id="battle-hint">WASD 移动 · 鼠标瞄准 · 左键攻击 · 空格键闪避</div>
        <div id="battle-coach-card" role="status" aria-live="polite" hidden></div>
        <div id="battle-help" class="battle-help-sheet" role="dialog" aria-modal="true" aria-labelledby="battle-help-title" hidden>
          <div class="battle-help-content">
            <button class="battle-help-close" id="battle-help-close" type="button" aria-label="关闭操作说明">×</button>
            <h3 id="battle-help-title">战斗怎么操作？</h3>
            <div id="battle-help-body"></div>
            <button class="btn gold" id="battle-help-start" type="button">知道了，继续战斗</button>
          </div>
        </div>

        <button id="duo-burst" type="button" hidden aria-label="双猫合击"></button>
        <!-- team slots (top-left) -->
        <div id="team-slots"></div>
        <div id="bench-slots" aria-label="可替换上场的猫咪" hidden></div>

        <!-- ultimate meter -->
        <div id="ult-wrap">
          <span class="ult-label">必杀</span>
          <div class="ult-track"><span id="ult-bar"></span></div>
        </div>

        <!-- move bar (bottom) -->
        <div class="move-bar">
          <button class="move" id="mv-basic" data-move="basic"><span class="mv-icon">🐟</span><span class="mv-k">左键/J</span></button>
          <button class="move" id="mv-q" data-move="q"><span class="mv-icon">🧶</span><span class="mv-name">技能一</span><span class="mv-k">Q</span></button>
          <button class="move" id="mv-e" data-move="e"><span class="mv-icon">💨</span><span class="mv-name">技能二</span><span class="mv-k">E</span></button>
          <button class="move" id="mv-lock" type="button" data-move="lock" aria-label="锁定野猫"><span class="mv-icon">◎</span><span class="mv-name">锁定</span><span class="mv-k">切换</span></button>
          <button class="move" id="mv-dodge" data-move="dodge" title="闪避伤害，短暂无敌（空格键）" aria-label="闪避伤害，短暂无敌（空格键）"><span class="mv-icon">🌀</span><span class="mv-name">闪避</span><span class="mv-k">空格键</span></button>
          <button class="move ult" id="ult-btn" data-move="ult" title="必杀技"><span class="mv-icon">🌪️</span><span class="mv-name">喵之怒涛</span><span class="mv-k">R</span></button>
        </div>
      </div>

      <!-- Bottom tabs -->
      <div id="tabbar">
        <button class="tab active" data-tab="yard"><span class="ico">🏡</span>庭院</button>
        <button class="tab" data-tab="cats"><span class="ico">🐾</span>猫猫</button>
        <button class="tab" data-tab="work"><span class="ico">🧶</span>工坊</button>
        <button class="tab" data-tab="dex"><span class="ico">📖</span>图鉴</button>
        <button class="tab" data-tab="daily"><span class="ico" style="position:relative">🎁<span id="daily-dot" class="hidden" style="position:absolute;top:-2px;right:-4px;width:8px;height:8px;background:#ff5a5a;border-radius:50%"></span></span>签到</button>
        <button class="tab" data-tab="shop"><span class="ico">🛒</span>商店</button>
      </div>

      <!-- Overlay panel host -->
      <div id="panel" class="panel"></div>

      <div class="studio-stamp">🌙 MORROW·WISH</div>

      <!-- Intro -->
      <div id="intro">
        <canvas id="intro-stars"></canvas>
        <div class="studio-badge">
          <span class="studio-moon">🌙</span>
          <span class="studio-text">MORROW·<span class="studio-wish">WISH</span></span>
          <span class="studio-tag">STUDIO 工作室 呈现</span>
        </div>
        <h1 class="game-logo">猫猫纽带<span class="logo-en">Cat Bond</span></h1>
        <div class="intro-cat-gallery"><canvas id="intro-cats" width="720" height="172" role="img" aria-label="Four expressive cats from Cat Bond"></canvas><span class="intro-cat-glint" aria-hidden="true">✦</span></div>
        <p>领养心仪的小猫，和伙伴一起战斗、成长，探索更大的猫咪世界。</p>
        <div class="intro-features" aria-label="猫猫纽带的四种玩法">
          <span>🐾 收集 25 种猫</span>
          <span>⚔️ 双猫合击 · 觉醒新技能</span>
          <span>🧶 工坊赚金币 · 培养猫</span>
          <span>🗺️ 解锁地图 · 发现秘密</span>
        </div>
        <div class="intro-guide"><strong>开局只要一步：选一只小猫，寻找第一位伙伴</strong></div>
        <button class="btn gold" id="intro-start" style="padding:14px 34px;font-size:1.15rem">开始冒险 🐱</button>
        <p id="start-error" hidden role="alert"></p>
        <button class="btn ghost" id="intro-reset" style="margin-top:6px">🗑️ 重置存档（出问题点这里）</button>
      </div>
    </div>
  </div>

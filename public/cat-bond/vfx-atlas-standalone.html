 // Solid tapered ribbons, not recolored flame particles. Each arm grows from the
 // mouth, fans into the authored corridor, then curls with its own phase.
 function drawShadowTendrils(c,b,time,ex,ey){
   const x=b._ox,y=b._oy,L=Math.hypot(ex-x,ey-y);
   if(L<1)return true;
   const age=Math.max(0,b.max-b.t),a=clip(Math.min(1,age/.10,b.t/.15));
   const reach=L*ease(clip(age/.11)),w=b.width||30;
   if(reach<1||a<=0)return true;
   c.save();c.translate(x,y);c.rotate(Math.atan2(ey-y,ex-x));
   for(const j of [-2,2,-1,1,0]){
     const n=30,span=reach*(1-Math.abs(j)*.075),points=[];
     for(let i=0;i<=n;i++){
       const u=i/n,en=Math.sin(u*PI*.8),tip=Math.pow(u,3);
       const yy=j*w*.34*Math.sin(u*PI*.54)+Math.sin(u*8.6-time*7+j*1.7)*w*.23*en+Math.sin(time*5+j)*w*.11*tip;
       const xx=span*u-7*tip*Math.sin(time*5+j);
       const r=(5.4+Math.abs(j)*.3)*Math.pow(1-u,.62)+.25;
       points.push([xx,yy,r]);
     }
     const grad=c.createLinearGradient(0,0,span,0);
     grad.addColorStop(0,'#34213e');grad.addColorStop(.35,'#51306c');grad.addColorStop(.75,'#76509b');grad.addColorStop(1,'#ae83d5');
     c.globalAlpha=a*.98;c.fillStyle=grad;c.strokeStyle='#281b3e';c.lineWidth=1.4;
     c.beginPath();points.forEach(([px,py,r],i)=>i?c.lineTo(px,py-r):c.moveTo(px,py-r));
     for(let i=n;i>=0;i--){const [px,py,r]=points[i];c.lineTo(px,py+r);}
     c.closePath();c.fill();c.stroke();
     stroke(c,j%2?'#b99ae0':'#9972c5',1.5,a*.78);
     path(c,points.slice(1,-2).map(([px,py,r])=>[px,py-r*.5]));
     for(let k=5;k<n-3;k+=5){const [px,py,r]=points[k];
       c.globalAlpha=a*.75;c.fillStyle='#cab0e7';c.beginPath();c.ellipse(px,py+r*.18,Math.max(.5,r*.5),Math.max(.3,r*.21),0,0,TAU);c.fill();}
   }
   c.restore();return true;
 }

   for(let i=0;i<4;i++){const a=i*TAU/4+time*2;point(c,Math.cos(a)*r,Math.sin(a)*r*.6,1.4,k>.5?'#eed8fc':'#ad84d3');}

 }

 function drawCombatBeam(c,b,time,ex,ey){
   if(b.sk?.id==='shadowTendrils')return drawShadowTendrils(c,b,time,ex,ey);
   if(b.sk?.id==='waterJet')return drawWaterLance(c,b,time,ex,ey);
   if(b.sk?.id==='thunderStream')return drawElectricStream(c,b,time,ex,ey);
   const fire=b.sk?.id==='flameSweep',water=b.sk?.id==='waterJet';
   if(!fire&&!water)return false;
   const x=b._ox,y=b._oy,L=Math.hypot(ex-x,ey-y);if(L<1)return true;
   const angle=Math.atan2(ey-y,ex-x),age=b.max-b.t,alpha=Math.min(1,age/.09,b.t/.12);

   // The hit box is untouched. Core width stays inside the real damage corridor.

     [[0,1.55,['#7c2c26','#d34923','#7d2e20'],.45],[1,1.03,['#ff9d30','#f56923','#fca23c'],.95],[2,.63,['#fff2a4','#ffcf4d','#fff0ae'],1],[3,.25,['#ffffeb','#fff4b8','#ffffe2'],1]]:
     [[0,1.63,['#1a658c','#48a5ce','#247bac'],.35],[1,1.12,['#1f8bb8','#41c4e7','#227ca4'],.95],[2,.70,['#a8f3ff','#68daf3','#c4f8ff'],.95],[3,.25,['#efffff','#ddfcff','#fff'],.97]])){
     c.globalAlpha=A*opacity;
     const grad=c.createLinearGradient(0,-w*mul,0,w*mul);
     grad.addColorStop(0,colors[0]);grad.addColorStop(.48,colors[1]);grad.addColorStop(1,colors[2]);c.fillStyle=grad;c.beginPath();
     for(const side of [-1,1])for(let j=0;j<=N;j++){
       const u=(side===-1?j:N-j)/N,edge=(.35+.65*Math.min(1,u*9))*(1-(fire?.18:.04)*u);
       const phase=u*(fire?31:22)-time*(fire?28:34);
       const turbulence=fire?Math.sin(phase+side+layer)*.19+Math.sin(phase*2.31-layer*1.7)*.09:Math.sin(phase+layer)*.12+Math.cos(phase*1.6+side)*.065;
       const yy=side*w*mul*edge*(1+turbulence*(layer===3?.24:1));
       if(side===-1&&j===0)c.moveTo(u*L,yy);else c.lineTo(u*L,yy);
     }c.closePath();c.fill();
   }
   for(let j=0;j<(fire?32:26);j++){
     const u=((j/32+time*(fire?1.25:1.9))%1+1)%1,side=hash(j+3)>.5?1:-1;
     const yy=side*w*(.15+.76*hash(j+20)),xx=u*L,span=Math.min(L-xx,12+hash(j+6)*33);
     stroke(c,fire?(j%3?'#ffce66':'#fff5d2'):(j%3?'#d5fcff':'#227eae'),1+hash(j)*2,A*(.35+hash(j+7)*.45));
     c.beginPath();c.moveTo(xx,yy);c.quadraticCurveTo(xx+span*.48,yy+Math.sin(time*20+j)*w*.25,xx+span,yy*.76);c.stroke();
     if(fire&&j%3===0){

   }

   if(water){
     // Pressurized white foam, directional spray; do not create a second damage area.
     flare(c,L,0,w*1.85,'#91edff',A*.64);
     for(let j=0;j<19;j++){
       const u=(time*3+j/19)%1,th=(hash(j+18)-.5)*PI*1.8;

 function drawHeavyImpact(c,v,spec){

   for(let i=0;i<9;i++){const th=i*2.399,dist=r*(.18+p*.98),x=Math.cos(th)*dist,y=Math.sin(th)*dist*.72;
     stroke(c,i%3===0?'#fff9e7':spec.color,2.5*(1-p)+.6,a*.85);

// Support effects use separate material silhouettes rather than generic rings.
function drawIdentitySupport(c,v,time=0){
 const id=v.skillId,shield=id==='bubbleVeil'||id==='guardStance',heal=id==='grooming'||id==='dawnHeal'||id==='tenderPaw',plant=id==='photosynth',aura=id==='blessFur',counter=id==='puffHiss';
 if(!(shield||heal||plant||aura||counter)||v.kind!=='signatureCast')return false;
 const k=clip(v.life/Math.max(.001,v.max)),p=1-k;
 c.save();c.translate(v.x,v.y);
 if(shield){
   const r=27+6*ease(p),g=c.createRadialGradient(-r*.25,-r*.32,0,0,0,r);
   g.addColorStop(0,'rgba(220,252,255,.02)');g.addColorStop(.72,'rgba(98,199,230,.12)');g.addColorStop(1,'rgba(209,251,255,.65)');
   c.globalAlpha=k;point(c,0,0,r,g);
   for(let j=0;j<3;j++){stroke(c,j===0?'#f4ffff':'#6ebad9',j===0?2.7:1.6,k*.95);c.beginPath();c.arc(0,0,r-j*2,-2.7+j*.35,.08+j*.45);c.stroke();}
   if(id==='guardStance'){stroke(c,'#f5d28d',3,k);path(c,[[-17,6],[0,-19],[17,6],[0,23],[-17,6]]);}
 }else if(plant){
   for(let j=0;j<6;j++){
     const a=j*TAU/6,x=Math.cos(a)*29,y=Math.sin(a)*13,stem=18*ease(p);
     stroke(c,'#649e4a',2.4,k);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x-5,y-stem*.5,x,y-stem);c.stroke();
     c.globalAlpha=k*.9;poly(c,[[x,y-stem],[x-12,y-stem-5],[x-7,y-stem+5]],'#a9d875');poly(c,[[x,y-stem],[x+12,y-stem-5],[x+7,y-stem+5]],'#e1eca2');
   }
 }else if(counter){
   for(let j=0;j<12;j++){const a=j*TAU/12,r=23+4*ease(p),x=Math.cos(a)*r,y=Math.sin(a)*r*.75; c.globalAlpha=k*.8;poly(c,[[x-3,y+3],[x+Math.cos(a)*15,y+Math.sin(a)*12],[x+5,y+1]],j%2?'#ffe0a7':'#bd5b32');}
 }else{
   const color=aura?'#f9cf7c':id==='grooming'?'#aee8db':'#ffd6d5';
   for(let j=0;j<(aura?8:6);j++){const a=j*TAU/8+time*.9,phase=(p+j/8)%1,x=Math.cos(a)*(aura?40:24),y=15+Math.sin(a)*8-phase*36;
     c.globalAlpha=k*Math.sin(PI*phase);if(aura){poly(c,[[x-3,y],[x,y-8],[x+3,y],[x,y+8]],color);}else{stroke(c,color,2.8,k*Math.sin(PI*phase));path(c,[[x-4,y],[x+4,y]]);path(c,[[x,y-4],[x,y+4]]);}}
 }
 c.restore();return true;
}

function draw(ctx,v,time=0){
 if(v?.kind==='shadowBindHit'||(v?.skillId==='shadowTendrils'&&v.kind==='signatureHit'))return drawShadowBind(ctx,v,time);
 if(v?.kind==='waterPierce'||(v?.skillId==='waterJet'&&v.kind==='signatureHit'))return drawWaterPierce(ctx,v);
 if(v?.meteorGround)return drawMeteorGround(ctx,v);
 const spec=REG[v?.skillId];if(!spec||!ctx)return false;
 if(isMeleeId(v.skillId))return drawMeleeContact(ctx,v,spec);
 if(drawIdentityMotion(ctx,v,time))return true;
 if(drawIdentitySupport(ctx,v,time))return true;
 const p=1-clip(v.life/Math.max(.001,v.max)),k=clip(v.life/v.max),r=spec.r;
 const cast=v.kind==='signatureCast',angle=v.angle||0;
 ctx.save();ctx.translate(v.x,v.y);ctx.rotate(angle);
 ctx.globalAlpha=clip(k*(cast?.72:.90));ctx.globalCompositeOperation='source-over';
 const g=spec.seed,style=spec.style,color=spec.color,R=cast?r:Math.min(43,r*.76);
 const spin=(time||0)*2.7+g*.91;
 // Real-game review found some signatures nearly invisible against the pale
 // watercolor garden. Paint a LOCAL dark-edged watercolor wash behind each
 // shape, never an additive/full-screen bloom or giant covering disc.
 const dark=(
  ['thunder','chain','orb','dash','wall'].includes(style)?'#56659b':
  ['flame','ball','claw','comet'].includes(style)?'#9d5049':
  ['vine','leaf','seed','thorn','sun'].includes(style)?'#4f8158':
  ['stream','whip','pool','ice','bubble'].includes(style)?'#417e9d':
  ['shadow','mist','hex','slash'].includes(style)?'#665386':'#8b7883');
 const wash=ctx.createRadialGradient(0,0,R*.10,0,0,R*.90);
 wash.addColorStop(0,cast?'rgba(255,250,229,.32)':'rgba(255,252,238,.52)');
 wash.addColorStop(.38,cast?'rgba(94,72,107,.14)':'rgba(81,58,95,.18)');
 wash.addColorStop(1,'rgba(50,40,60,0)');
 ctx.globalAlpha=cast?k*.71:k*.87;
 ctx.fillStyle=wash;ctx.beginPath();ctx.arc(0,0,R*.9,0,TAU);ctx.fill();
 // A directional outer rim differentiates cast animation from contact.
 ctx.globalAlpha=k*(cast?.63:.78);ctx.strokeStyle=dark;
 ctx.lineWidth=cast?2.4:3.6;ctx.beginPath();
 ctx.arc(0,0,R*(cast?.57:.72),g*.21+p*.9,g*.21+p*.9+PI*(cast?.7:1.35));ctx.stroke();
 ctx.globalAlpha=k*(cast?.72:.90);
 if(style==='claw'||style==='slash'||style==='shadow'||style==='fang'){
  for(let j=0;j<(style==='fang'?2:3);j++){
   const yy=(j-1)*9;
   stroke(ctx,j%2?'#fff6dc':color,style==='slash'?5.2:3.9,k*.86);
   ctx.beginPath();ctx.moveTo(-R*.36,yy-R*.38);
   ctx.bezierCurveTo(R*.06,yy-R*.51,R*.5,yy-R*.12,R*.51,yy+R*.27);
   ctx.stroke();
  }
 }else if(style==='dash'||style==='comet'||style==='paw'){
  for(let j=0;j<4;j++){
   const y=(j-1.5)*10;
   stroke(ctx,j===1?'#fff9e7':color,3+j%2,k*.8);
   path(ctx,[[-R*.65,y+4],[-R*.33,y-3],[R*.03,y-7],[R*.48,y-2]]);
  }
  if(style==='paw'){
   point(ctx,R*.15,R*.09,8,color);
   for(let j=0;j<3;j++)point(ctx,R*.08+j*9,-R*.16-j%2*4,3,color);
  }
 }else if(style==='stream'||style==='whip'||style==='flame'||style==='thunder'||style==='chain'||style==='thorn'){
  for(let j=0;j<3;j++){
   stroke(ctx,j===0?color:j===1?'#fff8dc':'#9dceef',j===0?8:j===1?3:1.4,k*(j===0?.46:.9));
   const pts=[];for(let u=0;u<=12;u++){
    const x=12+u*R*.075,y=Math.sin(u*.75+spin+j)*R*.11*(1-u/18);
    pts.push([x,y+(j-1)*5]);
   }path(ctx,pts);
  }
  if(style==='chain'||style==='thunder')for(let j=0;j<2;j++){
   stroke(ctx,'#e9efff',2,k*.8);
   path(ctx,[[R*.23,0],[R*.40,j?21:-18],[R*.61,j?14:-23]]);
  }
  if(style==='flame')for(let j=0;j<7;j++){
   ctx.save();ctx.translate(R*(.16+j*.12),(j-3)*7);ctx.rotate(-.15+j*.09);
   ctx.globalAlpha=k*(.37+.24*(j%3===0));ctx.fillStyle=j%2?'#ffb160':'#fff0ac';
   ctx.beginPath();ctx.moveTo(-6,7);ctx.quadraticCurveTo(-9,-5,7,-17);
   ctx.quadraticCurveTo(3,-2,8,7);ctx.closePath();ctx.fill();ctx.restore();
  }
 }else if(style==='ball'||style==='orb'||style==='bubble'||style==='seed'||style==='spores'){
  for(let j=0;j<5;j++){
   const th=j*TAU/5+spin*.21,rr=R*(.40+.18*p);
   const x=Math.cos(th)*rr,y=Math.sin(th)*rr*.62;
   stroke(ctx,color,2.4,k*.75);ctx.beginPath();ctx.arc(x,y,style==='spores'?3.5:6.5,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=k*.78;point(ctx,R*.22,0,style==='ball'?17:14,color);
  ctx.globalAlpha=k*.85;point(ctx,R*.18,-3,style==='ball'?7:6,'#fff7e5');
  if(style==='orb'){
    for(let j=0;j<5;j++){
      const a=j*TAU/5+spin*.7,rad=R*.45;
      stroke(ctx,j%2?'#eef4ff':'#7c83d8',2,k*.85);
      path(ctx,[[Math.cos(a)*rad,Math.sin(a)*rad],
        [Math.cos(a+.21)*(rad+7),Math.sin(a+.21)*(rad+7)],

 }else if(style==='leaf'||style==='vine'||style==='ice'||style==='hex'||style==='box'||style==='wall'){
  for(let j=0;j<(style==='wall'?3:5);j++){
   const th=j*TAU/5+spin*.08;
   ctx.save();ctx.rotate(th);ctx.globalAlpha=k*.74;
   stroke(ctx,color,style==='vine'?4:2.5,ctx.globalAlpha);
   ctx.beginPath();
   if(style==='box'||style==='wall')ctx.rect(-R*.22,-R*.46,R*.44,R*.64);
   else if(style==='hex'){
    for(let z=0;z<6;z++){const a=z*TAU/6;
      const x=Math.cos(a)*R*.35,y=Math.sin(a)*R*.35;z?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();
   }else{ctx.ellipse(0,-R*.35,R*.12,style==='ice'?R*.32:R*.23,-.2,0,TAU);}

  }
 }else if(style==='knead'){
  // Knead (踩奶) has its own rhythmic, alternating PAW-PAD animation.

   ctx.beginPath();ctx.ellipse(0,5,9,6,0,0,TAU);ctx.fill();
   for(let q=0;q<3;q++){
    ctx.beginPath();ctx.ellipse((q-1)*7,-5,3,4,0,0,TAU);ctx.fill();
   }
   stroke(ctx,'#fff5e6',1.8,k*.83);
   ctx.beginPath();ctx.ellipse(0,5,9,6,0,0,TAU);ctx.stroke();
   ctx.restore();
  }

  ctx.ellipse(0,R*.25,R*.7,R*.31,0,0,TAU);ctx.stroke();
 }else if(style==='heal'||style==='heart'||style==='sun'||style==='halo'||style==='shield'||style==='pool'||style==='stomp'||style==='fur'||style==='mist'||style==='prism'){
  for(let j=0;j<3;j++){
   const radius=R*(.24+.14*j+.14*p);
   stroke(ctx,j%2?color:'#fff9e6',j===0?5:2.5,k*(.78-j*.17));

 // Every duplicated attack family gets its own recognizable secondary shape.

// ALL combat TAG_INFO statuses deserve readable, localized, persistent shapes.
// This rendering is cosmetic only. No whole-screen flashes or large overlays.
const ACTIVE={
 burn:'#f58e5d',soak:'#80d7f2',shock:'#f6d776',oil:'#b8a3d2',
 chill:'#b8e9fc',dizzy:'#c6a9f5',bleed:'#e78086',
 blind:'#ffe5ab',bind:'#82ca84',expose:'#ed9ed5',
 weaken:'#aea0c8',rust:'#d1a06e',rewind:'#b9a5fa'
};
// Persistent, 3-star orbit for a real DIZZY/hard-stunned cat, including allies.
function drawDizzyStars(ctx,x,y,time=0,remaining=0){
 if(!ctx||!(remaining>0))return false;
 const alpha=Math.min(1,remaining/.24),angle0=time*3.8,top=y-41;
 ctx.save();ctx.lineJoin='round';
 for(let i=0;i<3;i++){
  const angle=angle0+i*TAU/3,depth=(1+Math.sin(angle))*.5;
  const cx=x+Math.cos(angle)*24,cy=top+Math.sin(angle)*6,rad=4.4+1.5*depth;
  ctx.save();ctx.globalAlpha=alpha*(.72+.27*depth);
  ctx.fillStyle=i===1?'#fff2bf':i===2?'#f5d18f':'#fffbea';
  ctx.strokeStyle='#9f8659';ctx.lineWidth=1.05;
  ctx.beginPath();
  for(let j=0;j<10;j++){
   const th=j*Math.PI/5-Math.PI/2,r=j%2?rad*.43:rad;
   const px=cx+Math.cos(th)*r,py=cy+Math.sin(th)*r;
   if(j)ctx.lineTo(px,py);else ctx.moveTo(px,py);
  }
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
 }
 ctx.restore();return true;
}
function drawStatus(ctx,unit,time=0){
 if(!ctx||!unit)return false;
 const tags=Object.keys(unit.status||{}).filter(
   tag=>(unit.status[tag]||0)>0&&ACTIVE[tag]).slice(0,3);
 const knead=unit.kneadT>0&&unit.kneadStacks>0;
 if(!tags.length&&!knead)return false;
 ctx.save();
 tags.forEach((tag,i)=>{
  // Keep the stun halo ABOVE the head, never duplicate the ear-side marks.
  if(tag==='dizzy'){drawDizzyStars(ctx,unit.x,unit.y,time,unit.status.dizzy);return;}
  const col=ACTIVE[tag],phase=time*(tag==='shock'?13:3.3)+i*1.6;
  const rad=31+i*4,a0=phase+i*2.1;
  const x=unit.x+Math.cos(a0)*rad;
  const y=unit.y+17+Math.sin(a0)*5;
  const a=Math.max(.4,Math.min(.83,(unit.status[tag]||0)*1.8));
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  if(tag==='burn'){
   ctx.beginPath();ctx.moveTo(x-5,y+7);
   ctx.quadraticCurveTo(x-9,y-2,x,y-12);
   ctx.quadraticCurveTo(x+2,y-3,x+8,y+1);
   ctx.quadraticCurveTo(x+8,y+8,x-5,y+7);ctx.fill();
  }else if(tag==='soak'||tag==='oil'||tag==='bleed'){
   ctx.beginPath();ctx.moveTo(x,y-10);
   ctx.bezierCurveTo(x-8,y,x-7,y+8,x,y+9);
   ctx.bezierCurveTo(x+7,y+8,x+8,y,x,y-10);ctx.fill();
   ctx.globalAlpha=a*.6;ctx.strokeStyle='#fff6e4';
   ctx.beginPath();ctx.moveTo(x-2,y+2);ctx.lineTo(x-1,y+5);ctx.stroke();
  }else if(tag==='shock'){
   ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(x-6,y-12);
   ctx.lineTo(x+3,y-5);ctx.lineTo(x-4,y+2);
   ctx.lineTo(x+7,y+10);ctx.stroke();
   ctx.strokeStyle='#fff';ctx.lineWidth=1.1;ctx.stroke();
  }else if(tag==='chill'){
   for(let j=0;j<3;j++){
    const th=j*Math.PI/3,dx=Math.cos(th)*11,dy=Math.sin(th)*11;
    ctx.beginPath();ctx.moveTo(x-dx,y-dy);ctx.lineTo(x+dx,y+dy);ctx.stroke();
   }
   ctx.fillStyle='#f4ffff';ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();
  }else if(tag==='blind'){
   ctx.beginPath();ctx.ellipse(x,y,11,5,0,0,TAU);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x-12,y+8);ctx.lineTo(x+12,y-9);ctx.stroke();
  }else if(tag==='bind'){
   ctx.beginPath();ctx.ellipse(unit.x,unit.y+18,23,7,0,0,TAU);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x,y+7);
   ctx.bezierCurveTo(x-8,y,x+8,y-7,x,y-12);ctx.stroke();
   ctx.fillStyle='#b9e6a2';ctx.beginPath();ctx.ellipse(x+5,y-4,6,3,-.5,0,TAU);ctx.fill();
  }else if(tag==='expose'){
   ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.stroke();
   for(const d of [-1,1]){
    ctx.beginPath();ctx.moveTo(x+d*9,y);ctx.lineTo(x+d*15,y);
    ctx.moveTo(x,y+d*9);ctx.lineTo(x,y+d*15);ctx.stroke();
   }
  }else if(tag==='weaken'){
   ctx.beginPath();ctx.moveTo(x-9,y-10);
   ctx.lineTo(x+1,y+1);ctx.lineTo(x+6,y-4);
   ctx.lineTo(x+6,y+10);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x-4,y+6);ctx.lineTo(x+6,y+12);ctx.stroke();
  }else if(tag==='rust'){
   ctx.beginPath();
   for(let j=0;j<8;j++){
    const th=j*TAU/8,r=j%2?6:11;
    j?ctx.lineTo(x+Math.cos(th)*r,y+Math.sin(th)*r):
      ctx.moveTo(x+Math.cos(th)*r,y+Math.sin(th)*r);
   }ctx.closePath();ctx.stroke();
   ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();
  }else if(tag==='rewind'){
   ctx.beginPath();ctx.arc(x,y,10,.24,TAU*.9);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x-12,y-7);
   ctx.lineTo(x-11,y+2);ctx.lineTo(x-3,y-2);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-6);
   ctx.moveTo(x,y);ctx.lineTo(x+5,y+2);ctx.stroke();
  }
  ctx.restore();
 });
 if(knead){
  const n=Math.min(4,Math.max(1,unit.kneadStacks));
  for(let i=0;i<n;i++){
   const x=unit.x+(i-(n-1)/2)*9,y=unit.y+24+Math.sin(time*12+i*Math.PI)*2;
   ctx.globalAlpha=.6;ctx.fillStyle='#e9b9ad';
   ctx.beginPath();ctx.ellipse(x,y,4,2.8,0,0,TAU);ctx.fill();
   for(let j=0;j<3;j++){
    ctx.beginPath();ctx.arc(x+(j-1)*3,y-5,1.3,0,TAU);ctx.fill();
   }
  }
 }
 ctx.restore();return true;
}
window.CatBondSkillFX={
 // `ids` is a live getter (not frozen): it syncs the generic template skills on first
 // access, so it reflects the full roster however the modules were load-ordered.
 get ids(){ syncGenerics(); return LIST.map(row=>row[0]); },
 has:id=>{ if(!REG[id])syncGenerics(); return !!REG[id]; },
 cast,support,hit,draw,drawStatus,drawDizzyStars,drawMeteorFlight,meteorImpact,drawCombatBeam,drawIdentityProjectile,drawMaterialField,drawTravel,drawInstantLine};
})();

<script>
/* Cat Bond single-cat ULT effects: eight distinct spells, keyed by skill.id.
 * Localized Canvas2D combat VFX; NO full-screen blackout, flash, freeze, cut-in
 * or separate images. Back pass sits under kittens; sparse front pass preserves
 * kitten faces and all HUD/aim information. Duo cinematics are not touched.
 */
(()=>{'use strict';
const PI=Math.PI,T=PI*2,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const h=n=>{const x=Math.sin(n*91.97+33.07)*43758.545;return x-Math.floor(x)};
const ID=Object.freeze(['sunflare','tsunamiPaw','sunbloom','thunderYowl',
 'voidMaw','moonlitHalo','moonfang']);
const col={
 sunflare:['#e95231','#ffb352','#fff4c9'],
 tsunamiPaw:['#2784b5','#7bdded','#eefeff'],
 sunbloom:['#559d65','#c8ed93','#fff4b8'],
 thunderYowl:['#779ddc','#ffe29a','#ffffff'],
 voidMaw:['#514079','#a983dd','#f4dcff'],
 moonlitHalo:['#a5a4d4','#fff0bf','#ffffff'],
 moonfang:['#7d80c7','#d3d3ff','#fffcf2']
};
function ring(c,x,y,r,c0,w,a,yr=1){
 c.globalAlpha=a;c.lineWidth=w;c.strokeStyle=c0;c.beginPath();
 c.ellipse(x,y,Math.max(1,r),Math.max(1,r*yr),0,0,T);c.stroke();
}
function glow(c,x,y,r,color,a){
 const g=c.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,color);g.addColorStop(.35,color);g.addColorStop(1,'rgba(0,0,0,0)');
 c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,T);c.fill();
}
function star(c,x,y,r,color,a){
 c.globalAlpha=a;c.strokeStyle=color;c.lineWidth=Math.max(.8,r*.18);c.lineCap='round';
 c.beginPath();c.moveTo(x-r,y);c.lineTo(x+r,y);
 c.moveTo(x,y-r);c.lineTo(x,y+r);c.stroke();
}
function bolt(c,x,y,ex,ey,i,time,alpha){
 const dx=ex-x,dy=ey-y,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
 const pts=[[x,y]],tick=Math.floor(time*20);
 for(let j=1;j<10;j++){
  const t=j/10,off=(h(i*23+j*1.2+tick)-.5)*d*.13;
  pts.push([x+dx*t+nx*off,y+dy*t+ny*off]);
 }pts.push([ex,ey]);
 // Indigo outline preserves contrast on the bright watercolor garden floor.
 for(const [w,color,a] of [[15,'#4b55aa',.29],[8,'#5f80d5',.60],[3.5,'#ffe5a0',1],[1.6,'#fffdf0',1]]){
  c.globalAlpha=alpha*a;c.lineWidth=w;c.strokeStyle=color;c.beginPath();
  pts.forEach((p,j)=>j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
 }
 for(let j=3;j<8;j+=3){
  const p=pts[j];c.globalAlpha=alpha*.5;c.strokeStyle='#e6f7ff';c.lineWidth=1.6;
  c.beginPath();c.moveTo(p[0],p[1]);
  c.lineTo(p[0]+dx*.23,p[1]-dy*.13);c.stroke();
 }
}
function sunflare(c,s){
 const {x,y,R,p,a,angle,front}=s;
 c.save();c.translate(x,y);c.rotate(angle);
 if(front){
  for(let j=0;j<12;j++){
   const ang=(h(j+2)-.5)*1.13,rad=40+R*p*(.4+.6*h(j+20));
   star(c,Math.cos(ang)*rad,Math.sin(ang)*rad,2.3,'#fff7b8',a*.67);
  }
 }else{
  glow(c,R*p*.35,0,R*.85,'#ff9a4b',a*.12);
  for(let j=0;j<19;j++){
   const ang=(h(j+7)-.5)*1.14,len=R*p*(.5+.48*h(j+18));
   c.save();c.rotate(ang);c.globalAlpha=a*(j%3===0?.85:.62);
   const grad=c.createLinearGradient(0,-14,len,0);
   grad.addColorStop(0,'#d94330');grad.addColorStop(.5,j%2?'#ffae56':'#ff7d38');
   grad.addColorStop(1,j%3===0?'#fff3aa':'#ffc66e');c.fillStyle=grad;
   c.beginPath();c.moveTo(8,-7);c.bezierCurveTo(len*.15,-25,len*.62,-26,len+16,0);
   c.bezierCurveTo(len*.62,17,len*.2,21,8,7);c.closePath();c.fill();c.restore();
  }
 }c.restore();
}
function tsunamiPaw(c,s){
 const {x,y,R,p,a,front,time}=s,r=24+R*p;
 if(front){
  for(let j=0;j<17;j++){
   const th=j*2.4,rr=35+R*p*(.3+h(j+21)*.7);
   const xx=x+Math.cos(th)*rr,yy=y+Math.sin(th)*rr*.53;
   c.globalAlpha=a*.68;c.fillStyle=j%3?'#d1fdff':'#fff';
   c.beginPath();c.arc(xx,yy,2+h(j+3)*3,0,T);c.fill();
  }
 }else{
  glow(c,x,y,R*.9,'#6dd6ed',a*.11);
  for(let band=0;band<3;band++){
   const rad=r-band*12;
   const g=c.createLinearGradient(x,y-r*.70,x,y+r*.25);
   g.addColorStop(0,'rgba(212,251,255,.80)');
   g.addColorStop(.5,band?'rgba(92,202,236,.42)':'rgba(39,126,191,.46)');
   g.addColorStop(1,'rgba(53,144,181,.02)');
   c.globalAlpha=a*(band===2?.73:.52);c.fillStyle=g;c.beginPath();
   c.moveTo(x-rad,y+6);
   c.bezierCurveTo(x-rad*.89,y-rad*.75,x+rad*.15,y-rad*(1.18+Math.sin(time*7)*.03),x+rad,y-3);
   c.bezierCurveTo(x+rad*.44,y-rad*.42,x-rad*.51,y-rad*.39,x-rad,y+6);
   c.closePath();c.fill();
   c.globalAlpha=a*(band===2?.88:.47);c.strokeStyle=band===2?'#eaffff':'#76d5eb';
   c.lineWidth=band===2?3:7;c.beginPath();c.moveTo(x-rad,y+6);
   c.bezierCurveTo(x-rad*.89,y-rad*.75,x+rad*.15,y-rad*1.18,x+rad,y-3);c.stroke();
  }
  ring(c,x,y,r,r>0?'#b3f8ff':'#fff',3,a*.44,.32);
 }
}
function drawSolarCharge(c,g,p,time){
 p=clamp(p);const r=9+19*p;
 c.save();c.translate(g.x,g.y);c.rotate(g.aim);
 const trail=c.createLinearGradient(0,0,g.reach,0);trail.addColorStop(0,'rgba(240,242,150,.24)');trail.addColorStop(1,'rgba(231,242,155,.04)');
 c.fillStyle=trail;c.globalAlpha=.45;c.fillRect(0,-g.width,g.reach,g.width*2);
 for(let j=0;j<13;j++){const th=j*T/13+time*2.7,rr=58*(1-p)+r,xx=Math.cos(th)*rr,yy=Math.sin(th)*rr*.82;c.strokeStyle=j%2?'#d4e89c':'#fff2ae';c.lineWidth=2;c.globalAlpha=.35+.45*p;c.beginPath();c.moveTo(xx,yy);c.quadraticCurveTo(xx*.6+7,yy*.35,5,0);c.stroke();}
 glow(c,7,0,r*1.7,'#e9f6b0',.55*p);glow(c,7,0,r,'#fff7ba',.85);c.restore();
}
function sunbloom(c,s){
 const {x,y,R,p,a,front,time,angle}=s,L=s.reach||R*2,w=(s.width||36)*.72,k=Math.min(1,p*5);
 if(!Number.isFinite(L)||L<=0)return;
 c.save();c.translate(x,y);c.rotate(angle);
 if(!front){
  const g=c.createLinearGradient(0,-w,0,w);g.addColorStop(0,'rgba(101,163,80,0)');g.addColorStop(.16,'#c99a42');g.addColorStop(.42,'#ffe8a0');g.addColorStop(.5,'#ffffdf');g.addColorStop(.58,'#fff3b4');g.addColorStop(.84,'#d3a84e');g.addColorStop(1,'rgba(104,154,76,0)');
  const end=L*k;
  c.globalAlpha=a*.84;c.fillStyle=g;c.beginPath();c.moveTo(0,-9);
  for(let i=0;i<=24;i++){let u=i/24,xx=end*u,yy=-w*(.30+.70*Math.sin(Math.PI*u*.84))*(1+.09*Math.sin(u*24-time*16));c.lineTo(xx,yy);}
  for(let i=24;i>=0;i--){let u=i/24,xx=end*u,yy=w*(.30+.70*Math.sin(Math.PI*u*.84))*(1+.09*Math.sin(u*24+time*15));c.lineTo(xx,yy);}c.closePath();c.fill();
  c.globalAlpha=a*.92;c.strokeStyle='#fffde0';c.lineWidth=w*.36;c.lineCap='round';c.beginPath();c.moveTo(4,0);c.lineTo(end,0);c.stroke();
  glow(c,10,0,w*.8,'#fff6bb',a*.65);
 }else{
  for(let j=0;j<16;j++){const u=(h(j+4)+time*1.7)%1;if(u>k)continue;const xx=u*L,yy=(h(j+8)-.5)*w*1.6;c.globalAlpha=a*.75;c.strokeStyle=j%3?'#e9f6be':'#fffbe8';c.lineWidth=1.6+h(j)*2;c.beginPath();c.moveTo(xx-10,yy);c.lineTo(xx+14,yy*.8);c.stroke();}
 }
 c.restore();
}
function thunderYowl(c,s){
 const {x,y,p,a,front,targets,time}=s;
 // Vertical strikes are anchored to enemies the actual ultimate hit.
 if(!targets.length)return;
 for(let j=0;j<Math.min(7,targets.length);j++){
   const d=targets[j],q=clamp(p*2.8-j*.06),r=21+12*q;
   if(front){if(q>0&&q<.9)bolt(c,d.x-7,d.y-88*q,d.x,d.y,j,time,a*.9);
     star(c,d.x,d.y-8,6*(1-q)+2,'#fffbe1',a*.86);
   }else{glow(c,d.x,d.y-6,r,'#a99bfa',a*.35);
     ring(c,d.x,d.y+9,r*q,'#c9c2ff',2.4,a*.67,.52);
     for(let k=0;k<4;k++){const th=k*T/4+q;bolt(c,d.x,d.y,d.x+Math.cos(th)*r,d.y+Math.sin(th)*r*.65,k+j*4,time,a*.55);}
   }
 }
}
function voidMaw(c,s){
 const {x,y,R,p,a,front,time}=s;
 if(front){
  for(let j=0;j<13;j++){
   const ang=j*2.4-time*2.5,rr=R*(.85-.68*p)*(h(j)+.16);
   star(c,x+Math.cos(ang)*rr,y+Math.sin(ang)*rr*.82,2.4,'#e9caff',a*.65);
  }
 }else{
  const r=Math.max(18,R*(1-.82*p));
  // A true dark event horizon UNDER the existing cat, not white rings on grass.
  c.globalAlpha=a*.23;c.fillStyle='#32204f';c.beginPath();
  c.ellipse(x,y,r*.67,r*.52,0,0,T);c.fill();
  glow(c,x,y,r*.86,'#57327d',a*.17);
  for(let j=0;j<8;j++){
   c.strokeStyle=j%2?'#7447b3':'#ac78d3';c.lineWidth=j%2?7:3;
   c.globalAlpha=a*(j%2?.6:.91);c.beginPath();
   for(let k=0;k<=26;k++){
    const t=k/26,theta=j*T/8+t*PI*1.8-time*2.4,rad=r*(1-t*.86);
    const px=x+Math.cos(theta)*rad,py=y+Math.sin(theta)*rad*.82;
    k?c.lineTo(px,py):c.moveTo(px,py);
   }c.stroke();
  }
  ring(c,x,y,r,'#8652c0',2.8,a*.66,.82);
 }
}
function moonlitHalo(c,s){
 const {x,y,R,p,a,front}=s,rad=25+R*p;
 if(front){
  for(let j=0;j<13;j++){
   const th=j*T/13,rr=rad*(.7+.3*h(j+2));
   star(c,x+Math.cos(th)*rr,y+Math.sin(th)*rr,3,'#fffbec',a*.75);
  }
 }else{
  for(let j=0;j<20;j++){
   const th=j*T/20,dx=Math.cos(th),dy=Math.sin(th);
   c.globalAlpha=a*.2;c.strokeStyle=j%2?'#fff5da':'#c8e8fa';
   c.lineWidth=j%2?4:8;c.beginPath();
   c.moveTo(x+dx*25,y+dy*25);c.lineTo(x+dx*rad,y+dy*rad);c.stroke();
  }
  ring(c,x,y,rad,'#fff5d5',5,a*.72);
  ring(c,x,y,rad*.69,'#d1e9ff',2.2,a*.62);
  glow(c,x,y,rad*.66,'#fff4dc',a*.12);
 }
}
function moonfang(c,s){
 const {x,y,R,p,a,front,angle,targets}=s;
 const target=targets[0]||{x:x+Math.cos(angle)*R*.64,y:y+Math.sin(angle)*R*.64};
 const ang=Math.atan2(target.y-y,target.x-x),r=Math.min(65,R*.52);
 if(front){
   window.CatBondMoonFX?.drawImpact(c,{x:target.x,y:target.y,angle:ang+.5,life:1-p,max:1,radius:r},s.time);
   window.CatBondMoonFX?.drawImpact(c,{x:target.x,y:target.y,angle:ang-.65,life:1-p,max:1,radius:r*.88},s.time);
 }else{
   const q=Math.min(1,p*3.4);
   for(const [offset,dy] of [[0,-12],[.18,12]]){
     const u=Math.max(0,q-offset);
     const dx=target.x-x,ddy=target.y-y;
     window.CatBondMoonFX?.drawProjectile(c,{kind:'crescent',x:x+dx*u,y:y+ddy*u+dy*Math.sin(PI*u),r:22,vx:dx,vy:ddy,ang},s.time);
   }
 }
}
// Seven currently registered ultimates. Starfall is a separate unimplemented design.
const paint=Object.freeze({sunflare,tsunamiPaw,sunbloom,thunderYowl,voidMaw,moonlitHalo,moonfang});
function has(id){return !!paint[id]}
function draw(ctx,v,W,H,time=0,layer='back'){
 if(!ctx||v?.kind!=='ultimate'||!has(v.skillId))return false;
 const p=ease(1-clamp(v.life/Math.max(.001,v.max))),fade=clamp(v.life/Math.max(.001,v.max)*2.3);
 if(fade<.004)return true;
 const R=Math.min(190,Math.max(72,Math.min(W,H)*.27));
 const s={x:v.x,y:v.y,R,p,a:fade*(layer==='front'?.85:1),
  angle:v.angle||0,targets:v.targets||[],reach:v.reach,width:v.width,time,front:layer==='front'};
 // Purple shadow and dark-blue thunder must not be bleached into white by
 // additive compositing over a bright garden floor. Other spells keep glow.
 ctx.save();ctx.globalCompositeOperation=
   v.skillId==='voidMaw'||v.skillId==='thunderYowl'?'source-over':'lighter';
 ctx.lineCap='round';ctx.lineJoin='round';
 paint[v.skillId](ctx,s);
 ctx.restore();return true;
}
window.CatBondUltVFX={ids:ID,has,draw,drawSolarCharge};
})();

function drawEvent(c,v,t){const p=cl((t-v.start)/Math.max(.01,v.life)),a=1-p;if(a<=0)return false;const fn=PAINT[v.species];if(!fn)return false;c.save();fn(c,v,t,p,a);c.restore();return true;}

 for(const f of b.fields||[]){if(f.t<=0)continue;const sp=species(f._traitCaster);if(sp==='meidu'||sp==='fanmao')vineField(c,f,t,sp==='fanmao');}
 for(const a of b.team||[]){if(a.alive)drawReady(c,a,b,t);}
 for(const e of b.enemies||[]){if(!e.alive)continue;if(e._frostStack>0&&t-(e._frostStackT||0)<5)for(let j=0;j<e._frostStack;j++)shard(c,e.x-12+j*6,e.y-29,0,5,'#b6e5fb',.9);
 if(e._hunterMark&&e._hunterMarkExpire>t){const x=e.x,y=e.y-38;for(let j=0;j<4;j++){const th=j*TAU/4;line(c,[[x+Math.cos(th)*10,y+Math.sin(th)*10],[x+Math.cos(th)*5,y+Math.sin(th)*5]],'#e0b5ff',2,.8);}}
 if(e.status?.suppress>0){arc(c,e.x,e.y-18,19,t*.7,PI*1.3,'#9e82c6',2.6,.7,.6);}}
 try{for(const v of b._traitFX||[])if(t-v.start<v.life)drawEvent(c,v,t);}finally{activeGhost=null;c.restore();}}

window.CatBondTraitFX={draw,drawFront,drawEvent,colors,ids:Object.freeze(Object.keys(PAINT))};

<script>
// vfx.js — reusable juicy visual effects for skills & impacts. Pure Canvas 2D.
// A single VFX layer owns a pool of effect objects; battle.js spawns into it.

class VFX {
  constructor() { this.fx = []; this._t = 0; }
  clear() { this.fx.length = 0; }

  // Lighten a hex color toward white (for the mid glow pass of the charged bolt).
  _lighten(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#cfe0ff';
    const n = parseInt(m[1], 16);
    const r = Math.min(255, (n >> 16 & 255) + 90), g = Math.min(255, (n >> 8 & 255) + 90), b = Math.min(255, (n & 255) + 90);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  // Midpoint-displacement lightning path between two points. Seeded + time-quantized
  // so it re-rolls a few times per second (flicker) without being noisy every frame.
  _bolt(x1, y1, x2, y2, seed) {
    const step = Math.floor(this._t * 18);               // reseed ~18x/sec
    let rnd = (Math.sin((seed + step) * 12.9898) * 43758.5453) % 1; if (rnd < 0) rnd += 1;
    const rand = () => { rnd = (Math.sin(rnd * 78.233 + 1) * 43758.5453) % 1; return rnd < 0 ? rnd + 1 : rnd; };
    let pts = [{ x: x1, y: y1 }, { x: x2, y: y2 }];
    let offset = Math.hypot(x2 - x1, y2 - y1) * 0.18;
    for (let pass = 0; pass < 5 && offset > 3; pass++) {
      const out = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const nx = -(b.y - a.y), ny = (b.x - a.x), nl = Math.hypot(nx, ny) || 1;
        const d = (rand() - 0.5) * offset;
        out.push(a, { x: mx + nx / nl * d, y: my + ny / nl * d });
      }
      out.push(pts[pts.length - 1]);
      pts = out; offset *= 0.55;
    }
    // branch forks: short dim child bolts peeling off a few interior vertices
    // (Drilian). Seeded off the same rnd stream so they boil in sync with the main.
    const branches = [];
    for (let i = 2; i < pts.length - 2; i++) {
      if (rand() > 0.22) continue;                       // ~1 in 5 vertices forks
      const a = pts[i - 1], b = pts[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const ang = Math.atan2(dy, dx) + (rand() - 0.5) * 1.0;   // ±0.5 rad off parent
      const len = Math.hypot(dx, dy) * (3 + rand() * 3);       // a few segments long
      const n = 3; const seg = [];
      for (let j = 0; j <= n; j++) {
        const t = j / n;
        seg.push({ x: b.x + Math.cos(ang) * len * t + (rand() - 0.5) * 6,
                   y: b.y + Math.sin(ang) * len * t + (rand() - 0.5) * 6 });
      }
      branches.push(seg);
    }
    pts.branches = branches;
    return pts;
  }

  // How many throwaway particles (sparks/fades) are live right now. Used to keep
  // the screen legible: once the field is busy, new bursts spawn fewer motes so a
  // flurry of skills never buries the cats under confetti. (Player clutter fix.)
  _noise() { let n = 0; for (const e of this.fx) if (e.type === 'spark' || e.type === 'fade') n++; return n; }

  // ---- spawners ----
  burst(x, y, opts = {}) {
    // Clarity budget: fade the requested particle count toward 0 as the screen
    // fills, and hard-stop once we're saturated. Rings/text/beams are unaffected.
    const noise = this._noise();
    if (noise > 150) return;
    const scale = noise > 80 ? Math.max(0.3, 1 - (noise - 80) / 100) : 1;
    const n = Math.max(3, Math.round((opts.count || 14) * scale));
    const color = opts.color || '#ffd36b';
    const spd = opts.speed || 180;
    for (let i = 0; i < n; i++) {
      const a = (opts.angle != null) ? opts.angle + (Math.random() - 0.5) * (opts.spread || Math.PI * 2) : Math.random() * Math.PI * 2;
      const s = spd * (0.4 + Math.random() * 0.8);
      this.fx.push({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: opts.life || 0.5, max: opts.life || 0.5, r: (opts.r || 3) * (0.6 + Math.random()), color, drag: opts.drag ?? 2.5, grav: opts.grav || 0 });
    }
  }
  ring(x, y, opts = {}) {
    this.fx.push({ type: 'ring', x, y, r: opts.r0 || 6, vr: opts.vr || 360, life: opts.life || 0.45, max: opts.life || 0.45,
      color: opts.color || '#9be7c4', width: opts.width || 4 });
  }
  shockwave(x, y, color) { this.ring(x, y, { r0: 10, vr: 520, life: 0.4, color: color || '#fff', width: 6 }); }
  // muzzle flash + small forward cone when a projectile is fired
  muzzle(x, y, angle, color) {
    this.fx.push({ type: 'muzzle', x, y, angle, life: 0.14, max: 0.14, color: color || '#ffd36b', len: 26 });
    this.burst(x, y, { count: 5, color, angle, spread: 0.7, speed: 220, life: 0.22, r: 2.5, drag: 4 });
  }
  // persistent-ish glowing trail dot (call each frame behind a projectile)
  trail(x, y, color, r) {
    if (this._noise() > 120) return;                 // don't pile trails onto a saturated screen
    this.fx.push({ type: 'fade', x, y, r: r || 4, life: 0.26, max: 0.26, color: color || '#ffd36b' });
  }
  // Standard visual grammar. Purely local: no fullscreen hit overlay.
  // Combat mechanics (HP, invulnerability, hitstop) remain battle-owned.
  impactType(x,y,type='light',options={}){
    const C=window.CatBondContactFX;
    if(C){
      // Per-contact duration and intensity, with a bounded visual pool.
      const style=C.classify(type,options.skill),max=['heal','cleanse','barrier','shieldBreak'].includes(style)?.42:type==='kill'?.44:.28;
      const live=this.fx.filter(e=>e.type==='contact').length;
      if(live<36){
        this.fx.push({type:'contact',style,tier:type,element:options.skill?.element,skillId:options.skill?.isBasic||options.skill?.ultCost?null:options.skill?.id,angle:options.angle||0,x,y,life:max,max,scale:options.scale||1});
      }
      return;
    }
    const color=options.color||({
      light:'#fff1ce',heavy:'#ffe4a4',crit:'#fff3b4',stagger:'#ffd888',kill:'#fff1b3',
      heal:'#a6e9c5',guard:'#9ce5ce',reflect:'#addaff',
      barrier:'#a5e4fb',wardFade:'#c5dbe4',cleanse:'#c7f2d6',shieldBreak:'#d8f8ff'
    }[type]||'#fff1ce');
    const heavy=type==='heavy'||type==='crit'||type==='stagger'||type==='kill';
    const soft=['heal','guard','reflect','barrier','wardFade','cleanse'].includes(type);
    const shatter=type==='shieldBreak';
    const duration=soft?.34:.25;
    this.ring(x,y,{r0:heavy?10:4,vr:(heavy?72:shatter?58:soft?40:32)/duration,
      life:duration,color,width:heavy?4.5:shatter?3.6:2.4});
    this.burst(x,y,{count:type==='kill'?15:shatter?11:heavy?11:soft?7:5,
      color,speed:heavy?180:shatter?150:soft?85:130,life:soft?.38:.26,
      r:heavy?2.8:shatter?3.2:2.2,angle:options.angle,
      spread:options.angle==null?Math.PI*2:1.1,
      grav:type==='heal'?-35:0});
    if(!soft)this.fx.push({type:'flash',x,y,r:heavy?12:7,
      life:heavy?.11:.08,max:heavy?.11:.08});
    if(type==='crit')this.ring(x,y,{r0:7,vr:280,life:.27,color:'#fff5d4',width:2});
    if(type==='stagger')this.orb(x,y,'#fff0bf',4);
    if(type==='reflect')this.beam(x-8,y-4,x+21,y-16,'#a3d5ff');
    if(type==='heal')this.orb(x,y,'#ace9cd',4);
    if(type==='barrier')this.ring(x,y,{r0:11,vr:72,life:.18,color:'#e8fcff',width:2.5});
    if(type==='wardFade')this.ring(x,y,{r0:20,vr:62,life:.32,color,width:2});
    if(type==='cleanse')this.orb(x,y,'#f2ffec',3);
    if(shatter)this.fx.push({type:'guardShards',x,y,life:.31,max:.31,
      color,seed:Math.abs(x*71+y*19)%7});
  }
  // `angle` (optional) sprays sparks directionally along the hit normal — reads as
  // force far better than a symmetric puff. A brief white flash pop sells the connect.
  impact(x, y, color, angle) {
    if (angle != null) {
      this.burst(x, y, { count: 9, color, speed: 240, life: 0.34, r: 3, drag: 3.5, angle, spread: 1.0 });
    } else {
      this.burst(x, y, { count: 10, color, speed: 200, life: 0.4, r: 3, drag: 3 });
    }
    this.ring(x, y, { r0: 4, vr: 300, life: 0.3, color, width: 3 });
    // white-hot flash pop at the contact point (impact-frame feel)
    this.fx.push({ type: 'flash', x, y, r: 10, life: 0.12, max: 0.12 });
  }
  // rising text (damage / status)
  text(x, y, str, color, size) {
    // Max 5 readable callouts, never 30 overlapping skill names.
    // Nearby duplicate events coalesce instead of piling into a word cloud.
    const clean=String(str||'').trim();
    if(!clean)return;
    const alive=this.fx.filter(e=>e.type==='text'&&e.life>.16);
    if(alive.length>=5)return;
    const nearby=alive.find(e=>Math.hypot(e.x-x,e.y-y)<42&&e.life>.4);
    if(nearby)return;
    this.fx.push({type:'text',x,y,str:clean.slice(0,11),color:color||'#fff',
      size:Math.min(14,Math.max(10,size||12)),life:.52,max:.52});
  }
  // orbiting glyph for charge/buff
  orb(x, y, color, n) {
    for (let i = 0; i < (n || 6); i++) this.fx.push({ type: 'orb', x, y, baseA: (i / (n || 6)) * Math.PI * 2, rad: 34, life: 0.6, max: 0.6, color: color || '#9d7bff' });
  }
  // lightning-ish zigzag beam between two points (for combo / ult)
  beam(x1, y1, x2, y2, color) {
    this.fx.push({ type: 'beam', x1, y1, x2, y2, life: 0.28, max: 0.28, color: color || '#ffd36b', seed: (x1 * 13 + y2 * 7) % 100 });
  }
  // A compact three-claw brush stroke, not a giant circular sword arc. radius
  // is VISUAL reach and is capped below the melee hit geometry. Same primitive
  // serves enemy swipes; heavy player strikes get a longer, weighted follow-through.
  slash(x, y, aim, color, radius, arc, options = {}) {
    const reach = Math.max(24, Math.min(112, Number(radius) || 52));
    const life = options.heavy ? 0.34 : 0.26;
    this.fx.push({ type: 'slash', x, y, aim, color: color || '#f8ddbe',
      radius: reach, arc: Math.max(.35, Math.min(.95, Number(arc) || .7)),
      heavy: !!options.heavy, element: options.element || null, life, max: life });
  }

  update(dt) {
    this._t += dt;                        // drives lightning flicker/reseed
    for (const e of this.fx) {
      e.life -= dt;
      if (e.type === 'spark' || e.type === 'fade') {
        if (e.vx != null) { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= (1 - (e.drag || 0) * dt); e.vy = e.vy * (1 - (e.drag || 0) * dt) + (e.grav || 0) * dt; }

    }
  }
}

window.VFX = VFX;

   coordinates/actors are fixtures, not a live gameplay or damage test. */
(()=>{'use strict';
const W=600,H=300,PI=Math.PI,T=PI*2;
const P={fire:'#d59256',water:'#95bacb',grass:'#90ac78',elec:'#cfb971',dark:'#9990b8',light:'#dfd0ac',neutral:'#c9a882'};
const names={tangyuan:'汤圆',dundun:'团团',lanbao:'蓝莓',senlin:'松松',abi:'杏仁',wumao:'桃桃',moqiu:'墨球',niuniu:'奥利奥',meidu:'圈圈',duanduan:'跳跳',yunduo:'云朵',bosi:'绒绒',nietu:'奶酥',jiafei:'圆宝',qisi:'芝士',jinwu:'焰焰',nuowei:'枫枫',lixiao:'绅绅',sanhua:'花花',xiaohui:'小雾',xianluo:'露露',youling:'幽幽',yuelian:'月月',doudou:'豆豆',baomao:'斑斑',xingchen:'星星',fanmao:'奶糖',mengmai:'夜夜',yinghua:'樱桃',xuewa:'雪袜',zherdd:'布丁',jinjc:'金豆',nainai:'雪团'};
const effects=['light','heavy','slash','smash','fire','water','ice','elec','dark','grass','vine','heal','cleanse','guard','barrier','reflect','wardFade','shieldBreak','stagger','kill','crit'];
const labels=['普通命中','重击','斩击','重砸','火焰命中','水流命中','冰晶命中','电击命中','暗影命中','草系命中','藤蔓撕击','治疗','净化','守护','护盾','反弹','护盾消退','护盾破裂','韧性击破','终结','暴击'];
const tags=['burn','soak','shock','oil','chill','dizzy','bleed','blind','bind','expose','weaken','rust','rewind'];
const elements=['fire','water','grass','elec','dark','light'];
function getCases(){const sk=window.Skills.SKILLS.filter(s=>!s.legacy);
 return [...sk.map(s=>({id:s.id,name:s.name,group:s.ultCost?'ult':s.element,kind:s.id==='magneticField'?'magnetic':s.ultCost?'ult':'skill',sk:s})),...window.CatBondTraitFX.ids.map(id=>({id,name:names[id]||id,group:'passive',kind:'passive'})),...effects.map((id,i)=>({id,name:labels[i],group:'contact',kind:'contact'})),...tags.map(id=>({id,name:id,group:'status',kind:'status'})),...elements.flatMap((a,i)=>elements.slice(i).map(b=>({id:[a,b].sort().join('+'),name:a+' + '+b,group:'duo',kind:'duo'})))];}
function oval(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,T);c.fill();}
function cat(c,x,y,col,face=1){c.save();c.translate(x,y);oval(c,0,15,23,7,'#3c5044');c.scale(face,1);c.lineWidth=2;c.strokeStyle='#4c5047';c.fillStyle=col;c.beginPath();c.moveTo(-18,0);c.bezierCurveTo(-26,-10,-28,-27,-15,-21);c.lineTo(-6,-14);c.lineTo(9,-15);c.lineTo(20,-26);c.lineTo(23,-6);c.bezierCurveTo(29,14,10,20,-5,17);c.bezierCurveTo(-20,18,-25,9,-18,0);c.closePath();c.fill();c.stroke();oval(c,5,-3,1.8,2.2,'#393c36');oval(c,15,-3,1.8,2.2,'#393c36');oval(c,10,3,2.5,1.4,'#9e7469');c.restore();}
function stage(c){c.fillStyle='#435a48';c.fillRect(0,0,W,H);c.fillStyle='#536b50';c.fillRect(12,12,W-24,H-24);c.strokeStyle='#61765a';c.lineWidth=.8;for(let i=24;i<W;i+=42){c.beginPath();c.moveTo(i,15);c.lineTo(i,H-15);c.stroke();}for(let i=24;i<H;i+=42){c.beginPath();c.moveTo(15,i);c.lineTo(W-15,i);c.stroke();}c.strokeStyle='#849378';c.lineWidth=1;c.strokeRect(12,12,W-24,H-24);}
function render(c,item,phase=0,t=.25){
 const F=window.CatBondSkillFX,U=window.CatBondUltVFX,M=window.CatBondMoonFX,C=window.CatBondContactFX,A=window.CatBondTraitFX;
 const sk=item.sk,el=sk?.element||'light',x=125,y=165,ex=['waterJet','shadowTendrils'].includes(sk?.id)?286:440,ey=165,time=.8+t,contact=(style,tier='heavy',px=ex,py=ey)=>C.draw(c,{style,tier,element:el,skillId:item.kind==='skill'?sk?.id:null,x:px,y:py,angle:0,life:1-t,max:1},time);
 stage(c);const melee=sk?.kind==='melee',close=melee?ex-52:x,ally=['heal','buff'].includes(sk?.kind)||['heal','cleanse','guard','barrier','wardFade','shieldBreak'].includes(item.id);
 if(item.kind==='skill'){
   const v={kind:phase?'signatureHit':'signatureCast',skillId:sk.id,x:phase?ex:close,y,angle:0,heavy:!!sk.heavy,life:1-t,max:1};
   if(sk.id==='meteor'){if(phase){F.draw(c,{...v,meteorGround:true,r:86,life:1-t,max:1},time);}else F.drawMeteorFlight(c,{burst:{tx:ex,ty:ey,r:86,skill:sk},life:.42},time);}
   else if(sk.kind==='aoe'&&sk.field){if(phase)F.drawMaterialField(c,{element:sk.field.element||el,r:82,x:ex,y:ey,t:4},time);}
   if(sk.kind==='buff'&&sk.id==='mirrorWall')window.CatBondWardArt?.drawFlatWall(c,{x:ex,y:ey,angle:0,halfLength:110,age:.4,remaining:4,hitAge:phase?.18:0},time);
   if(sk.kind==='beam'){F.drawCombatBeam(c,{sk,_ox:['waterJet','shadowTendrils'].includes(sk.id)?x+22:x,_oy:y,width:sk.width||22,max:1.4,t:.7},time,['waterJet','shadowTendrils'].includes(sk.id)?x+22+sk.reach:ex,ey);}
   else if(['waterLash','frostLance','prismBeam'].includes(sk.id)){F.drawInstantLine(c,{kind:sk.id==='waterLash'?'water':sk.id==='frostLance'?'ice':'prism',x,y,x2:ex+65,y2:ey,life:.7,max:1},time);}
   else if(sk.kind==='chain'){F.drawInstantLine(c,{kind:'lightning',x,y,x2:ex,y2:ey,life:.82,max:1},time);F.drawInstantLine(c,{kind:'lightning',x:ex,y:ey,x2:ex+58,y2:ey-73,life:.73,max:1},time);}
   else if(sk.kind==='projectile'&&!phase){
      const kind=sk.id==='crescentFan'?'crescent':sk.id==='fireballMeow'?'fireball':sk.id==='hex'||sk.id==='arcanePulse'?'hex':sk.id==='lightningOrb'||sk.id==='boltSwarm'?'lightningOrb':sk.id==='leafDart'||sk.id==='homingSeed'?'leaf':'orb';
      const n=sk.id==='crescentFan'?3:sk.pulseCount?2:sk.shots?Math.min(5,sk.shots):sk.id==='leafDart'?3:1;
      for(let j=0;j<n;j++){const p={kind,x:270-j*(sk.pulseCount?55:8),y:y+(j-(n-1)/2)*(sk.pulseCount?5:18),r:kind==='crescent'?14:kind==='fireball'?15:kind==='lightningOrb'?13:kind==='hex'?13:9,ang:0,vx:250,vy:0,skill:sk,owner:'me'};
        if(!M.drawProjectile(c,p,time))F.drawIdentityProjectile(c,p,time);}
   }else if(['dash','pounce','leap'].includes(sk.kind)&&!phase){F.drawTravel(c,[{x:145,y,x2:345,y2:y,element:el,start:time-.045}],time);}
   cat(c,phase&&['dash','pounce','leap'].includes(sk.kind)?ex-36:close,y,P[el]||P.neutral);cat(c,ex,ey,ally?'#c4cbb0':'#a9b1bb',-1);
   if(sk.id==='waterJet')cat(c,ex+92,ey,'#a9b1bb',-1);
   if(sk.id==='shadowTendrils')cat(c,ex+65,ey+18,'#a9b1bb',-1);
   if(sk.kind==='chain')cat(c,ex+58,ey-73,'#a9b1bb',-1);
   if(melee&&!phase){const a=new window.VFX();a.slash(close,y,0,P[el],sk.heavy?104:81,.72,{heavy:!!sk.heavy,element:el});a.update(.12);a.draw(c);}
   if(sk.kind==='heal'||sk.kind==='buff'){
     if(sk.id!=='mirrorWall')F.draw(c,{...v,kind:'signatureCast',x:phase?ex:close},time);
     if(phase)contact(sk.kind==='heal'?'heal':'barrier','light');
   }else if(phase){if(sk.id==='crescentFan')M.drawImpact(c,{x:ex,y:ey,angle:0,radius:32,life:1-t,max:1},time);
     else if(sk.id==='waterJet'){for(const px of [ex,ex+92])F.draw(c,{kind:'waterPierce',x:px,y:ey,radius:18,angle:0,life:1-t,max:1},time);}
     else if(sk.id==='shadowTendrils'){for(const [px,py] of [[ex,ey],[ex+65,ey+18]])F.draw(c,{kind:'shadowBindHit',x:px,y:py,radius:18,angle:0,life:1-t,max:1},time);}
     else contact(C.classify(sk.heavy||melee?'heavy':'light',sk),sk.heavy||melee?'heavy':'light');}
   else if(!['projectile','beam','chain','melee','dash','pounce','leap','aoe'].includes(sk.kind))F.draw(c,v,time);
 }else if(item.kind==='ult'){
   const v={kind:'ultimate',skillId:sk.id,x:185,y,angle:0,targets:[{x:ex,y:ey},{x:ex-72,y:ey-75},{x:ex-28,y:ey+64}],reach:350,width:36,life:phase?.43:.74,max:1};
   if(sk.id==='sunbloom'&&!phase){cat(c,185,y,P[el]);cat(c,ex,ey,'#a9b1bb',-1);U.drawSolarCharge(c,{x:185,y,aim:0,reach:350,width:36},.8,time);}
   else {U.draw(c,v,W,H,time,'back');cat(c,185,y,P[el]);for(const e of v.targets)cat(c,e.x,e.y,'#a9b1bb',-1);U.draw(c,v,W,H,time,'front');if(phase&&sk.kind!=='heal')contact(C.classify('heavy',sk),'heavy');}
 }else if(item.kind==='passive'){
   cat(c,x,y,P.light);cat(c,ex,ey,'#a9b1bb',-1);
   const self=['tangyuan','dundun','senlin','nietu','wumao','abi','moqiu','nuowei','zherdd','bosi'].includes(item.id);
   A.drawEvent(c,{species:item.id,phase:phase?'fire':'ready',x:(!phase&&self||item.id==='dundun')?x:ex,y:ey,ox:x,oy:y,start:0,life:1,radius:90,level:5},t);
 }else if(item.kind==='contact'){
   cat(c,x,y,P.light);cat(c,ex,ey,'#a9b1bb',-1);
   const style=item.id==='crit'?'slash':item.id,tier=item.id==='crit'?'crit':item.id==='kill'?'kill':['light','heal','cleanse','guard','barrier','reflect','wardFade'].includes(item.id)?'light':'heavy';
   contact(style,tier);
 }else if(item.kind==='status'){
   cat(c,x,y,P.light);cat(c,ex,ey,'#a9b1bb',-1);
   F.drawStatus(c,{x:ex,y:ey,alive:true,status:{[item.id]:2},tags:[item.id]},time);
 }else if(item.kind==='duo'){
   cat(c,110,165,P[item.id.split('+')[0]]);cat(c,490,165,P[item.id.split('+')[1]],-1);
   window.CatBondDuoFinale?.draw(c,W,H,phase?.58:.30,item.id,2);
 }else if(item.kind==='magnetic'){
   window.CatBondMagneticFX.draw(c,{x:305,y:99},{x:305,y:231},time,1,22);
   cat(c,x,y,P.elec);cat(c,305,ey,'#a9b1bb',-1);cat(c,390,ey,'#a9b1bb',-1);
 }
}
window.CatBondVFXAtlas={getCases,render,W,H};
})();
</script><script>
const A=CatBondVFXAtlas,items=A.getCases(),g=document.getElementById('group'),rows=document.getElementById('rows'),search=document.getElementById('find'),names={fire:'火系',water:'水系',grass:'草系',elec:'电系',dark:'暗系',light:'光系',neutral:'通用',ult:'必杀技',passive:'33猫专属被动',contact:'命中反馈',status:'状态效果',duo:'双猫合击收尾',prototype:'原型'};
const opt=(id,label)=>{let o=document.createElement('option');o.value=id;o.textContent=label;g.append(o)};opt('all','全部');for(const key of new Set(items.map(x=>x.group)))opt(key,names[key]||key);g.value='fire';
function canvas(v,p){const c=document.createElement('canvas');c.width=A.W;c.height=A.H;A.render(c.getContext('2d'),v,p,p?.32:.2);return c}
function download(c,name){c.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')}
function shown(){const q=search.value.toLowerCase();return items.filter(x=>(g.value==='all'||x.group===g.value)&&(x.id.toLowerCase().includes(q)||x.name.includes(q)))}
function combined(list){const c=document.createElement('canvas');c.width=A.W*2;c.height=50+list.length*(A.H+37);const ctx=c.getContext('2d');ctx.fillStyle='#202f2a';ctx.fillRect(0,0,c.width,c.height);ctx.font='bold 22px sans-serif';ctx.fillStyle='#f3efdf';ctx.fillText('Cat Bond / isolated renderer fixtures',16,30);list.forEach((v,i)=>{const y=50+i*(A.H+37);ctx.fillStyle='#f3efdf';ctx.font='17px sans-serif';ctx.fillText(v.name+' · '+v.id,16,y+22);for(let p=0;p<2;p++)ctx.drawImage(canvas(v,p),p*A.W,y+32)});return c}
function refresh(){rows.replaceChildren();const list=shown();document.getElementById('summary').textContent=list.length+' / '+items.length+' 个效果';for(const v of list){let a=document.createElement('article'),h=document.createElement('h3'),s=document.createElement('section');h.textContent=v.name+' · '+v.id;a.append(h);for(let p=0;p<2;p++){const d=document.createElement('div'),c=canvas(v,p),label=document.createElement('small');label.textContent=p?'触发 / 命中':'施放 / 准备';d.append(label,c);s.append(d)}a.append(s);const b=document.createElement('button');b.textContent='导出该效果双帧 PNG';b.onclick=()=>download(combined([v]),v.group+'-'+v.id+'.png');a.append(b);rows.append(a)}}
g.onchange=search.oninput=refresh;document.getElementById('all').onclick=()=>{const list=shown();for(let i=0;i<list.length;i+=12)download(combined(list.slice(i,i+12)),'cat-bond-'+g.value+'-'+(i/12+1)+'.png')};refresh();
</script></html>

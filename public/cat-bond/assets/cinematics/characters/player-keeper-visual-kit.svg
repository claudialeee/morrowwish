<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1600 930" role="img" aria-labelledby="t d">
<title id="t">First Bellkeeper — player visual kit</title><desc id="d">A flexible visual kit that overlays the player's selected cat without replacing its breed, fur pattern or chosen name.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1b2b39"/><stop offset="1" stop-color="#344750"/></linearGradient><linearGradient id="cloth" x2="1" y2="1"><stop stop-color="#637d77"/><stop offset="1" stop-color="#253d44"/></linearGradient><linearGradient id="brass" x2="1" y2="1"><stop stop-color="#7c5b39"/><stop offset=".4" stop-color="#e3c28a"/><stop offset="1" stop-color="#755234"/></linearGradient></defs>
<rect width="1600" height="930" fill="url(#bg)"/>
<text x="70" y="80" fill="#e4cfaa" font-family="Georgia,serif" font-size="30" letter-spacing="4">THE UNNAMED FIRST BELLKEEPER</text><text x="70" y="118" fill="#aebfc0" font-family="system-ui" font-size="14" letter-spacing="2">PLAYER-SELECTED CAT · ROLE MOTIF, NOT A FIXED BREED</text>
<g transform="translate(130 170)"><rect width="390" height="620" rx="10" fill="#192b38" stroke="#b58c55" stroke-opacity=".55"/><circle cx="195" cy="220" r="140" fill="#a2b7a8" opacity=".12"/>
<path d="M90 475Q48 370 110 300Q165 250 220 300Q315 275 340 380L320 510H75Z" fill="#9eaaa7"/><path d="M125 340L100 225Q100 180 160 240L195 280 238 235Q292 185 285 250L260 350Z" fill="#b9c4b8"/><path d="M120 355Q195 270 270 355Q300 420 245 465Q165 495 115 420Z" fill="#d7d3c2"/>
<ellipse cx="165" cy="385" rx="11" ry="16" fill="#9e865c"/><ellipse cx="225" cy="385" rx="11" ry="16" fill="#9e865c"/><path d="M185 410L198 410 191 420Z" fill="#8b6260"/>
<path d="M80 480Q195 565 310 480L350 620H40Z" fill="url(#cloth)"/><path d="M195 495V590" stroke="url(#brass)" stroke-width="9"/><path d="M168 530H222L230 568 195 595 160 568Z" fill="#1a2a35" stroke="url(#brass)" stroke-width="5"/>
<text x="195" y="660" text-anchor="middle" fill="#e4cfaa" font-family="Georgia,serif" font-size="20">Chosen companion</text><text x="195" y="690" text-anchor="middle" fill="#aebfc0" font-family="system-ui" font-size="12">Preserve the selected cat's identity</text></g>
<g transform="translate(610 185)"><text x="0" y="0" fill="#e4cfaa" font-family="Georgia,serif" font-size="24">KEEPER CLASP</text><path d="M80 90H180L205 150 180 220H80L55 150Z" fill="#223643" stroke="url(#brass)" stroke-width="8"/><path d="M130 112L160 150 130 198 100 150Z" fill="none" stroke="#e4c48c" stroke-width="6"/><path d="M130 130V174M108 151H152" stroke="#e4c48c" stroke-width="4"/><text x="260" y="140" fill="#c5d0c8" font-size="16">Worn brass half-ring</text><text x="260" y="168" fill="#9fb1b2" font-size="13">No crown · no prophecy sigil</text>
<text x="0" y="320" fill="#e4cfaa" font-family="Georgia,serif" font-size="24">THE FIRST NOTE</text><g transform="translate(120 410)" fill="none" stroke="#d8bc83" stroke-width="7" stroke-linecap="round"><path d="M0 0Q170-95 340 0"/><path d="M20 42Q170-30 320 42"/><path d="M60 85Q170 35 280 85"/><circle cx="170" cy="-30" r="22" fill="#d8bc83" stroke="none"/></g><text x="0" y="580" fill="#c5d0c8" font-size="16">A living reply completes the light path.</text><text x="0" y="610" fill="#9fb1b2" font-size="13">Visual metaphor, not a new power or story rule.</text></g>
<g transform="translate(1170 185)"><text x="0" y="0" fill="#e4cfaa" font-family="Georgia,serif" font-size="24">MEMORY RETURN</text><circle cx="130" cy="220" r="115" fill="url(#brass)" opacity=".12"/><path d="M130 100L150 175 230 190 160 230 170 315 130 260 80 315 100 230 30 190 110 175Z" fill="none" stroke="#d8bc83" stroke-width="5"/><path d="M130 135V280M60 210H200" stroke="#d8bc83" stroke-width="2" opacity=".65"/><text x="0" y="390" fill="#c5d0c8" font-size="15">Warmth returns to the same cat.</text><text x="0" y="420" fill="#9fb1b2" font-size="13">No body swap or forced fur color.</text></g>
</svg>
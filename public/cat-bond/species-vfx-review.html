<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>33猫专属被动 · VFX 审核</title><style>body{max-width:900px;margin:18px auto;padding:0 12px;background:#202e2b;color:#edf0dc;font:15px system-ui}canvas{width:100%;height:auto;border:1px solid #708278;border-radius:10px;background:#364c3e}button,select{font:inherit;padding:8px;background:#374e43;color:#f0f1de;border:1px solid #829383;border-radius:6px;margin:3px}p{color:#bacab9}input{width:38%}</style><h2>Cat Bond · 33猫专属被动审核场</h2><p>调用正式 trait-fx.js 的绘图函数。使用合成的触发事件和示意猫形，不是实机战斗或机制验证。</p><h3 id="name"></h3><canvas id="stage" width="800" height="420"></canvas><div><select id="species"></select><select id="phase"><option value="fire">触发</option><option value="ready">准备</option></select><button id="toggle">暂停</button><button id="repeat">重播</button><input type="range" id="seek" min="0" max=".79" step=".01" value="0"></div><script src="js/traits.js"></script><script src="js/trait-fx.js"></script><script>
const F=window.CatBondTraitFX,T=window.CatTraits,cn={tangyuan:'汤圆·炎怒反击',dundun:'团团·碎霜反击',lanbao:'蓝莓·冰川破击',senlin:'松松·巨兽之躯',abi:'杏仁·疾风燃势',wumao:'桃桃·静电蓄能',moqiu:'墨球·暗夜潜伏',niuniu:'奥利奥·雷影追击',meidu:'圈圈·藤蔓漩涡',duanduan:'跳跳·电荷轨迹',yunduo:'云朵·羁绊丝线',bosi:'绒绒·柔光护甲',nietu:'奶酥·扎根',jiafei:'圆宝·同甘共苦',qisi:'芝士·越战越勇',jinwu:'焰焰·燃尽',nuowei:'枫枫·领地意识',lixiao:'绅绅·决斗节奏',sanhua:'花花·流光连舞',xiaohui:'小雾·水流共鸣',xianluo:'露露·声波共振',youling:'幽幽·暗影回响',yuelian:'月月·月华焦距',doudou:'豆豆·林间伏击',baomao:'斑斑·狩猎本能',xingchen:'星星·星界裂隙',fanmao:'奶糖·潮汐牵引',mengmai:'夜夜·寂静压制',yinghua:'樱桃·落樱余韵',xuewa:'雪袜·踏浪之路',zherdd:'布丁·安宁之庭',jinjc:'金豆·电力共享',nainai:'雪团·净化庇护'};
const el=id=>document.getElementById(id),select=el('species'),phase=el('phase'),ctx=el('stage').getContext('2d');for(const sp of F.ids){const o=document.createElement('option');o.value=sp;o.textContent=cn[sp]||sp;select.append(o)}
let age=0,last=0,playing=true;function actor(x,y,color){ctx.globalAlpha=1;ctx.fillStyle='#23382e';ctx.beginPath();ctx.ellipse(x,y+24,24,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-20,y-8);ctx.lineTo(x-21,y-29);ctx.lineTo(x-6,y-19);ctx.lineTo(x+6,y-19);ctx.lineTo(x+21,y-29);ctx.lineTo(x+20,y-8);ctx.quadraticCurveTo(x+25,y+22,x,y+22);ctx.quadraticCurveTo(x-25,y+22,x-20,y-8);ctx.fill();ctx.fillStyle='#2f3832';for(const n of [-7,7]){ctx.beginPath();ctx.arc(x+n,y-4,2,0,Math.PI*2);ctx.fill()}}
function draw(){const sp=select.value;el('name').textContent=cn[sp]||sp;ctx.clearRect(0,0,800,420);ctx.fillStyle='#4a624b';ctx.fillRect(0,0,800,420);ctx.strokeStyle='#556e55';for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,420);ctx.stroke()}for(let y=0;y<420;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}
actor(260,210,'#d2b07b');actor(510,210,'#a4abb8');const self=['tangyuan','dundun','senlin','nietu','wumao','abi','moqiu','nuowei','zherdd','bosi'].includes(sp)&&phase.value==='ready'||sp==='dundun';F.drawEvent(ctx,{species:sp,phase:phase.value,x:self?260:510,y:210,ox:260,oy:210,start:0,life:.8,radius:90},Math.min(.79,age));el('seek').value=Math.min(age,.79)}
function frame(t){if(last&&playing)age=(age+Math.min(.04,(t-last)/1000))%1.1;last=t;draw();requestAnimationFrame(frame)}select.onchange=phase.onchange=()=>{age=0;draw()};el('toggle').onclick=()=>{playing=!playing;el('toggle').textContent=playing?'暂停':'播放'};el('repeat').onclick=()=>{age=0;draw()};el('seek').oninput=()=>{playing=false;el('toggle').textContent='播放';age=+el('seek').value;draw()};draw();requestAnimationFrame(frame);
</script></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Unlocked Duo Move | Cat Bond</title>
<script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('duo-embedded');</script>
<style>
:root{font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;color:#344e55;background:#f8f5ee}
*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,28px)}
main{max-width:900px;margin:auto}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(20px,4vw,30px);margin:0}a{color:#376b5d;text-decoration:none;font-weight:700}
p{color:#62757b}.viewer{background:#edf5ef;border:2px solid #d9e9dd;border-radius:16px;padding:6px;overflow:hidden}
canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;border-radius:12px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button{background:#fff;border:1px solid #b6c5c4;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;color:#35544e;font:700 14px system-ui}
button:hover{background:#f1faf6}#locked{margin:28px 0;padding:25px;background:#fff;border:1px solid #d9ddd9;border-radius:16px}
#skill-title{color:#415d64;font-weight:800}
[hidden]{display:none!important}
@media(max-width:550px){canvas{aspect-ratio:16/9;max-height:42dvh}}

/* Original 16:9 painting centered in the same soft watercolor frame as the game modal. */
html.duo-embedded body{margin:0;padding:7px 8px 8px;overflow:auto;background:transparent}
html.duo-embedded main{width:100%;max-width:none}
html.duo-embedded header{display:none}
html.duo-embedded .viewer{
 display:flex;justify-content:center;align-items:center;min-width:0;
 border:1px solid #e3d6e7;border-radius:15px;padding:4px;
 background:linear-gradient(130deg,#fff7eb,#ebe9f8,#e9f4ee);
 overflow:hidden;box-shadow:0 5px 18px #8b789018;
}
html.duo-embedded #duo-canvas{
 display:block;flex:none;width:100%!important;height:auto!important;
 max-width:100%;max-height:none;aspect-ratio:16/9!important;
 object-fit:contain;border-radius:10px;
}
/* Parent dialog supplies the only skill heading. */
html.duo-embedded #skill-title{display:none!important}
html.duo-embedded #trust-note{margin:5px 7px;font-size:clamp(11px,1.5vw,13px);
 color:#786b80;line-height:1.4;text-align:center}
html.duo-embedded .controls{margin:8px 0 5px;justify-content:center}
html.duo-embedded .controls button{border-color:#dbc5e5;background:#f6e9f9;color:#694e77;
 border-radius:14px;min-height:42px}
.tier-controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:5px 0 2px}
.tier-controls button{min-width:108px;padding:8px 12px;border:1px solid #dbc5e5;
 border-radius:12px;background:#fff9ff;color:#73577d;font:750 13px system-ui;min-height:40px}
.tier-controls button[aria-pressed=true]{background:linear-gradient(135deg,#eadcf4,#f8e5ee);
 border-color:#b99acb;box-shadow:inset 0 0 0 1px #b99acb}
.tier-controls button:disabled{opacity:.38;cursor:not-allowed}
html.duo-embedded .tier-controls{gap:6px;margin:4px 0 0}
html.duo-embedded .tier-controls button{min-width:0;flex:1 1 0;padding:7px 8px;font-size:12px;min-height:38px}
html.duo-embedded #locked{margin:6px 0 0}
@media(max-width:550px){
 html.duo-embedded body{padding:5px 4px 6px}
 html.duo-embedded #duo-canvas{
  width:100%!important;height:auto!important;max-height:none;aspect-ratio:16/9!important;
 }
 html.duo-embedded .controls{margin:6px 0 3px}
 html.duo-embedded .controls button{min-height:40px}
}
@media(max-height:480px) and (orientation:landscape){
 html.duo-embedded body{padding:4px 6px;overflow:auto}
 html.duo-embedded .viewer{padding:3px}
 html.duo-embedded #duo-canvas{width:min(100%,calc((100dvh - 132px)*16/9))!important;height:auto!important;max-height:calc(100dvh - 132px)!important}
 html.duo-embedded .controls{margin:4px 0}
 html.duo-embedded .controls button,html.duo-embedded .tier-controls button{min-height:34px;padding:4px 8px}
 html.duo-embedded #trust-note{margin:3px 0}
}
</style>
</head>
<body><main>
<header><h1 id="page-title">已解锁的双猫合击</h1><a href="./" id="back">返回《猫猫纽带》</a></header>
<section id="locked"><h2 id="locked-title">🔒 合击尚未解锁</h2>
<p id="locked-body">让这对猫咪培养默契，到达 20 后才能解锁对应技能。本页没有全部技能总览。</p></section>
<section id="unlocked" hidden>
<p id="skill-title" aria-live="polite"></p>
<div class="viewer"><canvas id="duo-canvas" width="960" height="540" aria-label="已解锁双猫动态合击演出"></canvas></div>
<div class="controls"><button id="replay">重播全部三档</button><button id="pause" aria-pressed="false">暂停</button></div>
<div class="tier-controls" role="group" aria-label="选择已解锁的合击等级">
 <button id="tier-1" type="button" data-tier="1" aria-pressed="true">等级 1 · 默契 20</button>
 <button id="tier-2" type="button" data-tier="2" aria-pressed="false">等级 2 · 默契 60</button>
 <button id="tier-3" type="button" data-tier="3" aria-pressed="false">等级 3 · 默契 90</button>
</div>
<p id="trust-note"></p></section>
</main>
<script>window.MorrowwishI18n={get:()=>new URLSearchParams(location.search).get('lang')==='en'?'en':'zh'};</script>
<script src="js/data.js"></script>
<script src="js/skills.js?v=staggered-unlocks-20261122-v2"></script>
<script src="js/state.js"></script>
<script src="js/cat-relationships.js"></script>
<script src="js/catart.js"></script>
<script src="js/real-kittens.js?v=jiafei-approved-flatface-20261122-v4"></script>
<script src="js/duo-portraits.js?v=32-breeds-21-poses-3-tiers-20261122"></script>
<script src="js/duo-artwork.js?v=32-breeds-pastel-20261122"></script>
<script src="js/duo-signatures.js"></script>
<script src="js/duo-director.js?v=three-tiers-21-cameras-20261122"></script>
<script src="js/duo-summons.js?v=cinematic-spirit-20261121"></script>
<script src="js/duo-finale.js?v=cinematic-v5-20261121"></script>
<script src="js/duo-premium.js?v=original-art-dynamic-effects-20261123-v3"></script>
  <script src="js/duo-hero.js?v=original-63-only-20261123-v1"></script>
<script>
(function(){'use strict';
 const english=MorrowwishI18n.get()==='en';
 const msg=(id,cn,en)=>document.getElementById(id).textContent=english?en:cn;
 msg('page-title','已解锁的双猫合击','Your Unlocked Duo Move');
 msg('back','返回《猫猫纽带》','Back to Cat Bond');
 msg('locked-title','🔒 合击尚未解锁','🔒 Duo move locked');
 msg('locked-body','需要先在游戏中培养两只猫的默契，达到20后解锁对应的合击。没有公开的全部技能总览。',
    'Grow trust between your two cats to 20 to unlock their duo technique. No complete move gallery is available.');
 msg('pause','暂停','Pause');
 const q=new URLSearchParams(location.search),embedded=q.get('embedded')==='1';
 let root=null,owner=null,slot=null;
 if(embedded){
  try{owner=parent.State;slot=owner?.activeSlot();if(!owner||slot!==q.get('slot'))return;root=owner.S;}catch{return;}
 }else{
  slot=State.activeSlot();const data=State.getSaveSlot(slot)?.data;root=data?.state||data;
 }
 if(!root)return;
 const roster=root.cats||[],active=root.duoRelations?.active||[];
 const uidA=q.get('a')||active[0],uidB=q.get('b')||active[1];
 const catA=roster.find(c=>c.uid===uidA),catB=roster.find(c=>c.uid===uidB);
 if(!catA||!catB||catA.uid===catB.uid)return;
 const key=[catA.uid,catB.uid].sort().join(':');
 const rel=root.duoRelations?.pairs?.[key];
 if(!rel||!(Number(rel.value)>=20))return;
 const trust=Number(rel.value),maxTier=trust>=90?3:trust>=60?2:1;
 const duo=CatRelations.title(catA,catB);
 if(!duo||!window.CatBondDuoHero)return;
 document.getElementById('locked').hidden=true;
 document.getElementById('unlocked').hidden=false;
 const note=maxTier===3
  ?'默契 '+trust+'/100 · 已解锁全部三档合击演出 · 可单独切换或依次观看'
  :'默契 '+trust+'/100 · 已解锁等级 '+maxTier+' · 继续一起冒险即可解锁下一档';
 const noteEn=maxTier===3
  ?'Trust '+trust+'/100 · All three duo tiers unlocked · Select one or replay all three'
  :'Trust '+trust+'/100 · Tier '+maxTier+' unlocked · Keep adventuring to unlock the next tier';
 document.getElementById('trust-note').textContent=english?noteEn:note;
 const name=cat=>embedded?owner.catName(cat):(cat.nickname||GameData.speciesName(cat.species));
 document.getElementById('skill-title').textContent=duo.name+' · '+name(catA)+' × '+name(catB);
 const tierNames={
  1:['等级 1 · 默契 20','Tier 1 · Trust 20'],
  2:['等级 2 · 默契 60','Tier 2 · Trust 60'],
  3:['等级 3 · 默契 90','Tier 3 · Trust 90']
 };
 for(let n=1;n<=3;n++){
  const b=document.getElementById('tier-'+n);
  b.textContent=tierNames[n][english?1:0];
  b.disabled=n>maxTier;
 }
 const replayButton=document.getElementById('replay');
 replayButton.textContent=maxTier===3
  ?(english?'Replay all three tiers':'重播全部三档')
  :(english?'Replay unlocked tier(s)':'重播已解锁动作');
 const cv=document.getElementById('duo-canvas'),ctx=cv.getContext('2d');
 const lookup=uid=>uid===catA.uid?catA:uid===catB.uid?catB:null;
 const duration=2.75,colors={dark:'#bba5df',elec:'#d9b2f4',fire:'#ffa77c',
  grass:'#8ccb9f',light:'#fff1bc',water:'#9cd7f7'};
 const first=Skills.elementOf(catA.species),second=Skills.elementOf(catB.species);
 let start=performance.now(),paused=false,held=0,sequenceMode=true;
 let selectedTier=1,currentTier=1,artClockStarted=false;
 const pauseButton=document.getElementById('pause');
 function setActiveTier(t){
  currentTier=t;
  for(let n=1;n<=3;n++)document.getElementById('tier-'+n).setAttribute('aria-pressed',String(n===t));
 }
 function selectTier(t){
  if(t<1||t>maxTier)return;
  selectedTier=t;sequenceMode=false;start=performance.now();held=0;paused=false;
  pauseButton.textContent=english?'Pause':'暂停';
  pauseButton.setAttribute('aria-pressed','false');setActiveTier(t);
 }
 function replayAll(){
  sequenceMode=true;selectedTier=1;start=performance.now();held=0;paused=false;
  pauseButton.textContent=english?'Pause':'暂停';
  pauseButton.setAttribute('aria-pressed','false');setActiveTier(1);
 }
 function render(ms){
  const rect=cv.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height);
  const pixel=Math.min(2,window.devicePixelRatio||1),pw=Math.round(w*pixel),ph=Math.round(h*pixel);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  ctx.setTransform(pixel,0,0,pixel,0,0);
  ctx.clearRect(0,0,w,h);
  if(!CatBondDuoHero.assetReady){
   ctx.fillStyle='#e8e2f1';ctx.fillRect(0,0,w,h);ctx.fillStyle='#51495d';ctx.font='600 14px system-ui';ctx.textAlign='center';
   ctx.fillText(window.CatBondPremiumCinematics?.failed?(english?'Artwork unavailable — close and retry':'原画暂不可用，请关闭后重试'):(english?'Loading original painting…':'正在加载原画…'),w/2,h/2);return;
  }
  let tier,elapsed;
  const seconds=Math.max(0,ms/1000);
  if(sequenceMode){
   const position=(seconds%(duration*maxTier));
   tier=Math.min(maxTier,Math.floor(position/duration)+1);
   elapsed=position%duration;
  }else{
   tier=selectedTier;elapsed=seconds%duration;
  }
  if(tier!==currentTier)setActiveTier(tier);
  CatBondDuoHero.draw(ctx,w,h,{
   max:duration,t:duration-Math.max(.01,elapsed),strikeAt:.78,
   catUids:[catA.uid,catB.uid],name:duo.name,elements:duo.elementPair,tier,
   galleryPreview:true,originalArt:true,hideCaptions:q.get('embedded')==='1',
   first:colors[first],second:colors[second]
  },lookup);
 }
 function frame(now){
  if(embedded&&(owner.S!==root||owner.activeSlot()!==slot)){document.getElementById('unlocked').hidden=true;document.getElementById('locked').hidden=false;return;}
  // Do not skip unlocked tiers while original paintings decode.
  if(!CatBondDuoHero.assetReady){start=now;held=0;artClockStarted=false;render(0);}
  else{if(!artClockStarted){start=now;held=0;artClockStarted=true;}render(paused?held:now-start);}
  requestAnimationFrame(frame);
 }
 replayButton.onclick=replayAll;
 pauseButton.onclick=()=>{
  paused=!paused;
  if(paused){held=performance.now()-start;pauseButton.textContent=english?'Resume':'继续';}
  else{start=performance.now()-held;pauseButton.textContent=english?'Pause':'暂停';}
  pauseButton.setAttribute('aria-pressed',String(paused));
 };
 for(let n=1;n<=3;n++)document.getElementById('tier-'+n).onclick=()=>selectTier(n);
 window.__duoPreviewState={
  get maxTier(){return maxTier;},
  get mode(){return sequenceMode?'sequence':'single';},
  get activeTier(){return currentTier;},
  get paused(){return paused;},
  selectTier,replayAll
 };
 window.__duoPreviewReady=true;
 if(embedded)window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();parent.document.querySelector('#cb-duo-viewer .cb-duo-viewer-close')?.click();}});
 requestAnimationFrame(frame);
})();;
</script></body></html>

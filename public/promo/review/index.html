<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<title>Morrow Wish · 最新宣传视频审核</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#171728;color:#f8f6ff}
*{box-sizing:border-box}body{margin:0;background:#171728}
header{max-width:1260px;margin:auto;padding:28px 22px 12px}
.eyebrow{color:#e7bddc;letter-spacing:.12em;font-size:12px;font-weight:700;text-transform:uppercase}
h1{font-size:clamp(24px,4vw,38px);line-height:1.2;margin:12px 0}
.lead{margin:0 0 13px;color:#d7cfe4;line-height:1.65;font-size:14px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin:12px 0 0;font-size:13px;color:#cfbfdd}
.status{color:#f4c6d3;font-weight:700}
button,.video-link{font:inherit}
.reload{border:1px solid #6b6084;background:#393252;color:#faf3ff;border-radius:9px;padding:7px 12px;cursor:pointer}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:20px;max-width:1260px;margin:auto;padding:18px 22px 32px}
article{background:#26243a;border:1px solid #443b58;border-radius:17px;padding:16px;min-width:0}
h2{font-size:17px;line-height:1.4;margin:0 0 12px}
video{display:block;width:100%;max-width:320px;aspect-ratio:9/16;object-fit:contain;background:#0b0a12;border-radius:12px;margin:0 auto}
.highlights{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.highlights button{padding:7px 9px;border:1px solid #696081;border-radius:999px;color:#faefff;background:#413657;font-size:12px;cursor:pointer}
.highlights button:hover{background:#634b77}
a{color:#f0cbe7}.video-link{display:inline-block;margin-top:12px;font-size:13px}
small{display:block;color:#c6b5d0;margin-top:9px;font-size:12px}
footer{max-width:1260px;margin:auto;padding:2px 22px 32px;font-size:12px;color:#c9bed4}
#error{margin:10px auto;max-width:1260px;padding:0 22px;color:#ffd4da}
@media(max-width:580px){header{padding:19px 14px 8px}main{padding:12px 14px 26px;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}article{padding:9px;border-radius:12px}h2{font-size:13px;margin-bottom:7px}video{border-radius:9px}.highlights{gap:5px}.highlights button{font-size:11px;padding:6px}.video-link{font-size:12px}footer{padding:0 14px 25px}}
</style>
</head>
<body>
<header>
<div class="eyebrow">Morrow Wish · Creative review</div>
<h1>Morrow Wish · 最新宣传视频</h1>
<p class="lead">这个网址固定不变，始终展示最近一次成功生成的完整审核版本。点击视频播放，或点击片段标签跳到重点镜头。尚未完成的新一轮渲染不会替换现有视频。</p>
<div class="meta"><span class="status">仅供审核 · 未获批准发布</span><span id="version">正在载入最新版本…</span><button class="reload" id="reload" type="button">检查更新</button><a href="/promo/readability-audit.json" target="_blank" rel="noopener">查看阅读时长检查</a></div>
</header>
<div id="error" role="status"></div>
<main id="videos"></main>
<footer>视频更新不等于批准发布。未经确认，不会将本页审核素材自动发布到 YouTube、TikTok、Instagram 或 Bluesky。</footer>
<script>
const names={'starbell':'星铃回响 · 英文剧情预告','cat-bond':'猫猫纽带','pawsibly-innocent':'猫猫捣蛋','tiny-town':'自由小镇','elsewhere':'平行人生','flip-dash':'Flip Dash','parcel-panic':'快递大作战','pocket-aquarium':'口袋水族馆'};
const highlights={
 'starbell':[['hook','开场'],['melody','神秘旋律'],['friends','伙伴'],['shadow','千灯城皮影表演'],['battle','战斗'],['secret','故事悬念']],
 'cat-bond':[['cat-upgrade','一键升级'],['duo-partners','双猫搭档'],['duo-map-walk','前往双猫约定'],['duo-promise','地图双猫约定'],['duo-quarrel','小猫闹别扭'],['duo-reconcile','哄好和解'],['work-after','猫咪打工'],['tease','逗猫'],['map-explore','探索地图'],['map-management','地图养成'],['battle-hud','血条与技能栏'],['battle-skills','技能实战'],['duo','新版双猫合击'],['rare-capture','收服稀有猫'],['ssr-showcase','SSR传说猫']],
 'pawsibly-innocent':[['escape-attempt','客厅偷鱼'],['narrow-pursuit','险些被抓'],['narrow-achievement','侥幸逃脱成就'],['room-kitchen','厨房'],['room-laundry','洗衣房'],['room-library','图书馆'],['room-garden','花园'],['caught-attempt','被抓住']],
 'tiny-town':[['opening-three-choices','开场三个选择'],['board','小镇棋盘'],['resident-profile','居民喜好'],['combination','组合碰撞'],['neighbor-story','居民故事'],['legendary','传奇建筑'],['ending','小镇结局']],
 'elsewhere':[['moon-surprise','月球奇遇'],['moon-ending','月球人生结局'],['paris-romance','巴黎邂逅'],['paris-ending','巴黎爱情结局']],
 'flip-dash':[['first-coin','开局吃金币'],['coin-collect','连续吃金币'],['crash','撞击失败']],
 'parcel-panic':[['opening','看起来简单？'],['express','加急快件'],['speed-up','班次加速'],['one-life','仅剩一次机会'],['clutch','极限分拣'],['shift-clear','完成班次'],['deliveries','连续投递'],['mistakes','错误投递'],['game-over','结算']],
 'pocket-aquarium':[['feeding','喂鱼'],['more-feeding','继续游戏'],['timeout','时间结束']]
};
const $=id=>document.getElementById(id);
function formatDate(iso){
 if(!iso)return '';
 const time=new Date(iso);
 return Number.isNaN(time.getTime())?'':new Intl.DateTimeFormat('zh-CN',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(time);
}
async function refresh(){
 $('error').textContent='';$('version').textContent='正在检查最新视频…';
 try{
  const response=await fetch('/promo/latest-review.json?check='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('审核清单尚未就绪（最新版本可能仍在部署）');
  const data=await response.json();
  if(!Array.isArray(data.trailers)||data.trailers.length!==7)throw Error('最新审核视频不完整');
  if(data.trailers.some(entry=>!entry.video||!names[entry.slug]))throw Error('最新视频清单存在无效项目');
  const star=await fetch('/promo/starbell/review.json?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  if(star&&star.slug==='starbell'&&star.video&&star.poster){data.trailers.unshift(star);}
  const box=$('videos');box.replaceChildren();
  for(const entry of data.trailers){
   if(!names[entry.slug]||typeof entry.video!=='string'||!entry.video.startsWith('/promo/'))continue;
   const article=document.createElement('article'),heading=document.createElement('h2'),
     video=document.createElement('video'),nav=document.createElement('div'),a=document.createElement('a'),note=document.createElement('small');
   heading.textContent=names[entry.slug]+(entry.paused?' · 暂停制作（保留上一版）':'');video.controls=true;video.playsInline=true;video.preload='metadata';
   const cacheToken=encodeURIComponent(entry.createdAt||entry.createdAt||entry.createdAt||entry.createdAt||entry.createdAt||data.createdAt||data.latestVersion||'latest');
   video.src=entry.video+'?revision='+cacheToken;
   if(entry.poster&&entry.poster.startsWith('/promo/'))video.poster=entry.poster+'?revision='+cacheToken;
   const times={};let offset=0;
   for(const scene of entry.shots||[]){if(scene.scene)times[scene.scene]=offset;offset+=Number(scene.seconds)||0}
   nav.className='highlights';
   for(const [key,label] of highlights[entry.slug]||[]){
     if(times[key]===undefined)continue;
     const button=document.createElement('button');button.type='button';button.textContent=label;
     button.addEventListener('click',()=>{video.currentTime=times[key]+.1;video.play().catch(()=>{})});
     nav.appendChild(button);
   }
   a.className='video-link';a.href=video.src;a.target='_blank';a.rel='noopener';a.textContent='单独打开 MP4';
   note.textContent=(entry.version ? entry.version+' · '+formatDate(entry.updatedAt||entry.createdAt)+' 更新 · ' : '')+Number(entry.duration||0).toFixed(1)+' 秒 · '+(entry.paused?'该游戏宣传片暂停制作，保留上一审核版 · ':'')+'未批准发布';
   if(entry.music){const music=document.createElement('small');music.textContent='Music credit: '+entry.music.title+' — '+entry.music.artist+' · '+entry.music.license+' (edited)';const link=document.createElement('a');link.href=entry.music.source;link.textContent=' Source';link.target='_blank';link.rel='noopener';music.append(link);article.append(music);}
   video.addEventListener('play',()=>box.querySelectorAll('video').forEach(other=>{if(other!==video)other.pause()}));
   video.addEventListener('error',()=>{note.textContent='播放器载入失败，请点「单独打开 MP4」重试';note.style.color='#ffd4da'});
   article.append(heading,video,nav,a,note);box.append(article);
  }
  const newest=[data.createdAt,star?.updatedAt||star?.createdAt].filter(Boolean).sort().at(-1);
  $('version').textContent=(data.latestVersion||data.version||'最新版本')+(star?.version?' · 星铃回响 '+star.version:'')+(newest?' · '+formatDate(newest)+' 更新（PT）':'')+' · '+box.children.length+' 条';
 }catch(error){$('version').textContent='暂时无法读取最新审核视频';$('error').textContent=error.message}
}
$('reload').addEventListener('click',refresh);
refresh();
</script>
</body></html>

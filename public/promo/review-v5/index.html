<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morrow Wish V5 Video QA — Not Published</title><style>
:root{color-scheme:dark}body{margin:0;background:#171728;color:#f8f6ff;font:15px/1.55 system-ui,sans-serif}header{text-align:center;padding:26px 16px 20px}h1{font-size:clamp(21px,4vw,34px);margin:0 0 10px}p{margin:8px 0;color:#d1cce0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:25px;max-width:1320px;padding:20px;margin:auto}article{background:#25243b;padding:15px;border-radius:19px;min-width:0}h2{font-size:18px;margin:0 0 10px}video{display:block;aspect-ratio:9/16;object-fit:contain;width:min(100%,310px);max-height:560px;margin:auto;border-radius:13px;background:#080812}a{color:#e9c0f4}small{display:block;color:#b3aacb;margin-top:10px}footer{text-align:center;padding:20px;color:#c1b6d1}</style></head><body><header><h1>Morrow Wish · V5 gameplay trailers</h1><p>Internal previews only. Real gameplay, chronological events, no social posting approved.</p></header><main id="videos"></main><footer>Every game requires owner approval before release.</footer><script>
fetch('/promo/v5-review.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Previews not rendered yet');return r.json()}).then(data=>{
 for(const entry of data.trailers||[]){
 const article=document.createElement('article'),h=document.createElement('h2'),v=document.createElement('video'),a=document.createElement('a'),note=document.createElement('small');
 h.textContent=entry.slug.replaceAll('-',' ').replace(/\b\w/g,x=>x.toUpperCase());v.controls=true;v.playsInline=true;v.preload='metadata';v.poster=entry.poster;v.src=entry.video;
 a.href=entry.video;a.textContent='Open source MP4';note.textContent=entry.duration+' seconds · UNAPPROVED';article.append(h,v,a,note);document.getElementById('videos').appendChild(article);
 }
}).catch(e=>{const p=document.createElement('p');p.textContent='Previews unavailable: '+e.message;document.querySelector('main').appendChild(p)});
</script></body></html>

<style>
*{box-sizing:border-box}body{font:15px/1.55 system-ui,-apple-system,sans-serif;background:#f9f6f3;color:#30283d;margin:0}
header{position:sticky;top:0;z-index:9;background:#fbfaf9ee;backdrop-filter:blur(12px);border-bottom:1px solid #e9dce6;padding:15px 24px}

<main>
<h1>七款游戏 · 短视频 V3 质检</h1>
<p>每条从真实游戏结果、失败或结局开场，再展示发生了什么。不同游戏使用不同音乐，手机竖屏按原生比例录制，避免拉伸。</p>
<div class="note">这是新版本成片的内部复核页，<strong>不代表已经公开发布到社交平台</strong>。播放时请重点检查前两秒是否吸引人、游戏是否看得清、结尾是否有明确结果，以及字幕和声音是否匹配。</div>
<div class="grid" id="reels"></div>
<p class="small">《平行人生》使用 Kevin MacLeod 的 Easy Lemon 音乐，CC BY 4.0：<a href="https://creativecommons.org/licenses/by/4.0/">许可与署名要求</a>。旧视频统计与本轮审核隔离。</p>
</main>
<script>
const data=[
 ['pawsibly-innocent','猫猫捣蛋','成功偷到三条鱼 → 险些被抓 → 毛线球诱敌 → 逃脱'],
 ['cat-bond','猫猫纽带','必杀技 Claw Cyclone → 双猫合击 → 组队挑战'],
 ['tiny-town','自由小镇','真实七日结局 → 亲手建设 → 邻居故事 → 你的结局'],
 ['elsewhere','平行人生','巴黎人生真实结局 → 新生活 → 关键选择 → 结果'],
 ['flip-dash','Flip Dash','真实失败 → 一键闪避 → 你能坚持更久吗？'],
 ['parcel-panic','快递大作战','错误通道导致失败 → 连续成功 → 你能打破记录吗？'],
 ['pocket-aquarium','口袋水族馆','真实评分 → 投喂与连击 → 你能更好吗？']
];
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('reels').innerHTML=data.map(([id,name,aim])=>{
 const url='/promo/'+id+'/hook-v3-20261121.mp4',poster='/promo/'+id+'/hook-v3-20261121.jpg';
 const review=[1,2,3].map(n=>'<a href="/promo/'+id+'/hook-v3-review-'+n+'.jpg" target="_blank" rel="noopener noreferrer">画面 '+n+'</a>').join('');
 return '<article><h2>'+escapeText(name)+'</h2><p class="aim">'+escapeText(aim)+'</p><div class="media"><video controls playsinline preload="metadata" poster="'+poster+'" src="'+url+'"></video><div><b>检查重点</b><ul><li>前 2 秒能否理解好玩在哪里</li><li>主角、动作、结果是否清楚</li><li>有没有拉伸、英文混中文或小字</li><li>配乐是否贴合内容</li></ul><div class="links"><a href="'+url+'" target="_blank">打开视频</a>'+review+'</div></div></div></article>';
}).join('');
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="scene">
<title id="scene">A friendly watercolor parcel-sorting room with sky-blue, sunny yellow and soft-pink delivery lanes and matching packages</title>
<defs>
 <linearGradient id="room" x2=".15" y2="1"><stop stop-color="#cce4e0"/><stop offset=".55" stop-color="#e9dfcf"/><stop offset="1" stop-color="#f2dfca"/></linearGradient>
 <linearGradient id="floor" x2=".08" y2="1"><stop stop-color="#f0dcca"/><stop offset="1" stop-color="#d5c6bd"/></linearGradient>
 <linearGradient id="cyan" x2=".12" y2="1"><stop stop-color="#bde8e6"/><stop offset="1" stop-color="#74b9c5"/></linearGradient>
 <linearGradient id="gold" x2=".12" y2="1"><stop stop-color="#f8e6ad"/><stop offset="1" stop-color="#e7bf7e"/></linearGradient>
 <linearGradient id="rose" x2=".12" y2="1"><stop stop-color="#f8d5cc"/><stop offset="1" stop-color="#df9fa6"/></linearGradient>
 <linearGradient id="box" x2=".1" y2="1"><stop stop-color="#f9e7c8"/><stop offset=".65" stop-color="#e9c9a0"/><stop offset="1" stop-color="#d4b48e"/></linearGradient>
 <linearGradient id="belt" x2=".1" y2="1"><stop stop-color="#9caaa8"/><stop offset=".5" stop-color="#aab7b2"/><stop offset="1" stop-color="#7a989c"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fff6df" stop-opacity=".68"/><stop offset="1" stop-color="#fff6df" stop-opacity="0"/></radialGradient>
 <filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
</defs>

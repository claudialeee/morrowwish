<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="scene">
<title id="scene">A glowing blue gravity-flipping orb in a dreamy double-track world, dodging coral obstacles and collecting golden stars</title>
<defs>
 <linearGradient id="sky" x2=".14" y2="1"><stop stop-color="#c5e3e5"/><stop offset=".5" stop-color="#d1dbee"/><stop offset="1" stop-color="#e6d7e7"/></linearGradient>
 <linearGradient id="upper" x2="0" y2="1"><stop stop-color="#fcf0d9"/><stop offset=".65" stop-color="#e9d9d0"/><stop offset="1" stop-color="#d4afbd"/></linearGradient>
 <linearGradient id="lower" x2="0" y2="1"><stop stop-color="#e0cbd3"/><stop offset=".5" stop-color="#f6e6d6"/><stop offset="1" stop-color="#fff2db"/></linearGradient>
 <linearGradient id="pink" x2=".1" y2="1"><stop stop-color="#f9beb6"/><stop offset=".65" stop-color="#eda4ab"/><stop offset="1" stop-color="#d88d9e"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#fffefa" stop-opacity=".84"/><stop offset=".53" stop-color="#a2e4df" stop-opacity=".45"/><stop offset="1" stop-color="#a2e4df" stop-opacity="0"/></radialGradient>
 <radialGradient id="ball" cx=".32" cy=".26" r=".8"><stop stop-color="#fcfff2"/><stop offset=".37" stop-color="#b8f0e4"/><stop offset=".8" stop-color="#74c5c8"/><stop offset="1" stop-color="#5ca7b5"/></radialGradient>
 <filter id="paint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".019" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
 <filter id="haze"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="600" fill="url(#sky)"/>
<!-- Thin pastel atmospheric watercolor clouds -->
<g fill="#fff8ee" opacity=".43"><ellipse cx="180" cy="220" rx="190" ry="71"/><ellipse cx="330" cy="256" rx="142" ry="45"/><ellipse cx="948" cy="312" rx="227" ry="78"/><ellipse cx="1100" cy="257" rx="133" ry="55"/></g>
<path d="M0 316Q153 292 284 326T564 326 858 314 1200 325" stroke="#fdf7ed" stroke-width="18" opacity=".17" fill="none"/>
<g fill="#b5c7cd" opacity=".15"><path d="M-40 413Q135 328 271 421T582 388 865 424 1240 376V600H0Z"/><path d="M0 441Q148 371 301 454T656 437 956 457 1200 398V600H0Z"/></g>
<!-- Repeating decorative linework suggests two gravity lanes without UI text -->
<g fill="none" stroke-linecap="round">
 <path d="M0 102H1200" stroke="#e7b9bb" stroke-width="15" opacity=".7"/>
 <path d="M0 116H1200" stroke="#fcf2e3" stroke-width="14"/>
 <path d="M0 132H1200" stroke="#b1cdd1" stroke-width="3" opacity=".75"/>
 <path d="M0 468H1200" stroke="#b5cdcf" stroke-width="5"/>
 <path d="M0 482H1200" stroke="#faf0df" stroke-width="16"/>
 <path d="M0 498H1200" stroke="#d8bbbf" stroke-width="15" opacity=".7"/>
</g>
<path d="M0 0H1200V105H0Z" fill="url(#upper)" opacity=".9"/>
<path d="M0 494H1200V600H0Z" fill="url(#lower)" opacity=".92"/>
<!-- Intermittent pastel rail markers -->
<g stroke="#bbbdc8" stroke-width="5" opacity=".5" stroke-linecap="round"><path d="M95 139h60M275 139h45M490 139h55M1060 139h59"/><path d="M80 456h54M345 456h65M980 456h60"/></g>
<!-- Soft painterly obstacles, one on each lane -->
<g stroke="#c98899" stroke-width="4" stroke-linejoin="round">
 <path d="M798 121h118q21 0 20 24v88q0 21-21 21H801q-21 0-21-20v-92q0-21 18-21Z" fill="url(#pink)"/>
 <path d="M813 134h95q14 0 14 17v62q0 12-13 17h-91q-17-3-18-17v-64q0-15 13-15Z" fill="#f8caca" opacity=".46" stroke="none"/>
 <path d="M688 354h114q21 0 21 24v95q0 16-23 16H686q-20 0-20-17v-94q0-24 22-24Z" fill="url(#pink)"/>
 <path d="M689 376h106q12 0 11 14v69q0 13-11 12h-105q-11 0-11-15v-66q0-14 10-14Z" fill="#f5c7bf" opacity=".32" stroke="none"/>
</g>
<g stroke="#d68fa2" stroke-width="4" fill="#edafb1" stroke-linejoin="round">
 <path d="M833 254l25 23 24-23Z"/><path d="M715 354l25-28 25 28Z"/>
</g>
<!-- Painted lavender geometric shadows of moving speed -->
<g stroke="#93c2c7" stroke-linecap="round" fill="none" opacity=".4"><path d="M82 308h100" stroke-width="9"/><path d="M49 326h141" stroke-width="5"/><path d="M122 340h63" stroke-width="4"/></g>
<!-- Curved gravity path: small dashes, not a machine-looking arrow -->
<path d="M171 437C237 449 307 423 346 365S401 239 515 204 671 214 733 158" stroke="#5ba7b7" stroke-width="12" opacity=".17" fill="none" stroke-linecap="round"/>
<path d="M171 437C237 449 307 423 346 365S401 239 515 204 671 214 733 158" stroke="#f9fff1" stroke-width="5" stroke-dasharray="13 19" opacity=".88" fill="none" stroke-linecap="round"/>
<path d="M268 393Q305 367 319 336" fill="none" stroke="#87bcc8" stroke-width="5" stroke-linecap="round" opacity=".7"/>
<!-- Central luminous circular protagonist -->
<circle cx="475" cy="292" r="130" fill="url(#aura)"/>
<circle cx="475" cy="292" r="62" fill="#6cc9c3" opacity=".23" filter="url(#soft)"/>
<circle cx="475" cy="292" r="41" fill="url(#ball)" stroke="#5eabb4" stroke-width="5"/>
<path d="M453 278q13-23 37-20" stroke="#fffef0" stroke-width="8" fill="none" opacity=".7" stroke-linecap="round"/>
<circle cx="490" cy="290" r="3.5" fill="#648994"/>
<g fill="#9fddd4" opacity=".62"><circle cx="408" cy="322" r="10"/><circle cx="386" cy="336" r="7"/><circle cx="367" cy="349" r="4.5"/><circle cx="340" cy="364" r="3"/></g>
<!-- Five-point collectibles -->
<g fill="#f5d58e" stroke="#d8b879" stroke-width="4" stroke-linejoin="round">
 <path d="M628 283l16 34 37 5-27 25 7 37-33-18-33 18 7-37-27-25 37-5Z"/>
 <path d="M1012 319l11 21 24 4-17 17 5 23-23-12-22 12 4-23-17-17 25-4Z" opacity=".72"/>
 <path d="M255 265l8 16 18 3-13 13 3 18-16-9-16 9 3-18-14-13 19-3Z" opacity=".69"/>
</g>
<g fill="none" stroke="#fff8df" stroke-width="5" stroke-linecap="round" opacity=".86"><path d="M619 314q16-12 24-2"/><path d="M1004 343q9-8 17-3"/></g>
<!-- Tiny hand-brushed stardust and floating botanicals -->
<g fill="#fefbf0" opacity=".72"><circle cx="334" cy="188" r="5"/><circle cx="562" cy="111" r="4"/><circle cx="990" cy="214" r="6"/><circle cx="1088" cy="420" r="4"/><circle cx="1124" cy="245" r="5"/></g>
<g fill="none" stroke="#f4e6d5" stroke-width="4" stroke-linecap="round" opacity=".75"><path d="M571 413v-23m-12 12h25"/><path d="M1086 160v-25m-12 12h25"/><path d="M308 215v-15m-8 8h17"/></g>
<!-- Foreground botanicals echo the aquarium illustration -->
<g fill="#a6c7ac" stroke="#87a99a" stroke-width="3" opacity=".82">
<path d="M56 600Q11 536 35 493q52 37 21 107Z"/><path d="M64 600q-3-91 56-111Q131 565 64 600Z"/>
<path d="M1134 600q-10-103 56-127Q1187 566 1134 600Z"/><path d="M1120 600q-88-47-79-96 72 14 79 96Z"/>
</g>
<rect width="1200" height="600" fill="#fffaf2" opacity=".28" filter="url(#paint)"/>
</svg>
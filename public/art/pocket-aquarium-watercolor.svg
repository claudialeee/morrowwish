  <linearGradient id="coral" x2="1" y2="1"><stop stop-color="#f9b3a4"/><stop offset="1" stop-color="#dc8893"/></linearGradient>
  <filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".10"/></feComponentTransfer></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>

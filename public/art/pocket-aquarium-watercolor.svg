<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="scene-title">
<title id="scene-title">A tranquil illustrated aquarium with colorful fish and coral</title>
<defs>
  <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#bce7df"/><stop offset=".48" stop-color="#92d1d1"/><stop offset="1" stop-color="#5aa3aa"/></linearGradient>
  <linearGradient id="sand" x2=".1" y2="1"><stop stop-color="#f1dfbe"/><stop offset="1" stop-color="#dec4a2"/></linearGradient>
  <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#fff9d9" stop-opacity=".55"/><stop offset="1" stop-color="#fff9d9" stop-opacity="0"/></linearGradient>
  <radialGradient id="softGlow"><stop stop-color="#fff9e6" stop-opacity=".5"/><stop offset="1" stop-color="#fff9e6" stop-opacity="0"/></radialGradient>
  <linearGradient id="orangeFish" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8bd85"/><stop offset=".5" stop-color="#ec9977"/><stop offset="1" stop-color="#db7b6b"/></linearGradient>

name: Canon 3 continuous finale actual browser acceptance
on:
  push:
    branches: ['qa/canon3-finale-continuous-20261127']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canon3-finale-continuous-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finale:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [wide, portrait]
    env:
      STARBELL_FINALE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - name: Continuous real battles from finale entrance to garden ending
        run: |
          set -euo pipefail
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/canon3-finale-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/test-starbell-canon3-finale-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canon3-finale-${{ matrix.profile }}
          path: |
            artifacts/canon3-finale/
            /tmp/canon3-finale-server.log
          retention-days: 7

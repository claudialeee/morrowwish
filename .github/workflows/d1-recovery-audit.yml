name: D1 recovery and safe historical event merge
# Merge only missing events from the latest verified pre-reset snapshot.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-recovery-audit.yml'
      - 'recovery/run-audit.trigger'
      - 'recovery/d1-recovery-merge.mjs'
      - 'recovery/d1-analytics-audit.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morrowwish-d1-recovery
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Wrangler
        run: npm ci
      - name: Read D1 bookmarks and current analytics aggregates (read-only)
        if: false
        env:
          CLOUDFLARE_D1_RECOVERY_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
          D1_DATABASE_ID: fbd62f69-1811-4538-a17f-ecc5be8ad7cc
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const token=process.env.CLOUDFLARE_D1_RECOVERY_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const db=process.env.D1_DATABASE_ID;
          if(!token||!account||!db) throw new Error('Missing recovery token or database configuration');
          const base='https://api.cloudflare.com/client/v4';
          async function api(path,init={}) {
            const res=await fetch(base+path,{...init,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(init.headers||{})}});
            const body=await res.json();
            if(!res.ok||!body.success) throw new Error('Cloudflare API '+res.status+': '+JSON.stringify(body.errors||body.messages||[]));
            return body.result;
          }
          const root='/accounts/'+account+'/d1/database/'+db;
          const database=await api(root);
          const timestamps=[
            '2026-11-22T08:00:00.000Z',
            '2026-11-22T12:00:00.000Z',
            '2026-11-22T16:00:00.000Z',
            '2026-11-22T20:00:00.000Z',
            '2026-11-23T00:00:00.000Z',
            '2026-11-23T00:30:00.000Z',
            '2026-11-23T00:59:00.000Z',
            '2026-11-23T01:00:00.000Z',
            '2026-11-23T04:00:00.000Z',
            '2026-11-23T08:00:00.000Z',
            '2026-11-23T12:00:00.000Z',
            '2026-11-23T16:00:00.000Z'
          ];
          const currentBookmark=await api(root+'/time_travel/bookmark');
          const historical=[];
          for(const timestamp of timestamps){
            try{
              const output=execFileSync('npx',['wrangler','d1','time-travel','info','morrowwish-analytics','--config','wrangler.jsonc','--timestamp',timestamp,'--json'],{
                cwd:'cloudflare-pages',encoding:'utf8',env:process.env
              });
              let parsed=null;try{parsed=JSON.parse(output)}catch{}
              const bookmark=parsed?.bookmark||parsed?.result?.bookmark||output.match(/[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}/i)?.[0]||null;
              historical.push({timestamp,bookmark,output:bookmark?undefined:output.slice(-1800)});
            }catch(e){historical.push({timestamp,error:String(e.stderr||e.message||e).slice(-1800)});}
          }
          async function query(sql) {
            const result=await api(root+'/query',{method:'POST',body:JSON.stringify({sql})});
            return result?.[0]?.results||[];
          }
          const tables=await query("SELECT name, sql FROM sqlite_master WHERE type='table' ORDER BY name");
          const hasEvents=tables.some(t=>t.name==='events');
          const eventsSchema=hasEvents?await query('PRAGMA table_info(events)'):[];
          const currentEvents=hasEvents?await query("SELECT day,category,game,kind,COUNT(*) AS rows FROM events WHERE day >= '2026-11-22' GROUP BY day,category,game,kind ORDER BY day,category,game,kind"):[];
          const totals=hasEvents?await query("SELECT category,game,kind,COUNT(*) AS rows,MIN(day) AS first_day,MAX(day) AS last_day FROM events GROUP BY category,game,kind ORDER BY category,game,kind"):[];
          const candidate=historical.find(x=>x.timestamp==='2026-11-23T00:00:00.000Z')?.bookmark;
          let historicalQueryTest=null;
          if(candidate){
            try{
              const result=await api(root+'/query',{method:'POST',body:JSON.stringify({
                sql:"SELECT day,category,game,kind,COUNT(*) AS rows FROM events WHERE day >= '2026-11-22' GROUP BY day,category,game,kind ORDER BY day,category,game,kind",
                params:[],bookmark:candidate
              })});
              historicalQueryTest=result?.[0]?.results||result;
            }catch(e){historicalQueryTest={error:String(e)};}
          }
          const output={
            generatedAt:new Date().toISOString(),
            targetRangeStart:'2026-11-22T00:00:00-08:00',
            database:{name:database.name,uuid:database.uuid,version:database.version,created_at:database.created_at,file_size:database.file_size},
            currentBookmark:currentBookmark?.bookmark||null,
            historicalBookmarks:historical,
            tables:tables.map(t=>({name:t.name,sql:t.sql})),
            eventsSchema:eventsSchema.map(c=>({name:c.name,type:c.type,notnull:c.notnull,pk:c.pk})),
            currentEventsSinceNov22:currentEvents,
            historicalQueryTest,
            currentTotals:totals
          };
          fs.mkdirSync('recovery',{recursive:true});
          fs.writeFileSync('recovery/d1-audit.json',JSON.stringify(output,null,2)+'\n');
          console.log(JSON.stringify(output,null,2));
          NODE
      - name: Merge historical events while preserving live production data
        id: historical_merge
        continue-on-error: true
        env:
          CLOUDFLARE_D1_RECOVERY_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
          D1_DATABASE_ID: fbd62f69-1811-4538-a17f-ecc5be8ad7cc
          D1_TARGET_TIMESTAMP: 2026-11-23T00:36:56.250Z
        run: node recovery/d1-recovery-merge.mjs
      - name: Audit restored raw analytics totals since Nov 22 Pacific midnight
        if: always()
        env:
          CLOUDFLARE_D1_RECOVERY_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
          D1_DATABASE_ID: fbd62f69-1811-4538-a17f-ecc5be8ad7cc
        run: node recovery/d1-analytics-audit.mjs
      - name: Upload non-sensitive recovery audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-recovery-audit-${{ github.run_id }}
          path: |
            recovery/d1-audit.json
            recovery/d1-merge-report.json
            recovery/d1-analytics-audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Fail if historical probe did not restore production safely
        if: always()
        run: |
          test -s recovery/d1-merge-report.json || { echo '::error::No D1 merge report was produced'; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('recovery/d1-merge-report.json','utf8'));
          if(report.error||report.rollbackError||report.currentStateRestored!==true||report.mergeVerified!==true){
            console.error(JSON.stringify({
              error:report.error,
              rollbackError:report.rollbackError,
              currentStateRestored:report.currentStateRestored,
              mergeVerified:report.mergeVerified
            },null,2));
            process.exit(1);
          }
          NODE

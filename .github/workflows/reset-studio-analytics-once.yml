name: One-time Morrow Wish D1 analytics reset through Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reset-studio-analytics-once.yml']
permissions:
  contents: read
concurrency:
  group: morrowwish-cloudflare-pages-production
  cancel-in-progress: false
jobs:
  reset:
    if: ${{ github.event.head_commit.message == 'One-time analytics purge via Pages Worker (approved)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify database binding, prepare the Pages build
        run: |
          node -e 'const d=require("./cloudflare-pages/wrangler.jsonc").d1_databases[0];if(d.database_name!=="morrowwish-analytics"||d.database_id!=="fbd62f69-1811-4538-a17f-ecc5be8ad7cc")process.exit(1)'
          npm ci
          npm install --no-save --no-package-lock sharp@0.34.5
          bash scripts/fetch-cat-music.sh
          npm run build:pages
      - name: Temporarily inject signed one-time reset handler (never commit secret)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {randomBytes} from 'node:crypto';
          const p='cloudflare-pages/public/_worker.js';
          const src=fs.readFileSync(p,'utf8');
          const marker='export default {async fetch(request,env,ctx){';
          if(!src.includes(marker))throw Error('Unexpected worker source; refusing purge');
          fs.copyFileSync(p,path.join(process.env.RUNNER_TEMP,'mw-original-worker.js'));
          const token=randomBytes(32).toString('hex');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'mw-reset-secret'),token,{mode:0o600});
          const extra=[
            'export default {async fetch(request,env,ctx){',
            'if(request.method==="POST"&&new URL(request.url).pathname==="/api/mw-analytics-once"){',
            'if(request.headers.get("x-mw-once")!=='+JSON.stringify(token)+')return new Response("Unauthorized",{status:401});',
            'try{',
            'const before=await env.DB.prepare("SELECT COUNT(*) AS count FROM events").first();',
            'await env.DB.prepare("DELETE FROM events").run();',
            'const after=await env.DB.prepare("SELECT COUNT(*) AS count FROM events").first();',
            'return new Response(JSON.stringify({success:true,deleted:Number(before?.count||0),remaining:Number(after?.count||0)}),{headers:{"content-type":"application/json","cache-control":"no-store"}});',
            '}catch(e){return new Response(JSON.stringify({success:false}),{status:500});}',
            '}',
            'return mwOriginal.fetch(request,env,ctx);',
            '}};'
          ].join('\n');
          fs.writeFileSync(p,src.replace(marker,'const mwOriginal={async fetch(request,env,ctx){')+'\n'+extra+'\n');
          console.log('Generated reset handler with 256-bit token, not logged.');
          NODE
      - name: Deploy temporary Worker with live production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          (cd cloudflare-pages && npx wrangler pages deploy public --project-name morrowwish --branch main)
      - name: Delete all historical analytics events and read back total
        run: |
          set -euo pipefail
          url='https://morrowwish.pages.dev/api/mw-analytics-once'
          for attempt in $(seq 1 15); do
            status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/mw-reset.json" -w '%{http_code}' -X POST -H "x-mw-once: $(cat "$RUNNER_TEMP/mw-reset-secret")" "$url" || true)
            if [ "$status" = 200 ] && node -e 'const d=require(process.argv[1]);if(!d.success||d.remaining!==0)process.exit(1)' "$RUNNER_TEMP/mw-reset.json"; then
              echo 'RESET_VERIFIED'
              cat "$RUNNER_TEMP/mw-reset.json"
              exit 0
            fi
            echo "Waiting for temporary Worker (HTTP $status)"
            sleep 3
          done
          echo '::error::Reset not verified'
          exit 1
      - name: Always restore original Worker and close private reset route
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/mw-original-worker.js" cloudflare-pages/public/_worker.js
          (cd cloudflare-pages && npx wrangler pages deploy public --project-name morrowwish --branch main)
          for attempt in $(seq 1 12); do
            status=$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' -X POST 'https://morrowwish.pages.dev/api/mw-analytics-once' || true)
            if [ "$status" = 404 ]; then echo 'Original Worker restored; admin reset route is gone'; exit 0; fi
            sleep 3
          done
          echo '::error::Worker restore could not be verified'
          exit 1

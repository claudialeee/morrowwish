name: One-time Morrow Wish analytics reset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reset-studio-analytics-once.yml'

permissions:
  contents: read

concurrency:
  group: morrowwish-one-time-analytics-reset
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ github.event.head_commit.message == 'One-time analytics data purge (approved)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact production D1 target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('cloudflare-pages/wrangler.jsonc','utf8'));
          const db=cfg.d1_databases?.find(x=>x.binding==='DB');
          if(cfg.name!=='morrowwish'||db?.database_name!=='morrowwish-analytics'||db?.database_id!=='fbd62f69-1811-4538-a17f-ecc5be8ad7cc')
            throw new Error('Unexpected production D1 target; refuse purge');
          console.log('Verified analytics-only production D1 database: '+db.database_name);
          NODE
      - name: Install pinned Wrangler
        run: npm ci
      - name: Clear analytics event rows, preserve database schema, and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing Cloudflare API token'; exit 1; }
          echo 'Analytics event counts BEFORE deletion:'
          npx wrangler d1 execute morrowwish-analytics --remote --command "SELECT category, COUNT(*) AS count FROM events GROUP BY category;"
          echo 'Removing all rows from analytics.events (not schema or other stores).'
          npx wrangler d1 execute morrowwish-analytics --remote --command "DELETE FROM events;"
          echo 'Analytics event count immediately AFTER deletion:'
          npx wrangler d1 execute morrowwish-analytics --remote --command "SELECT COUNT(*) AS remaining FROM events;"
          echo 'D1 analytics event reset finished. New traffic may begin accumulating immediately.'

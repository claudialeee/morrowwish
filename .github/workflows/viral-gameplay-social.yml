name: Generate proof-checked hook V3 previews (cats only, NO SOCIAL AUTOPOST)
# Rejected preview videos must never be regenerated or released on push.
# Owner review is required before any future manual generation.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-viral-gameplay.mjs'
      - '.github/workflows/viral-gameplay-social.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morrowwish-current-game-reels
  cancel-in-progress: false

jobs:
  capture-and-publish-media:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout current games
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser and ffmpeg
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Load and verify seven distinct licensed game tracks
        run: |
          bash scripts/fetch-cat-music.sh
          node scripts/fetch-promo-audio.mjs
          node scripts/test-promo-music.mjs
      - name: Capture new gameplay and render vertical videos
        run: node scripts/make-viral-gameplay.mjs
      - name: Validate both actual game footage reels
        run: |
          set -euo pipefail
          for slug in pawsibly-innocent cat-bond; do
            path="public/promo/$slug/hook-v3-20261121.mp4"
            test -s "$path"
            test -s "public/promo/$slug/hook-v3-20261121.jpg"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$path")" = "1080x1920"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$path")" = "audio"
          done
      - name: Stage review-only videos on website (NOT approved for social publishing)
        run: |
          set -euo pipefail
          git add public/promo/pawsibly-innocent/hook-v3-20261121.* public/promo/cat-bond/hook-v3-20261121.* public/promo/pawsibly-innocent/hook-v3-review-*.jpg public/promo/cat-bond/hook-v3-review-*.jpg
          git diff --cached --quiet && exit 0
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'promo: save two review-only story-first gameplay reels; no platform auto-post'
          git pull --rebase origin main
          git push origin HEAD:main

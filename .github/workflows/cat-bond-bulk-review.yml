name: Cat Bond memories and bulk QA (review only)
on:
  push:
    branches:
      - review/catbond-bulk-memories-20261121
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duo-bulk-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify all claimed mechanics
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/cat-bond-duo-memory-server.log 2>&1 &
          sleep 2
          node scripts/cat-bond-lazy-memory-smoke.mjs
          node scripts/cat-bond-locked-duo-review.mjs
          node scripts/cat-bond-duo-smoke.mjs
          node scripts/cat-bond-progression-smoke.mjs
          node scripts/cat-bond-single-painting-smoke.mjs
          node scripts/cat-bond-crazygames-smoke.mjs
      - name: Attach phone/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-duo-memories-bulk-review
          path: /tmp/catbond-bulk-memories-*.png
          retention-days: 7
          if-no-files-found: warn

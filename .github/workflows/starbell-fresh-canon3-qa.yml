name: Starbell fresh normal campaign QA
on:
  push:
    branches: [qa/starbell-fresh-canon3-20261127]
    paths: ['scripts/test-starbell-fresh-canon3-browser.mjs', '.github/workflows/starbell-fresh-canon3-qa.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Device coverage
        type: choice
        options: [both, wide, portrait]
        default: both
permissions:
  contents: read
concurrency:
  group: starbell-fresh-canon3
  cancel-in-progress: false
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile == 'portrait' || startsWith(github.event.head_commit.message, 'QA portrait retry:')) && '["portrait"]' || inputs.profile == 'wide' && '["wide"]' || '["wide","portrait"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8a7054cc95e9ee41ee9d6a877ff6cb3b758f449
      - name: Checkout common campaign driver
        uses: actions/checkout@v4
        with:
          ref: qa/starbell-live-fresh-20261127
          path: qa-driver
          sparse-checkout: scripts/test-starbell-fresh-shared.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - name: Continuous fresh slot campaign through ending
        env:
          STARBELL_WORK_PROFILE: ${{ matrix.profile }}
          STARBELL_MODE: local
          STARBELL_LANG: ${{ matrix.profile == 'portrait' && 'zh' || 'en' }}
          SOURCE_SHA: e8a7054cc95e9ee41ee9d6a877ff6cb3b758f449
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-fresh.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git -C qa-driver rev-parse HEAD
          cp qa-driver/scripts/test-starbell-fresh-shared.mjs scripts/test-starbell-fresh-shared.mjs
          node --check scripts/test-starbell-fresh-shared.mjs
          node scripts/test-starbell-fresh-shared.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-${{ matrix.profile }}
          path: artifacts/live-fresh/
          retention-days: 7

name: Starbell P1 locale purity
on:
  push:
    branches: [starbell-echoes]
    paths:
      - 'public/cat-bond/**'
      - 'public/lang.js'
      - 'public/game-settings.js'
      - 'scripts/cat-bond-*language*.mjs'
      - 'scripts/cat-bond-locale-purity.mjs'
      - 'scripts/cat-bond-release-prologue-qa.mjs'
      - 'scripts/starbell-garden-qa.mjs'
      - 'scripts/test-cat-bond-canon22-locale-purity.mjs'
      - '.github/workflows/starbell-locale-purity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starbell-locale-purity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      opening_only: ${{ steps.scope.outputs.opening_only }}
      focused: ${{ steps.scope.outputs.focused }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          if bash scripts/starbell-garden-release-scope.sh HEAD; then
            echo 'focused=true' >> "$GITHUB_OUTPUT"
            echo 'matrix=["opening-en"]' >> "$GITHUB_OUTPUT"
            echo 'opening_only=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=35ef1c1979513bd7d98b07bb804d842dc47bfcfd
          focused_base=0cf0e75dcc6386bb7b6b93094ba0a91900323208
          source_sha="$GITHUB_SHA"
          echo 'focused=false' >> "$GITHUB_OUTPUT"
          if [[ "$source_sha" != "$focused_base" ]] && git diff --quiet "$focused_base" "$source_sha" -- . ':!.github/workflows/starbell-framing-farwind-focused.yml' ':!docs/cat-bond-rpg/FINAL-ART-FOCUSED-HANDOFF-20261127.md' ':!public/cat-bond/assets/combat/star-bell-arena-chorus-wide.webp' ':!public/cat-bond/assets/combat/star-bell-arena-lock-wide.webp' ':!public/cat-bond/assets/combat/star-bell-arena-wide.webp' ':!public/cat-bond/assets/resonance-world-v2/sky-farwind-wide.webp' ':!public/cat-bond/index.html' ':!public/cat-bond/js/resonance/finale-art.mjs' ':!public/cat-bond/js/resonance/finale-combat.mjs' ':!public/cat-bond/js/resonance/integration-entry.mjs' ':!public/cat-bond/js/resonance/portrait-map.mjs' ':!public/cat-bond/js/resonance/world-runtime.mjs' ':!scripts/test-starbell-finale-framing-farwind.mjs' ':!scripts/import-starbell-region-music.mjs' ':!scripts/test-starbell-approved-region-music.mjs' ':!.github/workflows/cat-bond-preview.yml' ':!.github/workflows/starbell-portrait-art-preview.yml' ':!.github/workflows/starbell-locale-purity.yml' ':!scripts/starbell-release-gate.sh'; then
            echo 'focused=true' >> "$GITHUB_OUTPUT"
            echo 'matrix=["opening-en"]' >> "$GITHUB_OUTPUT"
            echo 'opening_only=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          opening_only=false
          if git diff --quiet "$base" HEAD -- . ':!scripts/cat-bond-release-prologue-qa.mjs' ':!scripts/starbell-garden-qa.mjs' ':!.github/workflows/starbell-locale-purity.yml' ':!.github/workflows/cat-bond-preview.yml' ':!.github/workflows/starbell-portrait-art-preview.yml' ':!scripts/starbell-release-gate.sh'; then
            opening_only=true
          fi
          echo "opening_only=$opening_only" >> "$GITHUB_OUTPUT"
          if [[ "$opening_only" == true ]]; then
            echo 'matrix=["opening-en","opening-zh"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["panels","interactions","opening-en","opening-zh"]' >> "$GITHUB_OUTPUT"
          fi
  source:
    needs: scope
    if: needs.scope.outputs.opening_only != 'true' && needs.scope.outputs.focused != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-cat-bond-canon22-locale-purity.mjs
  browser:
    needs: scope
    if: needs.scope.outputs.focused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Locale purity in real browser
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-locale.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          case "$SCOPE" in
            panels) node scripts/cat-bond-language-audit.mjs ;;
            interactions) node scripts/cat-bond-interaction-language-qa.mjs ;;
            opening-en) PROLOGUE_LANG=en CAT_BOND_FULL_CAMPAIGN=0 node scripts/cat-bond-release-prologue-qa.mjs ;;
            opening-zh) PROLOGUE_LANG=zh CAT_BOND_FULL_CAMPAIGN=0 node scripts/cat-bond-release-prologue-qa.mjs ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-locale-${{ matrix.scope }}
          path: |
            .check/cat-bond-language-audit
            .check/cat-bond-interaction-language
            artifacts/cat-bond-release-prologue
            /tmp/starbell-locale.log
          include-hidden-files: true
          if-no-files-found: warn

name: Owner-approved V14 Bluesky video relaunch (one-time)
# Authorized re-launch after Bluesky App Password was configured.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bluesky-relaunch-20261122.yml'
      - 'scripts/bluesky-relaunch-20261122.mjs'
permissions:
  contents: read
concurrency:
  group: morrowwish-owner-approved-bluesky-v14-relaunch-20261122
  cancel-in-progress: false
jobs:
  relaunch:
    if: github.event.head_commit.message == 'Schedule approved V14 Bluesky one-time video relaunch'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MORROW_BLUESKY_HANDLE: ${{ secrets.MORROW_BLUESKY_HANDLE }}
      MORROW_BLUESKY_APP_PASSWORD: ${{ secrets.MORROW_BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate single-use publisher
        run: node --check scripts/bluesky-relaunch-20261122.mjs
      - name: Publish V14 videos with clickable trial links and actual bot verification
        run: node scripts/bluesky-relaunch-20261122.mjs

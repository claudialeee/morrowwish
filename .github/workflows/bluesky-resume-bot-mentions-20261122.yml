name: Resume remaining Bluesky V14 videos with two bot mentions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bluesky-resume-bot-mentions-20261122.yml']
permissions:
  actions: write
  contents: read
concurrency:
  group: morrowwish-v14-resume-bot-mentions-20261122
  cancel-in-progress: false
jobs:
  resume:
    if: github.event.head_commit.message == 'Resume remaining Bluesky V14 videos with two bot mentions'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MORROW_BLUESKY_APP_PASSWORD: ${{ secrets.MORROW_BLUESKY_APP_PASSWORD }}
      MORROW_BLUESKY_HANDLE: morrowwishgames.bsky.social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publisher syntax before stopping prior job
        run: node --check scripts/bluesky-relaunch-20261122.mjs
      - name: Cancel previous unmodified release and wait until stopped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const prevRun=45105273215;
          const url='https://api.github.com/repos/'+process.env.REPO+'/actions/runs/'+prevRun;
          const headers={'Authorization':'Bearer '+process.env.GH_TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function status(){
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('GET run status '+r.status);
            const data=await r.json();
            console.log('Earlier job '+data.id+' '+data.status+'/'+data.conclusion);
            return data.status;
          }
          if((await status())!=='completed'){
            const r=await fetch(url+'/cancel',{method:'POST',headers,signal:AbortSignal.timeout(20000)});
            if(r.status!==202 && r.status!==409)throw Error('Cannot cancel earlier workflow: HTTP '+r.status+' '+(await r.text()).slice(0,200));
            console.log('Cancellation requested; no concurrent publish allowed');
            let stopped=false;
            for(let i=0;i<75;i++){
              await sleep(2000);
              if((await status())==='completed'){stopped=true;break;}
            }
            if(!stopped)throw Error('Previous publishing job did not stop; abort to prevent duplicate posts');
          }
          console.log('Previous video publisher fully stopped; safe to resume remaining games');
          NODE
      - name: Publish only missing videos with correct clickable URL and both bot mentions
        run: node scripts/bluesky-relaunch-20261122.mjs

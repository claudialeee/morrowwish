name: Cat Bond canonical narrative host QA
on:
  push:
    branches: [rpg/narrative-engine]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/test-cat-bond-resonance*.mjs'
      - 'scripts/cat-bond-resonance-host-smoke.mjs'
      - '.github/workflows/cat-bond-resonance-host-qa.yml'
permissions:
  contents: read
concurrency:
  group: cat-bond-resonance-host-qa
  cancel-in-progress: true
jobs:
  canonical-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/test-cat-bond-resonance.mjs && node scripts/test-cat-bond-resonance-slot.mjs && node scripts/test-cat-bond-resonance-ambient.mjs
      - run: npm ci && npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Start actual game on local HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/resonance-host-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
      - name: Browser test with canonical story fixture
        run: node scripts/cat-bond-resonance-host-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-narrative-host-browser-screenshots
          path: artifacts/cat-bond-resonance-host/
          if-no-files-found: warn
          retention-days: 7

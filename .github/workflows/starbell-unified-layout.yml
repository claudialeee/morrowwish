name: Starbell unified layout targeted QA
on:
  push:
    branches: [review/starbell-unified-layout-fix]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: starbell-unified-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      layout: ${{ steps.scope.outputs.layout }}
      opening: ${{ steps.scope.outputs.opening }}
      chapters: ${{ steps.scope.outputs.chapters }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select only affected checks against last verified live release
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/starbell-incremental-plan.mjs --self-test
          node scripts/starbell-incremental-plan.mjs
  layout:
    needs: plan
    if: needs.plan.outputs.layout == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAT_BOND_SMOKE_ORIGIN: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Syntax and focused browser acceptance
        run: |
          set -euo pipefail
          test_script=scripts/starbell-unified-layout-regression.mjs
          node --check public/cat-bond/js/main.js
          node --check public/cat-bond/js/story-cloud.js
          node --check "$test_script"
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-layout-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node "$test_script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-unified-layout-proof
          path: |
            artifacts/starbell-unified-layout/
            /tmp/starbell-layout-server.log
          if-no-files-found: ignore
  canon-restoration:
    needs: plan
    if: needs.plan.outputs.chapters != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJSON(needs.plan.outputs.chapters) }}
    env:
      CAT_BOND_EXPERIENCE: '1'
      CAT_BOND_CHAPTERS: ${{ matrix.chapter }}
      CAT_BOND_CHAPTER_LOCALE: zh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Canon restoration actual chapter input
        run: |
          set -euo pipefail
          node --check public/cat-bond/js/resonance/world-exploration.mjs
          node --check public/cat-bond/js/resonance/world-bridge.mjs
          node scripts/cat-bond-canon22-migration-audit.mjs
          node scripts/test-cat-bond-player-first.mjs
          node scripts/test-cat-bond-canon22-spatial.mjs
          case "$CAT_BOND_CHAPTERS" in finale) export CAT_BOND_TARGET_SCENES=finale:B-01 ;; epilogue) export CAT_BOND_TARGET_SCENES=epilogue:E-01 ;; harbor) export CAT_BOND_TARGET_SCENES=harbor:H-01 ;; sky) export CAT_BOND_TARGET_SCENES=sky:S-01 ;; library) export CAT_BOND_TARGET_SCENES=library:M-01 ;; forest) export CAT_BOND_TARGET_SCENES=forest:R-01 ;; forge) export CAT_BOND_TARGET_SCENES=forge:E-01 ;; starfall) export CAT_BOND_TARGET_SCENES=starfall:F-01 ;; esac
          node scripts/cat-bond-experience-knowledge.mjs
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/canon-restoration.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-targets.mjs
          if [[ "$CAT_BOND_CHAPTERS" != "epilogue" ]]; then export CAT_BOND_PORTRAIT=1; fi
          node scripts/cat-bond-experience-chapters.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canon-restoration-${{ matrix.chapter }}
          path: |
            artifacts/cat-bond-experience/
            artifacts/canon22/
            /tmp/canon-restoration.log
          if-no-files-found: ignore
  opening:
    needs: plan
    if: needs.plan.outputs.opening == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {locale: zh, profile: desktop}
          - {locale: zh, profile: portrait}
          - {locale: zh, profile: landscape}
          - {locale: en, profile: portrait}
    env:
      PROLOGUE_LANG: ${{ matrix.locale }}
      PROLOGUE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Opening quest and first encounter, real input
        run: |
          set -euo pipefail
          node --check public/cat-bond/js/sunlit-garden.js
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-opening.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-release-prologue-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-opening-${{ matrix.locale }}-${{ matrix.profile }}
          path: |
            artifacts/cat-bond-release-prologue/
            /tmp/starbell-opening.log
          if-no-files-found: ignore
  preview:
    needs: [plan, layout, canon-restoration, opening]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/review/starbell-unified-layout-fix' &&
      needs.plan.result == 'success' && needs.plan.outputs.deploy == 'true' &&
      (needs.layout.result == 'success' || (needs.plan.outputs.layout == 'false' && needs.layout.result == 'skipped')) &&
      (needs.opening.result == 'success' || (needs.plan.outputs.opening == 'false' && needs.opening.result == 'skipped')) &&
      (needs.canon-restoration.result == 'success' || (needs.plan.outputs.chapters == '[]' && needs.canon-restoration.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
      PREVIEW_URL: https://starbell-portrait-preview.morrowwish.pages.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install audio verification prerequisites if absent
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Build preview with existing audio and local-only saves
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/import-cat-bond-windchime-music.mjs
          node scripts/check-cat-bond-audio-assets.mjs
          mkdir -p /tmp/starbell-portrait/site
          cp -a public/cat-bond /tmp/starbell-portrait/site/
          for dir in audio art icons pawsibly-innocent; do cp -a "public/$dir" /tmp/starbell-portrait/site/; done
          find public -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -exec cp {} /tmp/starbell-portrait/site/ \;
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/starbell-portrait/site',file=root+'/cat-bond/index.html',sha=process.env.SOURCE_SHA;
          let html=fs.readFileSync(file,'utf8');
          html=html.replace(/<\/head>/i,'<meta name="robots" content="noindex,nofollow"><script>window.ARCADE_GAME_ID="starbell-portrait-preview";window.ARCADE_COLLECTOR="/api/preview-disabled";window.arcadeMetric=()=>{};</script></head>');
          html=html.replace(/<body([^>]*)>/i,'<body$1 data-source-sha="'+sha+'">');
          fs.writeFileSync(file,html);
          fs.writeFileSync(root+'/index.html','<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/cat-bond/"></head><body><a href="/cat-bond/">Echoes of the Starbell</a></body></html>');
          fs.writeFileSync(root+'/robots.txt','User-agent: *\nDisallow: /\n');
          fs.writeFileSync(root+'/_headers','/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n  Content-Security-Policy: connect-src \'self\'; form-action \'self\'\n');
          // An explicit 404 page disables Pages' SPA fallback for unavailable APIs.
          // No Worker or recursive redirect is needed: all API requests remain local.
          fs.writeFileSync(root+'/404.html','<!doctype html><html><head><meta name="robots" content="noindex,nofollow"></head><body>Preview APIs disabled; local saves only.</body></html>');
          fs.writeFileSync(root+'/preview-version.json',JSON.stringify({sha,scope:'isolated portrait engineering preview',productionApis:false,telemetry:false,storage:'local-only',fullReleaseAccepted:false,targetedLayoutGate:true,fullCampaignRevalidated:false}));
          NODE
          python3 - <<'PY'
          import pathlib
          files=[p for p in pathlib.Path('/tmp/starbell-portrait/site').rglob('*') if p.is_file()]
          assert len(files)<=20000
          assert max(p.stat().st_size for p in files)<=25*1024*1024
          print('Free static Pages asset limits verified:', len(files), 'files')
          PY
      - name: Publish separate non-production Pages alias only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          git fetch --depth=1 origin review/starbell-unified-layout-fix
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || { echo 'Runtime changed after acceptance; refuse stale preview'; exit 1; }
          # Direct upload to existing project, no new plan, project, paid service or Worker.
          ./node_modules/.bin/wrangler pages deploy /tmp/starbell-portrait/site --project-name morrowwish --branch starbell-portrait-preview --commit-hash "$SOURCE_SHA"
      - name: Verify deployed version and no production APIs
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsS "$PREVIEW_URL/preview-version.json?qa=$SOURCE_SHA" | jq -e --arg sha "$SOURCE_SHA" '.sha==$sha and .productionApis==false and .storage=="local-only"' >/dev/null && curl -fsS "$PREVIEW_URL/cat-bond/?qa=$SOURCE_SHA" | grep -F "data-source-sha=\"$SOURCE_SHA\"" >/dev/null; then
              for endpoint in preview-disabled session cat-bond-cloud-save; do
                test "$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/$endpoint")" = 404
              done
              echo "Verified isolated preview: $PREVIEW_URL/cat-bond/"; exit 0
            fi
            sleep 4
          done
          exit 1
      - uses: ./.github/actions/starbell-browser-setup
        with:
          npm-ci: 'false'
      - name: Verify live portrait title and new slot
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await ctx.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(process.env.PREVIEW_URL+'/cat-bond/?lang=zh&qa=portrait-handoff');
            assert.equal(await page.locator('body').getAttribute('data-source-sha'),process.env.SOURCE_SHA);
            const image=page.locator('.cb-title-cover-art');
            await image.waitFor({state:'visible'});
            await image.evaluate(i=>i.decode());
            assert.ok(await image.evaluate(i=>i.naturalWidth>0&&i.src.endsWith('title-bell-sanctuary.webp')));
            await page.screenshot({path:'portrait-live-title.png'});
            await page.locator('#intro-start').tap();
            assert.equal(await page.locator('#intro-slot-panel [data-slot-language]').count(),0);
            await page.locator('#intro-slot-list [data-slot="slot1"]').tap();
            await page.locator('#cb-player-first-intro').getByRole('button',{name:'开始探索',exact:true}).tap();
            await page.waitForFunction(()=>window.__game?.scene==='yard'&&window.State?.S?.cats?.length===1);
            await page.screenshot({path:'portrait-live-yard.png'});
            assert.deepEqual(errors,[]);
            console.log('LIVE PORTRAIT PASS',process.env.PREVIEW_URL);
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-live-proof
          path: portrait-live-*.png
          if-no-files-found: ignore
          retention-days: 14

name: Cat Bond actual duo cinematic and earned SSR capture
on:
  push:
    branches: [review/cat-bond-release-bundle-20261127]
    paths: ['capture-signature.mjs','.github/workflows/capture-signature.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install free browser tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 -c 'import PIL' || python3 -m pip install --break-system-packages pillow
      - name: Reuse corrected website candidate and earned gameplay saves
        run: |
          mkdir -p output/portrait-fixed-web
          cp -a source/public output/portrait-fixed-web/
          cp -a source-overlay/public/. output/portrait-fixed-web/public/
      - name: Play the real next encounter and earn SSR through normal input
        id: capture
        continue-on-error: true
        run: node capture-signature.mjs
      - name: Generate visual review sheets from actual screenshots
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('signature-capture')
          for o in ['landscape','portrait']:
              files=[root/o/(n+'.png') for n in ['duo-real','ssr-discovery','ssr-combat','ssr-earned'] if (root/o/(n+'.png')).exists()]
              if not files:continue
              w,h=(600,338) if o=='landscape' else (350,525)
              board=Image.new('RGB',(w*2,(h+24)*((len(files)+1)//2)),'#222222');d=ImageDraw.Draw(board)
              for i,p in enumerate(files):
                  im=Image.open(p).convert('RGB');im.thumbnail((w-8,h-8));x=i%2*w;y=i//2*(h+24);board.paste(im,(x+(w-im.width)//2,y+(h-im.height)//2));d.text((x+4,y+h+2),p.stem,fill='white')
              f=root/(o+'-review.jpg');board.save(f,quality=79,optimize=True);f.with_suffix('.b64.txt').write_text(base64.b64encode(f.read_bytes()).decode())
          PY
      - name: Save real capture evidence only
        if: always()
        run: |
          git config user.name 'Morrow Wish release QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find signature-capture -name '*.webm' -size +90M -delete
          git add -f signature-capture
          git diff --cached --quiet || git commit -m 'Save actual duo and natural SSR recording evidence [skip ci]'
          git push origin HEAD:review/cat-bond-release-bundle-20261127
      - name: Require true earned captures in both orientations
        if: steps.capture.outcome != 'success'
        run: exit 1

name: Starbell isolated portrait preview
on:
  push:
    branches: [review/starbell-mobile-portrait]
    paths: ['.github/workflows/starbell-portrait-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: starbell-portrait-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/review/starbell-mobile-portrait'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 0ef3eff2c67f310fbd76e39d1acca5ed5e603020
      TELEMETRY_SHA: 1806d4e57b46be628918b3d67b8573ae88d36100
      PREVIEW_URL: https://starbell-portrait-preview.morrowwish.pages.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require exact candidate's completed source and bilingual browser gates
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            a=$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/45941020787)
            b=$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/45941020775)
            test "$(jq -r .head_sha <<<"$a")" = "$SOURCE_SHA"
            test "$(jq -r .head_sha <<<"$b")" = "$SOURCE_SHA"
            if [[ $(jq -r .status <<<"$a") == completed && $(jq -r .status <<<"$b") == completed ]]; then
              test "$(jq -r .conclusion <<<"$a")" = success
              test "$(jq -r .conclusion <<<"$b")" = success
              echo "Pinned source and bilingual campaign passed"; exit 0
            fi
            sleep 10
          done
          echo 'Acceptance incomplete; do not deploy' >&2; exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install audio verification prerequisites if absent
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Build preview with existing audio and local-only saves
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/import-cat-bond-windchime-music.mjs
          node scripts/check-cat-bond-audio-assets.mjs
          mkdir -p /tmp/starbell-portrait/site
          cp -a public/cat-bond /tmp/starbell-portrait/site/
          for dir in audio art icons pawsibly-innocent; do cp -a "public/$dir" /tmp/starbell-portrait/site/; done
          find public -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -exec cp {} /tmp/starbell-portrait/site/ \;
          git fetch --no-tags --depth=1 origin "$TELEMETRY_SHA"
          git show "$TELEMETRY_SHA:public/telemetry.js" > /tmp/starbell-portrait/site/telemetry.js
          node --check /tmp/starbell-portrait/site/telemetry.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/starbell-portrait/site',file=root+'/cat-bond/index.html',sha=process.env.SOURCE_SHA;
          let html=fs.readFileSync(file,'utf8');
          html=html.replace(/<\/head>/i,'<meta name="robots" content="noindex,nofollow"><script>window.ARCADE_GAME_ID="starbell-preview";window.ARCADE_COLLECTOR=(new URLSearchParams(location.search).has("qa")||new URLSearchParams(location.search).has("rpgDev")||new URLSearchParams(location.search).has("developer")||location.hostname!=="starbell-portrait-preview.morrowwish.pages.dev")?"/api/preview-disabled":"https://morrowwish.pages.dev/api/starbell-preview-session";window.arcadeMetric=()=>{};</script></head>');
          html=html.replace(/<body([^>]*)>/i,'<body$1 data-source-sha="'+sha+'">');
          fs.writeFileSync(file,html);
          // Only the pinned telemetry asset is overlaid; approved game assets and local saves remain unchanged.
          fs.writeFileSync(root+'/index.html','<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/cat-bond/"></head><body><a href="/cat-bond/">Echoes of the Starbell</a></body></html>');
          fs.writeFileSync(root+'/robots.txt','User-agent: *\nDisallow: /\n');
          fs.writeFileSync(root+'/_headers','/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n  Content-Security-Policy: connect-src \'self\' https://morrowwish.pages.dev/api/starbell-preview-session; form-action \'self\'\n');
          // An explicit 404 page disables Pages' SPA fallback for unavailable APIs.
          // No Worker or recursive redirect is needed: all API requests remain local.
          fs.writeFileSync(root+'/404.html','<!doctype html><html><head><meta name="robots" content="noindex,nofollow"></head><body>Preview APIs disabled; local saves only.</body></html>');
          fs.writeFileSync(root+'/preview-version.json',JSON.stringify({sha,scope:'isolated portrait engineering preview',productionApis:false,telemetry:'starbell-preview',telemetrySha:process.env.TELEMETRY_SHA,storage:'local-only',fullReleaseAccepted:false,sourceGate:45941020775,campaignGate:45941020787}));
          NODE
          python3 - <<'PY'
          import pathlib
          files=[p for p in pathlib.Path('/tmp/starbell-portrait/site').rglob('*') if p.is_file()]
          assert len(files)<=20000
          assert max(p.stat().st_size for p in files)<=25*1024*1024
          print('Free static Pages asset limits verified:', len(files), 'files')
          PY
      - name: Publish separate non-production Pages alias only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          git fetch --depth=1 origin review/starbell-mobile-portrait
          git diff --quiet "$SOURCE_SHA" FETCH_HEAD -- public package.json package-lock.json || { echo 'Runtime changed after acceptance; refuse stale preview'; exit 1; }
          # Direct upload to existing project, no new plan, project, paid service or Worker.
          ./node_modules/.bin/wrangler pages deploy /tmp/starbell-portrait/site --project-name morrowwish --branch starbell-portrait-preview --commit-hash "$SOURCE_SHA"
      - name: Verify deployed version and no production APIs
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsS "$PREVIEW_URL/preview-version.json?qa=$SOURCE_SHA" | jq -e --arg sha "$SOURCE_SHA" '.sha==$sha and .productionApis==false and .storage=="local-only"' >/dev/null && curl -fsS "$PREVIEW_URL/cat-bond/?qa=$SOURCE_SHA" | grep -F "data-source-sha=\"$SOURCE_SHA\"" >/dev/null; then
              for endpoint in preview-disabled session cat-bond-cloud-save; do
                test "$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/$endpoint")" = 404
              done
              echo "Verified isolated preview: $PREVIEW_URL/cat-bond/"; exit 0
            fi
            sleep 4
          done
          exit 1
      - uses: ./.github/actions/starbell-browser-setup
        with:
          npm-ci: 'false'
      - name: Verify live portrait title and new slot
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await ctx.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const collector='https://morrowwish.pages.dev/api/starbell-preview-session';
            const observed=[];
            await page.route(collector,async route=>{
              observed.push(JSON.parse(route.request().postData()));
              await route.fulfill({status:202,headers:{'Access-Control-Allow-Origin':process.env.PREVIEW_URL},body:'{"ok":true}'});
            });
            await page.goto(process.env.PREVIEW_URL+'/cat-bond/?lang=zh');
            await page.waitForFunction(()=>window.ARCADE_GAME_ID==='starbell-preview'&&window.ARCADE_COLLECTOR==='https://morrowwish.pages.dev/api/starbell-preview-session');
            await page.waitForTimeout(300);
            assert.ok(observed.some(e=>e.kind==='visit'&&e.game==='starbell-preview'));
            await page.reload();
            await page.waitForTimeout(300);
            assert.equal(new Set(observed.filter(e=>e.kind==='visit').map(e=>e.viewId)).size,2);
            const entered=page.waitForRequest(req=>req.url()===collector&&req.method()==='POST'&&JSON.parse(req.postData()||'{}').signals?.rpg_new===1);
            await page.locator('#intro-start').tap();
            await page.locator('#intro-slot-list [data-slot="slot1"]').tap();
            await entered;
            assert.ok(observed.some(e=>e.metricsVersion===1));
            await page.evaluate(()=>localStorage.clear());
            await page.goto(process.env.PREVIEW_URL+'/cat-bond/?lang=zh&qa=portrait-handoff');
            const beforeQa=observed.length;
            assert.equal(await page.locator('body').getAttribute('data-source-sha'),process.env.SOURCE_SHA);
            const image=page.locator('.cb-title-cover-art');
            await image.waitFor({state:'visible'});
            await image.evaluate(i=>i.decode());
            assert.ok(await image.evaluate(i=>i.naturalWidth>0&&i.src.endsWith('title-bell-sanctuary.webp')));
            await page.screenshot({path:'portrait-live-title.png'});
            await page.locator('#intro-start').tap();
            await page.locator('#intro-slot-list [data-slot="slot1"]').tap();
            await page.locator('#cb-player-first-intro').getByRole('button',{name:'开始探索',exact:true}).tap();
            await page.waitForFunction(()=>window.__game?.scene==='yard'&&window.State?.S?.cats?.length===1);
            await page.screenshot({path:'portrait-live-yard.png'});
            assert.equal(observed.length,beforeQa,'QA must not send any real metrics');
            assert.deepEqual(errors,[]);
            console.log('LIVE PORTRAIT PASS',process.env.PREVIEW_URL);
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-live-proof
          path: portrait-live-*.png
          if-no-files-found: ignore
          retention-days: 14

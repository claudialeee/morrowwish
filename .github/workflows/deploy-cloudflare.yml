name: Deploy Morrow Wish to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'cloudflare-pages/wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morrowwish-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source, game ordering, and D1 binding
        run: |
          npm run check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('cloudflare-pages/wrangler.jsonc', 'utf8'));
          const db = config.d1_databases?.find(x => x.binding === 'DB');
          if (config.name !== 'morrowwish' || db?.database_name !== 'morrowwish-analytics' || db.database_id !== 'fbd62f69-1811-4538-a17f-ecc5be8ad7cc') {
            console.error('::error::Wrong Cloudflare Pages project or production D1 binding. Deployment stopped.');
            process.exit(1);
          }
          console.log('Existing Morrow Wish Pages project and production D1 binding verified.');
          NODE
      - name: Verify discovery and launch automation
        run: |
          node --check scripts/discovery.mjs
          node --check scripts/submit-indexnow.mjs
          node scripts/discovery.mjs --release-kit
          test -s release-kit/elsewhere.json
          test -s release-kit/tiny-town.json
      - name: Deploy existing Cloudflare Pages production project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Missing CLOUDFLARE_API_TOKEN in GitHub Actions secrets.'
            exit 1
          fi
          npm run deploy
      - name: Verify Cloudflare site and analytics API
        run: |
          set -eu
          for route in / /tiny-town/ /elsewhere/ /pocket-aquarium/ /pawsibly-innocent/ /pawsibly-innocent/game.js /icons/pawsibly-innocent.svg /studio-insights/; do
            code=$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' "https://morrowwish.pages.dev$route")
            test "$code" = 200 || { echo "::error::Page $route returned $code"; exit 1; }
          done
          good=0
          for attempt in 1 2 3 4 5; do
            code=$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' 'https://morrowwish.pages.dev/api/summary?days=7')
            if [ "$code" = 401 ]; then good=1; break; fi
            sleep 3
          done
          test "$good" = 1 || { echo "::error::Analytics API returned $code; expected 401 without login"; exit 1; }
          # A 200 alone can conceal a fallback HTML page: inspect the file body.
          for asset in no-work-public bookshop-cooperative paris-screens cabin-refuge; do
            code=$(curl -sSL --max-time 15 -o /tmp/elsewhere-ending.svg -w '%{http_code}' "https://morrowwish.pages.dev/elsewhere/endings/$asset.svg")
            test "$code" = 200 && grep -q '<svg' /tmp/elsewhere-ending.svg || { echo "::error::Ending illustration $asset missing or invalid (HTTP $code)"; exit 1; }
          done
          code=$(curl -sSL --max-time 15 -o /tmp/elsewhere-endings.js -w '%{http_code}' 'https://morrowwish.pages.dev/elsewhere/endings.js')
          test "$code" = 200 && grep -q 'ELSEWHERE_ENDINGS' /tmp/elsewhere-endings.js || { echo "::error::Ending script missing or invalid (HTTP $code)"; exit 1; }
          echo 'Morrow Wish Cloudflare Pages and protected Analytics API verified; Vercel was not deployed.'
      - name: Publish automatic game promotion kit for each release
        uses: actions/upload-artifact@v4
        with:
          name: morrowwish-game-promotion-kit
          path: release-kit/
          retention-days: 30
      - name: Notify Bing and other IndexNow search engines
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

name: Deploy Morrow Wish to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morrowwish-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify game source
        run: npm run check
      - name: Publish existing Cloudflare Worker (never deploy Vercel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub Actions secret. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run deploy

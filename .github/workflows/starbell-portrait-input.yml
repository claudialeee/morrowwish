name: Starbell portrait targeted input acceptance
on:
  push:
    branches: [review/starbell-mobile-portrait]
    paths:
      - 'scripts/starbell-portrait-input-acceptance.mjs'
      - '.github/workflows/starbell-portrait-input.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starbell-portrait-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  touch-and-rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CAT_BOND_SMOKE_ORIGIN: http://127.0.0.1:8765
      CAT_BOND_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Source check
        run: |
          node --check scripts/starbell-portrait-input-acceptance.mjs
          npm run check
      - name: Isolated native touch and orientation
        if: always()
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-input-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/starbell-portrait-input-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-portrait-input
          path: |
            artifacts/starbell-portrait-input/
            /tmp/starbell-input-server.log
          retention-days: 14

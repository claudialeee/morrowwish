name: Canon 2.2 chapter browser acceptance
on:
  push:
    branches: [review/starbell-canon13-player-experience, review/starbell-qa-optimization]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/cat-bond-experience-*.mjs'
      - '.github/workflows/cat-bond-canon22-browser.yml'
      - '.github/actions/starbell-browser-setup/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'chapters, tail, or comma-separated chapter IDs; scoped runs are not release evidence'
        type: string
        default: chapters
permissions:
  contents: read
concurrency:
  group: canon22-browser-${{ github.ref }}-${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[qa-full]') && 'final-full' || contains(github.event.head_commit.message, '[fresh-campaign]') && 'final-full' || contains(github.event.head_commit.message, '[qa-tail]') && 'tail' || 'incremental') || inputs.scope }}
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-obsolete-qa]') }}
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: scope
        env:
          TOOLCHAIN_ONLY: ${{ github.event_name == 'push' && github.ref_name == 'review/starbell-qa-optimization' }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          MANUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          node scripts/cat-bond-experience-qa-scope.mjs --self-test
          matrix=$(node scripts/cat-bond-experience-qa-scope.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  chapter:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CAT_BOND_EXPERIENCE: '1'
      CAT_BOND_TARGET_SCENES: ${{ matrix.entry }}
      CAT_BOND_CHAPTERS: ${{ matrix.chapter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Produce synthetic starting snapshot, not playthrough evidence
        run: node scripts/cat-bond-experience-knowledge.mjs
      - name: Complete the chapter through real browser input
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/canon22-browser.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-targets.mjs
          node scripts/cat-bond-experience-chapters.mjs
      - name: Reload actual chapter-derived saves across languages and screen profiles
        run: |
          root=artifacts/cat-bond-experience/chapter-acceptance/checkpoints/chapter-$CAT_BOND_CHAPTERS
          test -d "$root"
          mapfile -d '' fixtures < <(find "$root" -maxdepth 1 -name '*.json' -print0)
          test "${#fixtures[@]}" -gt 0
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/canon22-replay.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-replay.mjs --batch --chapter-derived "${fixtures[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canon22-browser-${{ matrix.chapter }}
          path: |
            artifacts/cat-bond-experience/
            /tmp/canon22-browser.log
            /tmp/canon22-replay.log
          if-no-files-found: warn
          retention-days: 14


name: Cat Bond final independent media recheck
on:
  push:
    branches: [review/cat-bond-release-bundle-20261127]
    paths: ['verify-portrait-final.py','.github/workflows/verify-portrait-final.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected full continuous take and media hashes
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 -c 'import PIL' || python3 -m pip install --break-system-packages pillow
          python3 verify-portrait-final.py
      - name: Save rechecked report
        run: |
          git config user.name 'Morrow Wish release QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-media/_verification/final-verification.json release-media/_verification/visual-review.md RELEASE-HOLD.md
          git commit -m 'Complete portrait fix final independent media QA [skip ci]'
          git push origin HEAD:review/cat-bond-release-bundle-20261127

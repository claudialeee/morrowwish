name: Cat Bond 8.1s ORIGINAL Shorts source-matched landscape
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-bond-hook-v3-native-landscape.yml'
      - 'scripts/record-cat-bond-original-hook-landscape.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catbond-native-landscape-original-hook-v3
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Current production code (output only, not re-recorded)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: EXACT historical game that generated the published YouTube Short
        uses: actions/checkout@v4
        with:
          repository: claudialeee/morrowwish
          ref: 968ba9c6d711e406c0817a65787cacc89a75a4d2
          path: .reference-hook-v3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install encoder and browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Download the same licensed Cat Bond soundtrack
        run: |
          bash scripts/fetch-cat-music.sh
          MW_PROMO_ONLY=cat-bond node scripts/fetch-promo-audio.mjs
      - name: Verify original reference source is not the current engine
        run: |
          set -euo pipefail
          grep -Fq 'this.ultCinematic = {' .reference-hook-v3/public/cat-bond/js/battle.js
          grep -Fq 'Claw Cyclone' .reference-hook-v3/public/cat-bond/js/battle.js
          node --check scripts/record-cat-bond-original-hook-landscape.mjs
      - name: Re-record the 8.1s original short, native 16:9, two distinct moves
        env:
          MW_HOOK_V3_GAME_ROOT: .reference-hook-v3
        run: node scripts/record-cat-bond-original-hook-landscape.mjs
      - name: Gate exact source shot order and actual historical Claw Cyclone
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('public/promo/cat-bond/hook-v3-landscape-original-20261122.json'));
          const status=JSON.parse(fs.readFileSync('public/promo/social-release-status.json'));
          const src=status.games.find(x=>x.slug==='cat-bond');
          if(src.media!==m.sourceVideo||!src.socialUrls.youtube.endsWith('/ELv02K9K294'))
            throw Error('Wrong reference - this must be the original PUBLIC Shorts video');
          const cuts=m.originalCutOrder;
          if(cuts.length!==3||cuts.map(x=>x.from).join(',')!=='ultimate,duo,ultimate'||
             cuts.map(x=>x.caption).join('|')!=='THAT FINISHER!|TWO CATS. ONE COMBO.|WHICH TWO WOULD YOU PICK?')
            throw Error('The three real source cut events do not match published Short');
          if(!m.duo.cast||m.duo.duoUses!==1||m.ultimate.name!=='Claw Cyclone'||
             !m.ultimate.cinematic||!m.ultimate.cast||m.ultimate.uses!==1)
            throw Error('Claw Cyclone / original duo not filmed');
          if(m.duration<8||m.duration>8.25||m.bytes<100000)
            throw Error('Wrong video length or empty output');
          console.log('SOURCE MATCH: published Shorts ELv02K9K294 / Claw Cyclone / duo / 8.1s / full-bleed 16:9');
          NODE
      - name: Save reviewed video + proof stills
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-original-short-native-16x9
          path: |
            public/promo/cat-bond/hook-v3-landscape-original-20261122.mp4
            public/promo/cat-bond/hook-v3-landscape-original-20261122.jpg
            public/promo/cat-bond/hook-v3-landscape-original-20261122.json
            public/promo/cat-bond/hook-v3-landscape-original-review-*.jpg
          retention-days: 14
      - name: Commit only verified wide video, without changing original Short or live game
        shell: bash
        run: |
          set -euo pipefail
          git add public/promo/cat-bond/hook-v3-landscape-original-20261122.mp4
          git add public/promo/cat-bond/hook-v3-landscape-original-20261122.jpg
          git add public/promo/cat-bond/hook-v3-landscape-original-20261122.json
          git add public/promo/cat-bond/hook-v3-landscape-original-review-*.jpg
          git diff --cached --quiet && exit 0
          git config user.name morrowwish-promo-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'media(cat-bond): restore original Claw Cyclone and duo shorts in 16:9'
          git restore --worktree .
          for attempt in $(seq 1 15); do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

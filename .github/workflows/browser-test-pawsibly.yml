name: Real-browser cat adventure smoke test
on:
  push:
    branches: [main]
    paths:
      - 'public/pawsibly-innocent/**'
      - 'public/studio-audio.js'
      - 'public/hub.css'
      - 'public/elsewhere/index.html'
      - 'public/tiny-town/index.html'
      - 'public/flip-dash/index.html'
      - 'public/parcel-panic/index.html'
      - 'public/pocket-aquarium/index.html'
      - 'public/cat-bond/**'
      - 'public/game-fullscreen.js'
      - 'public/upgrade.js'
      - 'public/lang.js'
      - 'public/index.html'
      - 'scripts/browser-test-pawsibly.mjs'
      - 'scripts/mobile-playtest.mjs'
      - 'scripts/fullscreen-smoke.mjs'
      - 'scripts/cat-bond-touch-smoke.mjs'
      - '.github/workflows/browser-test-pawsibly.yml'
  workflow_dispatch:
# Only the most recent source revision needs a browser test.
concurrency:
  group: morrowwish-browser-smoke-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Fetch CC0 recorded cat soundtrack
        run: bash scripts/fetch-cat-music.sh
      - name: Run Chromium test against local source
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/pawsibly-local.log 2>&1 &
          sleep 2
          node scripts/browser-test-pawsibly.mjs
          node scripts/mobile-playtest.mjs
          node scripts/fullscreen-smoke.mjs
          node scripts/cat-bond-touch-smoke.mjs

name: Review New Cat Bond Ultimate and Quarrel V10 - NO SOCIAL PUBLISH
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-bond-trailer-v10.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-cat-bond-v10-review
  cancel-in-progress: false
jobs:
  capture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      MW_PROMO_ONLY: cat-bond
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install browser and ffmpeg
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Fetch licensed trailer music
        run: |
          bash scripts/fetch-cat-music.sh
          MW_PROMO_ONLY=cat-bond node scripts/fetch-promo-audio.mjs
      - name: Syntax-check the independent V10 capture and edit
        run: |
          node --check scripts/capture-trailers-v10.mjs
          node --check scripts/render-trailers-v10.mjs
      - name: Record current Cat Bond in real mobile Chromium
        run: node scripts/capture-trailers-v10.mjs
      - name: Render only the updated Cat Bond review video
        run: node scripts/render-trailers-v10.mjs
      - name: Independent scene, music, duration and safety gate
        shell: bash
        run: |
          set -euo pipefail
          mp4=public/promo/cat-bond/trailer-v10-20261121.mp4
          poster=public/promo/cat-bond/trailer-v10-20261121.jpg
          test -s "$mp4" && test -s "$poster"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$mp4")" = "1080x1920"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$mp4")" = "audio"
          for i in 1 2 3; do test -s "public/promo/cat-bond/v10-review-$i.jpg"; done
          test -s public/promo/cat-bond/v10-quarrel-proof.png
          test -s public/promo/cat-bond/v10-duo-actual-render-proof.png
          test -s public/promo/cat-bond/ssr-showcase-proof.png
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./public/promo/v10-review.json');
          const audit=require('./public/promo/readability-audit-v10.json');
          const previous=require('./public/promo/v9-review.json');
          if(m.version!=='V10'||m.trailers.length!==7||m.socialAutopublish!==false||
             m.trailers.some(t=>t.approved||t.published||t.paused))
            throw Error('V10 must remain owner-review only');
          const bond=m.trailers.find(t=>t.slug==='cat-bond');
          if(!bond||!bond.video.includes('trailer-v10')||bond.retainedFrom)
            throw Error('No fresh Cat Bond V10 recording');
          const required=['raising','cat-upgrade','duo-partners','duo-map-walk','duo-promise',
            'duo-quarrel','duo-reconcile','work-after','tease','map-explore','map-management',
            'auto-team-saved','battle-hud','battle-skills','duo','rare-encounter','rare-capture','ssr-showcase'];
          for(const scene of required)
            if(!bond.shots.some(s=>s.scene===scene&&s.seconds>=1.5))
              throw Error('Missing verified real Cat Bond feature: '+scene);
          const scenes=bond.shots.map(s=>s.scene);
          if(scenes.filter(s=>s==='duo').length!==1||scenes.includes('ultimate'))
            throw Error('Repeated or legacy ultimate footage');
          for(const [first,next] of [['duo-promise','duo-quarrel'],['duo-quarrel','duo-reconcile'],
              ['battle-skills','duo'],['duo','rare-encounter']])
            if(scenes.indexOf(first)===-1||scenes.indexOf(first)>=scenes.indexOf(next))
              throw Error('Story continuity broken: '+first+' -> '+next);
          if(!audit.scenes.length||audit.scenes.some(s=>!s.passed))
            throw Error('Unacceptable phone reading duration');
          for(const slug of ['pawsibly-innocent','tiny-town','elsewhere','flip-dash',
            'parcel-panic','pocket-aquarium']){
            const current=m.trailers.find(t=>t.slug===slug);
            const old=previous.trailers.find(t=>t.slug===slug);
            if(!current||!old||current.video!==old.video||current.poster!==old.poster||
              !current.retainedFrom)
              throw Error('Unrequested trailer was replaced: '+slug);
          }
          for(const t of m.trailers)
            if(!fs.existsSync('public'+t.video)||!fs.existsSync('public'+t.poster))
              throw Error('Unrendered media in seven-game review: '+t.slug);
          console.log('V10 real quarrel, reconciliation, one new duo cinematic and all media verified');
          NODE
      - name: Commit owner-review assets only; never post to social media
        shell: bash
        run: |
          set -euo pipefail
          git add public/promo/cat-bond/trailer-v10-20261121.mp4
          git add public/promo/cat-bond/trailer-v10-20261121.jpg
          git add public/promo/cat-bond/v10-review-*.jpg
          git add public/promo/cat-bond/v10-quarrel-proof.png
          git add public/promo/cat-bond/v10-duo-actual-render-proof.png
          git add public/promo/cat-bond/cover-portrait.png
          git add public/promo/cat-bond/ssr-showcase-proof.png
          git add public/promo/v10-review.json public/promo/readability-audit-v10.json
          git diff --cached --quiet && exit 0
          git config user.name morrowwish-promo-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): V10 new duo cinematic and cat disagreement, unapproved'
          git pull --rebase origin main
          git push origin HEAD:main

name: Cat Bond Storybook and Sunlit Garden Trailer V10 - REVIEW ONLY
# Rerecord from the latest game UI; 9:16, under one minute, no social publishing.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-bond-trailer-v10.yml'
      - 'public/cat-bond/index.html'
      - 'public/cat-bond/css/style.css'
      - 'public/cat-bond/js/ui.js'
      - 'public/cat-bond/js/duo-premium.js'
      - 'public/cat-bond/js/duo-bond.js'
      - 'public/cat-bond/js/worldmap.js'
      - 'public/game-fullscreen.js'
      - 'scripts/capture-trailers-v10.mjs'
      - 'scripts/render-trailers-v10.mjs'
      - 'scripts/check-cat-bond-original-art.mjs'
      - 'scripts/check-cat-bond-map-return.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-cat-bond-v10-review
  cancel-in-progress: false
jobs:
  capture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      MW_PROMO_ONLY: cat-bond
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install browser and ffmpeg
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Fetch licensed trailer music
        run: |
          bash scripts/fetch-cat-music.sh
          MW_PROMO_ONLY=cat-bond node scripts/fetch-promo-audio.mjs
      - name: Syntax-check the independent V10 capture and edit
        run: |
          node --check scripts/capture-trailers-v10.mjs
          node --check scripts/render-trailers-v10.mjs
          node --check scripts/check-cat-bond-original-art.mjs
          node scripts/check-cat-bond-original-art.mjs --source-only
          node --check public/cat-bond/js/ui.js
          node --check public/cat-bond/js/worldmap.js
          node --check public/game-fullscreen.js
          node scripts/check-cat-bond-map-return.mjs
      - name: Record full map navigation and current Cat Bond in real mobile Chromium
        # The map shot must show top-left courtyard and the new header menu.
        run: node scripts/capture-trailers-v10.mjs
      - name: Render only the updated Cat Bond review video
        run: node scripts/render-trailers-v10.mjs
      - name: Independent scene, music, duration and safety gate
        shell: bash
        run: |
          set -euo pipefail
          mp4=public/promo/cat-bond/trailer-v13-20261122.mp4
          poster=public/promo/cat-bond/trailer-v13-20261122.jpg
          test -s "$mp4" && test -s "$poster"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$mp4")" = "1080x1920"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$mp4")" = "audio"
          for i in 1 2 3; do test -s "public/promo/cat-bond/v13-review-$i.jpg"; done
          test -s public/promo/cat-bond/v10-quarrel-proof.png
          test -s public/promo/cat-bond/v10-map-navigation-proof.png
          test -s public/promo/cat-bond/v13-duo-original-art-proof.png
          test -s public/promo/cat-bond/v10-rare-native-hud-proof.png
          test -s public/promo/cat-bond/ssr-showcase-proof.png
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./public/promo/v13-review.json');
          const audit=require('./public/promo/readability-audit-v13.json');
          const previous=require('./public/promo/v12-review.json');
          if(m.version!=='V13'||m.trailers.length!==7||m.socialAutopublish!==false||
             m.trailers.some(t=>t.approved||t.published||t.paused))
            throw Error('V13 must remain owner-review only');
          const bond=m.trailers.find(t=>t.slug==='cat-bond');
          if(!bond||!bond.video.includes('trailer-v13')||bond.retainedFrom)
            throw Error('No fresh Cat Bond V13 recording');
          if(bond.duration<55||bond.duration>=60)
            throw Error('Short-form cut must be 55–60 seconds');
          if(!bond.shots.some(x=>x.scene==='duo-quarrel'&&x.seconds>=6))
            throw Error('Readable two-cat story below six seconds');
          const required=['cat-upgrade','duo-partners','duo-map-walk','duo-promise',
            'duo-quarrel','duo-reconcile','work-after','tease','map-explore','map-management',
            'auto-team-saved','rare-encounter','battle-hud','battle-skills','duo','rare-aftermath','rare-capture','ssr-showcase'];
          for(const scene of required)
            if(!bond.shots.some(s=>s.scene===scene&&s.seconds>=(scene==='rare-aftermath'?1.1:1.5)))
              throw Error('Missing verified real Cat Bond feature: '+scene);
          const scenes=bond.shots.map(s=>s.scene);
          const finishers=bond.shots.filter(s=>s.scene==='duo');
          if(finishers.length!==1||finishers[0].seconds<2.8||finishers[0].seconds>3.2||
              scenes.includes('ultimate'))
            throw Error('Finisher must be one short, complete sequence without a second cast');
          for(const [first,next] of [['duo-promise','duo-quarrel'],['duo-quarrel','duo-reconcile'],
              ['rare-encounter','battle-hud'],['battle-hud','battle-skills'],
              ['battle-skills','duo'],['duo','rare-aftermath'],['rare-aftermath','rare-capture']])
            if(scenes.indexOf(first)===-1||scenes.indexOf(first)>=scenes.indexOf(next))
              throw Error('Story continuity broken: '+first+' -> '+next);
          if(!(scenes.indexOf('duo')+1===scenes.indexOf('rare-aftermath')&&
              scenes.indexOf('rare-aftermath')+1===scenes.indexOf('rare-capture')))
            throw Error('The unique duo finisher must resolve into the same battle rare capture');
          if(!audit.scenes.length||audit.scenes.some(s=>!s.passed))
            throw Error('Unacceptable phone reading duration');
          for(const slug of ['pawsibly-innocent','tiny-town','elsewhere','flip-dash',
            'parcel-panic','pocket-aquarium']){
            const current=m.trailers.find(t=>t.slug===slug);
            const old=previous.trailers.find(t=>t.slug===slug);
            if(!current||!old||current.video!==old.video||current.poster!==old.poster||
              !current.retainedFrom)
              throw Error('Unrequested trailer was replaced: '+slug);
          }
          for(const t of m.trailers)
            if(!fs.existsSync('public'+t.video)||!fs.existsSync('public'+t.poster))
              throw Error('Unrendered media in seven-game review: '+t.slug);
          console.log('V13 genuine original-painted duo, reconciliation, rare capture, all media verified');
          NODE
      - name: Verify independent V13 original-art trailer manifest
        run: node scripts/check-cat-bond-original-art.mjs
      - name: Commit owner-review assets only; never post to social media
        shell: bash
        run: |
          set -euo pipefail
          git add public/promo/cat-bond/trailer-v13-20261122.mp4
          git add public/promo/cat-bond/trailer-v13-20261122.jpg
          git add public/promo/cat-bond/v13-review-*.jpg
          git add public/promo/cat-bond/v10-quarrel-proof.png
          git add public/promo/cat-bond/v10-map-navigation-proof.png
          git add public/promo/cat-bond/v13-duo-original-art-proof.png
          git add public/promo/cat-bond/v10-rare-native-hud-proof.png
          git add public/promo/cat-bond/cover-portrait.png
          git add public/promo/cat-bond/ssr-showcase-proof.png
          git add public/promo/v13-review.json public/promo/readability-audit-v13.json
          git diff --cached --quiet && exit 0
          git config user.name morrowwish-promo-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): V13 verified original-painted duo, gameplay and single rare capture, unapproved'
          # Other gameplay and promotion workers update main concurrently.
          # A single pull-then-push can lose the race. Retry safely without force.
          for attempt in $(seq 1 20); do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during promo publish (attempt $attempt); retrying..."
            sleep 3
          done
          echo "::error::Cannot push owner-review assets after 20 safe retries"
          exit 1

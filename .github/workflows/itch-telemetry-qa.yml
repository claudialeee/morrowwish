name: Diagnose public itch.io iframe telemetry

on:
  push:
    paths:
      - scripts/verify-itch-telemetry.mjs
      - .github/workflows/itch-telemetry-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect real itch.io player frames and intercept telemetry without writing production events
        run: node scripts/verify-itch-telemetry.mjs

name: Parcel Panic Challenge Trailer - real gameplay, review only
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recut-parcel-challenge.mjs'
      - '.github/workflows/parcel-panic-challenge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mw-parcel-panic-challenge-review
  cancel-in-progress: true
jobs:
  genuine-parcel-recut:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install runtime, browser and video encoder
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Validate recut script syntax
        run: node --check scripts/recut-parcel-challenge.mjs
      - name: Re-record actual Parcel Panic, edit from real gameplay, verify 7-game manifest
        run: node scripts/recut-parcel-challenge.mjs
      - name: Verify licensed audio, original game, cliffhanger, shift and all review assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/promo/parcel-panic/trailer-challenge-20261122.mp4
          test -s public/promo/parcel-panic/trailer-challenge-20261122.jpg
          test -s public/promo/parcel-panic/challenge-one-life-proof.png
          test -s public/promo/parcel-panic/challenge-shift-clear-proof.png
          test -s public/promo/parcel-panic/challenge-proof.json
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x public/promo/parcel-panic/trailer-challenge-20261122.mp4)" = "1080x1920"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 public/promo/parcel-panic/trailer-challenge-20261122.mp4)" = "audio"
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),root='public/promo';
          const f=fs.readdirSync(root).filter(n=>/^v\d+-review\.json$/.test(n)).sort((a,b)=>parseInt(b.slice(1))-parseInt(a.slice(1)))[0];
          const m=JSON.parse(fs.readFileSync(path.join(root,f)));
          const t=m.trailers.find(x=>x.slug==='parcel-panic');
          const p=JSON.parse(fs.readFileSync(root+'/parcel-panic/challenge-proof.json'));
          if(m.trailers.length!==7||m.socialAutopublish!==false||m.trailers.some(x=>x.approved||x.published))
            throw Error('Owner-review gate is not safe');
          if(t?.video!=='/promo/parcel-panic/trailer-challenge-20261122.mp4'||t.duration<19||t.duration>26)
            throw Error('Fresh Parcel Panic review not present');
          const labels=t.shots.map(x=>x.scene);
          for(const scene of ['opening','express','speed-up','one-life','clutch','shift-clear'])
            if(!labels.includes(scene))throw Error('Missing real gameplay scene: '+scene);
          if(p.proof.final.delivered!==24||p.proof.final.stats.shifts!==3||
             p.proof.final.stats.express<3||p.proof.final.life!==2||!p.proof.closeCall)
            throw Error('Missing authentic gameplay achievements');
          for(const entry of m.trailers)
            for(const asset of [entry.video,entry.poster])
              if(!fs.existsSync('public'+asset))throw Error('Missing media '+asset);
          console.log('Verified one fresh real-gameplay trailer; six untouched; not published');
          NODE
      - name: Commit QA-only media, without publishing to social platforms
        shell: bash
        run: |
          set -euo pipefail
          git add public/promo/parcel-panic/trailer-challenge-20261122.mp4
          git add public/promo/parcel-panic/trailer-challenge-20261122.jpg
          git add public/promo/parcel-panic/challenge-review-*.jpg
          git add public/promo/parcel-panic/challenge-*-proof.png
          git add public/promo/parcel-panic/challenge-proof.json
          git add public/promo/v[0-9]*-review.json
          git add public/promo/readability-audit*.json
          git diff --cached --quiet && exit 0
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): real Parcel Panic express rush and one-life recovery, review only'
          for attempt in $(seq 1 15); do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

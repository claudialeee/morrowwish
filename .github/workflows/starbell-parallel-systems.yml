name: Starbell isolated parallel systems
on:
  push:
    branches: [review/starbell-qa-parallel-ae9f294]
    paths: ['.github/workflows/starbell-parallel-systems.yml']
permissions:
  contents: read
concurrency:
  group: starbell-parallel-systems-${{ github.ref }}
  cancel-in-progress: true
jobs:
  systems:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [combat, saves]
    env:
      CAT_BOND_EXPERIENCE: '1'
      SCOPE: ${{ matrix.scope }}
      CAT_BOND_QA_OUTPUT: artifacts/starbell-parallel/saves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Execute independently scoped system regression
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-parallel-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          case "$SCOPE" in
            skills) node scripts/cat-bond-all-skills-visual-smoke.mjs ;;
            combat) node scripts/cat-bond-combat-skills-visual-smoke.mjs ;;
            progression) node scripts/cat-bond-starbell-progression-probe.mjs ;;
            saves) node scripts/cat-bond-title-save-browser-qa.mjs ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-parallel-${{ matrix.scope }}
          path: |
            artifacts/starbell-parallel
            /tmp/cat-bond-all-skills-*.png
            /tmp/cat-bond-skill-*.png
            /tmp/cb-parallel-server.log
          retention-days: 30

name: Starbell player-first minigames
on:
  pull_request:
    branches: [review/starbell-names-regional-bosses-20261127]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/test-starbell-player-first-browser.mjs'
      - 'scripts/test-cat-bond-canon22-spatial.mjs'
      - 'scripts/test-cat-bond-canon22-glide.mjs'
      - '.github/workflows/starbell-player-first-minigames.yml'
permissions:
  contents: read
concurrency:
  group: starbell-player-first-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    if: github.head_ref == 'fix/starbell-minigame-player-first-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [wide, portrait]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic regressions
        run: |
          node scripts/test-cat-bond-canon22-spatial.mjs
          node scripts/test-cat-bond-canon22-glide.mjs
          node --check scripts/test-starbell-player-first-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - name: Real browser minigame interactions
        env:
          STARBELL_MINIGAME_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-minigames.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/test-starbell-player-first-browser.mjs

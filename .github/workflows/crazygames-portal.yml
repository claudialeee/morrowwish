name: Inspect authorized CrazyGames studio portal (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/crazygames-portal.mjs'
      - '.github/workflows/crazygames-portal.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser automation
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check studio session and available submission entrypoint
        env:
          CRAZYGAMES_STORAGE_STATE_B64: ${{ secrets.CRAZYGAMES_STORAGE_STATE_B64 }}
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
        run: node scripts/crazygames-portal.mjs
      - name: Save sanitized portal capability report (no cookies or private HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazygames-portal-inspection
          path: .check/crazygames/portal-inspection.json
          if-no-files-found: warn
          retention-days: 7

name: Cat Bond Chat 2 — title/save QA (no deploy)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [rpg/integration, rpg/cat-bond-takeover]
permissions:
  contents: read
concurrency:
  group: cat-bond-chat2-title-save-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-and-build:
    if: github.head_ref == 'rpg/title-save-integration-v2' || github.head_ref == 'rpg/cat-bond-takeover' || github.head_ref == 'rpg/release-title'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dedicated save and cloud API regression
        run: node scripts/check-cat-bond-story-cloud.mjs
      - run: npm run check
        if: always()
      - run: npm run build:pages
        if: always()
  real-browser-title-save:
    if: github.head_ref == 'rpg/title-save-integration-v2' || github.head_ref == 'rpg/cat-bond-takeover' || github.head_ref == 'rpg/release-title'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Local-only game server and browser test
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cat-bond-chat2-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          node scripts/cat-bond-title-save-browser-qa.mjs
          node scripts/cat-bond-cloud-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-bond-chat2-title-save-screenshots
          path: cat-bond-title-save-qa/
          if-no-files-found: warn
          retention-days: 3

name: Cat Bond exact V10 source 21-shot landscape
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-bond-v10-landscape.yml'
      - 'scripts/capture-trailers-v10-landscape.mjs'
      - 'scripts/render-cat-bond-v10-landscape.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-catbond-v10-landscape
  cancel-in-progress: false
jobs:
  capture-render:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      MW_PROMO_ONLY: cat-bond
      MW_V7_BROLL_DIR: /tmp/morrowwish-v10-landscape-broll
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Browser and encoder
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Install owned Cat Bond music
        run: |
          bash scripts/fetch-cat-music.sh
          MW_PROMO_ONLY=cat-bond node scripts/fetch-promo-audio.mjs
      - name: Syntax check source-locked 16:9 scripts
        run: |
          node --check scripts/capture-trailers-v10-landscape.mjs
          node --check scripts/render-cat-bond-v10-landscape.mjs
      - name: Re-record all the original V10 gameplay actions in native 16:9
        run: node scripts/capture-trailers-v10-landscape.mjs
      - name: Assemble the complete 21-shot trailer
        run: node scripts/render-cat-bond-v10-landscape.mjs
      - name: Exact source review parity gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('public/promo/cat-bond/trailer-v10-landscape-20261122.json'));
          const b=JSON.parse(fs.readFileSync('public/promo/v12-review.json')).trailers.find(x=>x.slug==='cat-bond');
          if(a.sourceVideo!==b.video||a.shots.length!==21||a.shots.length!==b.shots.length)
            throw Error('The 21-shot source video was not recreated');
          for(let i=0;i<b.shots.length;i++){
            const x=a.shots[i],y=b.shots[i];
            if(x.scene!==(y.scene||'end-card')||x.caption!==y.caption||x.seconds!==y.seconds)
              throw Error('Original source shot mismatch at '+i);
          }
          if(a.shots.filter(s=>s.scene==='duo').length!==1||
            a.shots[17].scene!=='rare-aftermath'||a.shots[18].scene!=='rare-capture'||
            a.width!==1920||a.height!==1080||a.duration<59.3||a.duration>59.8)
              throw Error('Missing correct 3.1-second combo, rare capture, or 16:9 format');
          console.log('21 ORIGINAL SCENES, NATIVE 16:9, ONE DUO, RARE CAPTURE: QA PASS');
          NODE
      - name: Save new landscape video and quality frames
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-v10-native-landscape
          path: |
            public/promo/cat-bond/trailer-v10-landscape-20261122.mp4
            public/promo/cat-bond/trailer-v10-landscape-20261122.jpg
            public/promo/cat-bond/trailer-v10-landscape-20261122.json
            public/promo/cat-bond/v10-landscape-*-proof.jpg
          retention-days: 14
      - name: Commit only native landscape assets, preserve original portrait video
        run: |
          set -euo pipefail
          git add public/promo/cat-bond/trailer-v10-landscape-20261122.mp4
          git add public/promo/cat-bond/trailer-v10-landscape-20261122.jpg
          git add public/promo/cat-bond/trailer-v10-landscape-20261122.json
          git add public/promo/cat-bond/v10-landscape-*-proof.jpg
          git diff --cached --quiet && exit 0
          git config user.name morrowwish-promo-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'media(cat-bond): native 16:9 copy of original V10 21-shot trailer'
          # The recording temporarily changes existing QA stills and covers, which
          # must never be committed, and must not block safe git pull --rebase.
          git restore --worktree .
          for attempt in $(seq 1 20); do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

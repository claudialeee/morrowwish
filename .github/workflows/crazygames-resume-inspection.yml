name: Resume existing CrazyGames QA preview, inspect Continue navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/crazygames-resume-inspection.mjs'
      - '.github/workflows/crazygames-resume-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crazygames-resume-qa-inspection
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci
          npm install --no-save --no-package-lock playwright
      - name: Inspect the existing Pawsibly Innocent QA Continue button
        env:
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
        run: node scripts/crazygames-resume-inspection.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazygames-resume-inspection
          path: .check/crazygames/resume-inspection.json
          retention-days: 7

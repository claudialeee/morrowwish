name: Starbell portrait engineering acceptance
on:
  push:
    branches: [review/starbell-mobile-portrait]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/cat-bond-layout-acceptance.mjs'
      - '.github/workflows/starbell-mobile-portrait.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starbell-portrait-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CAT_BOND_SMOKE_ORIGIN: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/starbell-browser-setup
      - name: Syntax gate
        run: |
          node --check public/cat-bond/js/resonance/world-runtime.mjs
          node --check scripts/cat-bond-layout-acceptance.mjs
      - name: Real browser layout and touch regression
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-portrait-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-layout-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-portrait-layout
          path: |
            artifacts/cat-bond-layout/
            /tmp/starbell-portrait-server.log
          retention-days: 14

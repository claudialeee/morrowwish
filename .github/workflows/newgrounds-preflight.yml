name: Newgrounds candidate builds and release queue

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'promotion/newgrounds-review.json'
      - 'scripts/newgrounds-preflight.mjs'
      - '.github/workflows/newgrounds-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: morrowwish-newgrounds-candidates
  cancel-in-progress: true

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Morrow Wish source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real HTML5 game candidate ZIP files
        run: |
          node --check scripts/newgrounds-preflight.mjs
          node scripts/newgrounds-preflight.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('release-kit/newgrounds/queue.json','utf8'));
          if (!q.games.length || q.games.some(x=>x.status!=='candidate-not-submitted')) process.exit(1);
          console.log('Candidate builds: '+q.games.map(g=>g.slug).join(', '));
          console.log('WARNING: AI-generated games and AI-generated thumbnails are not allowed by Newgrounds.');
          NODE
      - name: Store Newgrounds ZIP candidates and compliance queue
        uses: actions/upload-artifact@v4
        with:
          name: newgrounds-candidates
          path: release-kit/newgrounds/
          retention-days: 30
      - name: Open private review item for genuinely new launches only
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {execFileSync}=require('node:child_process');
            let before=context.payload.before;
            if(!/^[0-9a-f]{40}$/.test(before||'')||/^0{40}$/.test(before))return;
            let previous;
            try{previous=execFileSync('git',['show',before+':public/index.html'],{encoding:'utf8'});}
            catch(e){core.warning('Previous homepage not available; skipping launch issues.');return;}
            const current=fs.readFileSync('public/index.html','utf8');
            const extract=(html)=>new Set([...html.matchAll(/<a\b[^>]*\bdata-id="([a-z0-9-]+)"[^>]*>/gi)]
              .filter(m=>m[0].includes('href="/'+m[1]+'/"')).map(m=>m[1]));
            const old=extract(previous),now=extract(current);
            for(const slug of now){
              if(old.has(slug))continue;
              const marker='mw-newgrounds-review:'+slug;
              const found=await github.rest.search.issuesAndPullRequests({q:'repo:'+context.repo.owner+'/'+context.repo.repo+' is:issue in:body "'+marker+'"',per_page:10});
              if(found.data.total_count)continue;
              await github.rest.issues.create({...context.repo,title:'Newgrounds eligibility review: '+slug,
                body:'<!-- '+marker+' -->\nNew Morrow Wish playable launch. GitHub Actions produced a Newgrounds HTML5 candidate ZIP in the **newgrounds-candidates** artifact.\n\n**Not submitted or approved.** Verify the game is human-led (not generated from an AI prompt), artwork/thumbnail is not AI-generated, asset rights are cleared, AI involvement is disclosed, third-party tracking/privacy is reviewed, and the ZIP runs through the entire play loop on Newgrounds. Maximum 2 submissions per day.\n\nPortal: https://www.newgrounds.com/projects/games/new\nPolicy: https://www.newgrounds.com/wiki/help-information/terms-of-use/game-guidelines\nRecord actual post ID and URL in promotion/ledger.json only after verification.'});
              core.info('Queued Newgrounds release review for '+slug);
            }

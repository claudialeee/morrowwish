name: Audit Morrow Wish acquisition attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing Cloudflare CLI
        run: npm ci
      - name: Read anonymous aggregate game funnel from production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing Cloudflare token; no metrics were fetched."
            exit 1
          fi
          cat > /tmp/morrow-acquisition-query.sql <<'SQL'
          SELECT
            CASE
              WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('youtube','yt','youtu.be')
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%youtube.com%'
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%youtu.be%'
                THEN 'youtube'
              WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('tiktok','tik_tok')
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%tiktok.com%'
                THEN 'tiktok'
              WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('instagram','ig')
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%instagram.com%'
                THEN 'instagram'
              WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('bluesky','bsky')
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%bsky.app%'
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%bsky.social%'
                THEN 'bluesky'
              WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('itch','itch.io')
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%itch.io%'
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%itch.zone%'
                THEN 'itch'
              WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('google','bing','search')
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%google.%'
                OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%bing.com%'
                THEN 'search'
              WHEN json_extract(payload,'$.source')='external' THEN 'other_external'
              ELSE 'direct_or_unattributed'
            END AS channel,
            CASE WHEN game='hub' THEN 'homepage' ELSE 'game' END AS destination,
            SUM(CASE WHEN kind='visit' THEN 1 ELSE 0 END) AS pageviews,
            SUM(CASE WHEN kind='session' THEN CAST(coalesce(json_extract(payload,'$.starts'),0) AS INTEGER) ELSE 0 END) AS starts,
            SUM(CASE WHEN kind='session' THEN CAST(coalesce(json_extract(payload,'$.ends'),0) AS INTEGER) ELSE 0 END) AS completed
          FROM events
          WHERE category='arcade' AND day>=date('now','-14 days')
            AND kind IN ('visit','session')
          GROUP BY channel,destination
          ORDER BY channel,destination;
          SQL
          npx wrangler d1 execute morrowwish-analytics --remote --command "$(cat /tmp/morrow-acquisition-query.sql)" --json > /tmp/morrow-acquisition-summary.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parsed=JSON.parse(fs.readFileSync('/tmp/morrow-acquisition-summary.json','utf8'));
          const rows=(Array.isArray(parsed)?parsed.flatMap(x=>x.results||[]):parsed.results||[]);
          if(!Array.isArray(rows))throw new Error('Unexpected D1 query result');
          const safe=rows.map(x=>({
            channel:String(x.channel),destination:String(x.destination),
            pageviews:Number(x.pageviews)||0,
            starts:Number(x.starts)||0,completed:Number(x.completed)||0
          }));
          console.log('MORROW_ACQUISITION_AGGREGATES_14_DAYS_BEGIN');
          console.log(JSON.stringify(safe));
          console.log('MORROW_ACQUISITION_AGGREGATES_14_DAYS_END');
          const total=safe.reduce((a,r)=>{
            if(r.destination==='homepage')a.homepageViews+=r.pageviews;
            else {a.gameViews+=r.pageviews;a.gameStarts+=r.starts;a.completedRuns+=r.completed;}
            return a
          },{homepageViews:0,gameViews:0,gameStarts:0,completedRuns:0});
          console.log('MORROW_ACQUISITION_TOTALS_14_DAYS '+JSON.stringify(total));
          NODE

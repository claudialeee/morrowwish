name: Audit Morrow Wish acquisition attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read anonymous aggregate game funnel from production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Cloudflare API token not configured"; exit 1; fi
          node --input-type=module <<'NODE'
          const sql="SELECT\n  CASE\n    WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('youtube','yt','youtu.be')\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%youtube.com%'\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%youtu.be%'\n      THEN 'youtube'\n    WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('tiktok','tik_tok')\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%tiktok.com%'\n      THEN 'tiktok'\n    WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('instagram','ig')\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%instagram.com%'\n      THEN 'instagram'\n    WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('bluesky','bsky')\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%bsky.app%'\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%bsky.social%'\n      THEN 'bluesky'\n    WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('itch','itch.io')\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%itch.io%'\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%itch.zone%'\n      THEN 'itch'\n    WHEN lower(coalesce(json_extract(payload,'$.utmSource'),'')) IN ('google','bing','search')\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%google.%'\n      OR lower(coalesce(json_extract(payload,'$.referrer'),'')) LIKE '%bing.com%'\n      THEN 'search'\n    WHEN json_extract(payload,'$.source')='external' THEN 'other_external'\n    ELSE 'direct_or_unattributed'\n  END AS channel,\n  CASE WHEN game='hub' THEN 'homepage' ELSE 'game' END AS destination,\n  SUM(CASE WHEN kind='visit' THEN 1 ELSE 0 END) AS pageviews,\n  SUM(CASE WHEN kind='session' THEN CAST(coalesce(json_extract(payload,'$.starts'),0) AS INTEGER) ELSE 0 END) AS starts,\n  SUM(CASE WHEN kind='session' THEN CAST(coalesce(json_extract(payload,'$.ends'),0) AS INTEGER) ELSE 0 END) AS completed\nFROM events\nWHERE category='arcade' AND day>=date('now','-14 days')\n  AND kind IN ('visit','session')\nGROUP BY channel,destination\nORDER BY channel,destination;";
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/fbd62f69-1811-4538-a17f-ecc5be8ad7cc/query',{
           method:'POST',headers:{'Authorization':'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql})
          });
          const payload=await response.json();
          if(!response.ok||!payload.success){const details=(payload.errors||[]).map(e=>String(e.message||e.code||'unknown')).join('; ');throw Error('D1 aggregate query failed: HTTP '+response.status+' '+details);}
          const results=Array.isArray(payload.result)?payload.result.flatMap(x=>x.results||[]):payload.result?.results||[];
          const safe=results.map(x=>({channel:String(x.channel),destination:String(x.destination),pageviews:Number(x.pageviews)||0,starts:Number(x.starts)||0,completed:Number(x.completed)||0}));
          console.log('MORROW_ACQUISITION_AGGREGATES_14_DAYS_BEGIN');
          console.log(JSON.stringify(safe));
          console.log('MORROW_ACQUISITION_AGGREGATES_14_DAYS_END');
          const total=safe.reduce((a,r)=>{if(r.destination==='homepage')a.homepageViews+=r.pageviews;else{a.gameViews+=r.pageviews;a.gameStarts+=r.starts;a.completedRuns+=r.completed;}return a;},{homepageViews:0,gameViews:0,gameStarts:0,completedRuns:0});
          console.log('MORROW_ACQUISITION_TOTALS_14_DAYS '+JSON.stringify(total));
          NODE

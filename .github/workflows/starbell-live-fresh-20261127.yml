name: Starbell live fresh-slot continuity (read-only QA)
on:
  push:
    branches: [qa/starbell-live-fresh-20261127]
    paths: ['scripts/test-starbell-fresh-shared.mjs']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        profile: [wide, portrait]
    env:
      SOURCE_SHA: e8a7054cc95e9ee41ee9d6a877ff6cb3b758f449
      STARBELL_WORK_PROFILE: ${{ matrix.profile }}
      STARBELL_MODE: ${{ startsWith(github.event.head_commit.message, 'QA cinema audit:') && 'cinema-audit' || 'live' }}
      CAT_BOND_SMOKE_ORIGIN: ${{ matrix.profile == 'portrait' && 'https://starbell-portrait-preview.morrowwish.pages.dev' || 'https://cat-bond-preview.morrowwish.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8a7054cc95e9ee41ee9d6a877ff6cb3b758f449
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live deployment SHA
        run: |
          curl -fsS "$CAT_BOND_SMOKE_ORIGIN/preview-version.json?qa=live-fresh" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const v=JSON.parse(s);if(v.sha!==process.env.SOURCE_SHA)throw Error("Live SHA changed: "+v.sha);console.log(JSON.stringify(v))})'
      - name: Restore latest earned checkpoint for same build and device
        if: env.STARBELL_MODE != 'cinema-audit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p resume
          artifact="starbell-earned-$SOURCE_SHA-$STARBELL_WORK_PROFILE"
          for run in $(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$GITHUB_REF_NAME" -f status=completed -f per_page=30 --jq '.workflow_runs[] | select(.name == "Starbell live fresh-slot continuity (read-only QA)") | .id'); do
            if gh run download "$run" -n "$artifact" -D resume; then
              test -s resume/checkpoint.json
              echo "Resume artifact from run $run"
              break
            fi
          done
      - name: Install isolated browser
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - name: Checkout shared QA driver without changing pinned runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa-driver
          sparse-checkout: scripts/test-starbell-fresh-shared.mjs
          sparse-checkout-cone-mode: false
      - name: Play actual live build from earned slot or fresh slot
        run: |
          cp qa-driver/scripts/test-starbell-fresh-shared.mjs scripts/test-starbell-fresh-shared.mjs
          node --check scripts/test-starbell-fresh-shared.mjs
          node scripts/test-starbell-fresh-shared.mjs
      - uses: actions/upload-artifact@v4
        if: always() && env.STARBELL_MODE != 'cinema-audit'
        with:
          name: starbell-earned-${{ env.SOURCE_SHA }}-${{ matrix.profile }}
          path: artifacts/earned/checkpoint.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-${{ env.STARBELL_MODE }}-fresh-${{ matrix.profile }}
          path: artifacts/live-fresh/
          if-no-files-found: warn
          retention-days: 3

name: Render Seven Cinematic V5 Game Trailers — REVIEW ONLY
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-trailer-broll-v4.mjs'
      - 'scripts/render-cinematic-trailers-v4.mjs'
      - '.github/workflows/cinematic-trailers-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-v5-cinematic-review-only
  cancel-in-progress: false
jobs:
  render-real-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install gameplay capture and video tools
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Validate seven independently licensed soundtracks
        run: |
          bash scripts/fetch-cat-music.sh
          node scripts/fetch-promo-audio.mjs
          node scripts/test-promo-music.mjs
      - name: Capture fresh gameplay from four real main games
        run: node scripts/capture-trailer-broll-v4.mjs
      - name: Render 4 longer trailers and 3 short challenge ads
        run: node scripts/render-cinematic-trailers-v4.mjs
      - name: Strict rendering checks (no social upload)
        run: |
          set -euo pipefail
          for slug in pawsibly-innocent cat-bond tiny-town elsewhere flip-dash parcel-panic pocket-aquarium; do
            mp4="public/promo/$slug/trailer-v5-20261121.mp4"
            jpg="public/promo/$slug/trailer-v5-20261121.jpg"
            test -s "$mp4"; test -s "$jpg"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$mp4")" = "1080x1920"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$mp4")" = "audio"
            for i in 1 2 3; do test -s "public/promo/$slug/v5-review-$i.jpg"; done
            echo "$slug $(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$mp4") seconds"
          done
          test -s public/promo/v5-review.json
      - name: Save unapproved previews for owner review; NEVER schedule on social media
        run: |
          set -euo pipefail
          for slug in pawsibly-innocent cat-bond tiny-town elsewhere flip-dash parcel-panic pocket-aquarium; do
            git add "public/promo/$slug/trailer-v5-20261121.mp4" "public/promo/$slug/trailer-v5-20261121.jpg"
            git add "public/promo/$slug/v5-review-"*.jpg
          done
          git add public/promo/cat-bond/cover-portrait.png public/promo/v5-review.json public/promo/review-v5/index.html
          git diff --cached --quiet && exit 0
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): 7 cinematic V5 video previews with no social publishing or approval'
          git pull --rebase origin main
          git push origin HEAD:main

name: Fill Cat Bond CrazyGames draft (never submit for review)
# Regenerate from live 63-original Cat Bond, replace the existing draft ONLY.
# Never reuse an old ZIP or submit for approval.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crazygames-cat-bond-fill-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cat-bond-crazygames-write-draft
  cancel-in-progress: true
jobs:
  fill-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install studio browser driver
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright sharp@0.34.5
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Validate new media generation code
        run: |
          node --check scripts/record-cat-bond-crazygames-previews.mjs
          node --check scripts/crazygames-cat-bond-cover-from-gameplay.mjs
          node --check scripts/prepare-cat-bond-crazygames-media.mjs
          node --check scripts/crazygames-cat-bond-save-draft.mjs
          node scripts/check-cat-bond-original-art.mjs --source-only
          node scripts/check-cat-bond-host.mjs
          node scripts/check-cat-bond-premium-21x3.mjs
      - name: QA portal mouse/touch navigation, English and responsive iframe
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/catbond-qa-server.log 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          node scripts/cat-bond-crazygames-real-input.mjs
      - name: Verify current deployed iframe is really on approved original-63 art
        run: |
          set -eu
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 12 "https://morrowwish.vercel.app/cat-bond/js/duo-bond.js?fresh=$i" | grep -Fq "this.duoCinematic.originalArt=true;" &&
               curl -fsSL --max-time 12 "https://morrowwish.vercel.app/cat-bond/js/battle.js?fresh=$i" | grep -Fq "originalArt:true"; then
              echo "Verified current live iframe approved 63-original renderer."
              exit 0
            fi
            echo "Waiting for live iframe release $i/24"
            sleep 15
          done
          echo "Live game does not yet match canonical originals: block portal upload." >&2
          exit 1
      - name: Record actual original-63 duo, create NEW covers and silent previews
        run: |
          node scripts/record-cat-bond-crazygames-previews.mjs
          node scripts/crazygames-cat-bond-cover-from-gameplay.mjs
          node scripts/prepare-cat-bond-crazygames-media.mjs
      - name: Check reused files before portal upload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const file of ['cover-landscape.png','cover-portrait.png','cover-square.png','real-gameplay-landscape.mp4','real-gameplay-portrait.mp4']){
            const p='public/promo/cat-bond/'+file;
            if(!fs.existsSync(p)||fs.statSync(p).size<1000)throw Error('Missing media: '+p);
          }
          console.log('Five NEW verified 63-original Cat Bond files prepared for portal replacement.');
          NODE
      - name: Login, create or resume Cat Bond, save draft only — NEVER submit
        env:
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
          CRAZYGAMES_TARGET_SLUGS: cat-bond
        run: node scripts/crazygames-cat-bond-save-draft.mjs
      - name: Confirm actual portal save and persist verifiable draft receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence=JSON.parse(fs.readFileSync('.check/crazygames/cat-bond-draft-fill.json','utf8'));
          const r=evidence.results?.[0];
          const want=['cover-landscape.png','cover-portrait.png','cover-square.png',
            'real-gameplay-landscape.mp4','real-gameplay-portrait.mp4'];
          if(r?.status!=='saved-final-step-unsubmitted'||r.verifiedDraftVisible!==true||
             r.platformDraftId!=='cda65c21-75f7-4ce5-b717-62b425097981'||
             r.reviewSubmitted!==false||r.finalSubmitClicked!==false||
             r.artProvenance?.originalArt!==true||r.artProvenance?.originalSceneCount!==63||
             want.some(x=>!r.uploaded?.includes(x)))
            throw Error('Draft media replacement NOT independently confirmed: '+JSON.stringify({
              status:r?.status,id:r?.platformDraftId,uploaded:r?.uploaded,
              verified:r?.verifiedDraftVisible,error:r?.error}));
          const path='promotion/crazygames-cat-bond-submission-draft.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.portalSavedAt=r.savedAt;
          data.mediaReplacedAt=r.savedAt;
          data.mediaArtSource='63-original-painted-storyboards';
          data.mediaArtifactSource='fresh current-game native landscape + portrait recordings';
          data.rightsAndQA.visualAssets='Five newly recorded original-63 assets uploaded to the existing portal draft; human final visual QA not yet separately recorded.';
          data.submissionForReview=false;
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log('CONFIRMED existing CrazyGames draft updated with all 5 original-63 assets at',r.savedAt);
          NODE
          git config user.name morrowwish-crazygames-qa-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add promotion/crazygames-cat-bond-submission-draft.json
          if ! git diff --cached --quiet; then
            git commit -m "ops(crazygames): verify original-63 media replaced in existing Cat Bond draft"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep draft evidence and failure diagnostics, no publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-crazygames-saved-draft-receipt
          path: |
            .check/crazygames/cat-bond-draft-fill.json
            .check/crazygames/cat-bond-trim-portrait.json
            .check/crazygames/cat-bond-trim-landscape.json
            .check/crazygames/cat-bond-original-duo-portrait.png
            .check/crazygames/cat-bond-original-duo-landscape.png
            public/promo/cat-bond/cover-landscape.png
            public/promo/cat-bond/cover-portrait.png
            public/promo/cat-bond/cover-square.png
            public/promo/cat-bond/real-gameplay-landscape.mp4
            public/promo/cat-bond/real-gameplay-portrait.mp4
          if-no-files-found: warn
          retention-days: 14
      - name: Persist truthful draft-repair status, including failures
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='.check/crazygames/cat-bond-draft-fill.json';
          const rec=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')).results?.[0]:null;
          const status={
            checkedAt:new Date().toISOString(),
            workflowStatus:process.env.JOB_STATUS,
            portalDraftId:'cda65c21-75f7-4ce5-b717-62b425097981',
            portalScriptStatus:rec?.status||'not-run-or-blocked-before-portal',
            uploaded:rec?.uploaded||[],
            verifiedDraftVisible:rec?.verifiedDraftVisible===true,
            confirmedOriginal63:rec?.artProvenance?.originalArt===true&&rec?.artProvenance?.originalSceneCount===63,
            error:rec?.error||null,submittedForReview:false
          };
          fs.writeFileSync('promotion/crazygames-cat-bond-repair-status.json',JSON.stringify(status,null,2)+'\n');
          console.log('CRAZYGAMES_REPAIR_STATUS',JSON.stringify(status));
          NODE
          git config user.name morrowwish-crazygames-qa-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add promotion/crazygames-cat-bond-repair-status.json
          if ! git diff --cached --quiet; then
            git commit -m "ops(crazygames): record verified Cat Bond draft repair status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

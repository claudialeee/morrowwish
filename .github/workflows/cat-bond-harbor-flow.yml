name: Cat Bond Misttide Harbor playthrough

on:
  pull_request:
    branches: [main, rpg/integration, rpg/cat-bond-takeover]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/cat-bond-harbor-playthrough.mjs'
      - 'scripts/cat-bond-local-cloud-server.mjs'
      - '.github/workflows/cat-bond-harbor-flow.yml'

permissions:
  contents: read

jobs:
  harbor:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Cat Bond canonical world regression (independent of studio dashboard)
        run: node scripts/check-cat-bond-resonance-world.mjs
      - name: Play from a new slot on desktop and mobile
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/harbor-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null; then break; fi
            sleep 1
          done
          if [ "${{ github.head_ref }}" = "rpg/release-starfall" ]; then
            CAT_BOND_CHAPTER_QA=starfall node scripts/cat-bond-harbor-playthrough.mjs
          else
            node scripts/cat-bond-harbor-playthrough.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-bond-harbor-playthrough
          path: |
            artifacts/cat-bond-harbor/
            artifacts/cat-bond-starfall/
          if-no-files-found: warn
          retention-days: 7

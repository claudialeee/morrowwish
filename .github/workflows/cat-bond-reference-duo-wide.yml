name: Cat Bond exact current V10 duo wide composite QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-bond-reference-duo-wide.yml'
      - 'scripts/compose-cat-bond-reference-duo-wide.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catbond-reference-duo-wide
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install real-media composition dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg python3-pil
      - name: Rebuild entire horizontal reel with original precise V10 duo frames
        run: |
          python3 -m py_compile scripts/compose-cat-bond-reference-duo-wide.py
          python3 scripts/compose-cat-bond-reference-duo-wide.py
      - name: Confirm source exactness and finalized media
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.json').read_text())
          assert m['source']=='/promo/cat-bond/trailer-v10-20261121.mp4'
          assert m['originalDuoVideoFramesUsed'] and not m['originalDuoVideoRetimed']
          assert abs(m['sourceDuoStart']-44.7)<.001 and abs(m['sourceDuoEnd']-47.8)<.001
          assert m['width']==1920 and m['height']==1080 and abs(m['duration']-59.57)<.09
          assert len(m['proofImages'])==6
          print('EXACT ORIGINAL DUO ACTION FRAMES, WIDE NO BLACK SIDES, 21 SCENES, QA VERIFIED')
          PY
      - name: Save corrected full video and six source scene frames
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-current-v10-exact-duo-wide
          path: |
            public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.mp4
            public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.jpg
            public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.json
            public/promo/cat-bond/reference-duo-landscape-*.jpg
          retention-days: 14
      - name: Commit new source-exact video only, preserve all original clips and game
        run: |
          set -euo pipefail
          git add public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.mp4
          git add public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.jpg
          git add public/promo/cat-bond/trailer-v10-landscape-reference-duo-20261122.json
          git add public/promo/cat-bond/reference-duo-landscape-*.jpg
          git diff --cached --quiet && exit 0
          git config user.name morrowwish-promo-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'media(cat-bond): align exact V10 duo animation in 16:9 trailer'
          git restore --worktree .
          for n in $(seq 1 15); do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

name: Verify Pawsibly live player build

on:
  # Verify the public player-facing URLs only after the real Pages deployment.
  workflow_run:
    workflows: ['Deploy Morrow Wish to Cloudflare Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-pawsibly-live.yml']

permissions:
  contents: read

concurrency:
  group: verify-pawsibly-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-live-assets:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Pin Pawsibly to the actual independently published source
        shell: bash
        run: |
          set -euo pipefail
          source=$(curl -fsSL --retry 3 --max-time 20 "https://morrowwish.pages.dev/release-version.json?verify=$GITHUB_RUN_ID" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("gameShas",{}).get("pawsibly-innocent",d["sha"]))')
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$source"
          git restore --source="$source" --staged --worktree -- public/pawsibly-innocent
          echo "PAWSIBLY_SOURCE_SHA=$source" >> "$GITHUB_ENV"
      - name: Diagnose current public game asset revisions
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://morrowwish.pages.dev https://morrowwish.vercel.app; do
            echo "DIAGNOSTIC ORIGIN: ${origin}"
            for entry in "index.html|/pawsibly-innocent/|html" "game.js|/pawsibly-innocent/game.js|js" "single-screen.css|/pawsibly-innocent/single-screen.css|css"; do
              IFS='|' read -r name route ext <<< "$entry"
              source="public/pawsibly-innocent/${name}"
              live="/tmp/pawsibly-probe-${ext}"
              if curl -fsSL --max-time 15 -o "$live" "${origin}${route}?asset-diagnostic=${GITHUB_SHA}"; then
                echo "PROBE ${name}: source / live checksums:"
                sha256sum "$source" "$live"
                if cmp -s "$source" "$live"; then
                  echo "PROBE ${name}: MATCH"
                else
                  echo "PROBE ${name}: MISMATCH"
                  cmp -l "$source" "$live" | head -n 4 || true
                fi
                if [ "$ext" = html ]; then
                  grep -oE '/pawsibly-innocent/(game.js|single-screen.css)[?]v=[^"]+' "$live" | head -n 2 || true
                fi
              else
                echo "PROBE ${name}: FETCH FAILED"
              fi
            done
          done
      - name: Verify published HTML, game engine and CSS bytes on both domains
        shell: bash
        run: |
          set -euo pipefail
          test -s public/pawsibly-innocent/game.js
          test -s public/pawsibly-innocent/single-screen.css
          test -s public/pawsibly-innocent/index.html
          expected_js=$(grep -oE '/pawsibly-innocent/game.js[?]v=[^"]+' public/pawsibly-innocent/index.html | head -1)
          expected_css=$(grep -oE '/pawsibly-innocent/single-screen.css[?]v=[^"]+' public/pawsibly-innocent/index.html | head -1)
          test -n "$expected_js" && test -n "$expected_css"
          for origin in https://morrowwish.pages.dev https://morrowwish.vercel.app; do
            ready=0
            for attempt in $(seq 1 12); do
              query="verify=${GITHUB_SHA}&attempt=${attempt}"
              if curl -fsSL --max-time 18 -o /tmp/pawsibly-live.html "${origin}/pawsibly-innocent/?${query}" &&
                 curl -fsSL --max-time 18 -o /tmp/pawsibly-live-game.js "${origin}/pawsibly-innocent/game.js?${query}" &&
                 curl -fsSL --max-time 18 -o /tmp/pawsibly-live.css "${origin}/pawsibly-innocent/single-screen.css?${query}" &&
                 grep -Fq "$expected_js" /tmp/pawsibly-live.html &&
                 grep -Fq "$expected_css" /tmp/pawsibly-live.html &&
                 grep -Fq 'id="wait"' /tmp/pawsibly-live.html &&
                 grep -Fq 'id="heistStatus"' /tmp/pawsibly-live.html &&
                 grep -Fq 'id="roomNum"' /tmp/pawsibly-live.html &&
                 cmp -s public/pawsibly-innocent/game.js /tmp/pawsibly-live-game.js &&
                 cmp -s public/pawsibly-innocent/single-screen.css /tmp/pawsibly-live.css; then
                ready=1
                echo "VERIFIED Pawsibly HTML release markers and byte-exact game.js / CSS on ${origin} for deployed source ${PAWSIBLY_SOURCE_SHA}"
                break
              fi
              echo "Waiting for current published Pawsibly bytes at ${origin} (attempt ${attempt}/12)"
              sleep 5
            done
            if [ "${ready}" -ne 1 ]; then
              echo "::error::${origin} Pawsibly player asset bytes do not match the deployed source revision"
              exit 1
            fi
          done
          echo "Both official domains provide updated HTML controls and byte-exact tested Pawsibly JS and CSS."

name: Render Seven Cinematic V7 Game Trailers — REVIEW ONLY
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-trailers-v7.mjs'
      - 'scripts/render-trailers-v7.mjs'
      - '.github/workflows/cinematic-trailers-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-v7-cinematic-review-only
  cancel-in-progress: false
jobs:
  render-real-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    # This push selectively trims the Elsewhere promo. Other pushes keep the
    # normal all-six behavior; Cat Bond remains paused in either case.
    env:
      MW_PROMO_ONLY: ${{ contains(github.event.head_commit.message, '[only-elsewhere]') && 'elsewhere' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install gameplay capture and video tools
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Validate seven independently licensed soundtracks
        run: |
          bash scripts/fetch-cat-music.sh
          node scripts/fetch-promo-audio.mjs
          node scripts/test-promo-music.mjs
      - name: Verify trailer source syntax BEFORE expensive real-game capture
        run: |
          node --check scripts/capture-trailers-v7.mjs
          node --check scripts/render-trailers-v7.mjs
      - name: Verify all eight story worlds, coherent choices, and trailer evidence requirements
        run: node scripts/check-elsewhere-story.mjs
      - name: Capture six active promos; Cat Bond video production paused
        run: node scripts/capture-trailers-v7.mjs
      - name: Render six active review videos and retain existing Cat Bond trailer
        run: node scripts/render-trailers-v7.mjs
      - name: Strict V7 rendering and preview checks (no social upload)
        run: |
          set -euo pipefail
          for slug in pawsibly-innocent tiny-town elsewhere flip-dash parcel-panic pocket-aquarium; do
            mp4="public/promo/$slug/trailer-v7-20261121.mp4"
            jpg="public/promo/$slug/trailer-v7-20261121.jpg"
            test -s "$mp4"; test -s "$jpg"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$mp4")" = "1080x1920"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$mp4")" = "audio"
            for i in 1 2 3; do test -s "public/promo/$slug/v7-review-$i.jpg"; done
            echo "$slug $(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$mp4") seconds"
          done
          test -s public/promo/v7-review.json
          test -s public/promo/cat-bond/trailer-v7-20261121.mp4
          node -e "const m=require('./public/promo/v7-review.json');if(m.trailers.length!==7||m.trailers.filter(x=>x.slug==='cat-bond'&&x.paused).length!==1)process.exit(1);if(process.env.MW_PROMO_ONLY==='elsewhere'){const x=m.trailers.find(t=>t.slug==='elsewhere');if(!x||x.duration>=41)process.exit(1);console.log('Elsewhere shortened to',x.duration,'seconds')}"
          test -s public/promo/readability-audit.json
          test -s public/promo/pawsibly-innocent/narrow-escape-card-proof.png
          node -e "const a=require('./public/promo/readability-audit.json'),m=require('./public/promo/v7-review.json');const shots=m.trailers.find(x=>x.slug==='elsewhere')?.shots||[];if(!Array.isArray(a.scenes)||a.scenes.length<38||a.scenes.some(s=>!s.passed)||a.scenes.some(s=>s.game==='cat-bond')||!a.scenes.some(s=>s.game==='tiny-town'&&s.scene==='opening-three-choices'&&s.seconds>=6.8)||shots.filter(s=>s.scene?.startsWith('paris')).length!==3||!shots.some(s=>s.scene==='moon-ending'))process.exit(1);console.log('Reading QA:',a.scenes.length,'scenes checked; Paris limited to three scenes')"
      - name: Save unapproved previews for owner review; NEVER schedule on social media
        run: |
          set -euo pipefail
          for slug in pawsibly-innocent tiny-town elsewhere flip-dash parcel-panic pocket-aquarium; do
            git add "public/promo/$slug/trailer-v7-20261121.mp4" "public/promo/$slug/trailer-v7-20261121.jpg"
            git add "public/promo/$slug/v7-review-"*.jpg
          done
          git add public/promo/v7-review.json public/promo/readability-audit.json public/promo/pawsibly-innocent/narrow-escape-card-proof.png public/promo/review-v7/index.html
          git diff --cached --quiet && exit 0
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): refresh six review trailers; Cat Bond remains paused and unchanged'
          git pull --rebase origin main
          git push origin HEAD:main

name: Cat Bond canonical world — physical and visual QA
on:
  push:
    branches: [feat/cat-bond-last-resonance-world]
    paths:
      - 'public/cat-bond/js/resonance/**'
      - 'public/cat-bond/assets/resonance-world-v2/**'
      - 'public/cat-bond/css/resonance-canonical-world.css'
      - 'public/cat-bond/index.html'
      - 'scripts/check-cat-bond-resonance-world.mjs'
      - 'scripts/cat-bond-resonance-browser-qa.mjs'
      - '.github/workflows/cat-bond-resonance-module-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cat-bond-canonical-world-qa
  cancel-in-progress: true
jobs:
  world-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-cat-bond-resonance-world.mjs
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/catbond-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/cat-bond/ > /dev/null
      - name: Normal start plus isolated real map interactions on desktop and both mobile orientations
        run: node scripts/cat-bond-resonance-browser-qa.mjs
      - name: Save real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-world-browser-evidence
          path: artifacts/cat-bond-resonance/
          if-no-files-found: warn
          retention-days: 7

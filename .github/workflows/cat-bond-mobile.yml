name: Cat Bond mobile playable test
on:
  push:
    branches: [main]
    paths:
      - 'public/cat-bond/**'
      - 'public/game-fullscreen.js'
      - 'scripts/cat-bond-touch-smoke.mjs'
      - 'scripts/cat-bond-panel-scroll-smoke.mjs'
      - 'scripts/cat-bond-topbar-smoke.mjs'
      - 'scripts/cat-bond-adult-smoke.mjs'
      - 'scripts/cat-bond-ult-visual-smoke.mjs'
      - 'scripts/cat-bond-crazygames-smoke.mjs'
      - 'scripts/cat-bond-duo-smoke.mjs'
      - 'scripts/cat-bond-single-painting-smoke.mjs'
      - 'scripts/cat-bond-locked-duo-review.mjs'
      - 'scripts/cat-bond-lazy-memory-smoke.mjs'
      - 'scripts/cat-bond-yard-placement-smoke.mjs'
      - 'scripts/cat-bond-audio-smoke.mjs'
      - 'scripts/cat-bond-balance-smoke.mjs'
      - 'scripts/cat-bond-progression-smoke.mjs'
      - 'scripts/cat-bond-autofight-smoke.mjs'
      - 'public/studio-audio.js'
      - 'scripts/cat-bond-scale-smoke.mjs'
      - 'scripts/cat-bond-squad-smoke.mjs'
      - '.github/workflows/cat-bond-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cat-bond-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify real phone taps and Cat Bond play area
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/cat-bond-server.log 2>&1 &
          sleep 2
          # Gate the user's actual right-hand yard toolbar and removed dead tab FIRST.
          # A broken or offscreen menu must not be hidden by later art-load tests.
          node scripts/cat-bond-topbar-smoke.mjs
          # Real Chromium checks legacy illustrated cats on phone/desktop and
          # confirms no new growth/awakening controls are available.
          node scripts/cat-bond-adult-smoke.mjs
          # Gate the newly unlocked-only duo UI and the complete 21-motion
          # private QA first, so unrelated map browser failures cannot hide
          # regressions in the core cat-bond abilities.
          node scripts/cat-bond-ult-visual-smoke.mjs
          node scripts/cat-bond-duo-smoke.mjs
          node scripts/cat-bond-single-painting-smoke.mjs
          node scripts/cat-bond-locked-duo-review.mjs
          node scripts/cat-bond-lazy-memory-smoke.mjs
          node scripts/cat-bond-yard-placement-smoke.mjs
          node scripts/cat-bond-audio-smoke.mjs
          node scripts/cat-bond-balance-smoke.mjs
          node scripts/cat-bond-progression-smoke.mjs
          node scripts/cat-bond-autofight-smoke.mjs
          node scripts/cat-bond-squad-smoke.mjs
          node scripts/cat-bond-touch-smoke.mjs
          # Verify skill/duo selection never jumps a long 320/390px panel to the top.
          node scripts/cat-bond-panel-scroll-smoke.mjs
          node scripts/cat-bond-crazygames-smoke.mjs
          node scripts/cat-bond-scale-smoke.mjs

      - name: Save legacy art comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-32-adult-forms
          path: /tmp/cat-bond-adult-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save eight distinct in-battle ultimate VFX review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-eight-ult-vfx-review
          path: /tmp/cat-bond-ult-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save duo animation visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-duo-visual-qa
          path: /tmp/cat-bond-*-duo.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save unlocked duo-only preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-duo-preview
          path: /tmp/cat-bond-*-preview*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save mobile build positioning and combat button clearance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-mobile-control-clearance
          path: |
            /tmp/cat-bond-*-placement-preview.png
            /tmp/cat-bond-*-duo-clearance.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save map and battle visibility screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-cat-scale-qa
          path: /tmp/cat-bond-scale-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save prebattle party-selection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-squad-qa
          path: /tmp/cat-bond-squad-*.png
          if-no-files-found: ignore
          retention-days: 7

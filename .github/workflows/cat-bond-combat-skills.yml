name: Cat Bond seven combat skills visual QA

on:
  push:
    branches: [main]
    paths:
      - 'public/cat-bond/js/skills.js'
      - 'public/cat-bond/js/battle.js'
      - 'scripts/check-cat-bond.mjs'
      - 'scripts/cat-bond-combat-skills-visual-smoke.mjs'
      - '.github/workflows/cat-bond-combat-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check skill mechanics and saved loadouts
        run: node scripts/check-cat-bond.mjs
      - name: Render seven combat skills on real desktop and phone
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/cat-bond-visual-server.log 2>&1 &
          sleep 2
          node scripts/cat-bond-combat-skills-visual-smoke.mjs
      - name: Save fourteen real in-battle VFX review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-seven-skills-actual-gameplay
          path: /tmp/cat-bond-skill-*.png
          if-no-files-found: warn
          retention-days: 7

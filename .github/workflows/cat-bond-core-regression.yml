name: Cat Bond fast combat regression
on:
  push:
    branches: [main]
    paths:
      - 'public/cat-bond/js/**'
      - 'scripts/check-cat-bond.mjs'
      - 'scripts/check-cat-bond-ai.mjs'
      - 'scripts/check-cat-bond-invariants.mjs'
      - '.github/workflows/cat-bond-core-regression.yml'
  pull_request:
    branches: [rpg/cat-bond-takeover]
    paths:
      - 'public/cat-bond/js/**'
      - 'scripts/check-cat-bond*.mjs'
      - '.github/workflows/cat-bond-core-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cat-bond-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full headless game logic regression
        run: node scripts/check-cat-bond.mjs
      - name: Physical melee reach, ward expiry and bounded status invariants
        run: node scripts/check-cat-bond-invariants.mjs
      - name: Real 2D enemy AI and auto-combat regression
        run: node scripts/check-cat-bond-ai.mjs

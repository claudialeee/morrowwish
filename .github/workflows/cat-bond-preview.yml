name: Cat Bond isolated Cloudflare Pages preview
on:
  push:
    branches: [rpg/release-combined-next]
    paths:
      - 'public/cat-bond/**'
      - 'public/audio/**'
      - 'public/art/**'
      - 'public/icons/**'
      - 'public/*.js'
      - 'public/*.css'
      - 'package*.json'
      - '.github/workflows/cat-bond-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: cat-bond-isolated-preview
  cancel-in-progress: true
jobs:
  preview:
    # Preview only; never deploy main or touch production APIs.
    if: github.ref == 'refs/heads/rpg/release-combined-next'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact preview candidate (not formal release approval)
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin rpg/release-combined-next
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          printf '%s %s\n' rpg/release-combined-next "$SOURCE_SHA" > /tmp/cat-bond-preview-sources.txt
          test -s public/cat-bond/js/rpg-audio.js
          test -s public/cat-bond/js/resonance/resonance-book.mjs
          test -s public/cat-bond/css/rpg-visual-polish.css
          grep -Fq 'rpg-audio.js' public/cat-bond/index.html
          grep -Fq 'resonance-book.mjs' public/cat-bond/js/resonance/integration-entry.mjs
          grep -Fq 'rpg-visual-polish.css' public/cat-bond/index.html
          node --check public/cat-bond/js/main.js
      - name: Cancel superseded Cat Bond QA runs (same branch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin rpg/release-combined-next
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=rpg%2Frelease-combined-next&per_page=100" --jq '.workflow_runs[] | select(.status != "completed") | select(.event == "pull_request") | select(.name == "Cat Bond incremental development QA" or (.name | startswith("Full release QA "))) | [.id,.head_sha] | @tsv' > /tmp/obsolete-cat-bond-runs
          while read -r id oldsha; do
            [ "$oldsha" != "$SOURCE_SHA" ] || continue
            git merge-base --is-ancestor "$oldsha" "$SOURCE_SHA" || continue
            echo "Cancelling obsolete QA $id ($oldsha)"
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel"; then
              echo "::warning::Could not cancel obsolete run $id"
            fi
          done < /tmp/obsolete-cat-bond-runs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify player-first opening and named party logic
        run: |
          node scripts/test-cat-bond-player-first.mjs
          node scripts/test-cat-bond-story-party.mjs
          node scripts/test-cat-bond-garden-exploration.mjs
          node scripts/test-cat-bond-canon12-campaign.mjs
          node scripts/test-cat-bond-resonance.mjs
          node scripts/test-cat-bond-resonance-slot.mjs
          node scripts/check-cat-bond-resonance-world.mjs
      - name: Build isolated Cat Bond preview (no production Worker or D1)
        run: |
          set -eu
          mkdir -p /tmp/cat-bond-preview/site
          cp -a public/cat-bond /tmp/cat-bond-preview/site/
          for dir in audio art icons pawsibly-innocent; do cp -a "public/$dir" /tmp/cat-bond-preview/site/; done
          find public -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -exec cp {} /tmp/cat-bond-preview/site/ \;
          # RPG uses its own committed recordings. No mutable production audio imports.
          test -d /tmp/cat-bond-preview/site/cat-bond/assets/audio
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/cat-bond-preview/site';
          const file=root+'/cat-bond/index.html';
          let html=fs.readFileSync(file,'utf8');
          html=html.replace(/<script[^>]+src=["'][^"']*telemetry\.js[^"']*["'][^>]*><\/script>/gi,'');
          html=html.replace(/<\/head>/i,'<meta name="robots" content="noindex,nofollow"><script>window.ARCADE_COLLECTOR="/api/preview-disabled";window.arcadeMetric=()=>{};</script></head>');
          const sha=process.env.SOURCE_SHA;
          html=html.replace(/<body([^>]*)>/i,'<body$1><aside role="note" style="position:fixed;z-index:2147483647;bottom:3px;left:3px;pointer-events:none;background:#202332e8;color:white;font:10px system-ui;padding:3px 6px;border-radius:4px">PREVIEW 试玩 (not release-approved) · '+sha.slice(0,10)+' · 序章–终章 / Prologue–Finale · Local saves only</aside>');
          fs.writeFileSync(file,html);
          fs.writeFileSync(root+'/index.html','<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/cat-bond/"></head><body><a href="/cat-bond/">Cat Bond RPG Preview</a></body></html>');
          fs.writeFileSync(root+'/robots.txt','User-agent: *\nDisallow: /\n');
          fs.writeFileSync(root+'/_headers','/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n  Content-Security-Policy: connect-src \'self\'; form-action \'self\'\n');
          fs.writeFileSync(root+'/telemetry.js','window.arcadeMetric=()=>{};');
          fs.writeFileSync(root+'/_worker.js','export default {fetch(request,env){const u=new URL(request.url);if(u.pathname.startsWith("/api/")||u.pathname==="/api")return Response.json({error:"Preview: production APIs disabled; use local saves."},{status:403});return env.ASSETS.fetch(request)}};');
          fs.writeFileSync(root+'/preview-version.json',JSON.stringify({sha,qaTier:'preview-smoke',fullReleaseAccepted:false,scope:'Prologue through Finale',storage:'local-only',productionApis:false,sources:fs.readFileSync('/tmp/cat-bond-preview-sources.txt','utf8').trim().split('\n')}));
          NODE
      - name: Install pinned Chromium test runtime once
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Prepare reusable real-browser smoke
        run: |
          cat > .cat-bond-preview-smoke.mjs <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const origin=process.env.CAT_BOND_SMOKE_ORIGIN || 'https://cat-bond-preview.morrowwish.pages.dev';
            await Promise.all([{name:'desktop',viewport:{width:1280,height:800}},{name:'portrait',viewport:{width:390,height:844},hasTouch:true},{name:'landscape',viewport:{width:844,height:390},hasTouch:true}].map(async profile=>{
              const {name,...device}=profile;
              const prefix=(process.env.CAT_BOND_SMOKE_STAGE || 'live')+'-'+name;
              const context=await browser.newContext(device);
              try{
                const page=await context.newPage(),external=[],errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.route('**/*',route=>{
                  const url=route.request().url();
                  if(url.startsWith(origin+'/')||/^(data:|blob:)/.test(url))return route.continue();
                  external.push(url);return route.abort();
                });
                const query=process.env.CAT_BOND_SMOKE_STAGE==='local'?'?lang=en&rpgDev=1':'?lang=en';
                const response=await page.goto(origin+'/cat-bond/'+query,{waitUntil:'domcontentloaded'});
                if(!response?.ok())throw Error('Preview not reachable');
                await page.locator('#intro-continue').waitFor({state:'visible',timeout:30000});
                await page.waitForFunction(()=>window.CatBondCanonicalWorld&&window.CatBondTitlePrologue&&window.ResonanceBook&&window.CatBondChapterCinematics);
                await page.waitForFunction(()=>CatBondChapterCinematics.developmentReady()||CatBondChapterCinematics.starfallReleaseReady());
                if(!await page.evaluate(()=>window.ARCADE_COLLECTOR==='/api/preview-disabled'&&window.__CAT_BOND_INTEGRATION_ART__===false))throw Error('Preview isolation / art approval marker mismatch');
                await page.screenshot({path:'preview-'+prefix+'-title.png'});
                await page.locator('#intro-start').click();
                await page.locator('#intro-slot-list [data-slot="slot1"]').waitFor();
                if(await page.locator('#intro-slot-list [data-slot]').count()!==3)throw Error('Three save slots required');
                await page.screenshot({path:'preview-'+prefix+'-slots.png'});
                await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                await page.waitForFunction(()=>CatBondResonance.view().current?.id==='prologue:P-05');
                const intro=page.locator('#cb-player-first-intro');
                await intro.waitFor({state:'visible'});
                if(!/Star Bell.*memories/s.test(await intro.innerText()))throw Error('Missing spoiler-free world context');
                if(await page.locator('.cbcp-root:not([hidden])').count())throw Error('Retired opening still playing');
                await page.screenshot({path:'preview-'+prefix+'-opening.png'});
                await intro.getByRole('button',{name:'Start exploring',exact:true}).click();
                await page.waitForFunction(()=>State.S.cats.length===1&&State.S.cats[0].species==='jinjc'&&window.__game?.scene==='yard'&&!document.querySelector('#panel.open .cat-starter-card'));
                await page.waitForFunction(()=>State.S.cats.length===1&&State.listSaveSlots().find(s=>s.id==='slot1')?.exists);
                const uid=await page.evaluate(()=>State.S.cats[0].uid);
                const completed=await page.evaluate(()=>State.S.resonance.completed.slice(0,4).join(','));
                if(completed!=='prologue:P-01,prologue:P-02,prologue:P-03,prologue:P-04')throw Error('Opening presentation checkpoints missing');
                if(await page.evaluate(()=>CatBondResonance.view().muling!=='unmet'||Object.values(State.S.resonance.evidence).flat().some(op=>op.startsWith('cinematic:'))))throw Error('Opening grants unearned companion or old cinematic evidence');
                // Actual encounter input on all three deployed profiles; no state mutation or forced click.
                const guide=page.locator('.sg-prologue-guide');
                await guide.waitFor({state:'visible'});
                if(await guide.locator('button:visible').count()!==1)throw Error('Opening guide must expose only the primary navigation button');
                const marker=page.locator('[data-npc-talk="muling"]');
                if(await page.locator('.res-garden-bell').count())throw Error('Detached garden bell must be removed');
                const discover=id=>page.locator('[data-garden-explore="'+id+'"]');
                for(let i=0;i<3;i++)await discover('butterfly').click();
                await discover('butterfly').waitFor({state:'hidden'});
                await discover('seed').click();
                await discover('snack').click();
                await page.getByRole('button',{name:'Keep for later',exact:true}).click();
                await discover('door').click();
                await marker.waitFor({state:'visible'});await marker.click();
                const encounter=page.locator('#cb-traveler-encounter');
                if(await encounter.getByRole('button',{name:/^(English|中文|EN)$/}).count())throw Error('Language toggle must not appear in dialogue');
                await encounter.getByRole('button',{name:'Leave for now',exact:true}).click();
                await encounter.waitFor({state:'detached'});await marker.click();
                await encounter.getByRole('button',{name:'Find the chart pieces',exact:true}).click();
                await encounter.waitFor({state:'detached'});
                await discover('chart-0').click();
                if(await page.evaluate(()=>CatBondResonance.view().openingMet))throw Error('One piece cannot complete the encounter');
                await discover('chart-1').click();
                await marker.click();
                await encounter.getByRole('button',{name:'Continue',exact:true}).click();
                await encounter.getByRole('button',{name:'Say goodbye',exact:true}).click();
                await encounter.waitFor({state:'detached'});
                await page.waitForFunction(()=>CatBondResonance.view().openingMet===true);
                await marker.waitFor({state:'hidden'});
                await page.screenshot({path:'preview-'+prefix+'-garden-discovery.png'});
                if(await guide.locator('button:visible').count()!==1)throw Error('Opening guide expanded after dialogue');
                if(await page.locator('#yard-actions').isVisible())throw Error('Garden floating dock must be hidden');
                await page.locator('#map-menu').click();
                const menu=page.locator('#cb-system-menu');
                await menu.waitFor({state:'visible'});
                for(const id of ['yard-map','yard-book','page-garden','leisure','page-settings','page-saves']){
                  if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing menu action '+id);
                }
                if(await page.locator('#hud').isVisible())throw Error('Wallet must not cover garden');
                if(await page.locator('#cb-yard-return').isVisible())throw Error('Duplicate yard return');
                const scrim=await menu.evaluate(el=>getComputedStyle(el).backgroundColor);
                if(scrim!=='rgba(0, 0, 0, 0)'&&scrim!=='transparent')throw Error('Menu must not dim the artwork: '+scrim);
                await page.screenshot({path:'preview-'+prefix+'-garden-menu.png'});
                await menu.locator('[data-system="page-garden"]').click();
                for(const id of ['yard-build','yard-seek','yard-play','yard-feed'])if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing garden action '+id);
                await menu.locator('[data-system="page-back"]').click();
                await menu.locator('[data-system="page-settings"]').click();
                for(const id of ['language','music','effects'])if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing setting '+id);
                await page.screenshot({path:'preview-'+prefix+'-settings.png'});
                await menu.locator('[data-system="page-back"]').click();
                await menu.locator('[data-system="page-saves"]').click();
                if(!await menu.locator('[data-system="slots"]').isVisible())throw Error('Save management is not reachable');
                await menu.locator('[data-system="page-back"]').click();
                await menu.locator('[data-system="yard-book"]').click();
                await page.locator('.rb-wallet').waitFor({state:'visible'});
                await page.screenshot({path:'preview-'+prefix+'-book-wallet.png'});
                if(await page.locator('#hud').isVisible())throw Error('Wallet must remain inside the book');
                await page.screenshot({path:'preview-'+prefix+'-garden.png'});
                await page.reload();
                await page.locator('#intro-continue').click();
                await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                await page.waitForFunction(uid=>State.S.cats.length===1&&State.S.cats[0].species==='jinjc'&&State.S.cats[0].uid===uid&&CatBondResonance.view().current?.id==='prologue:P-05',uid);
                if(!await page.evaluate(()=>CatBondResonance.view().openingMet))throw Error('Encounter completion lost on reload');
                await page.screenshot({path:'preview-'+prefix+'-reloaded.png'});
                await page.locator('.sg-prologue-guide').getByRole('button',{name:'Next scene · Misttide Harbor',exact:true}).click();
                await page.waitForFunction(()=>CatBondResonance.view().current?.id==='harbor:H-01'&&WorldMap.currentRegion==='harbor');
                await page.screenshot({path:'preview-'+prefix+'-harbor.png'});
                if(external.length||errors.length)throw Error('Unexpected external requests / page errors: '+JSON.stringify({external,errors}));
                console.log('PREVIEW NEW SLOT AND RELOAD VERIFIED: '+prefix+' '+page.url());
              }catch(error){
              console.error('Smoke failed in '+prefix, error);
              throw error;
            }finally{await context.close()}
            }));
          }finally{await browser.close()}
          NODE
      - name: Run isolated predeployment browser smoke
        env:
          CAT_BOND_SMOKE_ORIGIN: http://127.0.0.1:8766
          CAT_BOND_SMOKE_STAGE: local
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/cat-bond-preview-server.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import os
          os.chdir('/tmp/cat-bond-preview/site')
          class Preview(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Content-Security-Policy', "connect-src 'self'; form-action 'self'")
                  super().end_headers()
              def do_GET(self):
                  if self.path == '/api' or self.path.startswith('/api/'):
                      self.send_error(403)
                  else:
                      super().do_GET()
              def do_POST(self):
                  self.send_error(403)
          ThreadingHTTPServer(('127.0.0.1',8766), Preview).serve_forever()
          PY
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8766/cat-bond/ >/dev/null && break; sleep 1; done
          node .cat-bond-preview-smoke.mjs
      - name: Publish only preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          git fetch origin rpg/release-combined-next
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" # never publish a superseded commit
          WRANGLER="$PWD/node_modules/.bin/wrangler"
          cd /tmp/cat-bond-preview
          "$WRANGLER" pages deploy site --project-name morrowwish --branch cat-bond-preview --commit-hash "$SOURCE_SHA"
      - name: Verify stable preview alias and API isolation
        run: |
          set -eu
          URL=https://cat-bond-preview.morrowwish.pages.dev
          for attempt in $(seq 1 15); do
            if curl -fsS "$URL/preview-version.json?sha=$SOURCE_SHA" | grep -Fq "$SOURCE_SHA"; then break; fi
            sleep 4
          done
          curl -fsS "$URL/preview-version.json?sha=$SOURCE_SHA" > /tmp/live-preview-version.json
          python3 - <<'PY'
          import json, os
          version = json.load(open('/tmp/live-preview-version.json'))
          assert version['sha'] == os.environ['SOURCE_SHA']
          assert version['qaTier'] == 'preview-smoke' and version['fullReleaseAccepted'] is False
          assert version['scope'] == 'Prologue through Finale'
          assert version['storage'] == 'local-only' and version['productionApis'] is False
          print(version)
          PY
          curl -fsS "$URL/cat-bond/" | grep -F 'PREVIEW 试玩'
          for endpoint in session cat-bond-cloud-save; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/$endpoint")" = 403
          done
      - name: Smoke-test published preview with the same three profiles
        env:
          CAT_BOND_SMOKE_STAGE: live
        run: node .cat-bond-preview-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-title
          path: preview-*.png
          if-no-files-found: ignore
          retention-days: 3

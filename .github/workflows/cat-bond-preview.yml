name: Cat Bond isolated Cloudflare Pages preview
on:
  push:
    branches: [review/starbell-canon13-player-experience]
    paths:
      - 'public/cat-bond/**'
      - 'public/audio/**'
      - 'public/art/**'
      - 'public/icons/**'
      - 'public/*.js'
      - 'public/*.css'
      - 'package*.json'
      - 'scripts/test-cat-bond-*.mjs'
      - 'scripts/check-cat-bond-resonance-world.mjs'
      - 'scripts/cat-bond-test-start.mjs'
      - 'scripts/import-cat-bond-windchime-music.mjs'
      - 'scripts/check-cat-bond-audio-assets.mjs'
      - '.github/workflows/cat-bond-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cat-bond-isolated-preview
  cancel-in-progress: true
jobs:
  preview:
    # Preview only; never deploy main or touch production APIs.
    if: github.ref == 'refs/heads/review/starbell-canon13-player-experience'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Hold preview deployment at owner request
        run: |
          echo 'Preview deployment is paused until explicitly authorized.'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pin exact preview candidate (not formal release approval)
        run: |
          set -euo pipefail
          SOURCE_SHA="$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --depth=1 origin review/starbell-canon13-player-experience
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          printf '%s %s\n' review/starbell-canon13-player-experience "$SOURCE_SHA" > /tmp/cat-bond-preview-sources.txt
          test -s public/cat-bond/js/rpg-audio.js
          test -s public/cat-bond/js/resonance/resonance-book.mjs
          test -s public/cat-bond/css/rpg-visual-polish.css
          grep -Fq 'rpg-audio.js' public/cat-bond/index.html
          grep -Fq 'resonance-book.mjs' public/cat-bond/js/resonance/integration-entry.mjs
          grep -Fq 'rpg-visual-polish.css' public/cat-bond/index.html
          node --check public/cat-bond/js/main.js
      - name: Select QA scope against the actual deployed preview
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          live_sha=$(curl -fsS --connect-timeout 5 --max-time 12 "https://cat-bond-preview.morrowwish.pages.dev/preview-version.json?qa=$SOURCE_SHA" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' || true)
          if [[ "$live_sha" =~ ^[0-9a-f]{40}$ ]] && git fetch --no-tags --depth=1 origin "$live_sha"; then
            if git diff --name-only --no-renames -z "$live_sha" "$SOURCE_SHA" > /tmp/cb-preview-changes; then
              mode=$(python3 - <<'PY'
          import pathlib, re
          paths = [p.decode() for p in pathlib.Path('/tmp/cb-preview-changes').read_bytes().split(b'\0') if p]
          def audio(p):
              return bool(re.fullmatch(r'public/cat-bond/assets/(?:audio|quality-audio)/[^/]+\.(?:mp3|ogg|wav|json|html|txt)', p)) or p in {
                  'scripts/import-cat-bond-windchime-music.mjs',
                  'scripts/check-cat-bond-audio-assets.mjs',
                  'scripts/test-cat-bond-rpg-audio-lifecycle.mjs',
              }
          # CI-only edits may accompany an audio change; shared JS, gameplay, layout,
          # package changes and any unknown paths always retain the full gate.
          substantive = [p for p in paths if p != '.github/workflows/cat-bond-preview.yml']
          print('audio' if substantive and all(audio(p) for p in substantive) else 'full')
          PY
              )
            fi
          fi
          # Manual dispatch keeps the full validation path available.
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then mode=full; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CAT_BOND_QA_SCOPE=$mode" >> "$GITHUB_ENV"
          echo "Preview QA: $mode (deployed base: ${live_sha:-unknown})"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install audio import prerequisites when missing
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Import and verify user-selected Windchime Town soundtrack
        run: |
          node scripts/import-cat-bond-windchime-music.mjs
          node scripts/check-cat-bond-audio-assets.mjs
      - name: Verify audio lifecycle for every preview
        run: node scripts/test-cat-bond-rpg-audio-lifecycle.mjs
      - name: Verify player-first opening and named party logic
        if: steps.qa.outputs.mode == 'full'
        run: |
          for test in scripts/test-cat-bond-canon22-*.mjs; do node "$test"; done
          node scripts/test-cat-bond-player-first.mjs
          node scripts/test-cat-bond-story-party.mjs
          node scripts/test-cat-bond-garden-exploration.mjs
          node scripts/test-starbell-exploration-depth.mjs
          node scripts/test-cat-bond-companion-talents.mjs
          node scripts/test-cat-bond-side-adventures.mjs
          node scripts/test-cat-bond-regional-discoveries.mjs
          node scripts/test-cat-bond-canon12-campaign.mjs
          node scripts/test-cat-bond-resonance.mjs
          node scripts/test-cat-bond-resonance-slot.mjs
          node scripts/check-cat-bond-resonance-world.mjs
      - name: Build isolated Cat Bond preview (no production Worker or D1)
        run: |
          set -eu
          mkdir -p /tmp/cat-bond-preview/site
          cp -a public/cat-bond /tmp/cat-bond-preview/site/
          for dir in audio art icons pawsibly-innocent; do cp -a "public/$dir" /tmp/cat-bond-preview/site/; done
          find public -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -exec cp {} /tmp/cat-bond-preview/site/ \;
          # RPG serves self-contained recordings; Morning is verified from the official catalog before packaging.
          test -d /tmp/cat-bond-preview/site/cat-bond/assets/audio
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/cat-bond-preview/site';
          const file=root+'/cat-bond/index.html';
          let html=fs.readFileSync(file,'utf8');
          // Keep the real telemetry script; QA visits are disabled by its query guard.
          html=html.replace(/<\/head>/i,'<meta name="robots" content="noindex,nofollow"><script>window.ARCADE_GAME_ID="starbell-preview";window.ARCADE_COLLECTOR=(new URLSearchParams(location.search).has("qa")||new URLSearchParams(location.search).has("developer")||location.hostname!=="cat-bond-preview.morrowwish.pages.dev")?"/api/preview-disabled":"https://morrowwish.pages.dev/api/starbell-preview-session";window.arcadeMetric=()=>{};</script></head>');
          const sha=process.env.SOURCE_SHA;
          // Release identity is machine-readable, not a permanent overlay on the game.
          html=html.replace(/<body([^>]*)>/i,'<body$1 data-source-sha="'+sha+'">');
          fs.writeFileSync(file,html);
          fs.writeFileSync(root+'/index.html','<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/cat-bond/"></head><body><a href="/cat-bond/">Echoes of the Starbell Preview</a></body></html>');
          fs.writeFileSync(root+'/robots.txt','User-agent: *\nDisallow: /\n');
          fs.writeFileSync(root+'/_headers','/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n  Content-Security-Policy: connect-src \'self\' https://morrowwish.pages.dev/api/starbell-preview-session; form-action \'self\'\n');
          // The copied telemetry script sends only the independent preview game ID.
          fs.writeFileSync(root+'/_worker.js','export default {fetch(request,env){const u=new URL(request.url);if(u.pathname.startsWith("/api/")||u.pathname==="/api")return Response.json({error:"Preview: production APIs disabled; use local saves."},{status:403});return env.ASSETS.fetch(request)}};');
          fs.writeFileSync(root+'/preview-version.json',JSON.stringify({sha,qaTier:'preview-smoke',qaScope:process.env.CAT_BOND_QA_SCOPE,fullReleaseAccepted:false,scope:'Prologue through Finale',storage:'local-only',productionApis:false,previewTelemetry:'starbell-preview',sources:fs.readFileSync('/tmp/cat-bond-preview-sources.txt','utf8').trim().split('\n')}));
          NODE
      - name: Install pinned Chromium test runtime once
        uses: ./.github/actions/starbell-browser-setup
        with:
          npm-ci: 'false'
      - name: Prepare reusable real-browser smoke
        run: |
          cat > .cat-bond-preview-smoke.mjs <<'NODE'
          import {chromium} from 'playwright';
          import {gardenDiscovery} from './scripts/cat-bond-test-start.mjs';
          const browser=await chromium.launch({headless:true});
          try {
            const origin=process.env.CAT_BOND_SMOKE_ORIGIN || 'https://cat-bond-preview.morrowwish.pages.dev';
            const audioOnly=process.env.CAT_BOND_QA_SCOPE==='audio';
            const profiles=[{name:'desktop',viewport:{width:1280,height:800}},{name:'portrait',viewport:{width:390,height:844},hasTouch:true},{name:'landscape',viewport:{width:844,height:390},hasTouch:true}];
            const results=await Promise.allSettled((audioOnly?profiles.slice(0,2):profiles).map(async profile=>{
              const {name,...device}=profile; if(device.hasTouch)device.isMobile=true;
              const prefix=(process.env.CAT_BOND_SMOKE_STAGE || 'live')+'-'+name;
              const context=await browser.newContext(device);
              try{
                const page=await context.newPage(),external=[],errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.route('**/*',route=>{
                  const url=route.request().url();
                  if(url.startsWith(origin+'/')||/^(data:|blob:)/.test(url))return route.continue();
                  external.push(url);return route.abort();
                });
                const local=process.env.CAT_BOND_SMOKE_STAGE==='local';
                const sourceSha=process.env.SOURCE_SHA;
                if(!/^[0-9a-f]{40}$/.test(sourceSha||''))throw Error('Missing pinned source SHA');
                const expectedMarker='data-source-sha="'+sourceSha+'"';
                let loaded=false;
                // Verify the HTML actually received by each browser, not just the separate version endpoint.
                // A fresh deployment can briefly serve stale HTML from another edge/cache variant.
                for(let attempt=0;attempt<(local?1:6);attempt++){
                  const url=new URL('/cat-bond/',origin);
                  url.searchParams.set('lang','en');
                  if(local)url.searchParams.set('rpgDev','1');
                  url.searchParams.set('previewSha',sourceSha);
                  url.searchParams.set('qa',name+'-'+attempt);
                  const response=await page.goto(url.href,{waitUntil:'domcontentloaded'});
                  const html=response?.ok()?await response.text():'';
                  if(html.includes(expectedMarker)){loaded=true;break;}
                  console.warn('Preview HTML source mismatch',prefix,'attempt',attempt+1,'status',response?.status(),'cf-cache-status',response?.headers()['cf-cache-status'],'observed',html.match(/data-source-sha="([0-9a-f]{40})"/)?.[1]||'missing');
                  if(!local&&attempt<5)await new Promise(resolve=>setTimeout(resolve,2500));
                }
                if(!loaded)throw Error('Preview HTML did not converge to pinned source '+sourceSha+' for '+prefix);
                if(await page.locator('body').getAttribute('data-source-sha')!==sourceSha)throw Error('Pinned preview identity missing from DOM');
                if(await page.locator('#cb-preview-note').count())throw Error('Release watermark must not appear in game');
                await page.locator('#intro-continue').waitFor({state:'visible',timeout:30000});
                await page.waitForFunction(()=>window.CatBondCanonicalWorld&&window.CatBondTitlePrologue&&window.ResonanceBook&&window.CatBondChapterCinematics);
                await page.waitForFunction(()=>CatBondChapterCinematics.developmentReady()||CatBondChapterCinematics.starfallReleaseReady());
                // All final artwork must decode from the exact deployed build, not the source checkout.
                if(!audioOnly&&name==='desktop'){
                  const art=await page.evaluate(async()=>{
                    const names='forest-fork forest-landing forest-root-bridge forest-moonleaf-control lantern-theater garden-lantern shadow-fish shadow-butterfly shadow-cat lantern-vault lantern-stone-crossing shadow-beast sky-cloudfall sky-safety-island sky-glider history-impact garden-moonleaf-touch garden-moonleaf garden-teacup garden-route-map windchime-chase windchime-wisp'.split(' ');
                    const paths=names.map(name=>'canon22-final-art/'+name+'.webp').concat(['resonance-world-v2/atlas.webp','resonance-world-v2/harbor.webp','resonance-world-v2/harbor-mist.webp','resonance-world-v2/forge.webp','combat/harbor-arena.webp','combat/tide-shell-watercolor.webp','story-art/cloud-lookout.jpg','story-art/lantern-entrustment.jpg','story-art/library-shared-memories.jpg']);
                    return Promise.all(paths.map(async name=>{const im=new Image();im.src='assets/'+name;await im.decode();if(!im.naturalWidth||!im.naturalHeight)throw Error('Empty art '+name);return {name,w:im.naturalWidth,h:im.naturalHeight};}));
                  });
                  if(art.length!==31||new Set(art.map(a=>a.name)).size!==31)throw Error('Missing or duplicate final watercolor assets: '+art.length);
                  console.log('FINAL WATERcolors DECODED',JSON.stringify(art));
                }
                if(!await page.evaluate(()=>window.ARCADE_COLLECTOR==='/api/preview-disabled'&&window.__CAT_BOND_INTEGRATION_ART__===false))throw Error('Preview isolation / art approval marker mismatch');
                if(audioOnly){
                  // Audio-only: no campaign, layout, art or slot regression. Use the
                  // real audio director and real decoded local/online recordings.
                  // Scene selection is isolated in this disposable browser context.
                  await page.locator('#intro-start').click();
                  await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                  await page.locator('#cb-player-first-intro').getByRole('button',{name:'Start exploring',exact:true}).click();
                  await page.waitForFunction(()=>window.__CAT_BOND_STARTED__&&window.__game?.scene==='yard'&&window.WorldMap&&window.MorrowwishMusic?.status().playing);
                  await page.evaluate(()=>{
                    window.__game.scene='map';
                    window.WorldMap.mode='region';
                    window.WorldMap.currentRegion='harbor';
                    MorrowwishMusic.switchScene();
                  });
                  const town=()=>page.waitForFunction(()=>{const s=window.MorrowwishMusic.status();return s.scene==='harbor'&&s.track==='harbor'&&s.source==='premium-mp3:morning'&&s.playing&&s.loop&&s.duration>150&&s.duration<157;},null,{timeout:45000});
                  await town();
                  const before=await page.evaluate(()=>MorrowwishMusic.status().currentTime);
                  await page.waitForFunction(t=>MorrowwishMusic.status().currentTime>t+.1,before);
                  await page.evaluate(()=>MorrowwishMusic.setVolume(.35));
                  if(await page.evaluate(()=>MorrowwishMusic.status().volume)!==.35)throw Error('Music volume control failed');
                  await page.evaluate(()=>MorrowwishMusic.setEnabled(false));
                  await page.waitForFunction(()=>!MorrowwishMusic.status().playing);
                  await page.evaluate(()=>MorrowwishMusic.setEnabled(true));
                  await town();
                  await page.evaluate(()=>{WorldMap.currentRegion='forest';MorrowwishMusic.switchScene();});
                  await page.waitForFunction(()=>{const s=MorrowwishMusic.status();return s.track==='forest'&&s.playing&&s.source!=='premium-mp3:morning';},null,{timeout:45000});
                  if(external.length||errors.length)throw Error('Audio-only smoke errors: '+JSON.stringify({external,errors}));
                  console.log('AUDIO-ONLY SMOKE PASS',prefix);
                  return;
                }
                // Exercise the real page and both translation observers, including round-trip switching.
                for(const locale of ['en','zh','en']){
                  await page.evaluate(locale=>window.MorrowwishI18n.set(locale),locale);
                  await page.waitForFunction(locale=>document.documentElement.lang.startsWith(locale)&&document.getElementById('cb-title-name')?.textContent===(locale==='zh'?'星铃回响':'Echoes of the Starbell')&&document.title===(locale==='zh'?'星铃回响 | Morrow Wish':'Echoes of the Starbell | Morrow Wish'),locale);
                  const title=await page.locator('.cb-intro-titleblock').innerText();
                  const buttons=await page.locator('.cb-intro-actions').innerText();
                  if(locale==='en'&&/[\u4e00-\u9fff]/.test(title+buttons))throw Error('Chinese leaked into English title');
                  if(locale==='zh'&&(/[A-Za-z]/.test(title+buttons)))throw Error('English leaked into Chinese title');
                  if(await page.locator('#cb-title-subtitle').count())throw Error('Duplicate language title');
                  if(locale==='zh')await page.screenshot({path:'preview-'+prefix+'-title-zh.png'});
                }
                await page.screenshot({path:'preview-'+prefix+'-title.png'});
                await page.locator('#intro-start').click();
                await page.locator('#intro-slot-list [data-slot="slot1"]').waitFor();
                if(await page.locator('#intro-slot-list [data-slot]').count()!==3)throw Error('Three save slots required');
                await page.screenshot({path:'preview-'+prefix+'-slots.png'});
                await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                await page.waitForFunction(()=>CatBondResonance.view().current?.id==='prologue:P-05');
                const intro=page.locator('#cb-player-first-intro');
                await intro.waitFor({state:'visible'});
                if(!/Star Bell.*memories/s.test(await intro.innerText()))throw Error('Missing spoiler-free world context');
                if(await page.locator('.cbcp-root:not([hidden])').count())throw Error('Retired opening still playing');
                await page.screenshot({path:'preview-'+prefix+'-opening.png'});
                await intro.getByRole('button',{name:'Start exploring',exact:true}).click();
                await page.waitForFunction(()=>State.S.cats.length===1&&State.S.cats[0].species==='jinjc'&&window.__game?.scene==='yard'&&!document.querySelector('#panel.open .cat-starter-card'));
                await page.waitForFunction(()=>State.S.cats.length===1&&State.listSaveSlots().find(s=>s.id==='slot1')?.exists);
                const uid=await page.evaluate(()=>State.S.cats[0].uid);
                const completed=await page.evaluate(()=>State.S.resonance.completed.slice(0,4).join(','));
                if(completed!=='prologue:P-01,prologue:P-02,prologue:P-03,prologue:P-04')throw Error('Opening presentation checkpoints missing');
                if(await page.evaluate(()=>CatBondResonance.view().muling!=='unmet'||Object.values(State.S.resonance.evidence).flat().some(op=>op.startsWith('cinematic:'))))throw Error('Opening grants unearned companion or old cinematic evidence');
                // Actual encounter input on all three deployed profiles; no state mutation or forced click.
                const guide=page.locator('.sg-prologue-guide');
                await guide.waitFor({state:'visible'});
                if(await guide.locator('button:visible').count()!==1)throw Error('Opening quest must be collapsed');
                const questToggle=guide.getByRole('button',{name:'Main quest',exact:true});
                if(await questToggle.getAttribute('aria-expanded')!=='false')throw Error('Opening quest is not collapsed');
                await questToggle.click();
                if(!await guide.getByRole('button',{name:'Talk to the stranger',exact:true}).isVisible())throw Error('Opening quest does not prioritize encounter');
                if(await guide.getByRole('button',{name:'Next scene · Windchime Town',exact:true}).count())throw Error('Premature departure prompt');
                await questToggle.click();
                const marker=page.locator('[data-npc-talk="muling"]');
                if(await page.locator('.res-garden-bell').count())throw Error('Detached garden bell must be removed');
                const discover=id=>page.locator('[data-garden-explore="'+id+'"]');
                for(let i=0;i<3;i++){await discover('butterfly').click();await page.waitForFunction(n=>GardenExploration.read(State.S).butterfly===n,i+1);}
                await discover('butterfly').waitFor({state:'hidden'});
                await gardenDiscovery(page,'seed',{touch:device.hasTouch});
                await gardenDiscovery(page,'snack',{touch:device.hasTouch});
                await page.getByRole('button',{name:'Keep for later',exact:true}).click();
                await gardenDiscovery(page,'door',{touch:device.hasTouch});
                await marker.waitFor({state:'visible'});await marker.click();
                const encounter=page.locator('#cb-traveler-encounter');
                if(await encounter.getByRole('button',{name:/^(English|中文|EN)$/}).count())throw Error('Language toggle must not appear in dialogue');
                await encounter.getByRole('button',{name:'Leave for now',exact:true}).click();
                await encounter.waitFor({state:'detached'});await marker.click();
                await encounter.getByRole('button',{name:'Find the chart pieces',exact:true}).click();
                await encounter.waitFor({state:'detached'});
                await gardenDiscovery(page,'chart-0',{touch:device.hasTouch});
                if(await page.evaluate(()=>CatBondResonance.view().openingMet))throw Error('One piece cannot complete the encounter');
                await gardenDiscovery(page,'chart-echo',{touch:device.hasTouch});
                await marker.click();
                await encounter.getByRole('button',{name:'Continue',exact:true}).click();
                await encounter.getByRole('button',{name:'Answer',exact:true}).click();
                if(!/I don.t know/.test(await encounter.locator('.res-line').innerText()))throw Error('Player must answer Muling before departure');
                await encounter.getByRole('button',{name:'Continue',exact:true}).click();
                await encounter.getByRole('button',{name:'Say goodbye',exact:true}).click();
                await encounter.waitFor({state:'detached'});
                await page.waitForFunction(()=>CatBondResonance.view().openingMet===true);
                await marker.waitFor({state:'hidden'});
                if(await page.evaluate(()=>GardenExploration.read(State.S).parts.length)!==1)throw Error('Second chart must be optional');
                if(prefix.includes('desktop')){await gardenDiscovery(page,'chart-1',{touch:device.hasTouch});if(!await page.evaluate(()=>GardenExploration.read(State.S).keepsakes.includes('windblown-chart')))throw Error('Optional chart keepsake missing');}
                if(await page.locator('#toasts .toast:visible').count()>1)throw Error('Exploration notices stack over cats and navigation');
                await page.screenshot({path:'preview-'+prefix+'-garden-discovery.png'});
                if(await guide.locator('button:visible').count()!==1)throw Error('Opening guide expanded after dialogue');
                if(await page.locator('#yard-actions').isVisible())throw Error('Garden floating dock must be hidden');
                await page.locator('#map-menu').click();
                const menu=page.locator('#cb-system-menu');
                await menu.waitFor({state:'visible'});
                for(const id of ['yard-map','yard-book','page-garden','leisure','page-settings','slots']){
                  if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing menu action '+id);
                }
                if(await page.locator('#hud').isVisible())throw Error('Wallet must not cover garden');
                if(await page.locator('#cb-yard-return').isVisible())throw Error('Duplicate yard return');
                const scrim=await menu.evaluate(el=>getComputedStyle(el).backgroundColor);
                if(scrim!=='rgba(0, 0, 0, 0)'&&scrim!=='transparent')throw Error('Menu must not dim the artwork: '+scrim);
                await page.screenshot({path:'preview-'+prefix+'-garden-menu.png'});
                await menu.locator('[data-system="page-garden"]').click();
                for(const id of ['yard-build','yard-seek','yard-play','yard-feed'])if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing garden action '+id);
                await menu.locator('[data-system="page-back"]').click();
                await menu.locator('[data-system="page-settings"]').click();
                for(const id of ['language','music','effects'])if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing setting '+id);
                await page.screenshot({path:'preview-'+prefix+'-settings.png'});
                await menu.locator('[data-system="page-back"]').click();
                await menu.locator('[data-system="slots"]').click();
                const saves=page.locator('.cb-slot-manager');
                await saves.waitFor({state:'visible'});
                if(await saves.locator('.cb-slot-manager-row').count()!==3||await menu.isVisible())throw Error('Direct save management must open three slots and dismiss the menu');
                await saves.locator('.cb-cloud-close').click();
                await saves.waitFor({state:'hidden'});
                await page.locator('#map-menu').click();
                await menu.waitFor({state:'visible'});
                await menu.locator('[data-system="yard-book"]').click();
                await page.locator('.rb-wallet').waitFor({state:'visible'});
                await page.screenshot({path:'preview-'+prefix+'-book-wallet.png'});
                if(await page.locator('#hud').isVisible())throw Error('Wallet must remain inside the book');
                await page.screenshot({path:'preview-'+prefix+'-garden.png'});
                await page.reload();
                await page.locator('#intro-continue').click();
                await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                await page.waitForFunction(uid=>State.S.cats.length===1&&State.S.cats[0].species==='jinjc'&&State.S.cats[0].uid===uid&&CatBondResonance.view().current?.id==='prologue:P-05',uid);
                if(!await page.evaluate(()=>CatBondResonance.view().openingMet))throw Error('Encounter completion lost on reload');
                await page.screenshot({path:'preview-'+prefix+'-reloaded.png'});
                await page.locator('.sg-prologue-guide').getByRole('button',{name:'Main quest',exact:true}).click();
                await page.locator('.sg-prologue-guide').getByRole('button',{name:'Next scene · Windchime Town',exact:true}).click();
                await page.waitForFunction(()=>CatBondResonance.view().current?.id==='harbor:H-01'&&WorldMap.currentRegion==='harbor');
                await page.waitForFunction(()=>{const s=window.MorrowwishMusic?.status();return s?.scene==='harbor'&&s.track==='harbor'&&s.source==='premium-mp3:morning'&&s.playing&&s.loop&&s.duration>150&&s.duration<157;},{},{timeout:45000});
                console.log('WINDCHIME MUSIC PLAYING',prefix,JSON.stringify(await page.evaluate(()=>window.MorrowwishMusic.status())));
                await page.screenshot({path:'preview-'+prefix+'-harbor.png'});
                // Actual player-driven discovery from the accessible optional clue:
                // the game walks the cat to the landmark and validates its saved position.
                const clue=page.locator('[data-side-clue=harbor]');
                await clue.waitFor({state:'attached'});
                if(!await clue.isVisible()){
                  await page.locator('#map-menu').click();
                  await page.locator('#cb-system-menu [data-system="world-explore"]').click();
                }
                const details=page.locator('.rw-optional-actions:not([open]) > summary:visible');
                if(!await clue.isVisible()&&await details.count())await details.first().click();
                const prev=page.locator('[data-fit-prev]:visible'),next=page.locator('[data-fit-next]:visible');
                for(let i=0;i<20&&!await clue.isVisible()&&await prev.count()&&await prev.isEnabled();i++)await prev.click();
                for(let i=0;i<20&&!await clue.isVisible()&&await next.count()&&await next.isEnabled();i++){
                  if(await details.count())await details.first().click();
                  if(!await clue.isVisible())await next.click();
                }
                await clue.click();
                const side=page.locator('[data-adventure=side-harbor]');
                await side.waitFor({state:'visible',timeout:15000});
                for(const action of ['step-0-0','step-1-1','step-2-2'])await side.locator('[data-play-action="'+action+'"]').click();
                if(await side.getAttribute('data-complete')!=='true')throw Error('Tidepool reward did not complete');
                await page.waitForFunction(()=>State.S.resonanceExploration.interactions['side-adventure:harbor']===true);
                await page.screenshot({path:'preview-'+prefix+'-tidepool-complete.png'});
                await side.getByRole('button',{name:'Return',exact:true}).click();
                await side.waitFor({state:'detached'});
                if(external.length||errors.length)throw Error('Unexpected external requests / page errors: '+JSON.stringify({external,errors}));
                console.log('PREVIEW NEW SLOT AND RELOAD VERIFIED: '+prefix+' '+page.url());
              }catch(error){
              console.error('Smoke failed in '+prefix, error);
              throw error;
            }finally{await context.close()}
            }));
            const failures=results.filter(r=>r.status==='rejected');
            if(failures.length)throw new AggregateError(failures.map(r=>r.reason),'Preview profile failures: '+failures.length);
          }finally{await browser.close()}
          NODE
      - name: Run isolated predeployment browser smoke
        env:
          CAT_BOND_SMOKE_ORIGIN: http://127.0.0.1:8766
          CAT_BOND_SMOKE_STAGE: local
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/cat-bond-preview-server.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import os
          os.chdir('/tmp/cat-bond-preview/site')
          class Preview(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Content-Security-Policy', "connect-src 'self'; form-action 'self'")
                  super().end_headers()
              def do_GET(self):
                  if self.path == '/api' or self.path.startswith('/api/'):
                      self.send_error(403)
                  else:
                      super().do_GET()
              def do_POST(self):
                  self.send_error(403)
          ThreadingHTTPServer(('127.0.0.1',8766), Preview).serve_forever()
          PY
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8766/cat-bond/ >/dev/null && break; sleep 1; done
          node .cat-bond-preview-smoke.mjs
          if [[ "$CAT_BOND_QA_SCOPE" == full ]]; then
            node scripts/test-starbell-developer-browser.mjs
            node scripts/test-cat-bond-adventure-browser.mjs
            node scripts/cat-bond-title-audio-qa.mjs
            node scripts/cat-bond-layout-acceptance.mjs
          fi
      - name: Publish only preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad5c7e2459db758ac4a41973f4f6028b
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          git fetch --depth=1 origin review/starbell-canon13-player-experience
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA" # never publish a superseded commit
          WRANGLER="$PWD/node_modules/.bin/wrangler"
          cd /tmp/cat-bond-preview
          "$WRANGLER" pages deploy site --project-name morrowwish --branch cat-bond-preview --commit-hash "$SOURCE_SHA"
      - name: Verify stable preview alias and API isolation
        run: |
          set -eu
          URL=https://cat-bond-preview.morrowwish.pages.dev
          for attempt in $(seq 1 15); do
            if curl -fsS "$URL/preview-version.json?sha=$SOURCE_SHA&qa=version-$attempt" -o /tmp/live-preview-version.json && python3 -c 'import json,os; assert json.load(open("/tmp/live-preview-version.json"))["sha"] == os.environ["SOURCE_SHA"]'; then break; fi
            sleep 4
          done
          python3 - <<'PY'
          import json, os
          version = json.load(open('/tmp/live-preview-version.json'))
          assert version['sha'] == os.environ['SOURCE_SHA']
          assert version['qaTier'] == 'preview-smoke' and version['fullReleaseAccepted'] is False
          assert version['qaScope'] == os.environ['CAT_BOND_QA_SCOPE']
          assert version['scope'] == 'Prologue through Finale'
          assert version['storage'] == 'local-only' and version['productionApis'] is False
          print(version)
          PY
          # The alias HTML and version JSON must identify the same exact source.
          for attempt in $(seq 1 15); do
            if curl -fsS "$URL/cat-bond/?previewSha=$SOURCE_SHA&qa=alias-$attempt" -o /tmp/live-preview.html && grep -Fq "data-source-sha=\"$SOURCE_SHA\"" /tmp/live-preview.html; then break; fi
            sleep 4
          done
          grep -Fq "data-source-sha=\"$SOURCE_SHA\"" /tmp/live-preview.html
          for endpoint in session cat-bond-cloud-save; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/$endpoint")" = 403
          done
      - name: Smoke-test published preview with selected QA scope
        env:
          CAT_BOND_SMOKE_STAGE: live
        run: node .cat-bond-preview-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-title
          path: |
            preview-*.png
            artifacts/cat-bond-layout/
          if-no-files-found: ignore
          retention-days: 3

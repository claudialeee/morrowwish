name: Polish V3 game video captions (actual gameplay remains unchanged)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/polish-hook-v3-captions.mjs'
      - '.github/workflows/polish-hook-v3-captions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-v3-caption-polish
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Correct overlapping instructional captions without falsifying footage
        run: node scripts/polish-hook-v3-captions.mjs
      - name: Stage only verified game footage and review images
        run: |
          set -euo pipefail
          for slug in flip-dash parcel-panic pocket-aquarium elsewhere; do
            git add "public/promo/$slug/hook-v3-20261121.mp4" "public/promo/$slug/hook-v3-20261121.jpg" public/promo/$slug/hook-v3-review-*.jpg
          done
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'promo: polished legible hook cards on four genuine V3 videos'
          git pull --rebase origin main
          git push origin HEAD:main

name: Mention two indie bots on Flip Dash (one reply)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mention-flipdash-bots-20261122.yml']
permissions:
  contents: read
jobs:
  reply-once:
    if: github.event.head_commit.message == 'Mention two indie bots on existing Flip Dash post'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MORROW_BLUESKY_APP_PASSWORD: ${{ secrets.MORROW_BLUESKY_APP_PASSWORD }}
      MORROW_BLUESKY_HANDLE: morrowwishgames.bsky.social
    steps:
      - name: Mention two bots, verify facets and no duplicate
        run: |
          node --input-type=module <<'NODE'
          const owner='did:plc:d55banmfpsnzmt35hqmmwha7';
          const original='at://'+owner+'/app.bsky.feed.post/3n2x6vrtv2226';
          const bots=[
            {handle:'indiedevbot.bsky.social',did:'did:plc:mxpuaozhcvmu2fazmn2lyjnj'},
            {handle:'newindiedevbot.bsky.social',did:'did:plc:nptvomhr2s2m7fduabripuyj'}
          ];
          const play='https://morrowwish.vercel.app/flip-dash/';
          const message='Quick one-tap gravity challenge for the indie game feeds! @indiedevbot.bsky.social @newindiedevbot.bsky.social\n\nPlay Flip Dash free: '+play+'\n\n#IndieGame #IndieDev #GameDev #BrowserGame';
          const base='https://bsky.social/xrpc/';
          async function api(url,options={}){
            const r=await fetch(url,{signal:AbortSignal.timeout(25000),...options});
            const body=await r.json().catch(()=>({}));
            if(!r.ok)throw Error('HTTP '+r.status+' '+JSON.stringify(body).slice(0,250));
            return body;
          }
          const session=await api(base+'com.atproto.server.createSession',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({identifier:process.env.MORROW_BLUESKY_HANDLE,password:process.env.MORROW_BLUESKY_APP_PASSWORD})});
          if(session.did!==owner)throw Error('Account did mismatch');
          const auth={Authorization:'Bearer '+session.accessJwt,'content-type':'application/json'};
          const existing=await api(base+'com.atproto.repo.listRecords?'+new URLSearchParams({repo:owner,collection:'app.bsky.feed.post',limit:'100'}),{headers:auth});
          const duplicate=existing.records?.find(x=>x.value?.reply?.parent?.uri===original && x.value?.text===message);
          if(duplicate){
            console.log('ALREADY_POSTED '+duplicate.uri);
            process.exit(0);
          }
          const thread=await api('https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?'+new URLSearchParams({uri:original,depth:'0'}));
          const p=thread.thread?.post;
          if(p?.uri!==original||!p?.cid||p?.author?.did!==owner)throw Error('Original Flip Dash post not verified');
          if(!p?.record?.text?.includes('flip-dash/'))throw Error('Target does not match expected game');
          const facets=[];
          function facet(token,feature){
            const begin=message.indexOf(token);
            if(begin<0)throw Error('Missing facet token '+token);
            facets.push({index:{byteStart:Buffer.byteLength(message.slice(0,begin),'utf8'),byteEnd:Buffer.byteLength(message.slice(0,begin+token.length),'utf8')},features:[feature]});
          }
          for(const b of bots)facet('@'+b.handle,{$type:'app.bsky.richtext.facet#mention',did:b.did});
          facet(play,{$type:'app.bsky.richtext.facet#link',uri:play});
          for(const tag of ['IndieGame','IndieDev','GameDev','BrowserGame'])facet('#'+tag,{$type:'app.bsky.richtext.facet#tag',tag});
          facets.sort((a,b)=>a.index.byteStart-b.index.byteStart);
          const record={$type:'app.bsky.feed.post',text:message,createdAt:new Date().toISOString(),langs:['en'],facets,reply:{root:{uri:original,cid:p.cid},parent:{uri:original,cid:p.cid}}};
          const created=await api(base+'com.atproto.repo.createRecord',{
            method:'POST',headers:auth,body:JSON.stringify({repo:owner,collection:'app.bsky.feed.post',record})});
          const live=await api('https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?'+new URLSearchParams({uri:created.uri,depth:'0'}));
          const got=live.thread?.post?.record;
          if(!got||got.text!==message||got.reply?.parent?.uri!==original)throw Error('Reply not publicly verified '+created.uri);
          for(const b of bots)if(!got.facets?.some(x=>x.features?.some(y=>y.$type==='app.bsky.richtext.facet#mention'&&y.did===b.did)))throw Error('Missing mention facet for '+b.handle);
          console.log('PUBLIC_VERIFIED_MENTIONS '+JSON.stringify({url:'https://bsky.app/profile/'+owner+'/post/'+created.uri.split('/').at(-1),replyTo:original,botHandles:bots.map(b=>b.handle)}));
          NODE

name: Apply D1 analytics indexes (additive only)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-pages/analytics-indexes.sql'
      - '.github/workflows/d1-analytics-indexes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morrowwish-d1-analytics-indexes
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQL plans and exact historical counts locally
        run: python3 scripts/test-analytics-indexes.py
      - name: Apply only additive indexes to existing production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg=JSON.parse(fs.readFileSync('cloudflare-pages/wrangler.jsonc','utf8'));
          const db=cfg.d1_databases.find(x=>x.binding==='DB');
          assert.equal(cfg.name,'morrowwish');
          assert.equal(db.database_name,'morrowwish-analytics');
          assert.equal(db.database_id,'fbd62f69-1811-4538-a17f-ecc5be8ad7cc');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Missing existing D1 credential');
          const url='https://api.cloudflare.com/client/v4/accounts/ad5c7e2459db758ac4a41973f4f6028b/d1/database/'+db.database_id+'/query';
          async function query(sql,params=[]){
            const res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)});
            const json=await res.json();
            if(!res.ok||!json.success||json.result?.some(x=>x.success===false))throw Error('D1 rejected SQL (no retries): HTTP '+res.status+' '+JSON.stringify(json.errors||[]));
            return json.result[0];
          }
          const statements=fs.readFileSync('cloudflare-pages/analytics-indexes.sql','utf8').replace(/^--.*$/gm,'').split(';').map(x=>x.trim()).filter(Boolean);
          for(const sql of statements){
            assert.match(sql,/^CREATE INDEX IF NOT EXISTS idx_events_[a-z_]+ ON events\(/);
            const result=await query(sql);
            console.log(sql.split(' ON ')[0],JSON.stringify({rows_read:result.meta?.rows_read,rows_written:result.meta?.rows_written}));
          }
          const source=fs.readFileSync('src/analytics.js','utf8');
          const summary=source.match(/prepare\("(SELECT id,category,day,game,ts,visitor,view_id,run_id,event_name,kind,payload FROM events[^"]+)"\)/)[1];
          const checks=[
            [summary,['arcade',Date.parse('2026-11-22T08:00:00Z'),Number.MAX_SAFE_INTEGER,Number.MAX_SAFE_INTEGER],'idx_events_category_ts_id'],
            ["SELECT kind,payload FROM events WHERE category=? AND view_id=? ORDER BY id ASC LIMIT 4",['diagnostic','index-plan-only'],'idx_events_diagnostic_view'],
            ["SELECT MIN(day) AS firstDay,MAX(day) AS lastDay,COUNT(*) AS rawVisits,COUNT(*) AS pageviews FROM events WHERE category='arcade' AND game='cat-bond' AND kind='visit'",[],'idx_events_catbond_visits_day']
          ];
          for(const [sql,params,index] of checks){
            const result=await query('EXPLAIN QUERY PLAN '+sql,params);
            const plan=result.results.map(x=>x.detail).join(' ');
            console.log(plan);
            assert.ok(plan.includes(index)&&!plan.includes('SCAN events')&&!plan.includes('TEMP B-TREE'),plan);
          }
          console.log('Production indexes verified by EXPLAIN QUERY PLAN; no event rows changed.');
          NODE

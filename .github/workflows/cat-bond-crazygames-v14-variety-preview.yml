name: Cat Bond CrazyGames real gameplay V14 variety preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cat-bond-crazygames-v14-variety-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact V14 source media is committed
        run: |
          set -eu
          test -s public/promo/cat-bond/trailer-v13-20261122.mp4
          test -s public/promo/cat-bond/trailer-v13-landscape-20261122.mp4
          test -s public/promo/v14-review.json
          test -s public/promo/cat-bond/trailer-v13-landscape-20261122.json
          python3 - <<'PY'
          import json
          j=json.load(open('public/promo/v14-review.json'))
          c=next(x for x in j['trailers'] if x['slug']=='cat-bond')
          assert c['video']=='/promo/cat-bond/trailer-v13-20261122.mp4'
          assert any(x['scene']=='duo' for x in c['shots'])
          print('V14 actual game master and forbidden duo timeline found')
          PY
      - name: Install ffmpeg if necessary
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Recut V14 real gameplay (exploration, cats, growth, story, brief battle)
        run: python3 scripts/recut-cat-bond-crazygames-variety-v14.py
      - name: Final video and content guard
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('.check/crazygames-v14-variety/shot-plan-and-qa.json'))
          assert d['containsOriginal63DuoCinematic'] is False
          assert d['battleFraction']<0.15
          assert d['crazygamesDraftTouched'] is False
          for p in d['videos'].values():
            assert p['duration']<20 and p['bytes']<50_000_000
          print('PASS: No original duo cut-in; authentic cat collection/exploration/upgrades prominent')
          PY
      - name: Save exactly two review videos and storyboard frames
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-crazygames-v14-variety-real-gameplay-review
          path: |
            .check/crazygames-v14-variety/*.mp4
            .check/crazygames-v14-variety/*.jpg
            .check/crazygames-v14-variety/shot-plan-and-qa.json
          retention-days: 30
          if-no-files-found: error

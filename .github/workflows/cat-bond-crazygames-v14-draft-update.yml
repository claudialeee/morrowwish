name: Update existing Cat Bond CrazyGames draft with V14 real-gameplay variety previews
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cat-bond-crazygames-v14-draft-update.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cat-bond-crazygames-write-draft
  cancel-in-progress: false
jobs:
  existing-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install direct CrazyGames portal driver
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node --check scripts/crazygames-cat-bond-save-draft.mjs
      - name: Restore exactly the three existing approved portal covers
        uses: actions/download-artifact@v4
        with:
          name: cat-bond-crazygames-muted-covers-result
          run-id: 45104693348
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Load reviewed V14 REAL-gameplay (no full duo cinematic)
        uses: actions/download-artifact@v4
        with:
          name: cat-bond-crazygames-v14-variety-real-gameplay-review
          run-id: 45111398602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Restore flat Actions artifact layout and independently pinned review manifest
        run: |
          mkdir -p .check/crazygames-v14-variety
          for aspect in landscape portrait; do
            test -s "cat-bond-crazygames-v14-variety-${aspect}.mp4"
            mv "cat-bond-crazygames-v14-variety-${aspect}.mp4" ".check/crazygames-v14-variety/"
          done
          test -s promotion/cat-bond-crazygames-v14-variety-verified.json
          cp promotion/cat-bond-crazygames-v14-variety-verified.json .check/crazygames-v14-variety/shot-plan-and-qa.json
          echo "Restored two V14 real gameplay clips and independent non-hidden source manifest"
      - name: Ensure ffprobe is present for independent media verification
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Strict authentic gameplay, silent clip, size and copy preflight
        run: |
          set -eu
          python3 - <<'PY'
          import json,shutil,hashlib,subprocess
          from pathlib import Path
          p=Path('public/promo/cat-bond');q=Path('.check/crazygames-v14-variety')
          j=json.loads((q/'shot-plan-and-qa.json').read_text())
          assert j['kind']=='real-gameplay-V14-creative-recut-not-ai'
          assert j['reference']=='public/promo/v14-review.json'
          assert j['containsOriginal63DuoCinematic'] is False
          assert j['crazygamesDraftTouched'] is False
          assert 0<=j['battleFraction']<.15
          assert len(j['showcases'])>=8
          assert not any(s['scene']=='duo' for s in j['showcases'])
          approved=json.load(open('promotion/crazygames-cat-bond-submission-draft.json'))
          assert '33 collectible cats' in approved['description']
          assert 'five illustrated regions' in approved['description']
          assert 'locally in your browser' in approved['instructions']
          for aspect,shape in [('landscape',(1920,1080)),('portrait',(1080,1620))]:
            source=q/f'cat-bond-crazygames-v14-variety-{aspect}.mp4'
            assert source.is_file() and source.stat().st_size>100000
            assert hashlib.sha256(source.read_bytes()).hexdigest()==j['videos'][aspect]['sha256'],(aspect,'wrong source video')
            data=json.loads(subprocess.check_output(['ffprobe','-v','error',
              '-show_entries','stream=codec_type,width,height:format=duration,size',
              '-of','json',str(source)]))
            stream=[s for s in data['streams'] if s.get('codec_type')=='video']
            assert len(stream)==1 and (stream[0]['width'],stream[0]['height'])==shape
            assert not any(s.get('codec_type')=='audio' for s in data['streams'])
            assert 18<=float(data['format']['duration'])<20
            assert source.stat().st_size<50_000_000
            dest=p/f'real-gameplay-{aspect}.mp4'
            shutil.copyfile(source,dest)
            assert hashlib.sha256(dest.read_bytes()).hexdigest()==hashlib.sha256(source.read_bytes()).hexdigest()
            print('REAL V14 GAMEPLAY VERIFIED',aspect,shape,data['format'])
          for f in ['cover-landscape.png','cover-portrait.png','cover-square.png']:
            assert (p/f).is_file() and (p/f).stat().st_size>100000,f
          Path('.check/crazygames/cat-bond-draft-fill.json').unlink(missing_ok=True)
          print('APPROVED DESCRIPTION',approved['description'])
          print('APPROVED CONTROLS',approved['instructions'])
          PY
      - name: Replace previews and save verified English copy on existing draft only
        env:
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
          CRAZYGAMES_TARGET_SLUGS: cat-bond
          CRAZYGAMES_PREVIEW_MODE: v14-variety-real-gameplay
        run: node scripts/crazygames-cat-bond-save-draft.mjs
      - name: Require real CrazyGames save receipt and exact copy match
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const doc=JSON.parse(fs.readFileSync('promotion/crazygames-cat-bond-submission-draft.json','utf8'));
          const receipt=JSON.parse(fs.readFileSync('.check/crazygames/cat-bond-draft-fill.json','utf8')).results?.[0];
          const expected=['cover-landscape.png','cover-portrait.png','cover-square.png',
            'real-gameplay-landscape.mp4','real-gameplay-portrait.mp4'];
          if(receipt?.status!=='saved-final-step-unsubmitted'||
             receipt.platformDraftId!==doc.externalPortalDraftId||
             receipt.verifiedDraftVisible!==true||
             receipt.reviewSubmitted!==false||receipt.finalSubmitClicked!==false||
             receipt.copyVerifiedOnForm!==true||
             receipt.finalDescription!==doc.description||
             receipt.finalControls!==doc.instructions||
             receipt.artProvenance?.source!=='actual-V14-gameplay-recut'||
             receipt.artProvenance?.hasFullDuoCinematic!==false||
             !(receipt.artProvenance?.battleFraction<.15)||
             expected.some(f=>!receipt.uploaded?.includes(f))){
            throw Error('CRAZYGAMES DRAFT NOT VERIFIED: '+JSON.stringify({
              status:receipt?.status,id:receipt?.platformDraftId,uploaded:receipt?.uploaded,
              copy:receipt?.copyVerifiedOnForm,provenance:receipt?.artProvenance,
              error:receipt?.error}));
          }
          console.log('CONFIRMED existing CrazyGames draft saved with new authentic videos and English copy',JSON.stringify({
            id:receipt.platformDraftId,savedAt:receipt.savedAt,
            videoLengths:[receipt.artProvenance.landscapeSeconds,receipt.artProvenance.portraitSeconds],
            description:receipt.finalDescription,controls:receipt.finalControls,
            submitted:false
          }));
          NODE
      - name: Retain verified video and portal evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-crazygames-final-v14-draft-save-receipt
          path: |
            .check/crazygames/cat-bond-draft-fill.json
            .check/crazygames-v14-variety/shot-plan-and-qa.json
            public/promo/cat-bond/real-gameplay-landscape.mp4
            public/promo/cat-bond/real-gameplay-portrait.mp4
          if-no-files-found: warn
          retention-days: 30

name: Replace Cat Bond CrazyGames covers with approved muted gameplay showcase
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/crazygames-cat-bond-muted-covers.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cat-bond-crazygames-write-draft
  cancel-in-progress: false
jobs:
  update-existing-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install portal browser and image encoder
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          python3 -m pip install pillow==11.3.0
          node --check scripts/crazygames-cat-bond-save-draft.mjs
      - name: Reuse verified 63-original genuine game preview videos only
        uses: actions/download-artifact@v4
        with:
          name: cat-bond-crazygames-polished-draft-retry-result
          run-id: 45102338281
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Retrieve trusted original-63 provenance manifests only (separate directory)
        uses: actions/download-artifact@v4
        with:
          name: cat-bond-crazygames-saved-draft-receipt
          run-id: 45100812099
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-provenance-evidence
      - name: Restore original-gameplay proof without overwriting new covers or previews
        run: |
          mkdir -p .check/crazygames
          for aspect in portrait landscape; do
            test -s "original-provenance-evidence/.check/crazygames/cat-bond-trim-${aspect}.json"
            cp "original-provenance-evidence/.check/crazygames/cat-bond-trim-${aspect}.json" ".check/crazygames/cat-bond-trim-${aspect}.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const n of ['portrait','landscape']){
            const x=JSON.parse(fs.readFileSync('.check/crazygames/cat-bond-trim-'+n+'.json','utf8'));
            if(x.originalArt!==true||x.originalSceneCount!==63||
               !x.artSource?.includes('duo-storyboard-21x3-v3.webp'))
              throw Error('Original artwork provenance not verified: '+n);
          }
          console.log('Approved original 63-scene provenance restored without changing video files.');
          NODE
      - name: Replace three cover files with exactly user-approved muted artwork
        run: |
          python3 - <<'PY'
          from PIL import Image
          import hashlib
          from pathlib import Path
          root=Path('promotion/crazygames-covers-approved-20261122')
          dest=Path('public/promo/cat-bond')
          expected={
            'landscape':('b890b014fa0b443c8d1d4d522b3676503a3055b4',(1920,1080)),
            'portrait': ('a181625421361e646d602c22d20be266ce92b359',(800,1200)),
            'square':   ('5d1579ffc152fb9b977265cf1b208b8db1d769ed',(800,800)),
          }
          def git_sha(data):
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name,(sha,size) in expected.items():
            src=root/f'cover-{name}.jpg'
            raw=src.read_bytes()
            assert git_sha(raw)==sha,(name,'approved art changed')
            im=Image.open(src).convert('RGB')
            assert im.size==size,(name,im.size)
            out=dest/f'cover-{name}.png'
            im.save(out,format='PNG',optimize=True)
            reloaded=Image.open(out)
            assert reloaded.size==size and reloaded.mode=='RGB'
            print('APPROVED MUTED COVER VERIFIED',out,size,out.stat().st_size)
          PY
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('public/promo/cat-bond')
          h={}
          for name in ['real-gameplay-landscape.mp4','real-gameplay-portrait.mp4']:
            p=root/name
            assert p.exists() and p.stat().st_size>100000,name
            h[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('.check/crazygames').mkdir(parents=True,exist_ok=True)
          Path('.check/crazygames/preserved-preview-sha256.json').write_text(json.dumps(h,indent=2)+'\n')
          old=json.loads(Path('.check/crazygames/cat-bond-draft-fill.json').read_text()).get('results',[{}])[0]
          assert old.get('platformDraftId')=='cda65c21-75f7-4ce5-b717-62b425097981'
          assert old.get('status')=='saved-final-step-unsubmitted'
          Path('.check/crazygames/cat-bond-draft-fill.json').unlink()
          print('Preserved both genuine previously approved videos, invalidated previous draft receipt')
          PY
      - name: Save updated covers on existing CrazyGames Cat Bond draft only
        env:
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
          CRAZYGAMES_TARGET_SLUGS: cat-bond
        run: node scripts/crazygames-cat-bond-save-draft.mjs
      - name: Verify portal really saved images and previews remain unmodified
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('public/promo/cat-bond')
          expected=json.loads(Path('.check/crazygames/preserved-preview-sha256.json').read_text())
          for n,sha in expected.items():
            assert hashlib.sha256((root/n).read_bytes()).hexdigest()==sha,(n,'preview was modified')
          r=json.loads(Path('.check/crazygames/cat-bond-draft-fill.json').read_text())['results'][0]
          files=['cover-landscape.png','cover-portrait.png','cover-square.png',
                 'real-gameplay-landscape.mp4','real-gameplay-portrait.mp4']
          assert r.get('status')=='saved-final-step-unsubmitted',r.get('error')
          assert r.get('platformDraftId')=='cda65c21-75f7-4ce5-b717-62b425097981'
          assert r.get('verifiedDraftVisible') is True
          assert r.get('reviewSubmitted') is False and r.get('finalSubmitClicked') is False
          assert all(f in r.get('uploaded',[]) for f in files)
          print('SUCCESS: MUTED GAMEPLAY SHOWCASE COVERS SAVED TO EXISTING CAT BOND DRAFT',r['savedAt'])
          print('AUTHENTIC GAMEPLAY VIDEOS UNCHANGED',expected)
          PY
      - name: Retain five real media files and authenticated saved draft receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-crazygames-muted-covers-result
          path: |
            .check/crazygames/cat-bond-draft-fill.json
            .check/crazygames/preserved-preview-sha256.json
            public/promo/cat-bond/cover-landscape.png
            public/promo/cat-bond/cover-portrait.png
            public/promo/cat-bond/cover-square.png
            public/promo/cat-bond/real-gameplay-landscape.mp4
            public/promo/cat-bond/real-gameplay-portrait.mp4
          if-no-files-found: warn
          retention-days: 30

name: Prepare Y8 Cat Bond Submission — DRAFT ONLY

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-y8-cat-bond.yml'
      - 'scripts/y8-catbond-build.py'
      - 'scripts/y8-catbond-media.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: y8-cat-bond-submission-assets
  cancel-in-progress: true

jobs:
  package-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install capture tools
        run: |
          npm install --no-save --package-lock=false playwright sharp
          npx playwright install --with-deps chromium
          ffmpeg -version | head -n 1
      - name: Build standalone Y8 game ZIP (not for final review until App ID set)
        env:
          Y8_APP_ID: ${{ vars.Y8_APP_ID }}
          Y8_GAME_ID: ${{ vars.Y8_GAME_ID }}
        run: python3 scripts/y8-catbond-build.py
      - name: Capture actual in-game screenshots and continuous gameplay video
        run: node scripts/y8-catbond-media.mjs
      - name: Confirm ZIP and media
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          d=Path('.check/y8-cat-bond')
          z=zipfile.ZipFile(d/'cat-bond-y8.zip')
          assert 'index.html' in z.namelist()
          assert 'assets/duo-storyboard-21x3-v3.webp' in z.namelist()
          assert z.testzip() is None
          s=json.loads((d/'media-report.json').read_text())
          assert len(s['assets'])==6 and s['acceptedFileSpecs']
          print('Y8 DRAFT EXPORT VERIFIED',len(z.namelist()),'ZIP files,',len(s['assets']),'media assets')
          PY
      - name: Upload Y8 draft package and media (not public game submission)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y8-cat-bond-draft-${{ github.run_number }}
          path: |
            .check/y8-cat-bond/cat-bond-y8.zip
            .check/y8-cat-bond/media/
            .check/y8-cat-bond/build-report.json
            .check/y8-cat-bond/media-report.json
          if-no-files-found: warn
          retention-days: 30

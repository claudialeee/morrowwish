name: Starbell new story trailer (portrait review)
on:
  push:
    branches: ['promo/starbell-story-trailer-new-20261126']
    paths: ['.github/workflows/starbell-new-story-trailer.yml','scripts/starbell-new-story-*.mjs','scripts/starbell-new-story-*.py']
permissions:
  contents: read
concurrency:
  group: starbell-new-story-trailer
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/starbell-browser-setup
      - name: Install encoder and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm python3-pil
      - name: Capture latest published preview gameplay
        run: node scripts/starbell-new-story-capture.mjs
      - name: Score and cinematic composition
        run: |
          python3 scripts/starbell-new-story-audio.py
          fluidsynth -ni -g 0.8 -r 44100 -F artifacts/starbell-story-trailer/score.wav /usr/share/sounds/sf2/FluidR3_GM.sf2 artifacts/starbell-story-trailer/score.mid
          python3 scripts/starbell-new-story-particles.py
          node scripts/starbell-new-story-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-new-story-trailer-review
          path: |
            artifacts/starbell-story-trailer/Echoes-of-the-Starbell-Official-Trailer-EN.mp4
            artifacts/starbell-story-trailer/contact-*.jpg
            artifacts/starbell-story-trailer/*-frame.png
            artifacts/starbell-story-trailer/*-proof.png
            artifacts/starbell-story-trailer/capture-evidence.json
            artifacts/starbell-story-trailer/proof-*.json
            /tmp/starbell-trailer-server.log
          retention-days: 14

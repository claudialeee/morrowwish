name: Starbell new story trailer (portrait review)
on:
  push:
    branches: ['promo/starbell-story-trailer-new-20261126']
    paths: ['.github/workflows/starbell-new-story-trailer.yml','scripts/starbell-new-story-*.mjs','scripts/starbell-new-story-*.py']
permissions:
  contents: read
concurrency:
  group: starbell-new-story-trailer
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/starbell-browser-setup
      - name: Install encoder and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-ebgaramond python3-pil
      - name: Pin and stage exact live portrait source for isolated developer capture
        run: |
          set -euo pipefail
          sha=$(curl -fsS 'https://starbell-portrait-preview.morrowwish.pages.dev/preview-version.json?trailer=1' | jq -er .sha)
          git fetch --depth=1 origin "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          git restore --source="$sha" -- public/cat-bond
          echo "TRAILER_GAME_SHA=$sha" >> "$GITHUB_ENV"
      - name: Capture exact live source in isolated local developer mode
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-trailer-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          node scripts/starbell-new-story-capture.mjs
      - name: Score and cinematic composition
        run: |
          curl -fL --retry 3 'https://www.scottbuckley.com.au/library/wp-content/uploads/2019/12/sb_soar.mp3' -o artifacts/starbell-story-trailer/soar.mp3
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 artifacts/starbell-story-trailer/soar.mp3 | grep -qx audio
          python3 scripts/starbell-new-story-score-edit.py
          python3 scripts/starbell-new-story-particles.py
          node scripts/starbell-new-story-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-new-story-trailer-review
          path: |
            artifacts/starbell-story-trailer/Echoes-of-the-Starbell-Official-Trailer-EN.mp4
            artifacts/starbell-story-trailer/contact-*.jpg
            artifacts/starbell-story-trailer/*-frame.png
            artifacts/starbell-story-trailer/*-proof.png
            artifacts/starbell-story-trailer/capture-evidence.json
            artifacts/starbell-story-trailer/proof-*.json
            /tmp/starbell-trailer-server.log
          retention-days: 14

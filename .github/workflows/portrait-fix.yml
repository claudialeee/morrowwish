name: Fix Cat Bond portrait viewport and verify actual new portal builds
on:
  push:
    branches: [review/cat-bond-release-bundle-20261127]
    paths: ['portrait-fix-qa.mjs','.github/workflows/portrait-fix.yml']
permissions:
  contents: write
jobs:
  portrait-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install free tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 -c 'import PIL' || python3 -m pip install --break-system-packages pillow
      - name: Build actual corrected ZIPs and prepare patched canonical web candidate
        run: |
          python3 export-platform.py gamepix
          python3 export-platform.py y8 --awaiting-id
          python3 export-platform.py gamedistribution --awaiting-id
          python3 export-platform.py itch
          mkdir -p output/portrait-fixed-web
          cp -a source/public output/portrait-fixed-web/
          cp -a source-overlay/public/. output/portrait-fixed-web/public/
      - name: Six viewport geometry and real input QA on extracted exact GamePix ZIP
        run: node portrait-fix-qa.mjs
      - name: Recheck actual new ZIP normal capture and persisted save
        run: node independent-package-qa.mjs
      - name: Record corrected real horizontal and vertical gameplay
        run: node capture-portrait-fixed.mjs
      - name: Replace affected material and verify final binary outputs
        run: |
          cp output/cat-bond-gamepix-candidate.zip release-media/gamepix/
          cp output/cat-bond-y8-awaiting-sdk-id.zip release-media/y8/
          cp output/cat-bond-gamedistribution-awaiting-sdk-id.zip release-media/gamedistribution/
          cp output/cat-bond-itch-candidate.zip release-media/itch/internal-standalone-backup.zip
          cp output/*-build-report.json release-media/_verification/
          cp qa-output/standalone-qa.json release-media/_verification/
          cp output/portrait-fixed-refined/capture-report.json release-media/_verification/refined-capture-report.json
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for s,d in [('gamepix-portrait-garden','gamepix/portrait.jpg'),('y8-standard-garden','y8/standard.jpg'),('y8-standard-companions','y8/game-card.jpg')]:
              Image.open('portrait-fix-qa/'+s+'.png').convert('RGB').save(Path('release-media')/d,quality=94,optimize=True)
          Image.open('qa-output/desktop-garden.png').convert('RGB').save('release-media/gamepix/landscape.jpg',quality=94,optimize=True)
          PY
          python3 finalize-portrait-fixed.py
      - name: Save measured results and corrected files
        if: always()
        run: |
          git config user.name 'Morrow Wish release QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf portrait-fix-qa/extracted
          git add -f portrait-fix-qa release-media
          if [ -d output/portrait-fixed-refined ]; then
            find output/portrait-fixed-refined -name '*.webm' -size +90M -delete
            git add -f output/portrait-fixed-refined
          fi
          git diff --cached --quiet || git commit -m 'Save portrait fix measured QA and corrected media [skip ci]'
          git push origin HEAD:review/cat-bond-release-bundle-20261127

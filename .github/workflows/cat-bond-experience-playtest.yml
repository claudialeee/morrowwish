name: Starbell rapid gate dry run (no deploy)
on:
  push:
    branches: [review/starbell-fast-gates-b322b6a]
    paths:
      - 'scripts/cat-bond-experience-*.mjs'
      - 'scripts/cat-bond-starbell-save-direct-probe.mjs'
      - 'scripts/cat-bond-all-skills-visual-smoke.mjs'
      - 'scripts/cat-bond-combat-skills-visual-smoke.mjs'
      - 'scripts/cat-bond-starbell-progression-probe.mjs'
      - 'scripts/cat-bond-title-save-browser-qa.mjs'
      - 'scripts/cat-bond-release-prologue-qa.mjs'
      - 'scripts/cat-bond-harbor-playthrough.mjs'
      - 'scripts/cat-bond-starfall-playthrough.mjs'
      - 'scripts/cat-bond-finale-real-playthrough.mjs'
      - 'public/game-settings.js'
      - 'scripts/cat-bond-starfall-art-review.mjs'
      - 'scripts/test-cat-bond-companion-rarity.mjs'
      - 'scripts/test-cat-bond-core-art-roster.mjs'
      - 'scripts/cat-bond-core-art-browser.mjs'
      - 'scripts/cat-bond-rpg-audio-browser.mjs'
      - 'scripts/check-cat-bond-audio-assets.mjs'
      - 'scripts/test-cat-bond-rpg-audio-lifecycle.mjs'
      - 'scripts/test-cat-bond-canon12-campaign.mjs'
      - 'public/cat-bond/**'
      - 'docs/cat-bond-rpg/EXPERIENCE-PRE-AUDIT.md'
      - '.github/workflows/cat-bond-experience-playtest.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'quick daily smoke, full final acceptance, or selected regression'
        type: choice
        options: [quick, full, opening, campaign, targets, audio, systems, harbor, forest, forge, sky, library, starfall, finale, epilogue]
        default: quick
permissions:
  contents: read
concurrency:
  # Independent quick/full concurrency lanes; an ordinary edit cannot cancel full acceptance.
  # Push [starbell-full] for final fixed-revision acceptance; ordinary pushes use quick smoke.
  group: starbell-experience-${{ github.ref }}-${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[starbell-full]') && 'full' || 'quick') || format('manual-{0}-{1}', github.sha, inputs.scope) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  evidence:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[starbell-full]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || (github.event_name == 'workflow_dispatch' && !contains(fromJSON('["quick","audio","systems"]'), inputs.scope)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(((github.event_name == 'push' && contains(github.event.head_commit.message, '[starbell-full]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) && '["opening","campaign","targets","harbor","forest","forge","sky","library","starfall","finale","epilogue"]' || format('["{0}"]', inputs.scope || 'opening')) }}
    env:
      CAT_BOND_EXPERIENCE: '1'
      PROLOGUE_LANG: zh
      PROLOGUE_PROFILE: desktop
      CAT_BOND_PROFILE: desktop
      CAT_BOND_FULL_CAMPAIGN: '1'
      SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Core art roster contract
        run: |
          node scripts/test-cat-bond-core-art-roster.mjs
          node scripts/test-cat-bond-companion-rarity.mjs
      - name: Decode remaster and render actual game cats
        if: matrix.scope == 'opening'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-core-art-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-core-art-browser.mjs
      - name: Candidate cinematic frames in desktop and mobile
        if: matrix.scope == 'opening'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-cinematic-review-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-starfall-art-review.mjs
      - name: Offline narrative and gameplay structure
        run: node scripts/cat-bond-experience-structure.mjs
      - name: Engine-only knowledge paths and choice coverage
        run: |
          node scripts/cat-bond-experience-knowledge.mjs
          node scripts/test-cat-bond-player-first.mjs
          node scripts/test-cat-bond-canon12-campaign.mjs
          node scripts/test-cat-bond-story-party.mjs
        if: matrix.scope != 'campaign' && (matrix.scope == 'opening' || matrix.scope == 'targets')
      - name: Real browser evidence on loopback only
        if: always() && (matrix.scope == 'opening' || matrix.scope == 'campaign')
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-experience-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          if [ "$SCOPE" = campaign ]; then
            node scripts/cat-bond-harbor-playthrough.mjs
          else
            CAT_BOND_FULL_CAMPAIGN=0 node scripts/cat-bond-release-prologue-qa.mjs
          fi
      - name: Verify real save checkpoint reload
        if: always() && (matrix.scope == 'opening' || matrix.scope == 'campaign')
        run: |
          root=artifacts/cat-bond-experience/checkpoints
          if [ ! -d "$root" ]; then echo 'No real checkpoints available'; exit 1; fi
          mapfile -d '' fixtures < <(find "$root" -type f -name '*.json' -print0 | sort -z)
          if [ "${#fixtures[@]}" -eq 0 ]; then echo 'No real checkpoints available'; exit 1; fi
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-replay-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          passed=0
          failed=0
          for fixture in "${fixtures[@]}"; do
            if node scripts/cat-bond-experience-replay.mjs "$fixture"; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "::error::Checkpoint replay failed: $fixture"
            fi
          done
          echo "Real checkpoint replays: passed=$passed failed=$failed total=${#fixtures[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
      - name: Require fresh campaign checkpoint coverage in every chapter
        if: always() && matrix.scope == 'campaign'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {campaign} from './public/cat-bond/js/resonance/campaign.mjs';
          const root='artifacts/cat-bond-experience/checkpoints/campaign-en-desktop';
          assert.ok(fs.existsSync(root),'Fresh campaign checkpoint directory missing');
          const fixtures=fs.readdirSync(root).filter(f=>f.endsWith('.json')).map(f=>JSON.parse(fs.readFileSync(root+'/'+f,'utf8')));
          const expected=[...new Set(campaign.scenes.map(s=>s.chapter))];
          for(const fixture of fixtures){
            assert.equal(fixture.provenance,'real-input local browser save');
            assert.equal(fixture.revision,process.env.GITHUB_SHA);
          }
          const captured=new Set(fixtures.map(f=>campaign.scenes.find(s=>s.id===f.scene)?.chapter));
          const missing=expected.filter(ch=>!captured.has(ch));
          console.log('Fresh campaign coverage:',JSON.stringify({expected,captured:[...captured],missing}));
          assert.deepEqual(missing,[],'Fresh campaign must produce checkpoints in every story chapter');
          for(const milestone of ['ending','postgame']){
            const f=fixtures.find(x=>x.milestone===milestone&&x.ending===true);
            assert.ok(f,'Missing actual '+milestone+' save');
            const book=JSON.parse(f.storageState.origins[0].localStorage.find(x=>x.name==='catbond_save_slots_v1').value);
            const story=book.slots[f.slot].data.state.resonance;
            assert.equal(story.completed.length,campaign.scenes.length);
            if(milestone==='postgame'){
              assert.ok(campaign.side.every(q=>story.postgame.includes(q.id)),'All actual postgame quests must persist');
              assert.ok(story.ruins.duoClears>=1,'Actual Duo Promise ruins victory must persist');
            }
          }
          JS
      - name: Isolated synthetic chapter checkpoint restore
        if: matrix.scope == 'targets'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-experience-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-targets.mjs
          node scripts/cat-bond-experience-emotional.mjs
          node scripts/cat-bond-experience-ambient.mjs
      - name: All regional discoveries through actual map inputs
        if: always() && matrix.scope == 'targets'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-discoveries-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-discoveries.mjs
      - name: Current RPG encounter measurement from isolated checkpoints
        if: always() && matrix.scope == 'targets'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-rpg-combat-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-rpg-combat.mjs
      - name: Complete one entire chapter using real inputs
        if: contains(fromJSON('["harbor","forest","forge","sky","library","starfall","finale","epilogue"]'), matrix.scope)
        run: |
          case "$SCOPE" in
            harbor) entry=harbor:H-01 ;;
            forest) entry=forest:R-01 ;;
            forge) entry=forge:E-01 ;;
            sky) entry=sky:S-01 ;;
            library) entry=library:M-01 ;;
            starfall) entry=starfall:F-01 ;;
            finale) entry=finale:B-01 ;;
            epilogue) entry=epilogue:E-01 ;;
            *) exit 2 ;;
          esac
          node scripts/cat-bond-experience-knowledge.mjs
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-chapter-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          CAT_BOND_TARGET_SCENES="$entry" node scripts/cat-bond-experience-targets.mjs
          CAT_BOND_CHAPTERS="$SCOPE" node scripts/cat-bond-experience-chapters.mjs
      - name: Reload chapter-derived saves and verify checkpoint coverage
        if: always() && contains(fromJSON('["harbor","forest","forge","sky","library","starfall","finale","epilogue"]'), matrix.scope)
        run: |
          root=artifacts/cat-bond-experience/chapter-acceptance/checkpoints/chapter-$SCOPE
          if [ ! -d "$root" ]; then echo 'No chapter-derived checkpoints available'; exit 1; fi
          mapfile -d '' fixtures < <(find "$root" -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
          if [ "${#fixtures[@]}" -eq 0 ]; then echo 'No chapter-derived checkpoints available'; exit 1; fi
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-chapter-replay-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          passed=0
          failed=0
          for fixture in "${fixtures[@]}"; do
            for lang in zh en; do
              for profile in desktop portrait landscape; do
                if CAT_BOND_REPLAY_LANG="$lang" CAT_BOND_REPLAY_PROFILE="$profile" node scripts/cat-bond-experience-replay.mjs "$fixture" --chapter-derived; then
                  passed=$((passed+1))
                else
                  failed=$((failed+1))
                  echo "::error::Chapter-derived checkpoint replay failed: $fixture ($lang/$profile)"
                fi
              done
            done
          done
          echo "Chapter-derived replays (NOT fresh campaign or full mobile playthrough): passed=$passed failed=$failed total=$(("${#fixtures[@]}" * 6))" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
          node --input-type=module - "$SCOPE" "$root" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {campaign} from './public/cat-bond/js/resonance/campaign.mjs';
          const [chapter,root]=process.argv.slice(2);
          const expected=campaign.scenes.filter(s=>s.chapter===chapter).slice(1).map(s=>s.id);
          assert.ok(expected.length,'Chapter must have post-entry scenes');
          const fixtures=fs.readdirSync(root).filter(f=>f.endsWith('.json')).map(f=>JSON.parse(fs.readFileSync(root+'/'+f,'utf8')));
          const captured=new Set(fixtures.map(f=>f.scene));
          if(chapter==='epilogue')assert.ok(fixtures.some(f=>f.milestone==='ending'&&f.ending===true),'Epilogue must capture actual completed ending');
          const missing=expected.filter(id=>!captured.has(id));
          console.log('Chapter-derived coverage:',JSON.stringify({chapter,expected,captured:[...captured],missing}));
          assert.deepEqual(missing,[],'Missing post-entry scene saves');
          JS
      - name: Generate review packet even after failed playthrough
        if: always()
        run: node scripts/cat-bond-experience-report.mjs
      - name: Seeded legacy battle policy baseline
        if: always() && matrix.scope == 'opening'
        run: node scripts/cat-bond-experience-combat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-bond-experience-evidence-${{ matrix.scope }}
          path: |
            artifacts/cat-bond-experience/
            artifacts/cat-bond-release-prologue/
            artifacts/cat-bond-harbor/
            artifacts/cat-bond-starfall/visual-review/
            /tmp/cb-cinematic-review-server.log
            /tmp/cb-experience-server.log
            /tmp/cb-rpg-combat-server.log
            /tmp/cb-chapter-server.log
            /tmp/cb-chapter-replay-server.log
          if-no-files-found: warn
          retention-days: 30
  opening-ui:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[starbell-full]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'opening') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [zh, en]
        profile: [desktop, portrait, landscape]
        exclude:
          - language: zh
            profile: desktop
    env:
      CAT_BOND_EXPERIENCE: '1'
      PROLOGUE_LANG: ${{ matrix.language }}
      PROLOGUE_PROFILE: ${{ matrix.profile }}
      CAT_BOND_FULL_CAMPAIGN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Fresh opening with both traveler paths
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-opening-ui-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-release-prologue-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-bond-opening-${{ matrix.language }}-${{ matrix.profile }}
          path: |
            artifacts/cat-bond-experience/
            artifacts/cat-bond-release-prologue/
            /tmp/cb-opening-ui-server.log
          if-no-files-found: error
          retention-days: 30

  audio-evidence:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[starbell-full]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'audio') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/check-cat-bond-audio-assets.mjs
      - run: node scripts/test-cat-bond-rpg-audio-lifecycle.mjs
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Browser audio controls and decode all soundtrack recordings
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-audio-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-rpg-audio-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-bond-audio-evidence
          path: |
            artifacts/cat-bond-audio/
            /tmp/cb-audio-server.log
          if-no-files-found: warn
          retention-days: 30

  rpg-systems:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[starbell-full]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'systems') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [skills, combat, progression, saves]
    env:
      CAT_BOND_EXPERIENCE: '1'
      SCOPE: ${{ matrix.scope }}
      CAT_BOND_QA_OUTPUT: artifacts/starbell-parallel/saves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: RPG-only system regression on fixed acceptance revision
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-rpg-systems-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          case "$SCOPE" in
            skills) node scripts/cat-bond-all-skills-visual-smoke.mjs ;;
            combat) node scripts/cat-bond-combat-skills-visual-smoke.mjs ;;
            progression) node scripts/cat-bond-starbell-progression-probe.mjs ;;
            saves) node scripts/cat-bond-title-save-browser-qa.mjs ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-rpg-systems-${{ matrix.scope }}
          path: |
            artifacts/starbell-parallel
            /tmp/cat-bond-all-skills-*.png
            /tmp/cat-bond-skill-*.png
            /tmp/cb-rpg-systems-server.log
          retention-days: 30

  quick:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[starbell-full]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'quick') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fast RPG source gates
        run: |
          node scripts/test-cat-bond-player-first.mjs
          node scripts/test-cat-bond-story-party.mjs
          node scripts/test-cat-bond-canon12-campaign.mjs
          node scripts/test-cat-bond-resonance-slot.mjs
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Real title, menu and save smoke (six profiles)
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-quick-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-starbell-save-direct-probe.mjs
      - name: Record scope
        run: echo 'Quick smoke only — not final campaign or release acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starbell-quick-smoke
          path: |
            artifacts/starbell-save-direct
            /tmp/cb-quick-server.log
          retention-days: 7

  preview-local-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare local pinned preview without deployment
        run: |
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          printf '%s %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > /tmp/cat-bond-preview-sources.txt
      - name: Build isolated Cat Bond preview (no production Worker or D1)
        run: |
          set -eu
          mkdir -p /tmp/cat-bond-preview/site
          cp -a public/cat-bond /tmp/cat-bond-preview/site/
          for dir in audio art icons pawsibly-innocent; do cp -a "public/$dir" /tmp/cat-bond-preview/site/; done
          find public -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -exec cp {} /tmp/cat-bond-preview/site/ \;
          # RPG uses its own committed recordings. No mutable production audio imports.
          test -d /tmp/cat-bond-preview/site/cat-bond/assets/audio
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='/tmp/cat-bond-preview/site';
          const file=root+'/cat-bond/index.html';
          let html=fs.readFileSync(file,'utf8');
          html=html.replace(/<script[^>]+src=["'][^"']*telemetry\.js[^"']*["'][^>]*><\/script>/gi,'');
          html=html.replace(/<\/head>/i,'<meta name="robots" content="noindex,nofollow"><style>html[lang^="zh"] #cb-preview-note [lang="en"],html:not([lang^="zh"]) #cb-preview-note [lang="zh"]{display:none!important}</style><script>window.ARCADE_COLLECTOR="/api/preview-disabled";window.arcadeMetric=()=>{};</script></head>');
          const sha=process.env.SOURCE_SHA;
          html=html.replace(/<body([^>]*)>/i,'<body$1><aside id="cb-preview-note" data-source-sha="'+sha+'" role="note" style="position:fixed;z-index:2147483647;bottom:3px;left:3px;pointer-events:none;background:#202332e8;color:white;font:10px system-ui;padding:3px 6px;border-radius:4px"><span lang="en">Preview (not release-approved) · '+sha.slice(0,10)+' · Prologue–Finale · Local saves only</span><span lang="zh">试玩版（非正式发行） · '+sha.slice(0,10)+' · 序章至终章 · 仅本地存档</span></aside>');
          fs.writeFileSync(file,html);
          fs.writeFileSync(root+'/index.html','<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/cat-bond/"></head><body><a href="/cat-bond/">Echoes of the Starbell Preview</a></body></html>');
          fs.writeFileSync(root+'/robots.txt','User-agent: *\nDisallow: /\n');
          fs.writeFileSync(root+'/_headers','/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n  Content-Security-Policy: connect-src \'self\'; form-action \'self\'\n');
          fs.writeFileSync(root+'/telemetry.js','window.arcadeMetric=()=>{};');
          fs.writeFileSync(root+'/_worker.js','export default {fetch(request,env){const u=new URL(request.url);if(u.pathname.startsWith("/api/")||u.pathname==="/api")return Response.json({error:"Preview: production APIs disabled; use local saves."},{status:403});return env.ASSETS.fetch(request)}};');
          fs.writeFileSync(root+'/preview-version.json',JSON.stringify({sha,qaTier:'preview-smoke',fullReleaseAccepted:false,scope:'Prologue through Finale',storage:'local-only',productionApis:false,sources:fs.readFileSync('/tmp/cat-bond-preview-sources.txt','utf8').trim().split('\n')}));
          NODE
      - name: Install pinned Chromium test runtime once
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Prepare reusable real-browser smoke
        run: |
          cat > .cat-bond-preview-smoke.mjs <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const origin=process.env.CAT_BOND_SMOKE_ORIGIN || 'https://cat-bond-preview.morrowwish.pages.dev';
            await Promise.all([{name:'desktop',viewport:{width:1280,height:800}},{name:'portrait',viewport:{width:390,height:844},hasTouch:true},{name:'landscape',viewport:{width:844,height:390},hasTouch:true}].map(async profile=>{
              const {name,...device}=profile;
              const prefix=(process.env.CAT_BOND_SMOKE_STAGE || 'live')+'-'+name;
              const context=await browser.newContext(device);
              try{
                const page=await context.newPage(),external=[],errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.route('**/*',route=>{
                  const url=route.request().url();
                  if(url.startsWith(origin+'/')||/^(data:|blob:)/.test(url))return route.continue();
                  external.push(url);return route.abort();
                });
                const local=process.env.CAT_BOND_SMOKE_STAGE==='local';
                const sourceSha=process.env.SOURCE_SHA;
                if(!/^[0-9a-f]{40}$/.test(sourceSha||''))throw Error('Missing pinned source SHA');
                const expectedMarker='data-source-sha="'+sourceSha+'"';
                let loaded=false;
                // Verify the HTML actually received by each browser, not just the separate version endpoint.
                // A fresh deployment can briefly serve stale HTML from another edge/cache variant.
                for(let attempt=0;attempt<(local?1:6);attempt++){
                  const url=new URL('/cat-bond/',origin);
                  url.searchParams.set('lang','en');
                  if(local)url.searchParams.set('rpgDev','1');
                  url.searchParams.set('previewSha',sourceSha);
                  url.searchParams.set('qa',name+'-'+attempt);
                  const response=await page.goto(url.href,{waitUntil:'domcontentloaded'});
                  const html=response?.ok()?await response.text():'';
                  if(html.includes(expectedMarker)){loaded=true;break;}
                  console.warn('Preview HTML source mismatch',prefix,'attempt',attempt+1,'status',response?.status(),'cf-cache-status',response?.headers()['cf-cache-status'],'observed',html.match(/data-source-sha="([0-9a-f]{40})"/)?.[1]||'missing');
                  if(!local&&attempt<5)await new Promise(resolve=>setTimeout(resolve,2500));
                }
                if(!loaded)throw Error('Preview HTML did not converge to pinned source '+sourceSha+' for '+prefix);
                if(await page.locator('#cb-preview-note').getAttribute('data-source-sha')!==sourceSha)throw Error('Pinned preview note missing from DOM');
                await page.locator('#intro-continue').waitFor({state:'visible',timeout:30000});
                await page.waitForFunction(()=>window.CatBondCanonicalWorld&&window.CatBondTitlePrologue&&window.ResonanceBook&&window.CatBondChapterCinematics);
                await page.waitForFunction(()=>CatBondChapterCinematics.developmentReady()||CatBondChapterCinematics.starfallReleaseReady());
                if(!await page.evaluate(()=>window.ARCADE_COLLECTOR==='/api/preview-disabled'&&window.__CAT_BOND_INTEGRATION_ART__===false))throw Error('Preview isolation / art approval marker mismatch');
                // Exercise the real page and both translation observers, including round-trip switching.
                for(const locale of ['en','zh','en']){
                  await page.evaluate(locale=>window.MorrowwishI18n.set(locale),locale);
                  await page.waitForFunction(locale=>document.documentElement.lang.startsWith(locale)&&document.getElementById('cb-title-name')?.textContent===(locale==='zh'?'星铃回响':'Echoes of the Starbell')&&document.title===(locale==='zh'?'星铃回响 | Morrow Wish':'Echoes of the Starbell | Morrow Wish'),locale);
                  const title=await page.locator('.cb-intro-titleblock').innerText();
                  const buttons=await page.locator('.cb-intro-actions').innerText();
                  const previewNote=await page.locator('#cb-preview-note').innerText();
                  if(locale==='en'&&/[\u4e00-\u9fff]/.test(title+buttons+previewNote))throw Error('Chinese leaked into English title or preview note');
                  if(locale==='zh'&&(/[A-Za-z]/.test(title+buttons)||/Preview|Local saves|Prologue/.test(previewNote)))throw Error('English leaked into Chinese title or preview note');
                  if(await page.locator('#cb-title-subtitle').count())throw Error('Duplicate language title');
                  if(locale==='zh')await page.screenshot({path:'preview-'+prefix+'-title-zh.png'});
                }
                await page.screenshot({path:'preview-'+prefix+'-title.png'});
                await page.locator('#intro-start').click();
                await page.locator('#intro-slot-list [data-slot="slot1"]').waitFor();
                if(await page.locator('#intro-slot-list [data-slot]').count()!==3)throw Error('Three save slots required');
                await page.screenshot({path:'preview-'+prefix+'-slots.png'});
                await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                await page.waitForFunction(()=>CatBondResonance.view().current?.id==='prologue:P-05');
                const intro=page.locator('#cb-player-first-intro');
                await intro.waitFor({state:'visible'});
                if(!/Star Bell.*memories/s.test(await intro.innerText()))throw Error('Missing spoiler-free world context');
                if(await page.locator('.cbcp-root:not([hidden])').count())throw Error('Retired opening still playing');
                await page.screenshot({path:'preview-'+prefix+'-opening.png'});
                await intro.getByRole('button',{name:'Start exploring',exact:true}).click();
                await page.waitForFunction(()=>State.S.cats.length===1&&State.S.cats[0].species==='jinjc'&&window.__game?.scene==='yard'&&!document.querySelector('#panel.open .cat-starter-card'));
                await page.waitForFunction(()=>State.S.cats.length===1&&State.listSaveSlots().find(s=>s.id==='slot1')?.exists);
                const uid=await page.evaluate(()=>State.S.cats[0].uid);
                const completed=await page.evaluate(()=>State.S.resonance.completed.slice(0,4).join(','));
                if(completed!=='prologue:P-01,prologue:P-02,prologue:P-03,prologue:P-04')throw Error('Opening presentation checkpoints missing');
                if(await page.evaluate(()=>CatBondResonance.view().muling!=='unmet'||Object.values(State.S.resonance.evidence).flat().some(op=>op.startsWith('cinematic:'))))throw Error('Opening grants unearned companion or old cinematic evidence');
                // Actual encounter input on all three deployed profiles; no state mutation or forced click.
                const guide=page.locator('.sg-prologue-guide');
                await guide.waitFor({state:'visible'});
                if(await guide.locator('button:visible').count()!==1)throw Error('Opening guide must expose only the primary navigation button');
                const marker=page.locator('[data-npc-talk="muling"]');
                if(await page.locator('.res-garden-bell').count())throw Error('Detached garden bell must be removed');
                const discover=id=>page.locator('[data-garden-explore="'+id+'"]');
                for(let i=0;i<3;i++){await discover('butterfly').click();await page.waitForFunction(n=>GardenExploration.read(State.S).butterfly===n,i+1);}
                await discover('butterfly').waitFor({state:'hidden'});
                await discover('seed').click();
                await discover('snack').click();
                await page.getByRole('button',{name:'Keep for later',exact:true}).click();
                await discover('door').click();
                await marker.waitFor({state:'visible'});await marker.click();
                const encounter=page.locator('#cb-traveler-encounter');
                if(await encounter.getByRole('button',{name:/^(English|中文|EN)$/}).count())throw Error('Language toggle must not appear in dialogue');
                await encounter.getByRole('button',{name:'Leave for now',exact:true}).click();
                await encounter.waitFor({state:'detached'});await marker.click();
                await encounter.getByRole('button',{name:'Find the chart pieces',exact:true}).click();
                await encounter.waitFor({state:'detached'});
                await discover('chart-0').click();
                if(await page.evaluate(()=>CatBondResonance.view().openingMet))throw Error('One piece cannot complete the encounter');
                await discover('chart-1').click();
                await marker.click();
                await encounter.getByRole('button',{name:'Continue',exact:true}).click();
                await encounter.getByRole('button',{name:'Say goodbye',exact:true}).click();
                await encounter.waitFor({state:'detached'});
                await page.waitForFunction(()=>CatBondResonance.view().openingMet===true);
                await marker.waitFor({state:'hidden'});
                await page.screenshot({path:'preview-'+prefix+'-garden-discovery.png'});
                if(await guide.locator('button:visible').count()!==1)throw Error('Opening guide expanded after dialogue');
                if(await page.locator('#yard-actions').isVisible())throw Error('Garden floating dock must be hidden');
                await page.locator('#map-menu').click();
                const menu=page.locator('#cb-system-menu');
                await menu.waitFor({state:'visible'});
                for(const id of ['yard-map','yard-book','page-garden','leisure','page-settings','slots','title']){
                  if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing menu action '+id);
                }
                if(await page.locator('#hud').isVisible())throw Error('Wallet must not cover garden');
                if(await page.locator('#cb-yard-return').isVisible())throw Error('Duplicate yard return');
                const scrim=await menu.evaluate(el=>getComputedStyle(el).backgroundColor);
                if(scrim!=='rgba(0, 0, 0, 0)'&&scrim!=='transparent')throw Error('Menu must not dim the artwork: '+scrim);
                await page.screenshot({path:'preview-'+prefix+'-garden-menu.png'});
                await menu.locator('[data-system="page-garden"]').click();
                for(const id of ['yard-build','yard-seek','yard-play','yard-feed'])if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing garden action '+id);
                await menu.locator('[data-system="page-back"]').click();
                await menu.locator('[data-system="page-settings"]').click();
                for(const id of ['language','music','effects'])if(!await menu.locator('[data-system="'+id+'"]').isVisible())throw Error('Missing setting '+id);
                await page.screenshot({path:'preview-'+prefix+'-settings.png'});
                await menu.locator('[data-system="page-back"]').click();
                const saves=menu.locator('[data-system="slots"]');
                if(await saves.locator('span').textContent()!=='Saves')throw Error('Incorrect save entry label');
                await saves.click();
                const manager=page.locator('.cb-slot-manager');
                await manager.waitFor({state:'visible',timeout:12000});
                if(await menu.isVisible()||await manager.locator('#cb-slot-status').isVisible())throw Error('Save manager must open directly without an empty status strip');
                await page.screenshot({path:'preview-'+prefix+'-save-manager.png'});
                await manager.locator('.cb-cloud-close').click();
                await page.locator('#map-menu').click();
                await menu.locator('[data-system="yard-book"]').click();
                await page.locator('.rb-wallet').waitFor({state:'visible'});
                await page.screenshot({path:'preview-'+prefix+'-book-wallet.png'});
                if(await page.locator('#hud').isVisible())throw Error('Wallet must remain inside the book');
                await page.screenshot({path:'preview-'+prefix+'-garden.png'});
                await page.reload();
                await page.locator('#intro-continue').click();
                await page.locator('#intro-slot-list [data-slot="slot1"]').click();
                await page.waitForFunction(uid=>State.S.cats.length===1&&State.S.cats[0].species==='jinjc'&&State.S.cats[0].uid===uid&&CatBondResonance.view().current?.id==='prologue:P-05',uid);
                if(!await page.evaluate(()=>CatBondResonance.view().openingMet))throw Error('Encounter completion lost on reload');
                await page.screenshot({path:'preview-'+prefix+'-reloaded.png'});
                await page.locator('.sg-prologue-guide').getByRole('button',{name:'Next scene · Misttide Harbor',exact:true}).click();
                await page.waitForFunction(()=>CatBondResonance.view().current?.id==='harbor:H-01'&&WorldMap.currentRegion==='harbor');
                await page.screenshot({path:'preview-'+prefix+'-harbor.png'});
                if(external.length||errors.length)throw Error('Unexpected external requests / page errors: '+JSON.stringify({external,errors}));
                console.log('PREVIEW NEW SLOT AND RELOAD VERIFIED: '+prefix+' '+page.url());
              }catch(error){
              console.error('Smoke failed in '+prefix, error);
              throw error;
            }finally{await context.close()}
            }));
          }finally{await browser.close()}
          NODE
      - name: Run isolated predeployment browser smoke
        env:
          CAT_BOND_SMOKE_ORIGIN: http://127.0.0.1:8766
          CAT_BOND_SMOKE_STAGE: local
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/cat-bond-preview-server.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import os
          os.chdir('/tmp/cat-bond-preview/site')
          class Preview(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Content-Security-Policy', "connect-src 'self'; form-action 'self'")
                  super().end_headers()
              def do_GET(self):
                  if self.path == '/api' or self.path.startswith('/api/'):
                      self.send_error(403)
                  else:
                      super().do_GET()
              def do_POST(self):
                  self.send_error(403)
          ThreadingHTTPServer(('127.0.0.1',8766), Preview).serve_forever()
          PY
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8766/cat-bond/ >/dev/null && break; sleep 1; done
          node .cat-bond-preview-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-preview-dry-run
          path: preview-*.png
          retention-days: 7

  save-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Five profile save lifecycle in parallel
        run: |
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-save-lifecycle-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          CAT_BOND_QA_OUTPUT=artifacts/starbell-save-full node scripts/cat-bond-title-save-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-profile-save-lifecycle
          path: artifacts/starbell-save-full
          retention-days: 7

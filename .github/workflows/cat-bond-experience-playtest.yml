name: Cat Bond experience playtest (isolated)
on:
  push:
    branches: [review/cat-bond-playtest-harness]
    paths:
      - 'scripts/cat-bond-experience-*.mjs'
      - 'scripts/cat-bond-release-prologue-qa.mjs'
      - 'scripts/cat-bond-harbor-playthrough.mjs'
      - 'public/cat-bond/css/rpg-fullbleed.css'
      - 'docs/cat-bond-rpg/EXPERIENCE-PRE-AUDIT.md'
      - '.github/workflows/cat-bond-experience-playtest.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'opening (fast) or campaign (deep authored route)'
        type: choice
        options: [opening, campaign, targets]
        default: opening
permissions:
  contents: read
concurrency:
  group: cat-bond-experience-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'push' && '["opening","campaign","targets"]' || format('["{0}"]', inputs.scope || 'opening')) }}
    env:
      CAT_BOND_EXPERIENCE: '1'
      PROLOGUE_LANG: zh
      PROLOGUE_PROFILE: desktop
      CAT_BOND_PROFILE: desktop
      CAT_BOND_FULL_CAMPAIGN: '1'
      SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Offline narrative and gameplay structure
        run: node scripts/cat-bond-experience-structure.mjs
      - name: Engine-only knowledge paths and choice coverage
        run: |
          node scripts/cat-bond-experience-knowledge.mjs
          node scripts/test-cat-bond-player-first.mjs
          node scripts/test-cat-bond-canon12-campaign.mjs
          node scripts/test-cat-bond-story-party.mjs
        if: matrix.scope != 'campaign'
      - name: Real browser evidence on loopback only
        if: always() && matrix.scope != 'targets'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-experience-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          if [ "$SCOPE" = campaign ]; then
            node scripts/cat-bond-harbor-playthrough.mjs
          else
            CAT_BOND_FULL_CAMPAIGN=0 node scripts/cat-bond-release-prologue-qa.mjs
          fi
      - name: Verify real save checkpoint reload
        if: always() && matrix.scope != 'targets'
        run: |
          fixture=$(find artifacts/cat-bond-experience/checkpoints -name 'harbor-H-01-*.json' -print -quit 2>/dev/null || true)
          if [ -z "$fixture" ]; then echo 'No Harbor checkpoint available'; exit 1; fi
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/cb-replay-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          node scripts/cat-bond-experience-replay.mjs "$fixture"
      - name: Isolated synthetic chapter checkpoint restore
        if: matrix.scope == 'targets'
        run: |
          node scripts/cat-bond-local-cloud-server.mjs > /tmp/cb-experience-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/cat-bond-experience-targets.mjs
          node scripts/cat-bond-experience-emotional.mjs
      - name: Generate review packet even after failed playthrough
        if: always() && matrix.scope != 'targets'
        run: node scripts/cat-bond-experience-report.mjs
      - name: Seeded legacy battle policy baseline
        if: always() && matrix.scope == 'opening'
        run: node scripts/cat-bond-experience-combat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-bond-experience-evidence-${{ matrix.scope }}
          path: |
            artifacts/cat-bond-experience/
            artifacts/cat-bond-release-prologue/
            artifacts/cat-bond-harbor/
            /tmp/cb-experience-server.log
          if-no-files-found: warn
          retention-days: 7

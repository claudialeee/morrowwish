name: Sunlit Garden responsive visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/sunlit-garden-visual-qa.mjs'
      - '.github/workflows/sunlit-garden-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunlit-garden-visual-qa-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  garden-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium Playwright
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start isolated local game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/sunlit-garden-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/cat-bond/ > /dev/null
      - name: Render and interact with garden on desktop and both phone orientations
        run: node scripts/sunlit-garden-visual-qa.mjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunlit-garden-responsive-visual-qa
          path: artifacts/sunlit-garden-visual-qa/
          if-no-files-found: warn
          retention-days: 14

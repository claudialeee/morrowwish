name: Record five remaining Morrow Wish game highlights
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-remaining-game-reels.mjs'
      - '.github/workflows/remaining-game-reels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morrowwish-five-real-game-reels
  cancel-in-progress: false

jobs:
  capture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright and encoding dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Retrieve licensed CC0 audio
        run: bash scripts/fetch-cat-music.sh
      - name: Play and record five real game highlights
        run: node scripts/make-remaining-game-reels.mjs
      - name: Verify all five different playable game clips
        run: |
          set -euo pipefail
          for slug in tiny-town elsewhere flip-dash parcel-panic pocket-aquarium; do
            path="public/promo/$slug/highlight-20261121.mp4"
            test -s "$path"
            test -s "public/promo/$slug/highlight-20261121.jpg"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$path")" = "1080x1920"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$path")" = "audio"
          done
      - name: Save verified footage for staged social distribution
        run: |
          set -euo pipefail
          for slug in tiny-town elsewhere flip-dash parcel-panic pocket-aquarium; do
            git add "public/promo/$slug/highlight-20261121.mp4" "public/promo/$slug/highlight-20261121.jpg"
          done
          git diff --cached --quiet && exit 0
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'promo: five verified high-visibility new-version game shorts'
          git pull --rebase origin main
          git push origin HEAD:main

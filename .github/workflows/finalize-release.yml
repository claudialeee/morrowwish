name: Cat Bond final consolidated platform media verification
on:
  push:
    branches: [review/cat-bond-release-bundle-20261127]
    paths: ['finalize-release.py','.github/workflows/finalize-release.yml']
permissions:
  contents: write
jobs:
  final-media:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install free media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --break-system-packages pillow
      - name: Assemble final assets, decode videos, verify ZIP bytes and provenance
        run: python3 finalize-release.py
      - name: Save files and measured final report
        if: always()
        run: |
          git config user.name 'Morrow Wish release QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release-media
          git diff --cached --quiet || git commit -m 'Finalize consolidated platform assets and independent technical evidence [skip ci]'
          git push origin HEAD:review/cat-bond-release-bundle-20261127

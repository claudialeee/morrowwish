name: Submit ONE QA-approved Morrow Wish game to CrazyGames (live iframe)

# QA hold: Do NOT auto-submit new or rejected builds until a human confirms the
# gameplay quality checklist has passed. Explicit workflow_dispatch only.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Exactly ONE game: requires an approved quality gate"
        required: true
        type: choice
        options:
          - cat-bond
          - pawsibly-innocent
          - tiny-town
          - elsewhere
          - flip-dash
          - parcel-panic
          - pocket-aquarium

permissions:
  contents: write

concurrency:
  group: crazygames-studio-submission
  cancel-in-progress: false

jobs:
  submit-one:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Enforce single-game external QA signoff before portal access
        env:
          SELECTED_SLUG: ${{ inputs.slug }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const slug=process.env.SELECTED_SLUG || '';
          const gate=JSON.parse(fs.readFileSync('promotion/crazygames-quality-gate.json','utf8'));
          const supported=new Set(['cat-bond','pawsibly-innocent','tiny-town','elsewhere','flip-dash','parcel-panic','pocket-aquarium']);
          if(!supported.has(slug)||slug.includes(','))throw Error('Exactly one recognized game is required.');
          if(gate.status!=='approved'||gate.approvedSlug!==slug)throw Error('QA HOLD: this game has not been approved for a CrazyGames submission. Do not use the portal as a playtest.');
          for(const field of ['gameplayTest','firstTimePlayers','visualReview','technicalPreview','contentAndRights']){
            if(typeof gate.evidence?.[field]!=='string'||gate.evidence[field].trim().length<12)
              throw Error('QA HOLD: missing documented signoff: '+field);
          }
          console.log('One-game QA release approved:',slug);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser driver and image pipeline for approved media
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright sharp@0.34.5
      - name: Prepare Cat Bond CrazyGames covers and preview videos for QA-approved release
        if: ${{ inputs.slug == 'cat-bond' }}
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          npx playwright install --with-deps chromium
          node scripts/record-cat-bond-crazygames-previews.mjs
          node scripts/prepare-cat-bond-crazygames-media.mjs
          # Technical format checks are not a visual or music-rights signoff.
      - name: Sign in to authorized Morrow Wish studio account, submit external live URLs
        env:
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
          CRAZYGAMES_TARGET_SLUGS: ${{ inputs.slug }}
        run: node scripts/crazygames-complete-drafts.mjs
      - name: Save platform feedback and evidence, even on a partial submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crazygames-one-submission-results
          path: .check/crazygames/submission-results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist only verified CrazyGames submission IDs to dedupe ledger
        if: always()
        run: |
          if [ ! -f .check/crazygames/submission-results.json ]; then exit 0; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out=JSON.parse(fs.readFileSync('.check/crazygames/submission-results.json','utf8'));
          const file='promotion/ledger.json',l=JSON.parse(fs.readFileSync(file,'utf8'));
          let changed=0;
          for(const r of out.results){
            if(r.status!=='submitted-confirmed'||!r.platformId)continue;
            const g=l.games.find(x=>x.slug===r.slug);
            if(!g||g.channels.crazygames.status!=='draft')continue;
            g.channels.crazygames.status='submitted-for-review';
            g.channels.crazygames.platformId=r.platformId;
            g.channels.crazygames.submittedAt=r.finishedAt;
            changed++;
          }
          if(changed)fs.writeFileSync(file,JSON.stringify(l,null,2)+'\n');
          console.log('New verified CrazyGames submissions: '+changed);
          NODE
          git add promotion/ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name morrowwish-promo-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Record CrazyGames developer portal verified submission IDs'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report unconfirmed submissions as unfinished work
        if: always()
        run: |
          test -f .check/crazygames/submission-results.json || exit 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const {results}=JSON.parse(fs.readFileSync('.check/crazygames/submission-results.json','utf8'));
          const ok=results.filter(x=>x.status==='submitted-confirmed');
          const waiting=results.filter(x=>x.status==='waiting-platform-review');
          const skipped=results.filter(x=>x.status==='already-submitted');
          const errors=results.filter(x=>!['submitted-confirmed','already-submitted','waiting-platform-review'].includes(x.status));
          console.log('New confirmed review submissions: '+ok.map(x=>x.slug).join(', '));
          console.log('Previously submitted: '+skipped.map(x=>x.slug).join(', '));
          for(const x of waiting)console.log('PLATFORM REVIEW SLOT OCCUPIED: '+x.slug+'; auto-retry on next cron');
          for(const x of errors)console.log('ERROR '+x.slug+' '+x.status+' '+(x.reason||''));
          if(errors.length)process.exitCode=1;
          NODE

name: Assemble Morrow Wish seven-game homepage reel
on:
  push:
    branches: [main]
    paths:
      - 'public/promo/pocket-aquarium/highlight-20261121.mp4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-seven-games-montage
  cancel-in-progress: false
jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare ffmpeg and verified CC0 background audio
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          bash scripts/fetch-cat-music.sh
      - name: Render from seven genuine game recordings
        run: bash scripts/make-studio-montage.sh
      - name: Publish studio-wide reel
        run: |
          git add public/promo/morrow-wish-seven-games-20261121.mp4 public/promo/morrow-wish-seven-games-20261121.jpg
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'promo: publish seven real gameplay highlights in one 15-second reel'
          git pull --rebase origin main
          git push origin HEAD:main

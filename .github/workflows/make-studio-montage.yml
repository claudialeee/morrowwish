name: Assemble Morrow Wish seven-game homepage reel
# Rejected preview videos must never be regenerated or released on push.
# Owner review is required before any future manual generation.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-seven-games-montage
  cancel-in-progress: false
jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install encoder and verify distinct soundtrack policy
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          node scripts/test-promo-music.mjs
      - name: Render from seven genuine game recordings
        run: bash scripts/make-studio-montage.sh
      - name: Publish studio-wide reel
        run: |
          git add public/promo/morrow-wish-seven-games-20261121.mp4 public/promo/morrow-wish-seven-games-20261121.jpg
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'promo: publish seven real gameplay highlights in one 15-second reel'
          git pull --rebase origin main
          git push origin HEAD:main

name: Starbell fixed finale and Farwind route focused check
on:
  push:
    branches: [fix/starbell-finale-framing-farwind-art-20261127]
    paths: ['public/cat-bond/assets/resonance-world-v2/sky-farwind-wide.webp','public/cat-bond/assets/combat/star-bell-arena-lock-wide.webp','public/cat-bond/assets/combat/star-bell-arena-chorus-wide.webp']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/starbell-browser-setup
      - name: Verify only affected files and fixed finale framing
        run: |
          set -euo pipefail
          node --check public/cat-bond/js/resonance/world-runtime.mjs
          node --check public/cat-bond/js/resonance/portrait-map.mjs
          node --check public/cat-bond/js/resonance/finale-combat.mjs
          node --check public/cat-bond/js/resonance/finale-art.mjs
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-framing-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/test-starbell-finale-framing-farwind.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finale-framing-proof
          path: artifacts/starbell-framing
          if-no-files-found: ignore

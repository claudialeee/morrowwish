name: Starbell fixed finale and Farwind route focused check
on:
  push:
    branches: [fix/starbell-finale-framing-farwind-art-20261127]
    paths: ['public/cat-bond/assets/resonance-world-v2/sky-farwind-wide.webp','public/cat-bond/assets/combat/star-bell-arena-lock-wide.webp','public/cat-bond/assets/combat/star-bell-arena-wide.webp','public/cat-bond/assets/combat/star-bell-arena-chorus-wide.webp','scripts/import-starbell-region-music.mjs','scripts/test-starbell-approved-region-music.mjs','.github/workflows/starbell-framing-farwind-focused.yml','scripts/test-starbell-finale-framing-farwind.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/starbell-browser-setup
      - name: Install audio tools when absent
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Verify only affected files and fixed finale framing
        run: |
          set -euo pipefail
          node scripts/import-cat-bond-windchime-music.mjs
          node scripts/import-starbell-region-music.mjs
          node scripts/check-cat-bond-audio-assets.mjs
          node --check public/cat-bond/js/resonance/world-runtime.mjs
          node --check public/cat-bond/js/resonance/portrait-map.mjs
          node --check public/cat-bond/js/resonance/finale-combat.mjs
          node --check public/cat-bond/js/resonance/finale-art.mjs
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-framing-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          node scripts/test-starbell-finale-framing-farwind.mjs
          node scripts/test-starbell-approved-region-music.mjs
      - name: Package exact tested recordings and manifests
        run: |
          mkdir -p /tmp/starbell-approved-audio
          cp public/cat-bond/assets/quality-audio/{premium-amberlight.mp3,premium-a-kind-of-hope.mp3,premium-morning.mp3,premium-manifest.json,music-credits.html} /tmp/starbell-approved-audio/
          printf '%s\n' "$GITHUB_SHA" > /tmp/starbell-approved-audio/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: starbell-approved-audio
          path: /tmp/starbell-approved-audio/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finale-framing-proof
          path: artifacts/starbell-framing
          if-no-files-found: ignore

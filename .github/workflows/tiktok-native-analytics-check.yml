name: Verify TikTok native analytics integration

on:
  push:
    branches: [main]
    paths:
      - 'src/tiktok-native.js'
      - 'src/bluesky-native.js'
      - 'src/youtube-native.js'
      - 'src/instagram-native.js'
      - 'src/analytics.js'
      - 'src/social-native.js'
      - 'src/social-schedule.js'
      - 'scripts/test-social-refresh.mjs'
      - 'scripts/build-pages.mjs'
      - 'scripts/test-tiktok-native.mjs'
      - 'scripts/test-bluesky-native.mjs'
      - 'scripts/test-youtube-native.mjs'
      - 'scripts/test-instagram-native.mjs'
      - 'promotion/social-metrics-snapshot.json'
      - '.github/workflows/tiktok-native-analytics-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax and seven-video reconciliation
        run: |
          node --check src/tiktok-native.js
          node --check src/bluesky-native.js
          node --check src/youtube-native.js
          node --check src/instagram-native.js
          node --check src/analytics.js
          node --check scripts/build-pages.mjs
          node scripts/test-tiktok-native.mjs
          node scripts/test-bluesky-native.mjs
          node scripts/test-youtube-native.mjs
          node scripts/test-instagram-native.mjs
          node scripts/test-promotion-metrics.mjs
          node scripts/test-social-refresh.mjs
      - name: Verify production Worker concatenation without external credentials
        run: |
          npm ci
          npm install --no-save --no-package-lock sharp@0.34.5
          npm run build:pages
          node --check cloudflare-pages/public/_worker.js

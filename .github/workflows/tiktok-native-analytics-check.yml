name: Verify TikTok native analytics integration

on:
  push:
    branches: [main]
    paths:
      - 'src/tiktok-native.js'
      - 'src/bluesky-native.js'
      - 'src/analytics.js'
      - 'scripts/build-pages.mjs'
      - 'scripts/test-tiktok-native.mjs'
      - 'scripts/test-bluesky-native.mjs'
      - 'promotion/social-metrics-snapshot.json'
      - '.github/workflows/tiktok-native-analytics-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax and seven-video reconciliation
        run: |
          node --check src/tiktok-native.js
          node --check src/bluesky-native.js
          node --check src/analytics.js
          node --check scripts/build-pages.mjs
          node scripts/test-tiktok-native.mjs
          node scripts/test-bluesky-native.mjs
          node scripts/test-promotion-metrics.mjs
      - name: Verify production Worker concatenation without external credentials
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const social=fs.readFileSync('promotion/social-metrics-snapshot.json','utf8');
          const native=fs.readFileSync('src/tiktok-native.js','utf8').replace(/^export /gm,'');
          const bluesky=fs.readFileSync('src/bluesky-native.js','utf8').replace(/^export /gm,'');
          const analytics=fs.readFileSync('src/analytics.js','utf8')
            .replace('import {nativeTikTokRoute,nativeTikTokSnapshot} from "./tiktok-native.js";','')
            .replace('import {nativeBlueskySnapshot} from "./bluesky-native.js";','')
            .replace('export async function api','async function api');
          const router=fs.readFileSync('src/worker.js','utf8')
            .replace('import {api} from "./analytics.js";','');
          new vm.Script('const SOCIAL_SNAPSHOT='+social+';\n'+native+'\n'+bluesky+'\n'+analytics+'\n'+router.replace('export default {','const WORKER = {'));
          console.log('Cloudflare Pages Worker bundle compiles with TikTok OAuth + API v2 client.');
          NODE

name: Pawsibly five-portal release candidates
on:
  push:
    branches: ['release/pawsibly-five-portals-20261127']
    paths:
      - '.github/workflows/pawsibly-five-portals.yml'
      - 'scripts/build-pawsibly-five-portals.py'
      - 'scripts/capture-pawsibly-five-portals.mjs'
      - 'promotion/pawsibly-five-portals/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pawsibly-five-portal-release
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 63a1ddd2d4d07b1bbb4c24818fa3fe07a09b5545
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only capture dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version
      - name: Prepare licensed audio and core regression
        run: |
          bash scripts/fetch-cat-music.sh
          node scripts/check-pawsibly.mjs
      - name: Build independent portal candidates
        run: python3 scripts/build-pawsibly-five-portals.py
      - name: Create GamePix SDK candidate and record standalone browser checks
        continue-on-error: true
        run: |
          python3 scripts/pawsibly-bind-platform.py release-kit/pawsibly/pawsibly-standalone-candidate.zip gamepix
          mkdir -p release-kit/pawsibly/media
          python3 -m http.server 8766 --bind 127.0.0.1 --directory release-kit/pawsibly >/tmp/pawsibly-standalone.log 2>&1 &
          sleep 1
          node scripts/qa-pawsibly-standalone.mjs
      - name: Real-input media generation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/pawsibly.log 2>&1 &
          sleep 2
          node scripts/capture-pawsibly-five-portals.mjs
      - name: Copy listing metadata and validate archives
        if: always()
        run: |
          mkdir -p release-kit/pawsibly
          cp promotion/pawsibly-five-portals/* release-kit/pawsibly/
          find release-kit/pawsibly -maxdepth 2 -type f -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawsibly-five-portals-candidates
          path: |
            release-kit/pawsibly/*.zip
            release-kit/pawsibly/*.json
            release-kit/pawsibly/*.md
            release-kit/pawsibly/media/
          retention-days: 1
          if-no-files-found: error

name: Retry polished Cat Bond media upload to existing CrazyGames draft only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crazygames-cat-bond-polish-retry.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cat-bond-crazygames-write-draft
  cancel-in-progress: false
jobs:
  retry-existing-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Record current repair run ID
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('promotion/crazygames-cat-bond-current-run.json',JSON.stringify({
            runId:Number(process.env.GITHUB_RUN_ID),
            commit:process.env.GITHUB_SHA,startedAt:new Date().toISOString(),
            scope:'retry-polished-63-art-existing-draft'},null,2)+'\n');
          NODE
          git config user.name morrowwish-crazygames-qa-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add promotion/crazygames-cat-bond-current-run.json
          git commit -m "ops(crazygames): identify polished draft retry"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install logged-in CrazyGames portal driver
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node --check scripts/crazygames-cat-bond-save-draft.mjs
      - name: Download verified NEW five polished media files, no old re-encoding
        uses: actions/download-artifact@v4
        with:
          name: cat-bond-crazygames-polished-original-63-final
          run-id: 45102065577
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Verify polished art provenance and remove failed prior receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const aspect of ['landscape','portrait']){
            const m=JSON.parse(fs.readFileSync('.check/crazygames/cat-bond-trim-'+aspect+'.json','utf8'));
            if(m.originalArt!==true||m.originalSceneCount!==63||
               !m.artSource?.includes('duo-storyboard-21x3-v3.webp'))
              throw Error('Wrong art provenance, refusing upload');
          }
          for(const file of ['cover-landscape.png','cover-portrait.png','cover-square.png',
                             'real-gameplay-landscape.mp4','real-gameplay-portrait.mp4']){
             const p='public/promo/cat-bond/'+file;
             if(!fs.existsSync(p)||fs.statSync(p).size<100000)throw Error('Missing polished media '+file);
          }
          fs.rmSync('.check/crazygames/cat-bond-draft-fill.json',{force:true});
          console.log('POLISHED ORIGINAL-63 MEDIA VERIFIED, OLD UPLOAD RECEIPT INVALIDATED');
          NODE
      - name: Retry only existing draft edit and save, never submit approval
        env:
          CRAZYGAMES_STUDIO_EMAIL: ${{ secrets.CRAZYGAMES_STUDIO_EMAIL || 'morrowwishgames@gmail.com' }}
          CRAZYGAMES_STUDIO_PASSWORD: ${{ secrets.CRAZYGAMES_STUDIO_PASSWORD }}
          CRAZYGAMES_TARGET_SLUGS: cat-bond
        run: node scripts/crazygames-cat-bond-save-draft.mjs
      - name: Validate real saved draft receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('.check/crazygames/cat-bond-draft-fill.json','utf8')).results?.[0];
          const files=['cover-landscape.png','cover-portrait.png','cover-square.png',
            'real-gameplay-landscape.mp4','real-gameplay-portrait.mp4'];
          if(r?.status!=='saved-final-step-unsubmitted'||
             r.platformDraftId!=='cda65c21-75f7-4ce5-b717-62b425097981'||
             r.verifiedDraftVisible!==true||r.reviewSubmitted!==false||
             r.finalSubmitClicked!==false||r.artProvenance?.originalSceneCount!==63||
             r.artProvenance?.originalArt!==true||files.some(f=>!r.uploaded?.includes(f)))
            throw Error('CrazyGames real receipt not verified: '+JSON.stringify({
              status:r?.status,uploaded:r?.uploaded,error:r?.error}));
          console.log('SUCCESS: ALL FIVE POLISHED ORIGINAL-63 FILES VERIFIED SAVED ON CRAZYGAMES',JSON.stringify({
            id:r.platformDraftId,savedAt:r.savedAt,files:r.uploaded,submitted:false}));
          NODE
      - name: Preserve actual final portal receipt and polished media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-crazygames-polished-draft-retry-result
          path: |
            .check/crazygames/cat-bond-draft-fill.json
            public/promo/cat-bond/cover-landscape.png
            public/promo/cat-bond/cover-portrait.png
            public/promo/cat-bond/cover-square.png
            public/promo/cat-bond/real-gameplay-landscape.mp4
            public/promo/cat-bond/real-gameplay-portrait.mp4
          retention-days: 30
          if-no-files-found: warn

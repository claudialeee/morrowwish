name: Starbell Canon 3 narrative acceptance
on:
  push:
    branches: [review/starbell-canon13-player-experience]
    paths:
      - 'public/cat-bond/**'
      - 'scripts/test-starbell-canon3.mjs'
      - 'scripts/test-starbell-dialogue-camera.mjs'
      - 'scripts/test-starbell-talent-practice-browser.mjs'
      - 'scripts/test-starbell-garden-camera.mjs'
      - 'scripts/test-starbell-finale-framing-farwind.mjs'
      - 'scripts/test-cat-bond-rpg-audio-lifecycle.mjs'
      - 'scripts/test-starbell-regional-bosses-browser.mjs'
      - 'scripts/test-starbell-player-first-browser.mjs'
      - 'scripts/test-starbell-work-closure-browser.mjs'
      - 'scripts/cat-bond-release-prologue-qa.mjs'
      - '.github/workflows/starbell-canon3-acceptance.yml'
      - '.github/workflows/cat-bond-preview.yml'
      - 'scripts/starbell-release-gate.sh'
      - 'scripts/cat-bond-experience-chapters.mjs'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: starbell-canon3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/review/starbell-canon13-player-experience'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        profile: [wide, portrait]
    env:
      STARBELL_FOCUS_PROFILE: ${{ matrix.profile }}
      STARBELL_BOSS_PROFILE: ${{ matrix.profile }}
      STARBELL_MINIGAME_PROFILE: ${{ matrix.profile }}
      PROLOGUE_LANG: ${{ matrix.profile == 'portrait' && 'zh' || 'en' }}
      PROLOGUE_PROFILE: ${{ matrix.profile == 'portrait' && 'portrait' || 'desktop' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and new story contract
        run: |
          for f in public/cat-bond/js/resonance/*.mjs; do node --check "$f"; done
          node scripts/test-starbell-canon3.mjs
          node scripts/test-starbell-narrative-play-20261127.mjs
          node scripts/test-cat-bond-rpg-audio-lifecycle.mjs
      - name: Install Chromium once
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - name: Real opening, six guardian victories and retained minigames
        run: |
          set -euo pipefail
          node scripts/cat-bond-local-cloud-server.mjs >/tmp/starbell-canon3.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/cat-bond/ >/dev/null
          # Run independent browser suites concurrently so a failed one never hides the others.
          (node scripts/cat-bond-release-prologue-qa.mjs && if [[ "$PROLOGUE_PROFILE" == desktop ]]; then PROLOGUE_PROFILE=landscape node scripts/cat-bond-release-prologue-qa.mjs; fi) > /tmp/canon3-opening.log 2>&1 & opening=$!
          node scripts/test-starbell-regional-bosses-browser.mjs > /tmp/canon3-guardians.log 2>&1 & guardians=$!
          node scripts/test-starbell-player-first-browser.mjs > /tmp/canon3-minigames.log 2>&1 & minigames=$!
          node scripts/test-starbell-dialogue-camera.mjs > /tmp/canon3-dialogue-camera.log 2>&1 & camera=$!
          (node scripts/test-starbell-garden-camera.mjs && node scripts/test-starbell-finale-framing-farwind.mjs && node scripts/test-starbell-talent-practice-browser.mjs) > /tmp/canon3-continuity.log 2>&1 & continuity=$!
          STARBELL_WORK_PROFILE="$STARBELL_FOCUS_PROFILE" node scripts/test-starbell-work-closure-browser.mjs > /tmp/canon3-work-closure.log 2>&1 & closure=$!
          failed=0
          for pair in "$opening:opening" "$guardians:guardians" "$minigames:minigames" "$camera:dialogue-camera" "$continuity:continuity" "$closure:work-closure"; do
            pid=${pair%%:*}; name=${pair#*:}
            wait "$pid" || failed=1
            cat "/tmp/canon3-$name.log"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canon3-${{ matrix.profile }}
          path: |
            artifacts/cat-bond-release-prologue/
            artifacts/starbell-dialogue-camera/
            /tmp/starbell-canon3.log
            /tmp/canon3-*.log
            artifacts/work-closure/
          if-no-files-found: warn
          retention-days: 7

  report-exact-candidate:
    if: always() && github.ref == 'refs/heads/review/starbell-canon13-player-experience'
    needs: [browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - name: Publish exact SHA acceptance status and run link
        run: |
          state=failure
          if [[ "$BROWSER_RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="starbell/exact-candidate-browser" \
            -f description="Canon 3 browser matrix: $BROWSER_RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

name: One-time Cat Bond read-only encrypted traffic audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-catbond-traffic-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Cloudflare D1 aggregate counts, emit encrypted report only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUDIT_PUB: 
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          if(!process.env.CF_TOKEN)throw Error('Cloudflare API token unavailable');
          const api='https://api.cloudflare.com/client/v4/accounts/ad5c7e2459db758ac4a41973f4f6028b/d1/database/fbd62f69-1811-4538-a17f-ecc5be8ad7cc/query';
          const query=async sql=>{
            const response=await fetch(api,{method:'POST',headers:{
              'Authorization':'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'
            },body:JSON.stringify({sql})});
            const result=await response.json();
            if(!response.ok||!result.success)throw Error('D1 read-only audit query failed with HTTP '+response.status);
            return result.result?.[0]?.results??result.result??[];
          };
          const daily=await query("SELECT day,COUNT(*) AS raw_visits,COUNT(DISTINCT COALESCE(NULLIF(view_id,''),'legacy:'||COALESCE(visitor,'')||':'||day)) AS pageviews FROM events WHERE category='arcade' AND game='cat-bond' AND kind='visit' GROUP BY day ORDER BY day DESC LIMIT 35");
          const categories=await query("SELECT category,COUNT(*) AS events,MIN(day) AS first_day,MAX(day) AS last_day FROM events WHERE game='cat-bond' GROUP BY category");
          const totals=await query("SELECT game,COUNT(*) AS visit_rows,COUNT(DISTINCT COALESCE(NULLIF(view_id,''),'legacy:'||COALESCE(visitor,'')||':'||day)) AS pageviews FROM events WHERE category='arcade' AND kind='visit' AND day>='2026-11-16' GROUP BY game ORDER BY game");
          const report=Buffer.from(JSON.stringify({daily,categories,totals}));
          const key=crypto.randomBytes(32),iv=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
          const encrypted=Buffer.concat([cipher.update(report),cipher.final()]);
          const publicKey=Buffer.from(process.env.AUDIT_PUB,'base64').toString();
          const wrapped=crypto.publicEncrypt({key:publicKey,oaepHash:'sha256'},key);
          const envelope={k:wrapped.toString('base64'),iv:iv.toString('base64'),
            tag:cipher.getAuthTag().toString('base64'),ct:encrypted.toString('base64')};
          console.log('CAT_BOND_AUDIT_ENCRYPTED='+JSON.stringify(envelope));
          console.log('Read-only D1 audit completed; no raw analytics emitted to logs.');
          NODE

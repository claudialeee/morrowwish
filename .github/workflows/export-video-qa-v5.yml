name: Export Seven V5 Trailer Contact Sheets — INTERNAL QA
on:
  push:
    branches: [main]
    paths:
      - 'public/promo/**/trailer-v5-20261121.mp4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: morrowwish-v5-visual-quality-control
  cancel-in-progress: false
jobs:
  visual-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout actual rendered V5 preview videos
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Export seven actual contact sheets as inspectable JPG and base64
        run: node scripts/export-v5-contact-sheets.mjs
      - name: Commit inspection images only, never social publishing
        run: |
          git add promotion/video-qa-v5/*.jpg promotion/video-qa-v5/*.b64
          git diff --cached --quiet && exit 0
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): export seven V5 final video contact sheets for visual review only'
          git pull --rebase origin main
          git push origin HEAD:main

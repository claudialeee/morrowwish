name: Export 7 V3 playable video frames for pixel-level editorial QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-video-qa-frames.mjs'
      - 'public/promo/review-v3/index.html'
      - '.github/workflows/export-video-qa-frames.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Export real JPEG frame bytes (not screenshot descriptions)
        run: node scripts/export-video-qa-frames.mjs
      - name: Preserve the seven previews for actual visual inspection
        run: |
          git add promotion/video-qa-v3/*.b64
          git config user.name 'morrowwish-promo-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): export actual frames of seven revised gameplay videos for visual inspection'
          git pull --rebase origin main
          git push origin HEAD:main

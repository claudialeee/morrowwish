name: Pawsibly Innocent Clear Story and Real Failure V12 - REVIEW ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pawsibly-story-v12.yml'
      - 'scripts/capture-pawsibly-v12.mjs'
      - 'scripts/render-pawsibly-teaser-v12.mjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: morrowwish-pawsibly-story-v12
  cancel-in-progress: false
jobs:
  capture-edit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser, FFmpeg, and dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Syntax verify
        run: |
          node --check scripts/capture-pawsibly-v12.mjs
          node --check scripts/render-pawsibly-teaser-v12.mjs
          node --check public/pawsibly-innocent/game.js
      - name: Capture genuine three-capture loss and native result in one room
        run: node scripts/capture-pawsibly-v12.mjs
      - name: Edit anti-spoiler single-room story
        run: node scripts/render-pawsibly-teaser-v12.mjs
      - name: Independent video, screen and story checks
        shell: bash
        run: |
          set -euo pipefail
          f=public/promo/pawsibly-innocent/trailer-v12-20261121.mp4
          test -s "$f"
          test -s public/promo/pawsibly-innocent/trailer-v12-20261121.jpg
          test -s public/promo/pawsibly-innocent/v12-real-failure-result-proof.png
          for n in 1 2 3; do test -s "public/promo/pawsibly-innocent/v12-review-$n.jpg"; done
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$f")" = '1080x1920'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$f")" = audio
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('public/promo/v12-review.json','utf8'));
          const prev=JSON.parse(fs.readFileSync('public/promo/v11-review.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('public/promo/readability-audit-v12.json','utf8'));
          if(manifest.version!=='V12'||manifest.trailers.length!==7||manifest.socialAutopublish!==false||
             manifest.trailers.some(t=>t.approved||t.published))throw Error('Social release gate breached');
          const p=manifest.trailers.find(t=>t.slug==='pawsibly-innocent');
          const scenes=p?.shots?.map(s=>s.scene);
          if(JSON.stringify(scenes)!==JSON.stringify(['first-fish','narrow-pursuit',
             'narrow-achievement','last-chase','failure-result']))throw Error('Story continuity broken '+scenes);
          if(p.duration<12||p.duration>18||!p.video.includes('trailer-v12')||
             !p.transitions.includes('no random map switches')||
             !p.sourceClips.includes('three real captures'))throw Error('Authenticity or story QA failed');
          if(audit.scenes.some(s=>!s.passed))throw Error('Unusable on-screen reading times');
          for(const old of prev.trailers.filter(t=>t.slug!=='pawsibly-innocent')){
            const current=manifest.trailers.find(t=>t.slug===old.slug);
            if(current.video!==old.video||current.poster!==old.poster)
              throw Error('Another game trailer changed '+old.slug);
          }
          console.log('Verified one room, actual fish, authentic near-miss, real native game-over screen; unapproved review only');
          NODE
      - name: Commit verified game video and result screenshots, never auto-publish socially
        shell: bash
        run: |
          set -euo pipefail
          git add public/promo/pawsibly-innocent/trailer-v12-20261121.mp4
          git add public/promo/pawsibly-innocent/trailer-v12-20261121.jpg
          git add public/promo/pawsibly-innocent/v12-review-*.jpg
          git add public/promo/pawsibly-innocent/v12-real-failure-result-proof.png
          git add public/promo/v12-review.json public/promo/readability-audit-v12.json
          git diff --cached --quiet && exit 0
          git config user.name morrowwish-promo-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa(promo): V12 one room story and genuine failure result, review only'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy owner-review files to existing Cloudflare Pages project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-cloudflare.yml --ref main
          echo 'Review media deployment dispatched; social accounts untouched.'

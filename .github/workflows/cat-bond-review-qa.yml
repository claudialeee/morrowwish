name: Cat Bond review-only browser QA
on:
  push:
    branches:
      - review/catbond-yard-controls-placement-20261121
  workflow_dispatch:
concurrency:
  group: cat-bond-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  review-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run real mobile and desktop placement tests, never deploy
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/yard-preview-server.log 2>&1 &
          sleep 2
          node scripts/cat-bond-yard-placement-smoke.mjs
          node scripts/cat-bond-art-review.mjs
          python3 scripts/build-cat-bond-owner-gallery.py
          node scripts/cat-bond-owner-gallery-smoke.mjs
          node scripts/cat-bond-single-painting-smoke.mjs
          node scripts/cat-bond-locked-duo-review.mjs
          node scripts/cat-bond-duo-smoke.mjs
          node scripts/cat-bond-progression-smoke.mjs
      - name: Save screenshots for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-review-yard-screenshots
          path: |
            /tmp/cat-bond-*-yard-placement.png
            /tmp/catbond-review-*.png
            /tmp/catbond-review-gallery-21.png
          retention-days: 7
          if-no-files-found: warn
      - name: Save private full-resolution 21-animation owner viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-bond-premium-21-animations-offline
          path: /tmp/cat-bond-premium-21-duos-review.html
          retention-days: 7
          if-no-files-found: warn

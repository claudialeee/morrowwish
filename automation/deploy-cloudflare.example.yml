name: Deploy Morrow Wish to Cloudflare
# Manual only until Cloudflare GitHub secret and review are configured.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morrowwish-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish existing Cloudflare Worker (no Vercel deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret. Add it before using automatic deploy.'
            exit 1
          fi
          npm run deploy
